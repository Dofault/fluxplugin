# FluxArmor: armour sets, one file per set in sets/ (sets/_example.yml, files starting with « _ » are ignored).
# /fluxarmor reload re-reads them. /fluxarmor build reads the Blockbench model of each set and writes the pack into the
# ItemsAdder content folder below (then run /iazip).

# ItemsAdder content folder where the pack is written, relative to the plugins/ folder.
itemsadder-content: ItemsAdder/contents/fluxarmor
