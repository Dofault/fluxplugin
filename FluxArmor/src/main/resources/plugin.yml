name: FluxArmor
version: 26.2
main: fr.influencraft.fluxarmor.FluxArmor
api-version: "26.2"
description: Armour sets with full and partial bonuses, in real 3D through the resource pack's entity shader.
authors: [Influencraft]
depend: [Flux]
# custom enchantments of the pieces must be registered first
softdepend: [EcoEnchants]

permissions:
  fluxarmor.admin:
    description: Build the 3D armour pack, reload.
    default: op
