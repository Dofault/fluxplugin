name: FluxWebsite
version: 26.2
main: fr.influencraft.fluxwebsite.FluxWebsite
api-version: '26.2'
author: dofault
description: "Bridge between the website and the server: shop deliveries, vote rewards to claim, Vote Party, vote reminder and vote streak. Formerly InfluBridge."
depend: [Flux]

permissions:
  influbridge.admin:
    description: "Reload the config (/website reload)."
    default: op
  influbridge.voteparty.admin:
    description: "Change the Vote Party counter by hand (/voteparty add|remove <amount>)."
    default: op
