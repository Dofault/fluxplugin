# Balance of the rpg universe (docs/technique/rpg.md §8). Every number of monsters comes from here: a monster file
# only gives a level, a rank and its own exceptions. Check the targets after any change:
#   /fluxdungeons balance (in game) or mvn -pl FluxDungeons test (BalanceTest).

defense:
  # defense that halves a hit = k-base + k-per-level x attacker level (more defense always helps, never 100 %)
  k-base: 50
  k-per-level: 10
damage:
  # a hit that lands always deals at least this much
  minimum: 1

levels:
  max: 50
  # experience from level n to n+1: base + per-level x (n - 1)
  xp-to-next: {base: 100, per-level: 40}

# Monster of rank "normal" at a level: base + per-level x (level - 1). Ranks multiply life, damage, defense, xp.
monsters:
  max_health:       {base: 165, per-level: 18}
  physical_attack:  {base: 8.5, per-level: 1.9}
  magic_power:      {base: 8.5, per-level: 1.9}
  physical_defense: {base: 10, per-level: 3}
  magic_defense:    {base: 10, per-level: 3}
  attack_speed:     {base: -0.2}
  xp:               {base: 10, per-level: 2}

# 2026-11-11: boss 140 -> 80, mini-boss 20 -> 10, elite 5 -> 4 (a lone level 1 warrior took about 2 minutes of
# non-stop hits on an easy boss, 3 to 4 in a real fight; a dungeon has several mini-bosses now).
# 2026-11-14, with the three elemental classes: normal monsters tougher and softer (life 120 + 13 a level -> 165 + 18,
# attack 10 + 2.2 -> 8.5 + 1.9), so that a monster lives long enough for a class's mechanic to play on it (three
# frosts, five burns, three seeds) and a pack hurts less by its number; elite 4 -> 3.5, mini-boss 10 -> 9, boss
# 80 -> 70 of that longer life; mini-boss damage 2.2 -> 2.0 and boss 3 -> 2.7 (nobody heals a party from a key any
# more: each class mends itself a little by fighting, the druid the others too).
ranks:
  normal:   {health: 1, damage: 1, defense: 1, xp: 1}
  elite:    {health: 3.5, damage: 1.6, defense: 1.3, xp: 4}
  miniboss: {health: 9, damage: 2.0, defense: 1.5, xp: 15}
  boss:     {health: 70, damage: 2.7, defense: 1.8, xp: 60}

# What a full set of rare gear of a level gives each class: base + per-level x (level - 1).
# Items are made against this budget (an item of level n gives its share of it).
reference-gear:
  warrior: {physical_attack: {base: 8, per-level: 1.2}, max_health: {base: 60, per-level: 20}, physical_defense: {base: 15, per-level: 2}, magic_defense: {base: 8, per-level: 1}}
  archer:  {physical_attack: {base: 10, per-level: 1.4}, max_health: {base: 40, per-level: 14}, physical_defense: {base: 6, per-level: 1}, magic_defense: {base: 5, per-level: 0.8}, crit_damage: {base: 0.1, per-level: 0.005}}
  mage:    {magic_power: {base: 10, per-level: 1.5}, max_health: {base: 40, per-level: 15}, physical_defense: {base: 4, per-level: 1.5}, magic_defense: {base: 8, per-level: 1.2}, max_mana: {base: 20, per-level: 0.5}}
  healer:  {magic_power: {base: 8, per-level: 1.1}, max_health: {base: 50, per-level: 16}, physical_defense: {base: 8, per-level: 1.3}, magic_defense: {base: 8, per-level: 1.2}, healing_power: {base: 0.05, per-level: 0.004}}
  cryomancer: {magic_power: {base: 9, per-level: 1.4}, max_health: {base: 45, per-level: 16}, physical_defense: {base: 5, per-level: 1.4}, magic_defense: {base: 8, per-level: 1.2}, max_mana: {base: 15, per-level: 0.5}}
  pyromancer: {magic_power: {base: 10, per-level: 1.5}, max_health: {base: 40, per-level: 14}, physical_defense: {base: 4, per-level: 1.2}, magic_defense: {base: 6, per-level: 1.0}, max_mana: {base: 15, per-level: 0.5}}
  druid:      {magic_power: {base: 8, per-level: 1.2}, max_health: {base: 55, per-level: 18}, physical_defense: {base: 8, per-level: 1.6}, magic_defense: {base: 8, per-level: 1.2}, max_mana: {base: 15, per-level: 0.5}}

# Targets checked by the simulator (raw numbers: no movement, no dodged telegraphs).
targets:
  levels: [1, 10, 20, 30, 40, 50]
  # seconds for one player of a damage class (warrior, archer, mage) alone to kill one monster of his level;
  # boss: a party of the four classes
  time-to-kill:
    normal:   {min: 3, max: 8}
    elite:    {min: 7, max: 30}
    miniboss: {min: 25, max: 70}
    boss:     {min: 60, max: 150}
  # seconds a player of any class lasts alone against one monster of his level, without healing
  survive-normal: 20
  survive-elite: 8
