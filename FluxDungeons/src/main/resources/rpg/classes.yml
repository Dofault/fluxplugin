# Classes of the rpg universe (docs/technique/rpg.md §6). Numbers only: how a skill moves and looks is the code of
# its "type". stats: added at level 1; per-level: added at each level above 1 (on top of stats.yml bases).
# basic = left click (click: right = right click held down, the weapon spell then goes on the left click).
# skills: right = right click (the weapon's spell), a = drop key, f = swap hands key.
# damage: physical or magic (which power it scales with); coefficient: x that power per hit; hits: hits of one cast;
# targets: enemies it is made for; duration in seconds; mana: cost (no cooldown: mana is the only limit);
# extra: the type's own numbers.

warrior:
  hidden: true
  stats: {max_health: 300, physical_attack: 18, physical_defense: 25, magic_defense: 10, attack_speed: -0.15, max_mana: -20, mana_regen: 1}
  per-level: {max_health: 30, physical_attack: 1.6, physical_defense: 2, magic_defense: 1}
  basic: {style: melee, damage: physical, coefficient: 1.0, targets: 3, range: 3.5}
  skills:
    right: {type: charge, kind: damage, damage: physical, coefficient: 2.2, mana: 30, targets: 3, duration: 1, extra: {distance: 8, stun: 1}}
    a: {type: war_cry, kind: buff, mana: 30, duration: 6, extra: {radius: 10, damage_reduction: 0.3, taunt: 1}}
    f: {type: whirlwind, kind: damage, damage: physical, coefficient: 1.1, hits: 3, mana: 40, targets: 5, extra: {radius: 4}}

