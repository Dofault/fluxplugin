# ---------------------------------------------------------------------------------------------------------------
# The three elemental classes (2026-11-14): the classes players choose from. The four above are retired from the
# menus (hidden: staff only, /classe choisir <id>), kept until the elemental ones are approved in game.
# Each has a mechanic of its own (passive), drawn and played by its code (rpg/Frost, Fire, Flora) and counted by the
# simulator (rpg/core/Simulator): change a number here, then run the tests (BalanceTest).
# A skill lasting "duration" seconds spreads its "hits" over it; extra.final: one last hit of that coefficient.

# The cryomancer: control and chain reactions. Everything he does leaves
# frost on monsters (passive): chill-max stacks freeze a monster in ice (freeze s; a boss is only slowed, half as long),
# and the next hit of another cast shatters it: shatter x magic power on it, shatter-splash of that on the monsters within
# shatter-radius, which are chilled and shatter in turn if frozen. chill: stacks a hit leaves.
# Skills: frost_glide (surf ahead on ice for "ticks" ticks), glacial_rift (spikes along the ground, lift: how high the
# monsters fly, end-radius: the crown at its end), winter_comet (aimed; delay s before the impact, which freezes
# everyone inside; frozen ground for "duration" s that chills again).
cryomancer:
  stats: {max_health: 200, magic_power: 24, physical_defense: 9, magic_defense: 14, attack_speed: -0.1, max_mana: 50, mana_regen: 3.5}
  per-level: {max_health: 20, magic_power: 1.9, physical_defense: 0.7, magic_defense: 1.1, max_mana: 1}
  passive: {chill-max: 3, chill-seconds: 4, freeze: 1.6, shatter: 1.4, shatter-splash: 0.35, shatter-radius: 3}
  basic: {style: shard, damage: magic, element: frost, coefficient: 0.85, targets: 1, range: 22}
  skills:
    right: {type: frost_glide, kind: mobility, damage: magic, element: frost, coefficient: 0.6, mana: 25, targets: 5, extra: {distance: 9, ticks: 8, chill: 1}}
    a: {type: glacial_rift, kind: damage, damage: magic, element: frost, coefficient: 2.0, mana: 55, targets: 4, extra: {range: 14, width: 1.6, lift: 0.55, chill: 2, end-radius: 2.5}}
    f: {type: winter_comet, kind: damage, damage: magic, element: frost, coefficient: 3.0, mana: 95, targets: 8, duration: 3, extra: {radius: 5, range: 24, delay: 0.9, size: 2.4}}

# The pyromancer: the most damage, the least life. Every hit sets the monster alight (burn: x magic power per stack and
# per second, up to burn-max stacks, burn-seconds after the last hit). A burning monster that dies bursts (wildfire x
# magic power at full stacks, on the monsters within wildfire-radius, which catch wildfire-stacks): packs burn down in
# a chain. Each hit that lands heats him (heat-basic / heat-spell per hit, 0 to 100, lost at heat-decay a second after
# heat-decay-after s without hitting): up to heat-damage bonus damage at 100, where the blaze starts: blaze-seconds
# during which his basic attack is a fan of blaze-bolts bolts, blaze-speed faster.
# Skills: phoenix_flight (takes off and lands in a burst of radius, strength / lift: the jump), fire_wave (a fan of
# flames, angle: half its opening in degrees), little_sun (aimed; hits pulses over duration, then a nova: final).
pyromancer:
  stats: {max_health: 175, magic_power: 24, physical_defense: 7, magic_defense: 12, attack_speed: -0.05, max_mana: 40, mana_regen: 3.5}
  per-level: {max_health: 17.5, magic_power: 1.9, physical_defense: 0.6, magic_defense: 1.0, max_mana: 1}
  passive: {burn-max: 5, burn-seconds: 5, burn: 0.07, wildfire: 0.7, wildfire-radius: 3.5, wildfire-stacks: 2, heat-basic: 6, heat-spell: 1, heat-decay-after: 4, heat-decay: 12, heat-damage: 0.2, blaze-seconds: 7, blaze-speed: 0.3, blaze-bolts: 3}
  basic: {style: ember, damage: magic, element: fire, coefficient: 0.75, targets: 1, range: 22}
  skills:
    right: {type: phoenix_flight, kind: mobility, damage: magic, element: fire, coefficient: 0.6, mana: 25, targets: 4, extra: {radius: 3, strength: 1.15, lift: 0.72, burn: 1}}
    a: {type: fire_wave, kind: damage, damage: magic, element: fire, coefficient: 1.6, mana: 50, targets: 4, extra: {range: 10, angle: 35, burn: 2}}
    f: {type: little_sun, kind: damage, damage: magic, element: fire, coefficient: 0.3, hits: 8, mana: 100, targets: 6, duration: 4, extra: {radius: 5.5, range: 22, size: 2.2, height: 4.5, burn: 1, final: 2.0, final-burn: 2}}

# The druid: the class that keeps a party standing, by fighting. Every hit plants a seed (up to seed-max, lost after
# seed-seconds); full of seeds a monster blooms (at most every bloom-gap s): held by roots (root s; a boss is only
# slowed, half as long), hit for bloom x magic power, and the pollen heals the druid and the allies within
# bloom-heal-radius of the flower (bloom-heal x magic power) and seeds the monsters within bloom-radius.
# Skills: vine (a vine to the block or monster aimed at hauls him there; a monster caught is rooted "root" s),
# brambles (aimed; a zone that tears and slows, a seed every seed-every pulses), maneater (aimed; a carnivorous plant
# biting "hits" times over duration within radius, its pollen heals "heal" x magic power within heal-radius at the end).
druid:
  stats: {max_health: 235, magic_power: 19, physical_defense: 13, magic_defense: 14, attack_speed: -0.1, max_mana: 40, mana_regen: 3, health_regen: 0.5}
  per-level: {max_health: 23.5, magic_power: 1.5, physical_defense: 1.0, magic_defense: 1.0, max_mana: 1, health_regen: 0.12}
  passive: {seed-max: 3, seed-seconds: 6, bloom: 1.0, bloom-heal: 0.25, bloom-heal-radius: 10, bloom-radius: 3, bloom-gap: 2, root: 1.2}
  basic: {style: thorn, damage: magic, element: nature, coefficient: 0.8, targets: 1, range: 20}
  skills:
    right: {type: vine, kind: mobility, damage: magic, element: nature, coefficient: 0.6, mana: 20, targets: 3, extra: {range: 16, speed: 1.05, seed: 1, root: 1.0}}
    a: {type: brambles, kind: damage, damage: magic, element: nature, coefficient: 0.33, hits: 10, mana: 55, targets: 5, duration: 5, extra: {radius: 4, range: 18, slow: 2, seed-every: 2}}
    f: {type: maneater, kind: damage, damage: magic, element: nature, coefficient: 0.8, hits: 8, mana: 90, targets: 2, duration: 8, extra: {radius: 6, range: 16, reach: 5, seed: 1, heal: 1.5, heal-radius: 8}}
