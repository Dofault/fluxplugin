# Items of the rpg universe (docs/technique/rpg.md §7). Dungeon armour written by
# FluxDungeons/assets/balance/gear.py (the dungeon tower, 2026-11-16): run it again rather than editing it here.
# Class weapons are kept as they are by the script.
# slot: weapon, helmet, chestplate, leggings, boots. classes: who may use it (empty = everyone). level: required.
# Stats are added as they are (stats.yml ids). look: material, name, model, color (dye of a leather piece).

