rochiste_colosse:
  # body without vanilla AI (the ravager rewrote its own speed every tick): FluxDungeons drives it
  type: POLAR_BEAR
  controlled: true
  silent: true
  name: '&#7E6FA0&lAbyss Colossus'
  boss: true
  rank: BOSS
  model: colosse_abime
  health: 500
  damage: 5
  # very slow, at the pace of its walk animation: about 1 block per second
  speed: 0.022
  attack-speed: 0.5
  # half the damage of projectiles: melee is the way to beat it
  ranged-resistance: 0.5
  xp: 200
  # at least 2.5 s between two attacks, drawn among those ready
  cast-gap: 2.5
  abilities:
  - type: cataclysm
    every: 35
    animation: attack_ultimate
    impact: 80
    hold: 160
    radius: 10
    power: 18
    title: '&#FF5C5C&lCATACLYSM'
    subtitle: '&#FFD94DGet out of the ring of fire!'
  - type: uplift
    every: 13
    animation: attack_stomp
    impact: 20
    hold: 46
    radius: 6
    height: 5
    power: 4
    title: '&#C0705AThe ground gives way!'
  - type: bite
    every: 5
    animation: attack_bite
    impact: 12
    hold: 28
    range: 4.5
    power: 8
  - type: rock_shard
    every: 3
    min-range: 7
    power: 3
