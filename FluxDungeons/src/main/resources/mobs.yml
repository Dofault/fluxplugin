# Dungeon monsters. Best kept one file per monster, by dungeon: mobs/<dungeon>/<id>.yml (the file name is the id, its
# keys at the root). This file documents the format and may hold monsters shared by several dungeons.
# Abilities: leap, fireball, arrow, volley, cone, taze, lightning, implosion, summon, slam, heal, shield, enrage,
# and the rock ones: boulder (thrown rock), rockfall (rocks falling), quake (ring earthquake),
# ice_spikes (line of ice spikes), stone_skin (stone skin), bite, uplift (throws up and blinds),
# cataclysm (ring of fire then a huge hit in that radius), rock_shard (shard chasing whoever keeps away).
# hold: ticks standing still during the animation. ranged-resistance: share of projectile damage ignored.
# every: seconds between two casts; below: only under this % of life; power: damage;
# animation / impact: model animation and ticks before the effect. attack-speed: melee hits per second.
# Dyed leather: "LEATHER_CHESTPLATE #7D7D7D". A block on the head (head: GRANITE) is worn as a helmet.
# Farm abilities (HarvestPowers, Harvest Hamster): harvest (eats the crops of its field, spits them back), rolling_charge
# (rolls as a ball, stunned by a wall), crush_leap (leap and shockwave), root_eruption (roots under the players),
# great_feast (ultimate), phase_shift (shakes itself, speed-bonus), entrance (first move), scurry (runs at whoever keeps away).
# Choosing abilities, for every one: target-min / target-max (distance to the target, blocks), weight (draw weight,
# 1 by default), once: true (cast once), opening: true (first move of the fight, once), wait (seconds below "below"
# before the first cast, an ultimate kept for later).
# Damage in several hits: combo: {first, hits, every} on an ability = that share of the hit at once, the rest in
# small hits every few ticks (the player sees his life go down and can react); lead-in (share) and lead-ticks on an
# ultimate (cataclysm, tidal_breach, great_feast) = that share drained before the impact from whoever stays in the
# shown zone, the impact dealing the rest. The total is the same as one hit, armour included.
# cues: sounds and effects of the animations (a model carries none). cues.<animation>: list of {tick, sound, volume,
# pitch, particle, count, height, spread}; cues.steps: {sound, stride, volume, pitch} (a step every stride blocks);
# cues.ambient: {every (ticks), chance, animations, sounds} (standing still, nobody within 8 blocks).
# Bones of a model whose name ends with _empty: a second look of a part, hidden when the model is put on (empty cheeks).

# ─── Stonecutter dungeon ─────────────────────────────────────────────────────

