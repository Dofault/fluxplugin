# Dungeon monsters written by hand (monsters imported from EliteMobs live in mobs/<dungeon>.yml).
# Abilities: leap, fireball, arrow, volley, cone, taze, lightning, implosion, summon, slam, heal, shield, enrage,
# and the rock ones: boulder (thrown rock), rockfall (rocks falling), quake (ring earthquake),
# ice_spikes (line of ice spikes), stone_skin (stone skin), bite, uplift (throws up and blinds),
# cataclysm (ring of fire then a huge hit in that radius), rock_shard (shard chasing whoever keeps away).
# hold: ticks standing still during the animation. ranged-resistance: share of projectile damage ignored.
# every: seconds between two casts; below: only under this % of life; power: damage;
# animation / impact: model animation and ticks before the effect. attack-speed: melee hits per second.
# Dyed leather: "LEATHER_CHESTPLATE #7D7D7D". A block on the head (head: GRANITE) is worn as a helmet.

# ─── Stonecutter dungeon ─────────────────────────────────────────────────────

rochiste_tailleur:
  type: ZOMBIE
  name: '&#B8B2AAStonecutter'
  health: 24
  damage: 2
  speed: 0.25
  xp: 10
  equipment:
    hand: STONE_PICKAXE
    head: "LEATHER_HELMET #8A8580"
    chest: "LEATHER_CHESTPLATE #6F6A64"
    legs: "LEATHER_LEGGINGS #4E4A46"
    feet: "LEATHER_BOOTS #3A3633"
  abilities:
  - type: boulder
    every: 7
    block: COBBLESTONE
    size: 0.5
    radius: 1.6
    power: 3

rochiste_lanceur:
  type: HUSK
  name: '&#D9B77ASandstone Thrower'
  health: 22
  damage: 2
  speed: 0.23
  xp: 12
  equipment:
    head: SANDSTONE
    chest: "LEATHER_CHESTPLATE #C2A26B"
    legs: "LEATHER_LEGGINGS #9C7F4E"
    feet: "LEATHER_BOOTS #6E5836"
  abilities:
  - type: boulder
    every: 6
    block: SANDSTONE
    size: 1.1
    radius: 2.5
    power: 5

rochiste_sentinelle:
  type: STRAY
  name: '&#9FD6F0Frost Sentinel'
  health: 20
  damage: 1
  speed: 0.24
  # harassing archer: four times the vanilla pace (two arrows a second), light arrows that freeze
  ranged-rate: 4
  frost-arrows: true
  xp: 12
  equipment:
    hand: BOW
    head: PACKED_ICE
    chest: "LEATHER_CHESTPLATE #9FD6F0"
    legs: "LEATHER_LEGGINGS #6FB3D6"
  abilities:
  - type: ice_spikes
    every: 9
    range: 12
    power: 4

rochiste_golem:
  type: ZOMBIE
  name: '&#C0705AGranite Golem'
  rank: MINIBOSS
  health: 80
  damage: 5
  speed: 0.2
  attack-speed: 0.8
  scale: 1.5
  xp: 40
  equipment:
    head: GRANITE
    chest: "LEATHER_CHESTPLATE #9A5C48"
    legs: "LEATHER_LEGGINGS #7A4535"
    feet: "LEATHER_BOOTS #5A3226"
  abilities:
  - type: quake
    every: 10
    radius: 6
    power: 5
  - type: stone_skin
    every: 15
    below: 50
    duration: 5
    level: 2

rochiste_colosse:
  type: RAVAGER
  name: '&#7E6FA0&lAbyss Colossus'
  boss: true
  rank: BOSS
  model: colosse_abime
  health: 500
  damage: 7
  # very slow, at the pace of its walk animation: about 1 block per second
  speed: 0.022
  attack-speed: 0.5
  # half the damage of projectiles: melee is the way to beat it
  ranged-resistance: 0.5
  xp: 200
  abilities:
  # by priority when several are ready
  - type: cataclysm
    every: 35
    animation: attack_ultimate
    impact: 80
    hold: 160
    radius: 10
    power: 20
    title: '&#FF5C5C&lCATACLYSM'
    subtitle: '&#FFD94DGet out of the ring of fire!'
  - type: uplift
    every: 13
    animation: attack_stomp
    impact: 20
    hold: 46
    radius: 6
    height: 5
    power: 5
    title: '&#C0705AThe ground gives way!'
  - type: bite
    every: 5
    animation: attack_bite
    impact: 12
    hold: 28
    range: 4.5
    power: 10
  - type: rock_shard
    every: 3
    min-range: 7
    power: 4
