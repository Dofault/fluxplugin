# Dungeon monsters written by hand (monsters imported from EliteMobs live in mobs/<dungeon>.yml).
# Abilities: leap, fireball, arrow, volley, cone, taze, lightning, implosion, summon, slam, heal, shield, enrage,
# and the rock ones: boulder (thrown rock), rockfall (rocks falling), quake (ring earthquake),
# ice_spikes (line of ice spikes), stone_skin (stone skin).
# every: seconds between two casts; below: only under this % of life; power: damage;
# animation / impact: model animation and ticks before the effect. attack-speed: melee hits per second.
# Dyed leather: "LEATHER_CHESTPLATE #7D7D7D". A block on the head (head: GRANITE) is worn as a helmet.

# ─── Stonecutter dungeon ─────────────────────────────────────────────────────

rochiste_tailleur:
  type: ZOMBIE
  name: '&#B8B2AAStonecutter'
  health: 30
  damage: 4
  speed: 0.25
  xp: 10
  equipment:
    hand: STONE_PICKAXE
    head: "LEATHER_HELMET #8A8580"
    chest: "LEATHER_CHESTPLATE #6F6A64"
    legs: "LEATHER_LEGGINGS #4E4A46"
    feet: "LEATHER_BOOTS #3A3633"
