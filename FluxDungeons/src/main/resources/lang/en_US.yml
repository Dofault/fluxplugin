    not-in-rpg: "Enter the rpg world to see your character."
  classes:
    warrior:
      role: "Tank, melee"
      difficulty: 1
      strengths: "Lots of health and defence, hits several enemies, draws the monsters."
      weaknesses: "Slow, no ranged attack, little mana."
      basic: {name: "Arc strike", description: "Hits up to %targets% enemies in front of you (%coef% %power%)."}
      right: {name: "Charge", description: "Rushes %distance% blocks and hits up to %targets% enemies (%coef% %power%), stunned %stun% s."}
      a: {name: "War cry", description: "Draws the monsters within %radius% blocks and cuts the damage you take by %damage_reduction_pct% for %duration% s."}
      f: {name: "Whirlwind", description: "Spins: %hits% hits of %coef% %power% on enemies within %radius% blocks."}
    archer:
      role: "Ranged damage"
      difficulty: 2
      strengths: "Long range, frequent crits, fast attacks, dodge."
      weaknesses: "Fragile up close: keep your distance."
      basic: {name: "Shot", description: "Shoots an arrow (%coef% %power%) up to %range% blocks."}
      right: {name: "Leap back", description: "Jumps back and runs %speed_pct% faster for %duration% s."}
      a: {name: "Volley", description: "Shoots a fan of %arrows% arrows, %coef% %power% each."}
      f: {name: "Arrow rain", description: "Arrows fall where you aim for %duration% s: %hits% waves of %coef% %power% over %radius% blocks."}
    mage:
      role: "Area damage, control"
      difficulty: 3
      strengths: "The biggest area damage, freezes and slows whole groups."
      weaknesses: "Very fragile, depends on mana."
      basic: {name: "Arcane bolt", description: "A bolt of magic (%coef% %power%) up to %range% blocks."}
      right: {name: "Blink", description: "Teleports you %distance% blocks forward."}
      a: {name: "Fireball", description: "Explodes on impact: %coef% %power% as fire over %radius% blocks."}
      f: {name: "Frost nova", description: "%coef% %power% as frost around you (%radius% blocks), enemies slowed by %slow_pct% for %duration% s."}
    healer:
      role: "Healing and support"
      difficulty: 2
      strengths: "Heals the party, raises the allies' damage, lots of mana."
      weaknesses: "Low damage: alone, slow progress."
      basic: {name: "Holy ray", description: "A ray of light (%coef% %power%) up to %range% blocks."}
      right: {name: "Heal", description: "Heals the ally you aim at, or yourself, for %coef% %power% (up to %range% blocks)."}
      a: {name: "Blessing", description: "Allies within %radius% blocks deal %damage_bonus_pct% more damage for %duration% s."}
      f: {name: "Sanctuary", description: "A healing zone of %radius% blocks: %hits% heals of %coef% %power% over %duration% s."}
    cryomancer:
      role: "Area control, chain reactions"
      difficulty: 3
      strengths: "Every hit leaves frost: after a few hits the monster is locked in ice, and the next hit shatters it onto its neighbours."
      weaknesses: "Fragile up close, his big damage needs the freeze set up first."
      basic: {name: "Ice shard", description: "Throws a shard of ice (%coef% %power%) up to %range% blocks. Leaves frost."}
      right: {name: "Boreal glide", description: "Glides %distance% blocks on a trail of ice: monsters on the way take %coef% %power% and frost."}
      a: {name: "Glacial rift", description: "Ice spikes burst out of the ground over %range% blocks: %coef% %power%, monsters are thrown up and covered in frost."}
      f: {name: "Winter comet", description: "A comet of ice crashes where you aim: %coef% %power% within %radius% blocks, every monster hit is frozen, the ground stays frozen %duration% s."}
      passive: {name: "Frost and Shatter", description: "Every hit leaves frost that slows. At %chill-max% frost the monster is locked in ice for %freeze% s (a boss is only slowed). The next hit of another spell shatters it: %shatter_pct% %power%, and the shards hurt and chill the monsters within %shatter-radius% blocks. Each shatter gives you back %shatter-heal_pct% of your health."}
    pyromancer:
      role: "Area damage, spreading fire"
      difficulty: 3
      strengths: "The highest damage of the three classes. Fire jumps from one monster to the next, and the more he hits, the hotter he gets."
      weaknesses: "The lowest health. His heat drops as soon as he stops hitting."
      passive: {name: "Burn and Heat", description: "Every hit sets the monster alight: %burn_pct% %power% per second and per burn, up to %burn-max% burns. A monster dying on fire bursts (%wildfire_pct% %power% within %wildfire-radius% blocks) and sets its neighbours alight. Every hit heats you: up to %heat-damage_pct% more damage, then at 100 heat the Blaze: for %blaze-seconds% s your bolt fans out into %blaze-bolts% embers and you attack faster. The Blaze gives you back %blaze-heal_pct% of your health."}
      basic: {name: "Ember bolt", description: "Throws an ember (%coef% %power%) up to %range% blocks. Sets the monster alight."}
      right: {name: "Phoenix flight", description: "Take off in a burst of flames and fly where you look: %coef% %power% within %radius% blocks at take-off and again at landing, monsters pushed back and set alight."}
      a: {name: "Fire wave", description: "A fan of flames rolls out in front of you over %range% blocks: %coef% %power%, monsters pushed back, %burn% burns each."}
      f: {name: "Little sun", description: "A sun rises where you aim: %hits% pulses of %coef% %power% within %radius% blocks over %duration% s, then it bursts (%final_pct% %power%)."}
    druid:
      role: "Fighting support, control"
      difficulty: 2
      strengths: "Heals the whole party by fighting, roots monsters, the highest health of the three classes."
      weaknesses: "The lowest damage of the three classes: he wins over time."
      passive: {name: "Seeds and Bloom", description: "Every hit plants a seed. At %seed-max% seeds the monster blooms: rooted for %root% s, it takes %bloom_pct% %power%, and the pollen heals you and the allies within %bloom-heal-radius% blocks of the flower (%bloom-heal_pct% %power%) and seeds the monsters around."}
      basic: {name: "Thorn", description: "Throws a thorn (%coef% %power%) up to %range% blocks. Plants a seed."}
      right: {name: "Vine", description: "A vine hooks what you aim at (wall, ground or monster, up to %range% blocks) and hauls you there. Monsters you fly through take %coef% %power% and a seed; a monster caught is rooted for %root% s."}
      a: {name: "Bramble garden", description: "Brambles grow where you aim (%radius% blocks) for %duration% s: %hits% hits of %coef% %power%, monsters slowed and seeded."}
      f: {name: "Maneater", description: "A giant carnivorous plant grows where you aim and fights for %duration% s: %hits% bites of %coef% %power% on the monsters within %radius% blocks. As it withers, its pollen heals the allies within %heal-radius% blocks for %heal_pct% %power%."}
