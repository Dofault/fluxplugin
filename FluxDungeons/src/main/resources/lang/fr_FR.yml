      a: {name: "Boule de feu", description: "Explose à l'impact : %coef% %power% en feu sur %radius% blocs."}
      f: {name: "Nova de givre", description: "%coef% %power% en glace autour de toi (%radius% blocs), ennemis ralentis de %slow_pct% pendant %duration% s."}
    healer:
      role: "Soin et soutien"
      difficulty: 2
      strengths: "Soigne le groupe, renforce les dégâts des alliés, beaucoup de mana."
      weaknesses: "Dégâts faibles : seul, il avance lentement."
      basic: {name: "Rayon sacré", description: "Un rayon de lumière (%coef% %power%) jusqu'à %range% blocs."}
      right: {name: "Soin", description: "Soigne l'allié visé, ou toi, de %coef% %power% (jusqu'à %range% blocs)."}
      a: {name: "Bénédiction", description: "Les alliés à %radius% blocs font %damage_bonus_pct% de dégâts en plus pendant %duration% s."}
      f: {name: "Sanctuaire", description: "Une zone de soin de %radius% blocs : %hits% soins de %coef% %power% en %duration% s."}
    cryomancer:
      role: "Contrôle de zone, réactions en chaîne"
      difficulty: 3
      strengths: "Chaque coup laisse du givre : au bout de quelques coups le monstre est pris dans la glace, et le coup suivant le fait éclater sur ses voisins."
      weaknesses: "Fragile au contact, ses gros dégâts demandent de préparer le gel."
      basic: {name: "Éclat de glace", description: "Lance un éclat de glace (%coef% %power%) jusqu'à %range% blocs. Laisse du givre."}
      right: {name: "Glissade boréale", description: "Glisse sur %distance% blocs sur un sillage de glace : les monstres traversés prennent %coef% %power% et du givre."}
      a: {name: "Faille glaciaire", description: "Des pics de glace jaillissent du sol sur %range% blocs : %coef% %power%, les monstres sont projetés en l'air et couverts de givre."}
      f: {name: "Comète de l'hiver", description: "Une comète de glace s'écrase là où tu vises : %coef% %power% sur %radius% blocs, tous les monstres touchés sont gelés, le sol reste gelé %duration% s."}
