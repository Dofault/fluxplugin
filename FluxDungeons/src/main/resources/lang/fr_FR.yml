  classes:
    warrior:
      role: "Tank, corps à corps"
      difficulty: 1
      strengths: "Beaucoup de santé et de défense, frappe plusieurs ennemis, attire les monstres sur lui."
      weaknesses: "Lent, aucune attaque à distance, peu de mana."
      basic: {name: "Coup en arc", description: "Frappe jusqu'à %targets% ennemis devant toi (%coef% %power%)."}
      right: {name: "Charge", description: "Fonce sur %distance% blocs et frappe jusqu'à %targets% ennemis (%coef% %power%), étourdis %stun% s."}
      a: {name: "Cri de guerre", description: "Attire les monstres à %radius% blocs et réduit tes dégâts subis de %damage_reduction_pct% pendant %duration% s."}
      f: {name: "Tourbillon", description: "Tourne sur toi-même : %hits% coups de %coef% %power% sur les ennemis à %radius% blocs."}
    archer:
      role: "Dégâts à distance"
      difficulty: 2
      strengths: "Longue portée, critiques fréquents, attaque vite, esquive."
      weaknesses: "Fragile au contact : il faut garder ses distances."
      basic: {name: "Tir", description: "Tire une flèche (%coef% %power%) jusqu'à %range% blocs."}
      right: {name: "Bond arrière", description: "Saute en arrière et court %speed_pct% plus vite pendant %duration% s."}
      a: {name: "Volée", description: "Tire un éventail de %arrows% flèches, %coef% %power% chacune."}
      f: {name: "Pluie de flèches", description: "Des flèches tombent là où tu vises pendant %duration% s : %hits% vagues de %coef% %power% sur %radius% blocs."}
    mage:
      role: "Dégâts de zone, contrôle"
      difficulty: 3
      strengths: "Les plus gros dégâts de zone, gèle et ralentit des groupes entiers."
      weaknesses: "Très fragile, dépend entièrement de son mana."
      basic: {name: "Trait arcanique", description: "Un trait de magie (%coef% %power%) jusqu'à %range% blocs."}
      right: {name: "Transfert", description: "Te téléporte de %distance% blocs devant toi."}
      a: {name: "Boule de feu", description: "Explose à l'impact : %coef% %power% en feu sur %radius% blocs."}
      f: {name: "Nova de givre", description: "%coef% %power% en glace autour de toi (%radius% blocs), ennemis ralentis de %slow_pct% pendant %duration% s."}
    healer:
      role: "Soin et soutien"
      difficulty: 2
      strengths: "Soigne le groupe, renforce les dégâts des alliés, beaucoup de mana."
      weaknesses: "Dégâts faibles : seul, il avance lentement."
      basic: {name: "Rayon sacré", description: "Un rayon de lumière (%coef% %power%) jusqu'à %range% blocs."}
      right: {name: "Soin", description: "Soigne l'allié visé, ou toi, de %coef% %power% (jusqu'à %range% blocs)."}
      a: {name: "Bénédiction", description: "Les alliés à %radius% blocs font %damage_bonus_pct% de dégâts en plus pendant %duration% s."}
      f: {name: "Sanctuaire", description: "Une zone de soin de %radius% blocs : %hits% soins de %coef% %power% en %duration% s."}
    cryomancer:
      role: "Contrôle de zone, réactions en chaîne"
      difficulty: 3
      strengths: "Chaque coup laisse du givre : au bout de quelques coups le monstre est pris dans la glace, et le coup suivant le fait éclater sur ses voisins."
      weaknesses: "Fragile au contact, ses gros dégâts demandent de préparer le gel."
      basic: {name: "Éclat de glace", description: "Lance un éclat de glace (%coef% %power%) jusqu'à %range% blocs. Laisse du givre."}
      right: {name: "Glissade boréale", description: "Glisse sur %distance% blocs sur un sillage de glace : les monstres traversés prennent %coef% %power% et du givre."}
      a: {name: "Faille glaciaire", description: "Des pics de glace jaillissent du sol sur %range% blocs : %coef% %power%, les monstres sont projetés en l'air et couverts de givre."}
      f: {name: "Comète de l'hiver", description: "Une comète de glace s'écrase là où tu vises : %coef% %power% sur %radius% blocs, tous les monstres touchés sont gelés, le sol reste gelé %duration% s."}
      passive: {name: "Givre et Éclatement", description: "Chaque coup laisse du givre qui ralentit. À %chill-max% givres le monstre est pris dans la glace %freeze% s (un boss est seulement ralenti). Le coup suivant d'un autre sort le fait éclater : %shatter_pct% %power%, et les éclats blessent et givrent les monstres à %shatter-radius% blocs. Chaque éclatement te rend %shatter-heal_pct% de ta santé."}
    pyromancer:
      role: "Dégâts de zone, feu qui se propage"
      difficulty: 3
      strengths: "Les plus gros dégâts des trois classes. Le feu passe d'un monstre à l'autre, et plus il frappe, plus il chauffe."
      weaknesses: "La plus petite santé. Sa chaleur retombe dès qu'il arrête de frapper."
      passive: {name: "Brûlure et Chaleur", description: "Chaque coup embrase le monstre : %burn_pct% %power% par seconde et par brûlure, jusqu'à %burn-max% brûlures. Un monstre qui meurt en feu explose (%wildfire_pct% %power% sur %wildfire-radius% blocs) et embrase ses voisins. Chaque coup te réchauffe : jusqu'à %heat-damage_pct% de dégâts en plus, puis à 100 de chaleur l'Embrasement : pendant %blaze-seconds% s ton trait part en éventail de %blaze-bolts% braises et tu attaques plus vite. L'Embrasement te rend %blaze-heal_pct% de ta santé."}
      basic: {name: "Trait de braise", description: "Lance une braise (%coef% %power%) jusqu'à %range% blocs. Embrase le monstre touché."}
      right: {name: "Envol du phénix", description: "Décolle dans une gerbe de flammes et vole là où tu regardes : %coef% %power% sur %radius% blocs au décollage puis à l'atterrissage, monstres repoussés et embrasés."}
      a: {name: "Vague ardente", description: "Un éventail de flammes déferle devant toi sur %range% blocs : %coef% %power%, monstres repoussés, %burn% brûlures chacun."}
      f: {name: "Petit soleil", description: "Un soleil se lève là où tu vises : %hits% vagues de %coef% %power% sur %radius% blocs en %duration% s, puis il explose (%final_pct% %power%)."}
    druid:
      role: "Soutien offensif, contrôle"
      difficulty: 2
      strengths: "Soigne tout le groupe en se battant, immobilise les monstres, la plus grosse santé des trois classes."
      weaknesses: "Les dégâts les plus faibles des trois classes : il gagne sur la durée."
      passive: {name: "Graines et Floraison", description: "Chaque coup plante une graine. À %seed-max% graines le monstre fleurit : enraciné %root% s, il prend %bloom_pct% %power%, et le pollen te soigne ainsi que les alliés à %bloom-heal-radius% blocs de la fleur (%bloom-heal_pct% %power%) et sème une graine dans les monstres voisins."}
      basic: {name: "Épine", description: "Lance une épine (%coef% %power%) jusqu'à %range% blocs. Plante une graine."}
      right: {name: "Liane", description: "Une liane s'accroche à ce que tu vises (mur, sol ou monstre, jusqu'à %range% blocs) et te tire jusque-là. Les monstres traversés prennent %coef% %power% et une graine ; un monstre attrapé est enraciné %root% s."}
      a: {name: "Jardin de ronces", description: "Des ronces poussent là où tu vises (%radius% blocs) pendant %duration% s : %hits% coups de %coef% %power%, monstres ralentis et semés de graines."}
      f: {name: "Fleur dévorante", description: "Une plante carnivore géante pousse là où tu vises et se bat pendant %duration% s : %hits% morsures de %coef% %power% sur les monstres à %radius% blocs. En fanant, son pollen soigne les alliés à %heal-radius% blocs de %heal_pct% %power%."}
