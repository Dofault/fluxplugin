# FluxDungeons: instanced dungeons played in parties.
# Classes: classes.yml, monsters: mobs.yml, dungeons: dungeons/<id>.yml. Players fight with their own gear (vanilla combat).

# Language of the texts (lang/<language>.yml), empty = the suite's language.
language: ""

# World the dungeons are played in, created empty when missing. Templates sit at negative z, runs side by side at z 0.
world: flux_dungeons
# Distance between two runs (and two templates), in blocks.
slot-spacing: 512
# Blocks placed per tick when copying or wiping a dungeon (higher: faster start, heavier ticks).
blocks-per-tick: 20000
# Runs played at the same time, at most.
max-runs: 8
# Seconds between the victory and the return of the players.
return-delay: 10

# Rpg universe (docs/technique/rpg.md): lobby world, created empty with a stone platform when missing. It must be
# listed in the "rpg" universe of plugins/Flux/universes.yml.
rpg:
  world: flux_rpg
  # Where players arrive in the lobby (/rpg, respawn, the void): set it standing there with /rpgadmin setspawn.
  # Missing: the middle of the platform.
  # spawn: {x: 0.5, y: 65, z: 0.5, yaw: 180, pitch: 0}
  # The class showcase (/classe in the lobby, Java clients): the player watches each class cast its real spells in a
  # small arena, through a fixed camera, a panel on the left third of his screen (docs/technique/rpg.md).
  showcase:
    enabled: true
    # One arena per viewer: how many, where the first one is (the lobby world, far from the lobby) and how far apart.
    stages: 6
    origin: {x: 4000, y: 100, z: 4000}
    spacing: 320
    # From the middle of the arena (x: west is negative and on the right of the screen, z: away from the camera).
    camera: {x: 2.25, y: 4.2, z: -9.5, pitch: 20}
    actor: {x: 4.5, z: 0}
    monsters: [[-2.5, 0], [-4.2, 1.9], [-4.2, -1.9]]
    monster: HUSK
    # Level of the actor (the monsters are level 1 normal ones).
    level: 1
    # Time of day the viewer sees (the arena is lit from above).
    time: 14000
    # Ticks the pointer rests on a class before its show starts.
    hover-ticks: 5
    pointer:
      # Screen units per degree of mouse turn (the screen is about 2.5 units wide).
      speed: 0.02
    panel:
      # Blocks between the camera and the panel. Everything is drawn for a field of view of 70 on a 16:9 screen.
      distance: 1.0
      pointer-scale: 0.16
      # Colours: opacity then colour, eight hex digits.
      background: "D9120826"
      edge: "FFF0A800"
      card: "B00D0D0D"
      card-hover: "D05B2D9E"
      choose: "D02A9D5F"
      choose-hover: "FF2ECF7B"
      caption: "99000000"
    # What the actor does, in a loop. monsters <n> (new ones, the former go), wait <ticks>, basic <times> <ticks between>,
    # cast <right|a|f>, home (the actor back to his place). Each big spell starts on a fresh scene, the spell that
    # moves the actor comes last: it pushes the monsters about.
    scripts:
      default: ["monsters 3", "wait 15", "basic 4 10", "wait 14", "cast a", "wait 50", "home", "monsters 3", "wait 20", "cast f", "wait 110", "home", "monsters 3", "wait 20", "cast right", "wait 45"]
      pyromancer: ["monsters 3", "wait 15", "basic 4 10", "wait 14", "cast a", "wait 45", "home", "monsters 3", "wait 20", "cast f", "wait 130", "home", "monsters 3", "wait 20", "cast right", "wait 55"]
      druid: ["monsters 3", "wait 15", "basic 4 10", "wait 14", "cast a", "wait 115", "home", "monsters 3", "wait 20", "cast f", "wait 180", "home", "monsters 3", "wait 20", "cast right", "wait 45"]

party:
  max-size: 4

scaling:
  # Each extra player adds this share of the monsters of every wave (0.5: 4 monsters become 6 for two players).
  extra-mobs-per-player: 0.5
  # Each extra player adds this share of the boss's life.
  boss-health-per-player: 0.6

reward:
  # The money of a victory is "reward.minutes" of a dungeon times the income of a level 100 player (FluxValue).
  # Without FluxValue, this amount per minute is used instead.
  money-per-minute-without-fluxvalue: 50

# Monsters of imported maps appear when a player comes this close to their place (blocks).
spawn-distance: 40
# View and simulation distance of dungeon worlds, in chunks (the server's would load the whole map).
view-distance: 8
# Damage numbers of the whole server (in place of CMI's, ShowDamageNumbers off in CMI/Settings/Combat.yml): a number
# rising above whoever a player hurts, in every world (rpg engine hits included). {damage}: 5, 4.5.
damage-numbers:
  enabled: true
  mob-format: "&c❤{damage}"
  player-format: "&c⚔{damage}"
  # rpg extras in the same style: a crit dealt, a dodge (a monster's rpg hit on a player uses player-format)
  crit-format: "&#FFD94D❤{damage} ✦"
  dodge-format: "&7Esquive"

# Life bar above the monsters, with their name and level: a red bar with the life written inside in QuinqueFive,
# drawn by a font of the pack (FluxDungeons/assets/gen_healthbar.py, then /iazip).
health-bar:
  enabled: true
  font: fluxdungeons:health
  # Also above every other creature near a player, everywhere (name translated by the game, LevelledMobs level when
  # it has one). Turn LevelledMobs' nametags off then.
  all-mobs: false
  # Outside the dungeons, a creature shows its bar only once hurt (it appears on the first hit) and loses it back at
  # full life. false = a bar on every creature nearby, even unhurt.
  only-hurt: true

# How a player reacts to a monster's hit in a dungeon: one melee hit out of melee-push-every pushes him melee-push
# blocks along the ground (never up); a hit from afar (arrow, ability) stops his momentum for an instant
# (ranged-stagger, no potion); each frost arrow adds frost-per-hit freezing ticks (progressive, never up to freezing
# damage). His screen shakes at most once every screen-shake-ms (the sound of each hit still plays).
hit-reaction:
  melee-push: 2
  melee-push-every: 4
  ranged-stagger: true
  frost-per-hit: 30
  screen-shake-ms: 1000

# Attack cadence of weapons: a rule of the WHOLE server (PvP included), carried by FluxDungeons as it serves PvE first.
# Attack cadence (as Wynncraft): a weapon attacks at its own pace, spam clicks do nothing until it is recharged,
# the weapon visibly comes back slowly (slower for a slow weapon), the vanilla recharge indicator is hidden (empty
# sprites over the pack influstatique). Hits always land at full charge. false: items lose it at their next refresh.
attack-cadence:
  enabled: true
  # Share of the recharge needed to attack again (1 = full).
  minimum-charge: 1.0
  # The swing of the weapon lasts the whole recharge.
  slow-swing: true
  # Length of the swing as a share of the recharge: the game lets the next hit go a little before the end (around
  # 80 %), a swing as long as the recharge restarted before the weapon was back. Raise it if the weapon comes back
  # too fast, lower it if the swing still restarts before its end.
  swing-share: 0.8
  # Particle and sound at every real swing, even in the air, where the swing reaches: the player's reach (attribute,
  # bonuses of pets and effects included, or the weapon's range), stopped by the first block or creature. none: off.
  swing-particle: SWEEP_ATTACK
  swing-sound:
    key: minecraft:entity.player.attack.sweep
    volume: 0.7
    pitch: 1.0

# Melee reach of the monsters: this many blocks beyond the vanilla reach (players hit at their class's range).
dungeon-reach-bonus: 1.5
# Aim assist of the rpg, the same for every class (basic attack: melee, arrow, bolt, shard): a monster counts as
# aimed at when the line of aim passes within margin blocks of its body (a near miss, at any distance: a baby
# zombie far away is as easy as a big monster), or when it lies within angle degrees of where the player looks
# (close up). The one closest to the aim wins, never through a wall. Shots fly at it (an arrow a little higher).
aim-assist:
  enabled: true
  angle: 12
  margin: 1.2

# Aggro. alert-radius: a monster that spots a player brings in the calm monsters of the run it sees within this many
# blocks (no chain; 0: off). A monster hit by a player (weapon, spell, zone, summoned plant) cries for help: the
# call-max nearest calm monsters it sees within call-radius (or within hear-radius, seen or not) come for that player,
# again every call-cooldown seconds while it is being hit (call-radius 0: off). switch-ratio: a monster leaves its
# target for a player who dealt it that many times the damage of its target.
aggro:
  alert-radius: 10
  call-radius: 12
  hear-radius: 4
  call-max: 3
  call-cooldown: 4
  switch-ratio: 1.3

# Blocks players may break in dungeons (every other block stays), plus the "breakable" list of each dungeon.
# drops: false = the block goes without dropping anything (crops uprooted before the Harvest Hamster eats them);
# drops: true = it drops its item (ores to mine and carry into the dungeon).
breakable:
  CARROTS: {drops: false}
  POTATOES: {drops: false}
  WHEAT: {drops: false}
  BEETROOTS: {drops: false}

# Jingles (FluxMusic) at the end of a run, over the boss music which stops. A dungeon gives its boss music in its
# own file (music.boss, started once a player comes within music.radius blocks of the boss).
music:
  victory: victoire_boss
  defeat: defaite

# Clés de donjon (2026-11-14) : le chef du groupe dépense une clé du métier du donjon (job: du donjon) pour le lancer.
# Elles tombent en faisant les actions payées de ce métier en Semi-RP : chaque action tente sa chance avec ses points
# FluxValue, pour une clé toutes les « minutes » minutes de jeu optimal en moyenne. Le staff (bypass-permission) et
# /fluxdungeons start (Typewriter) n'en dépensent pas. Affichées dans le menu Carrières (première action rémunérée).
keys:
  required: true
  minutes: 20
  bypass-permission: fluxdungeons.admin

# Jetons de donjon (monnaie Flux « currency ») : chaque monstre vaincu en donne à chaque joueur du groupe selon son rang,
# multipliés par la récompense du niveau de difficulté. Ils jaillissent du monstre (au plus max-coins-shown pièces).
tokens:
  currency: dungeon_tokens
  per-rank:
    TRASH: 1
    ELITE: 2
    MINIBOSS: 5
    BOSS: 20
  max-coins-shown: 6

# Fin d'un donjon gagné : retour immédiat au lobby RPG, feux d'artifice (sans dégâts), puis le familier du boss
# (adopté à la première victoire, sa carte ensuite) après pet-delay-ticks.
victory:
  fireworks: 8
  pet-delay-ticks: 70
