# FluxDungeons: instanced dungeons played in parties.
# Classes: classes.yml, monsters: mobs.yml, dungeons: dungeons/<id>.yml. Players fight with their own gear (vanilla combat).

# Language of the texts (lang/<language>.yml), empty = the suite's language.
language: ""

# World the dungeons are played in, created empty when missing. Templates sit at negative z, runs side by side at z 0.
world: flux_dungeons
# Distance between two runs (and two templates), in blocks.
slot-spacing: 512
# Blocks placed per tick when copying or wiping a dungeon (higher: faster start, heavier ticks).
blocks-per-tick: 20000
# Runs played at the same time, at most.
max-runs: 8
# Seconds between the victory and the return of the players.
return-delay: 10

party:
  max-size: 4

classes:
  max-level: 30
  # Experience to go from level n to n+1: xp-base × n ^ xp-exponent.
  xp-base: 60
  xp-exponent: 1.5

scaling:
  # Each extra player adds this share of the monsters of every wave (0.5: 4 monsters become 6 for two players).
  extra-mobs-per-player: 0.5
  # Each extra player adds this share of the boss's life.
  boss-health-per-player: 0.6

reward:
  # The money of a victory is "reward.minutes" of a dungeon times the income of a level 100 player (FluxValue).
  # Without FluxValue, this amount per minute is used instead.
  money-per-minute-without-fluxvalue: 50

# Monsters of imported maps appear when a player comes this close to their place (blocks).
spawn-distance: 40
# View and simulation distance of dungeon worlds, in chunks (the server's would load the whole map).
view-distance: 8
# Life bar above the monsters, with their name and level: the picture bar of FluxAFK and FluxTools (one picture per
# step, {step} from 0 to steps), a bar of text when the pack does not have these pictures.
health-bar:
  enabled: true
  glyph: "fluxafk:bar_{step}"
  steps: 20

# Pets taken into a dungeon (chosen on the launch screen): how many at most, and their numbers, the same for every
# pet for now. Each one is an invisible, silent mob wearing the pet's model, with the plugin's own behaviour (follow,
# attack what the owner fights).
pets:
  max: 5
  health: 40
  # Damage of a hit (the monster's vanilla armour applies) and ticks between two hits (20 = one second).
  attack: 6
  attack-ticks: 20
  # Moving speed (multiplier of the body's) and reach of a hit, in blocks.
  speed: 1.2
  reach: 1.2
  # Bodies of the pets: a walking mob, and a flying one for "flying" pets.
  body:
    ground: WOLF
    flying: BEE

# Attack cadence of weapons: a rule of the WHOLE server (PvP included), carried by FluxDungeons as it serves PvE first.
# Attack cadence (as Wynncraft): a weapon attacks at its own pace, spam clicks do nothing until it is recharged,
# the weapon visibly comes back slowly (slower for a slow weapon), the vanilla recharge indicator is hidden (empty
# sprites over the pack influstatique). Hits always land at full charge. false: items lose it at their next refresh.
attack-cadence:
  enabled: true
  # Share of the recharge needed to attack again (1 = full).
  minimum-charge: 1.0
  # The swing of the weapon lasts the whole recharge.
  slow-swing: true
  # Length of the swing as a share of the recharge: the game lets the next hit go a little before the end (around
  # 80 %), a swing as long as the recharge restarted before the weapon was back. Raise it if the weapon comes back
  # too fast, lower it if the swing still restarts before its end.
  swing-share: 0.8
  # Particle and sound at every real swing, even in the air, where the swing reaches: the player's reach (attribute,
  # bonuses of pets and effects included, or the weapon's range), stopped by the first block or creature. none: off.
  swing-particle: SWEEP_ATTACK
  swing-sound:
    key: minecraft:entity.player.attack.sweep
    volume: 0.7
    pitch: 1.0

# In a dungeon: the player's reach grows by this many blocks (4.5 instead of 3), and the melee reach of the monsters by
# as much. Aim assist: a swing in the air hits the monster closest to the aimed direction, within the player's reach,
# if it passes within radius blocks of it.
dungeon-reach-bonus: 1.5
aim-assist:
  enabled: true
  radius: 1.8
