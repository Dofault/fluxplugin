# FluxDungeons: instanced dungeons played in parties.
# Classes: classes.yml, monsters: mobs.yml, dungeon gear: items.yml, dungeons: dungeons/<id>.yml.

# Language of the texts (lang/<language>.yml), empty = the suite's language.
language: ""

# World the dungeons are played in, created empty when missing. Templates sit at negative z, runs side by side at z 0.
world: flux_dungeons
# Distance between two runs (and two templates), in blocks.
slot-spacing: 512
# Blocks placed per tick when copying or wiping a dungeon (higher: faster start, heavier ticks).
blocks-per-tick: 20000
# Runs played at the same time, at most.
max-runs: 8
# Seconds between the victory and the return of the players.
return-delay: 10

party:
  max-size: 4

classes:
  max-level: 30
  # Experience to go from level n to n+1: xp-base × n ^ xp-exponent.
  xp-base: 60
  xp-exponent: 1.5

scaling:
  # Each extra player adds this share of the monsters of every wave (0.5: 4 monsters become 6 for two players).
  extra-mobs-per-player: 0.5
  # Each extra player adds this share of the boss's life.
  boss-health-per-player: 0.6

reward:
  # The money of a victory is "reward.minutes" of a dungeon times the income of a level 100 player (FluxValue).
  # Without FluxValue, this amount per minute is used instead.
  money-per-minute-without-fluxvalue: 50

# Monsters of imported maps appear when a player comes this close to their place (blocks).
spawn-distance: 40
# View and simulation distance of dungeon worlds, in chunks (the server's would load the whole map).
view-distance: 8
# Monster loot, as EliteMobs: only players who dealt at least 10 % of a monster's life get it.
# Unique items: each rolled on its own chance (mobs/ files). Class loot: one roll on the monster's rank, then an item of
# the player's class 80 % of the time. Dropped weapons and armour take the level of the run.
mob-loot: true
class-loot-chance:
  trash: 0.05
  miniboss: 0.25
  boss: 1.0
class-loot-relevant-chance: 0.8

# Dungeon combat, EliteMobs' model (mob/Combat.java): the run's level is the party's average class level; 3 hits kill a
# normal monster with a weapon of that level, 5 of its hits kill a player wearing armour of that level; vanilla weapon
# damage and armour are replaced.
combat:
  # Global multipliers (EliteMobs: 1).
  damage-to-player-multiplier: 1
  damage-to-monster-multiplier: 1
  # Reduction of hits blocked with a shield (arrows are stopped).
  shield-reduction: 0.8
  # Ability powers of classes.yml count in hits of this value (6 = an iron sword).
  ability-reference-hit: 6
  # After a monster hit, others are ignored for this long (10 = vanilla invulnerability, 0.5 s).
  player-grace-ticks: 10
