# Classes de FluxDungeons. stats : ajoutées aux valeurs du joueur au niveau 1, per-level : ajoutées à chaque niveau.
# Stats : max-health, attack, armor, speed (part : 0.1 = +10 %), attack-speed, knockback-resistance.
# Types de compétences : charge, war_cry, whirlwind, volley, leap_back, arrow_rain, fireball, frost_nova, blink, heal, blessing, smite.

warrior:
  name: Guerrier
  color: '#FF5C5C'
  icon: IRON_SWORD
  description:
  - Tient la ligne de front et attire les monstres sur lui.
  stats:
    max-health: 8
    attack: 1
    armor: 2
    knockback-resistance: 0.1
  per-level:
    max-health: 0.5
    attack: 0.08
    armor: 0.05
  mana:
    max: 100
    regen: 6
  kit:
  - fluxdungeons:warrior_sword
  - fluxdungeons:warrior_chestplate
  - fluxdungeons:warrior_helmet
  - fluxdungeons:warrior_leggings
  - fluxdungeons:warrior_boots
  abilities:
  - type: charge
    name: Charge
    icon: FEATHER
    description:
    - Fonce droit devant et frappe les monstres sur son passage.
    mana: 20
    cooldown: 7
    power: 6
    distance: 1.6
    radius: 2.5
  - type: war_cry
    name: Cri de guerre
    icon: GOAT_HORN
    description:
    - Les monstres proches t'attaquent, tu résistes, tes alliés frappent plus fort.
    mana: 30
    cooldown: 18
    radius: 10
    duration: 6
    resistance: 1
  - type: whirlwind
    name: Tourbillon
    icon: IRON_AXE
    description:
    - Tourne sur toi-même et frappe tous les monstres autour.
    mana: 35
    cooldown: 10
    power: 7
    radius: 4
ranger:
  name: Rôdeur
  color: '#2ECF7B'
  icon: BOW
  description:
  - Rapide, redoutable à distance, difficile à attraper.
  stats:
    max-health: 2
    attack: 0.5
    speed: 0.1
  per-level:
    max-health: 0.3
    attack: 0.06
    speed: 0.002
  mana:
    max: 100
    regen: 7
  kit:
  - fluxdungeons:ranger_bow
  - fluxdungeons:ranger_arrow
  - fluxdungeons:ranger_dagger
  - fluxdungeons:ranger_tunic
  - fluxdungeons:ranger_leggings
  - fluxdungeons:ranger_boots
  abilities:
  - type: volley
    name: Salve
    icon: SPECTRAL_ARROW
    description:
    - Tire un éventail de cinq flèches.
    mana: 25
    cooldown: 6
    power: 5
    arrows: 5
    spread: 8
  - type: leap_back
    name: Bond arrière
    icon: RABBIT_FOOT
    description:
    - Saute en arrière et court plus vite un instant.
    mana: 15
    cooldown: 8
    strength: 1.4
    duration: 3
  - type: arrow_rain
    name: Pluie de flèches
    icon: ARROW
    description:
    - Des flèches s'abattent là où tu vises pendant quelques secondes.
    mana: 45
    cooldown: 16
    power: 14
    radius: 4
    duration: 3
    range: 30
mage:
  name: Mage
  color: '#6FA8FF'
  icon: BLAZE_ROD
  description:
  - Fragile, mais brûle et gèle des groupes entiers.
  stats:
    max-health: -2
  per-level:
    max-health: 0.3
    attack: 0.05
  mana:
    max: 140
    regen: 9
  kit:
  - fluxdungeons:mage_staff
  - fluxdungeons:mage_robe
  - fluxdungeons:mage_hood
  - fluxdungeons:mage_leggings
  - fluxdungeons:mage_boots
  abilities:
  - type: fireball
    name: Boule de feu
    icon: FIRE_CHARGE
    description:
    - Une boule de feu qui souffle les monstres autour de l'impact.
    mana: 20
    cooldown: 2.5
    power: 8
    radius: 2.5
    speed: 1.6
  - type: frost_nova
    name: Nova de givre
    icon: SNOWBALL
    description:
    - Gèle et ralentit tous les monstres autour.
    mana: 40
    cooldown: 12
    power: 7
    radius: 5
    duration: 4
  - type: blink
    name: Transfert
    icon: ENDER_PEARL
    description:
    - Se téléporte quelques blocs plus loin.
    mana: 25
    cooldown: 8
    distance: 8
cleric:
  name: Clerc
  color: '#FFD94D'
  icon: GOLDEN_HELMET
  description:
  - Soigne et protège le groupe, châtie à distance.
  stats:
    max-health: 4
    armor: 1
  per-level:
    max-health: 0.4
    attack: 0.05
    armor: 0.03
  mana:
    max: 120
    regen: 8
  kit:
  - fluxdungeons:cleric_scepter
  - fluxdungeons:cleric_chestplate
  - fluxdungeons:cleric_helmet
  - fluxdungeons:cleric_leggings
  - fluxdungeons:cleric_boots
  abilities:
  - type: heal
    name: Soin
    icon: GLISTERING_MELON_SLICE
    description:
    - Soigne toi et les alliés autour de toi.
    mana: 35
    cooldown: 8
    power: 8
    radius: 8
  - type: blessing
    name: Bénédiction
    icon: TOTEM_OF_UNDYING
    description:
    - Cœurs en plus et régénération pour les alliés proches.
    mana: 50
    cooldown: 20
    duration: 8
    radius: 8
    absorption: 1
  - type: smite
    name: Châtiment
    icon: BLAZE_POWDER
    description:
    - La foudre frappe le monstre que tu vises.
    mana: 25
    cooldown: 5
    power: 9
    range: 20
