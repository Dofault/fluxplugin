# Monstres des donjons écrits à la main (les monstres importés d'EliteMobs vivent dans mobs/<donjon>.yml).
# Compétences : leap, fireball, arrow, volley, cone, taze, lightning, implosion, summon, slam, heal, shield, enrage,
# et celles de la roche : boulder (rocher lancé), rockfall (pluie de rochers), quake (séisme en anneau),
# ice_spikes (ligne de pics de glace), stone_skin (peau de pierre), bite (morsure), uplift (projette en l'air et aveugle),
# cataclysm (cercle de feu puis énorme coup dans ce rayon), rock_shard (éclat qui poursuit qui reste loin).
# hold : ticks d'immobilité pendant l'animation. ranged-resistance : part des dégâts de projectiles ignorée.
# every : secondes entre deux lancers ; below : seulement sous ce % de vie ; power : dégâts ;
# animation / impact : animation du modèle et ticks avant l'effet. attack-speed : coups au corps à corps par seconde.
# Armures en cuir teintes : "LEATHER_CHESTPLATE #7D7D7D". Un bloc en tête (head: GRANITE) se porte comme un casque.

# ─── Donjon Rochiste ─────────────────────────────────────────────────────────

rochiste_tailleur:
  type: ZOMBIE
  name: '&#B8B2AATailleur de pierre'
  health: 24
  damage: 2
  speed: 0.25
  xp: 10
  equipment:
    hand: STONE_PICKAXE
    head: "LEATHER_HELMET #8A8580"
    chest: "LEATHER_CHESTPLATE #6F6A64"
    legs: "LEATHER_LEGGINGS #4E4A46"
    feet: "LEATHER_BOOTS #3A3633"
  abilities:
  - type: boulder
    every: 7
    block: COBBLESTONE
    size: 0.5
    radius: 1.6
    power: 3

rochiste_lanceur:
  type: HUSK
  name: '&#D9B77ALanceur de grès'
  health: 22
  damage: 2
  speed: 0.23
  xp: 12
  equipment:
    head: SANDSTONE
    chest: "LEATHER_CHESTPLATE #C2A26B"
    legs: "LEATHER_LEGGINGS #9C7F4E"
    feet: "LEATHER_BOOTS #6E5836"
  abilities:
  - type: boulder
    every: 6
    block: SANDSTONE
    size: 1.1
    radius: 2.5
    power: 5

rochiste_sentinelle:
  type: STRAY
  name: '&#9FD6F0Sentinelle de givre'
  health: 20
  damage: 1
  speed: 0.24
  # archer : tire deux fois plus souvent qu'en vanilla (par défaut), des flèches légères
  ranged-rate: 2
  xp: 12
  equipment:
    hand: BOW
    head: PACKED_ICE
    chest: "LEATHER_CHESTPLATE #9FD6F0"
    legs: "LEATHER_LEGGINGS #6FB3D6"
  abilities:
  - type: ice_spikes
    every: 9
    range: 12
    power: 4

rochiste_golem:
  type: ZOMBIE
  name: '&#C0705AGolem de granite'
  rank: MINIBOSS
  health: 80
  damage: 5
  speed: 0.2
  attack-speed: 0.8
  scale: 1.5
  xp: 40
  equipment:
    head: GRANITE
    chest: "LEATHER_CHESTPLATE #9A5C48"
    legs: "LEATHER_LEGGINGS #7A4535"
    feet: "LEATHER_BOOTS #5A3226"
  abilities:
  - type: quake
    every: 10
    radius: 6
    power: 5
  - type: stone_skin
    every: 15
    below: 50
    duration: 5
    level: 2

rochiste_colosse:
  type: RAVAGER
  name: '&#7E6FA0&lColosse d''Abîme'
  boss: true
  rank: BOSS
  model: colosse_abime
  health: 500
  damage: 7
  # très lent, au rythme de son animation de marche : environ 1 bloc par seconde
  speed: 0.022
  attack-speed: 0.5
  # la moitié des dégâts des projectiles : le corps à corps est la bonne façon de le battre
  ranged-resistance: 0.5
  xp: 200
  abilities:
  # par ordre de priorité quand plusieurs sont prêtes
  - type: cataclysm
    every: 35
    animation: attack_ultimate
    impact: 80
    hold: 160
    radius: 10
    power: 20
    title: '&#FF5C5C&lCATACLYSME'
    subtitle: '&#FFD94DSors du cercle de feu !'
  - type: uplift
    every: 13
    animation: attack_stomp
    impact: 20
    hold: 46
    radius: 6
    height: 5
    power: 5
    title: '&#C0705ALe sol se dérobe !'
  - type: bite
    every: 5
    animation: attack_bite
    impact: 12
    hold: 28
    range: 4.5
    power: 10
  - type: rock_shard
    every: 3
    min-range: 7
    power: 4
