# FluxPets : textes affichés aux joueurs (français). Choisi par « language » dans config.yml : lang/<language>.yml.
# Une clé absente ici reprend le texte par défaut du plugin (anglais).
#
# Codes & et &#RRGGBB. %img_<id>% affiche un glyphe du pack ItemsAdder de FluxPets, %img_<namespace>:<id>% celui de n'importe quel pack,
# toujours précédé de &r&f pour garder ses couleurs.
# Palette des cartes (hors charte serveur) : corail #FF7A59 (accent), parchemin #EADBC8 (textes),
# crème #FFF4E0 (noms), ardoise #6B7A8F (secondaire), sarcelle #5FB3B3 (infos), brique #D9534F (erreurs).

messages:
  prompt-title: "Familiers"
  prompt-label: "Réponse"
  prefix: "&#FFD94Dᴄᴀʀᴛᴇꜱ &7▸ "
  opened: "&#B376E5Ouverture d'un %booster%&#B376E5..."
  finished: "&#B376E5Booster terminé : &f%count% &#B376E5cartes obtenues."
  opened-all: "&f%boosters% &#B376E5boosters ouverts : &f%count% &#B376E5cartes obtenues."
  skipped: "&7Révélation passée, cartes ajoutées à ton inventaire."
  inventory-full: "&#FF5C5CInventaire plein : le reste t'attend dans &f/recompenses&#FF5C5C."
  inventory-needed: "&#FF5C5CPas assez de place : libère &f%slots% &#FF5C5Cemplacement(s) pour ouvrir ce booster."
  empty-booster: "&#FF5C5CCe booster ne contient aucune carte (configuration à vérifier)."
  unknown-booster: "&#FF5C5CBooster inconnu : &f%id%"
  unknown-card: "&#FF5C5CCarte inconnue : &f%id%"
  player-not-found: "&#FF5C5CJoueur introuvable : &f%player%"
  invalid-amount: "&#FF5C5CNombre invalide : &f%amount% &7(1 à 64)"
  given: "&f%amount%x &r%item% &#B376E5donné(s) à &f%player%&#B376E5."
  stashed: "&f%amount%x &r%item% &#B376E5mis en attente pour &f%player%&#B376E5."
  opened-for: "&f%amount% &#B376E5booster(s) &r%booster% &#B376E5ouvert(s) pour &f%player%&#B376E5."
  reloaded: "&#B376E5Configuration rechargée : &f%cards% &#B376E5cartes, &f%boosters% &#B376E5boosters."
  unknown-pet: "&#FF5C5CFamilier inconnu : &f%id%"
  player-only: "&#FF5C5CCommande réservée aux joueurs."
  no-permission: "&#FF5C5CTu n'as pas la permission."
  already-exists: "&#FF5C5C« %id% » existe déjà."
  created: "&#B376E5« &f%id%&#B376E5 » créé."
  deleted: "&#B376E5« &f%id%&#B376E5 » supprimé."
  pet-broadcast: "&f%player% &#B376E5vient d'adopter &r%pet%&#B376E5 !"
  pet-unlocked: "&#2ECF7BNouveau familier adopté : &r%pet%&#2ECF7B !"
  career-catch-up-received: "&#B376E5Rattrapage de carrière : &f%count% &#B376E5booster(s) pour tes niveaux déjà passés :"
  career-catch-up-line: "&7  • &r%booster% &fx%amount% &7(%job% niv. %level%)"
  series-complete: "&#FFD94DSérie %series% complète ! &#B376E5Tu reçois ses &f%count% &#B376E5peluches."
  card-used: "&f%amount% &#B376E5carte(s) utilisée(s) : &f+%xp% XP &#B376E5pour &r%pet%"
  card-pet-locked: "&#FF5C5CTu n'as pas encore adopté &r%pet%&#FF5C5C : ouvre son booster pour le débloquer."
  card-no-use: "&7Cette carte ne nourrit aucun familier."
  usage:
    - "&#FFD94D/influpet give <joueur> booster <id> [nombre] &7- donne des boosters"
    - "&#FFD94D/influpet stash <joueur> <booster> [nombre] &7- met des boosters en attente de /boosters"
    - "&#FFD94D/influpet give <joueur> card <id> [nombre] &7- donne une carte précise"
    - "&#FFD94D/influpet open <joueur> <booster> [nombre] &7- ouvre des boosters sans l'objet"
    - "&#FFD94D/influpet list <cards|pets|boosters> &7- liste le contenu"
    - "&#FFD94D/influpet info <card|pet|booster> <id> &7- détail et chances de tirage"
    - "&#FFD94D/influpet pet <give|take|givexp|reset|setlevel|...> <joueur> &7- familiers d'un joueur"
    - "&#FFD94D/influpet reload &7- recharge la configuration"
  list:
    cards: "&#FFD94DCartes &7(%count%)"
    card: "&7N°%number% &r%name% &7(%id%)"
    pets: "&#FFD94DFamiliers &7(%count%)"
    pet-enabled: "&r%name% &7(%id%, obtenable)"
    pet-disabled: "&r%name% &7(%id%, désactivé)"
    boosters: "&#FFD94DBoosters &7(%count%)"
    booster: "&r%name% &7(%id%, %draws% tirages)"
  info:
    card: "%name% &7(%id%, N°%number%, série %series%)"
    pet: "%name% &7(%id%)"
    chance: "&7- &r%booster% &#B376E5: %chance% par tirage"
    booster: "%name% &7(%id%, %draws% tirages) - chance par tirage :"
    pets-share: "&#FFD94DFamiliers &#B376E5%chance% des tirages"
    cards-share: "&#FFD94DCartes &#B376E5%chance% des tirages"

# Révélation d'un booster
reveal:
  actionbar: '%card%'
  # quantité au milieu de l'écran (sous-titre en gros)
  subtitle: '%rarity_color%&lx%count%'
  # verso commun des cartes, affiché en grand avant chaque carte
  back-title: "&r&f%img_carte_verso_grand%"
  actionbar-pet: "%card% &#2ECF7BNouveau familier !"
  actionbar-pet-duplicate: '%card% &7Déjà adopté &#B376E5: sa carte et sa peluche'
  actionbar-pet-duplicate-incomplete: '%card% &7Déjà adopté &#B376E5: sa carte en plus'

# Adoption d'un familier : titre = nom du familier, sous-titre en petites capitales
pet-reveal:
  title: "%pet%"
  subtitle: "&#FFD94DNᴏᴜᴠᴇᴀᴜ Fᴀᴍɪʟɪᴇʀ"

# Cartes : %tag% (rareté), %name%, %number% (N° dans la collection), %series%
card-format:
  name: "%tag% &f%name%"
  lore-header:
    - "&7N°%number% &7• %series%"
    - ""
  lore-footer: []
  # ajouté aux cartes qui nourrissent un familier
  lore-pet:
    - ""
    - "&#2ECF7B+%xp% XP &#B376E5pour &r%pet%"
    - "&7[Clic droit] &#FFD94DNourrir &7(Maj : toute la pile)"

# Familiers
pets:
  # nom d'un familier dans les menus d'édition et les annonces
  name-format: "%tag% &#2ECF7B%name%"

pet-settings:
  # nom affiché au-dessus du modèle qui suit le joueur
  pet-entity:
    name: "%pet%&f (Niv. %level%)"
  level-up:
    message:
      message:
        - ""
        - " &#B376E5Ton familier %pet%&#B376E5 passe au &#FFD94Dniveau %level%&#B376E5 !"
        - ""
        - " &#FFD94D&lEFFETS :"
        - " %level_up_messages%"
        - ""
  messages:
    prefix: "&#FFD94D&lFamiliers &8» &r"
    invalid-pet: "&#FF5C5CFamilier inconnu ou pas adopté."
    pet-already-active: "&#FF5C5CCe familier est déjà actif."
    cannot-activate-pet: "&#FF5C5CTu ne peux pas activer %pet%&#FF5C5C ici."
    activated-pet: "&#B376E5Familier activé : %pet%"
    deactivated-pet: "&#B376E5Familier rangé : %pet%"
    no-menu: "&#B376E5Aucun menu des familiers n'est configuré (pet-settings.menu-command)."
    no-pet-active: "&#FF5C5CTu n'as aucun familier actif."
    pet-auto-deactivated: "&#FF5C5CTon familier %pet%&#FF5C5C a été rangé : ses conditions ne sont plus remplies."
    max-pets-reached: "&#FF5C5CTu as déjà %max% familier(s) actif(s) : range-en un d'abord (clic dessus)."
    pet-too-big: "&#FF5C5CCe familier prend %slots% emplacements, tu n'en as que %max%."
    mount-level: "&#FF5C5CTon %pet%&#FF5C5C se laisse monter à partir du niveau &f%level%&#FF5C5C."
    mount-other: "&#FF5C5CCe familier n'est pas à toi."
    mounted: "&#B376E5Tu montes %pet%&#B376E5. Accroupis-toi pour descendre."
    dig-blocked: "&#FF5C5CTa taupe ne creuse pas ici."
    cancelled-swap: "&#FF5C5CChangement de familier annulé."
    player-only: "&#FF5C5CCommande réservée aux joueurs."
    # /influpet pet ... (administration)
    admin:
      unavailable: "&#FF5C5CSystème de familiers inactif (cf. logs du démarrage)."
      usage: "&#FFD94D/influpet pet <give|take|givexp|givecurrentxp|reset|setlevel|activate|deactivate> <joueur> [familier] [valeur]"
      unknown-player: "&#FF5C5CJoueur inconnu : %player%"
      unknown-pet: "&#FF5C5CFamilier inconnu : %id%"
      offline: "&#FF5C5C%player% n'est pas connecté."
      invalid-number: "&#FF5C5CNombre invalide."
      not-owned: "&#FF5C5C%player% n'a pas %pet%&#FF5C5C."
      no-active-pet: "&#FF5C5C%player% n'a pas de familier actif (ou n'est pas connecté)."
      adopted: "&#B376E5%player% adopte %pet%&#B376E5."
      already-adopted: "&#FF5C5C%player% a déjà %pet%&#FF5C5C (ou adoption annulée)."
      taken: "&#B376E5%pet%&#B376E5 retiré à %player%."
      level-set: "&#B376E5%pet%&#B376E5 de %player% au niveau %level%."
      xp-given: "&#B376E5%xp% XP donnée à %pet%&#B376E5 de %player%."
      activated: "&#B376E5%pet%&#B376E5 activé pour %player%."
      activation-failed: "&#FF5C5CActivation de %pet%&#FF5C5C impossible : %reason% (max %max%)."
      deactivated: "&#B376E5Familier(s) de %player% rangé(s)."
      nothing-to-deactivate: "&#FF5C5C%player% n'a rien à ranger."

# Menus d'édition (/influpet menu)
# Menus of the pets (lists built by FluxPets, PetMenuLists)
menu:
  level-suffix: "&#FFD94DNiv. %level%"
  progress: "Progression"
  see-progress: "Voir la progression"
  put-away: "Ranger"
  activate: "Activer"
  active: "Familier actif"
  slot-locked: "&#FF5C5CEmplacement verrouillé"
  slot-locked-description: "Tu n'as pas encore accès à cet emplacement."
  rank-needed: "Grade requis"
  slots-taken: "Prend %slots% emplacements"
  mount-from: "Monture dès le niveau %level%"
  slot-free: "Emplacement libre"
  slot-free-description: "Clique sur un familier ci-dessous pour l'activer."
  unlocked: "Débloqué"
  locked: "Verrouillé"
  cards: "Cartes"
  level-name: "Niveau %level%"
