        - "&#B376E5Chance de cette rareté : &f%chance%"
        - "&#B376E5Familiers de cette rareté : &f%count%"
        - ""
    pet-chance:
      name: "&#FFD94DChance de familier &f%chance%"
      lore:
        - "&#B376E5Probabilité qu'un tirage soit un familier plutôt qu'une carte."
        - "&#B376E5Par booster : &f%chance% &#B376E5d'en avoir au moins un."
