# FluxPets: texts shown to players (English). Selected with "language" in config.yml: lang/<language>.yml.
# A key missing here falls back to the plugin's default (English) text.
#
# & and &#RRGGBB codes. %img_<id>% shows a glyph of the FluxPets ItemsAdder pack, %img_<namespace>:<id>% one of any pack,
# always preceded by &r&f to keep its colors.
# Card palette: coral #FF7A59 (accent), parchment #EADBC8 (text), cream #FFF4E0 (names), slate #6B7A8F
# (secondary), teal #5FB3B3 (info), brick #D9534F (errors).

messages:
  prefix: "&#FFD94Dᴄᴀʀᴅꜱ &7▸ "
  opened: "&#B376E5Opening a %booster%&#B376E5..."
  finished: "&#B376E5Booster done: &f%count% &#B376E5cards obtained."
  opened-all: "&f%boosters% &#B376E5boosters opened: &f%count% &#B376E5cards obtained."
  skipped: "&7Reveal skipped, cards added to your inventory."
  inventory-full: "&#FF5C5CInventory full: the rest waits for you in &f/recompenses&#FF5C5C."
  inventory-needed: "&#FF5C5CNot enough room: free &f%slots% &#FF5C5Cslot(s) to open this booster."
  empty-booster: "&#FF5C5CThis booster contains no card (check the configuration)."
  unknown-booster: "&#FF5C5CUnknown booster: &f%id%"
  unknown-card: "&#FF5C5CUnknown card: &f%id%"
  player-not-found: "&#FF5C5CPlayer not found: &f%player%"
  invalid-amount: "&#FF5C5CInvalid number: &f%amount% &7(1 to 64)"
  given: "&f%amount%x &r%item% &#B376E5given to &f%player%&#B376E5."
  stashed: "&f%amount%x &r%item% &#B376E5set aside for &f%player%&#B376E5."
  opened-for: "&f%amount% &#B376E5booster(s) &r%booster% &#B376E5opened for &f%player%&#B376E5."
  reloaded: "&#B376E5Configuration reloaded: &f%cards% &#B376E5cards, &f%boosters% &#B376E5boosters."
  unknown-pet: "&#FF5C5CUnknown pet: &f%id%"
  player-only: "&#FF5C5CPlayers only."
  no-permission: "&#FF5C5CYou do not have permission."
  already-exists: "&#FF5C5C\"%id%\" already exists."
  created: "&#B376E5\"&f%id%&#B376E5\" created."
  deleted: "&#B376E5\"&f%id%&#B376E5\" deleted."
  prompt-hint: "&7Type your answer in chat, or \"cancel\"."
  # word that cancels a chat prompt ("cancel" always works too)
  prompt-cancel-word: "cancel"
  prompt-cancelled: "&7Input cancelled."
  prompt-timeout: "&7Input timed out."
  pet-broadcast: "&f%player% &#B376E5just adopted &r%pet%&#B376E5!"
  pet-unlocked: "&#2ECF7BNew pet adopted: &r%pet%&#2ECF7B!"
  career-catch-up-received: "&#B376E5Career catch-up: &f%count% &#B376E5booster(s) for the levels you already passed:"
  career-catch-up-line: "&7  • &r%booster% &fx%amount% &7(%job% lvl %level%)"
  series-complete: "&#FFD94D%series% series complete! &#B376E5You receive its &f%count% &#B376E5plushies."
  card-used: "&f%amount% &#B376E5card(s) used: &f+%xp% XP &#B376E5for &r%pet%"
  card-pet-locked: "&#FF5C5CYou have not adopted &r%pet%&#FF5C5C yet: open its booster to unlock it."
  card-no-use: "&7This card does not feed any pet."
  usage:
    - "&#FFD94D/influpet menu &7- edit boosters, cards and pets"
    - "&#FFD94D/influpet give <player> booster <id> [amount] &7- give boosters"
    - "&#FFD94D/influpet stash <player> <booster> [amount] &7- sets boosters aside for /boosters"
    - "&#FFD94D/influpet give <player> card <id> [amount] &7- give a specific card"
    - "&#FFD94D/influpet open <player> <booster> [amount] &7- open boosters without the item"
    - "&#FFD94D/influpet list <cards|pets|boosters> &7- list the content"
    - "&#FFD94D/influpet info <card|pet|booster> <id> &7- details and draw chances"
    - "&#FFD94D/influpet pet <give|take|givexp|reset|setlevel|...> <player> &7- a player's pets"
    - "&#FFD94D/influpet reload &7- reload the configuration"
  list:
    cards: "&#FFD94DCards &7(%count%)"
    card: "&7N°%number% &r%name% &7(%id%)"
    pets: "&#FFD94DPets &7(%count%)"
    pet-enabled: "&r%name% &7(%id%, obtainable)"
    pet-disabled: "&r%name% &7(%id%, disabled)"
    boosters: "&#FFD94DBoosters &7(%count%)"
    booster: "&r%name% &7(%id%, %draws% draws)"
  info:
    card: "%name% &7(%id%, N°%number%, series %series%)"
    pet: "%name% &7(%id%)"
    chance: "&7- &r%booster% &#B376E5: %chance% per draw"
    booster: "%name% &7(%id%, %draws% draws) - chance per draw:"
    pets-share: "&#FFD94DPets &#B376E5%chance% of draws"
    cards-share: "&#FFD94DCards &#B376E5%chance% of draws"

# Booster reveal
reveal:
  actionbar: '%card%'
  # amount in the middle of the screen (big subtitle)
  subtitle: '%rarity_color%&lx%count%'
  # common card back, shown big before each card
  back-title: "&r&f%img_carte_verso_grand%"
  actionbar-pet: "%card% &#2ECF7BNew pet!"
  actionbar-pet-duplicate: '%card% &7Already adopted &#B376E5: its card and its plush'
  actionbar-pet-duplicate-incomplete: '%card% &7Already adopted &#B376E5: its card instead'

# Pet adoption: title = pet name, subtitle in small caps
pet-reveal:
  title: "%pet%"
  subtitle: "&#FFD94DNᴇᴡ Pᴇᴛ"

# Cards: %tag% (rarity), %name%, %number% (collection N°), %series%
card-format:
  name: "%tag% &f%name%"
  lore-header:
    - "&7N°%number% &7• %series%"
    - ""
  lore-footer: []
  # added to cards that feed a pet
  lore-pet:
    - ""
    - "&#2ECF7B+%xp% XP &#B376E5for &r%pet%"
    - "&7[Right-click] &#FFD94DFeed &7(Shift: whole stack)"

pets:
  # pet name in the editor menus and announcements
  name-format: "%tag% &#2ECF7B%name%"

pet-settings:
  # name shown above the model following the player
  pet-entity:
    name: "%pet%&f (Lvl. %level%)"
  level-up:
    message:
      message:
        - ""
        - " &#B376E5Your pet %pet%&#B376E5 reached &#FFD94Dlevel %level%&#B376E5!"
        - ""
        - " &#FFD94D&lEFFECTS:"
        - " %level_up_messages%"
        - ""
  messages:
    prefix: "&#FFD94D&lPets &8» &r"
    invalid-pet: "&#FF5C5CUnknown or not adopted pet."
    pet-already-active: "&#FF5C5CThis pet is already active."
    cannot-activate-pet: "&#FF5C5CYou cannot activate %pet%&#FF5C5C here."
    activated-pet: "&#B376E5Pet activated: %pet%"
    deactivated-pet: "&#B376E5Pet put away: %pet%"
    no-menu: "&#B376E5No pets menu is configured (pet-settings.menu-command)."
    no-pet-active: "&#FF5C5CYou have no active pet."
    pet-auto-deactivated: "&#FF5C5CYour pet %pet%&#FF5C5C was put away: its conditions are no longer met."
    max-pets-reached: "&#FF5C5CYou already have %max% active pet(s): put one away first (click it)."
    cancelled-swap: "&#FF5C5CPet change cancelled."
    player-only: "&#FF5C5CPlayers only."
    # /influpet pet ... (administration)
    admin:
      unavailable: "&#FF5C5CPet system unavailable (see startup logs)."
      usage: "&#FFD94D/influpet pet <give|take|givexp|givecurrentxp|reset|setlevel|activate|deactivate> <player> [pet] [value]"
      unknown-player: "&#FF5C5CUnknown player: %player%"
      unknown-pet: "&#FF5C5CUnknown pet: %id%"
      offline: "&#FF5C5C%player% is not online."
      invalid-number: "&#FF5C5CInvalid number."
      not-owned: "&#FF5C5C%player% does not have %pet%&#FF5C5C."
      no-active-pet: "&#FF5C5C%player% has no active pet (or is not online)."
      adopted: "&#B376E5%player% adopts %pet%&#B376E5."
      already-adopted: "&#FF5C5C%player% already has %pet%&#FF5C5C (or the adoption was cancelled)."
      taken: "&#B376E5%pet%&#B376E5 taken from %player%."
      level-set: "&#B376E5%pet%&#B376E5 of %player% set to level %level%."
      xp-given: "&#B376E5%xp% XP given to %pet%&#B376E5 of %player%."
      activated: "&#B376E5%pet%&#B376E5 activated for %player%."
      activation-failed: "&#FF5C5CCould not activate %pet%&#FF5C5C: %reason% (max %max%)."
      deactivated: "&#B376E5%player%'s pet(s) put away."
      nothing-to-deactivate: "&#FF5C5C%player% has nothing to put away."

# Editor menus (/influpet menu)
editor:
  back: "&7[Left-click] &#FFD94DBack"
  previous-page: "&7[Left-click] &#FFD94DPrevious page"
  next-page: "&7[Left-click] &#FFD94DNext page"
  page: "&7Page %page%/%pages%"
  click:
    left: "&7[Left-click] &#FFD94D%action%"
    right: "&7[Right-click] &#FFD94D%action%"
    shift: "&7Shift + click &#FFD94D%action%"
  action:
    edit: "Edit"
    create: "Create"
    add: "Add"
    remove: "Remove"
    delete: "Delete (Shift + right click)"
    receive-one: "Receive one"
    receive-stack: "Receive a stack (Shift + right click)"
    next-rarity: "Next rarity"
    previous-rarity: "Previous rarity"
  pets-unavailable:
    - "&#FF5C5CPets unavailable (see logs)."
    - ""
  # lore of a booster created from the menu
  new-booster-lore:
    - "&#B376E5Contains &f%cards% &#B376E5cards."
    - ""
    - "&7[Right-click] &#FFD94DOpen"
  texture:
    name: "&#FFD94DTexture"
    lore:
      - "&7Current: &#B376E5%value%"
      - ""
      - "&#B376E5ItemsAdder item id"
      - "&#B376E5(e.g. %example%)."
      - ""
    prompt: "&#B376E5ItemsAdder item &7(namespace:id):"
  description:
    name: "&#FFD94DDescription"
    prompt: "&#B376E5Description, lines separated by &f| &#B376E5:"
    current:
      - "&7Current:"
    empty:
      - "&7(empty)"
  main:
    title: "&#FFD94DCards &7▸ &#B376E5Boosters"
    booster:
      lore:
        - "&7%id% • %cards% draws"
        - "&7Contents: &#B376E5%contents%"
        - ""
      contents-all: "all"
      contents-count: "%count% rewards"
    info:
      name: "&#FFD94DCard editor"
      lore:
        - "&#B376E5Set up boosters, cards and obtainable pets."
        - ""
        - "&7Everything is saved in plugins/FluxPets/content/."
    new-booster:
      name: "&#FFD94DNew booster"
      lore:
        - "&#B376E5Creates an empty booster."
        - ""
      prompt: "&#B376E5New booster id &7(letters, digits, _):"
    cards:
      name: "&#FFD94DCards"
      lore:
        - "&#B376E5%count% cards."
        - ""
      action: "Manage cards"
    pets:
      name: "&#FFD94DPets"
      lore:
        - "&#B376E5%count% obtainable from boosters."
        - ""
      action: "Manage pets"
    reload:
      name: "&#FFD94DReload"
      lore:
        - "&#B376E5Reloads the configuration"
        - "&#B376E5(after a manual edit)."
        - ""
      action: "Reload"
  booster:
    title: "&#FFD94DBooster &7▸ &#B376E5%id%"
    preview:
      receive: "Receive this booster"
      test: "Test the opening"
    name:
      name: "&#FFD94DName"
      lore:
        - "&7Current: &r%value%"
        - ""
        - "&#B376E5Colors: & and hex codes."
        - ""
      prompt: "&#B376E5New booster name:"
    description-hint:
      - "&7One line per \"|\", %cards% = number of draws."
    draws:
      name: "&#FFD94DDraws per booster &f%count%"
      lore:
        - "&#B376E5Number of rewards given on each opening."
        - ""
    contents:
      name: "&#FFD94DContents"
      lore-all:
        - "&#B376E5All (every card and every obtainable pet)"
        - ""
      lore-chosen:
        - "&#B376E5%count% rewards chosen by hand."
        - ""
      action: "Choose cards and pets"
    chances:
      name: "&#FFD94DDraw chances"
      lore:
        - "&#B376E5Shows in chat the chance of each card and pet."
        - ""
      action: "Show"
    card-weights:
      name: "&#FFD94DCards: rarity weights"
      lore:
        - "&#B376E5On each card draw, a rarity is picked using these weights, then a random card of that rarity."
        - ""
        - "&7A rarity without any card in the contents is never drawn."
    pet-weights:
      name: "&#FFD94DPets: rarity weights"
      lore:
        - "&#B376E5Same principle for pet draws."
        - ""
        - "&7A pet drops at most once per booster."
    weight:
      name: "%rarity% &f%weight%"
      lore-cards:
        - "&#B376E5Chance of this rarity: &f%chance%"
        - "&#B376E5Cards of this rarity: &f%count%"
        - ""
      lore-pets:
        - "&#B376E5Chance of this rarity: &f%chance%"
        - "&#B376E5Pets of this rarity: &f%count%"
        - ""
    pet-chance:
      name: "&#FFD94DPet chance &f%chance%"
      lore:
        - "&#B376E5Probability that a draw is a pet rather than a card."
        - "&#B376E5Per booster: &f%chance% &#B376E5to get at least one."
        - ""
      more: "+0.1 %"
      less: "-0.1 %"
      shift: "±1 %"
    delete:
      name: "&#FF5C5CDelete this booster"
      lore:
        - "&#B376E5Boosters already given will no longer open."
        - ""
  content:
    title: "&#FFD94DContents &7▸ &#B376E5%id%"
    card:
      - "&#B376E5Card"
    pet:
      - "&#2ECF7BPet"
    pet-disabled:
      - "&#2ECF7BPet"
      - "&#FF5C5CDisabled (Pets menu):"
      - "&#FF5C5Cnever drawn, even if included."
    included:
      - "&#2ECF7B✔ In this booster"
      - "&#B376E5Chance per draw: &f%chance%"
      - ""
    excluded:
      - "&7✘ Not in this booster"
      - "&#B376E5Chance per draw: &f%chance%"
      - ""
    info:
      name: "&#FFD94DContents of %booster%"
      lore-all:
        - "&#B376E5Mode: &fall contents"
        - ""
        - "&7In \"all\" mode, new cards and obtainable pets join on their own."
        - "&7Clicking a reward switches to a chosen list."
      lore-chosen:
        - "&#B376E5Mode: &fchosen list (%count%)"
        - ""
        - "&7In \"all\" mode, new cards and obtainable pets join on their own."
        - "&7Clicking a reward switches to a chosen list."
    reset:
      name: "&#FFD94DInclude everything"
      lore:
        - "&#B376E5Back to \"all contents\" mode."
        - ""
      action: "Reset"
  pets:
    title: "&#FFD94DCards &7▸ &#B376E5Pets"
    unavailable:
      name: "&#FF5C5CPets unavailable (see logs)"
      lore:
        - "&#B376E5Pets cannot drop from boosters."
    pet:
      lore-enabled:
        - "&7%id%"
        - "&#B376E5Rarity: &r%rarity%"
        - "&#2ECF7B✔ Obtainable from boosters"
        - ""
      lore-disabled:
        - "&7%id%"
        - "&#B376E5Rarity: &r%rarity%"
        - "&7✘ Not obtainable"
        - ""
      enable: "Make obtainable"
      disable: "Make not obtainable"
      previous-rarity: "Previous rarity (Shift + right click)"
    info:
      name: "&#FFD94DPets"
      lore:
        - "&#B376E5An obtainable pet can drop from boosters (depending on their contents):"
        - "&#B376E5it is adopted when revealed."
        - ""
        - "&7A pet drops at most once per booster."
    duplicate:
      name: "&#FFD94DAlready adopted pet"
      lore-xp:
        - "&#B376E5Mode: &fcan drop again (its card)"
        - "&#B376E5Extra XP: &f%xp% XP"
        - ""
      lore-reroll:
        - "&#B376E5Mode: &fnew draw"
        - "&#B376E5An adopted pet is never drawn again for that player."
        - ""
      switch: "Change mode"
      more: "+100 XP"
      less: "-100 XP (Shift + right click)"
  cards:
    title: "&#FFD94DCards &7▸ &#B376E5Collection"
    info:
      name: "&#FFD94DCards &7(%count%)"
      lore:
        - "&#B376E5The collection number follows the creation order."
    new:
      name: "&#FFD94DNew card"
      lore:
        - "&#B376E5Creates a card (test texture, most common rarity)."
        - ""
      prompt: "&#B376E5New card id &7(letters, digits, _):"
  card:
    title: "&#FFD94DCard &7▸ &#B376E5%id%"
    receive: "Receive this card"
    # word that clears the series or the linked pet in the chat prompts
    none: "none"
    name:
      name: "&#FFD94DName"
      lore:
        - "&7Current: &f%value%"
        - ""
        - "&#B376E5Without a color, the name takes the card format color."
        - ""
      prompt: "&#B376E5New card name:"
    rarity:
      name: "&#FFD94DRarity &r%rarity%"
    series:
      name: "&#FFD94DSeries"
      lore:
        - "&7Current: &f%value%"
        - ""
      empty: "(none)"
      prompt: "&#B376E5Card series &7(\"%none%\" to clear):"
    pet:
      name: "&#FFD94DLinked pet"
      lore:
        - "&7Current: &f%value%"
        - ""
        - "&#B376E5Right-click with the card in hand:"
        - "&#B376E5gives &f%xp% XP &#B376E5to this pet (Shift: whole stack)."
        - ""
        - "&7XP per card is set by rarity"
        - "&7(card-xp in content/cards.yml)."
        - ""
      empty: "(none)"
      prompt: "&#B376E5Pet id &7(\"%none%\" to unlink):"
    description-hint:
      - "&7One line per \"|\"."
    delete:
      name: "&#FF5C5CDelete this card"
      lore:
        - "&#B376E5It is also removed from boosters."
        - "&#B376E5Cards already given stay in game but are no longer recognized."
        - ""
