# libreforge chains used by pets (run_chain), registered by FluxPets before loading the pets: same format
# as plugins/libreforge/chains.yml. Reloaded with /influpet reload.
# mimique_coffre: the Mimic places an adventure chest with a random vanilla loot table.

chains:
- id: mimique_coffre
  effects:
  - id: run_command
    args:
      command: execute as %player% at %player% run setblock %location_block_x% %location_block_y% %location_block_z% minecraft:chest{LootTable:"minecraft:chests/abandoned_mineshaft"}
