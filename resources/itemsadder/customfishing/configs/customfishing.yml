  common_rod:
    nbt: '{CustomFishing:{id: common_rod}}'
    durability:
      max_custom_durability: 64
      custom_durability: 64
    display_name: '<b><#AAAAAA>Canne Commune'
    lore:
      - ''
      - '<#7FFFD4>Description :'
      - '<gray> - Une canne simple et fiable, le premier vrai pas'
      - '<gray> - au-delà du matériel de fortune.'
      - ''
      - '<#FFD700>Effets :'
      - '<gray> - Augmente le temps d''attente'
      - '<gray> - Réduit la difficulté de pêche'
      - '<gray> - Favorise les poissons ✦ Commun'
    resource:
      material: FISHING_ROD
      generate: false
      model_path: item/influrod/common_rod
      model_id: 51001
  unique_rod:
    nbt: '{CustomFishing:{id: unique_rod}}'
    durability:
      max_custom_durability: 96
      custom_durability: 96
    display_name: '<b><#37C44A>Canne Unique'
    lore:
      - ''
      - '<#7FFFD4>Description :'
      - '<gray> - Sa finition soignée attire des poissons plus'
      - '<gray> - intéressants que la moyenne.'
      - ''
      - '<#FFD700>Effets :'
      - '<gray> - Réduit le temps d''attente'
      - '<gray> - Favorise les poissons ✦ Commun et ✦ Unique'
    resource:
      material: FISHING_ROD
      generate: false
      model_path: item/influrod/unique_rod
      model_id: 51002
  epic_rod:
    nbt: '{CustomFishing:{id: epic_rod}}'
    durability:
      max_custom_durability: 112
      custom_durability: 112
    display_name: '<b><#3283A8>Canne Épique'
    lore:
      - ''
      - '<#7FFFD4>Description :'
      - '<gray> - Une canne recherchée, taillée pour ramener'
      - '<gray> - des prises qui sortent de l''ordinaire.'
      - ''
      - '<#FFD700>Effets :'
      - '<gray> - Temps d''attente normal'
      - '<gray> - Augmente légèrement la difficulté'
      - '<gray> - Favorise les poissons ✦ Commun, ✦ Unique et ✦ Épique'
    resource:
