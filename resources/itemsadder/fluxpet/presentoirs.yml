# Présentoirs de boosters (meubles), générés par scripts/influcard/presentoirs.py : modifier le
# script, pas ce fichier. /iagive <joueur> fluxpet:presentoir_<booster>

info:
  namespace: fluxpet
items:
  presentoir_metier_mineur:
    display_name: <#4FD6E8>Présentoir Mineur
    lore:
    - <#EADBC8>Une boîte de boosters à exposer
    - <#EADBC8>dans ton magasin.
    resource:
      material: PAPER
      generate: false
      model_path: item/presentoir_metier_mineur
    behaviours:
      furniture:
        entity: item_display
        opposite_direction: true
        display_transformation:
          transform: FIXED
          translation:
            x: 0
            y: 0.5
            z: 0
          scale:
            x: 1.0
            y: 1.0
            z: 1.0
        solid: true
        gravity: false
        fixed_rotation: false
        placeable_on:
          floor: true
          walls: false
          ceiling: false
        hitbox:
          width: 1
          length: 1
          height: 1
        sound:
          place:
            name: block.wood.place
          break:
            name: block.wood.break
