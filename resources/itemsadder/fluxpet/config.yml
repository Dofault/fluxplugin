# Cartes et boosters InfluCard (textures seules), généré par scripts/influcard/gen_familiers.py.
# Nom, lore et comportement : plugins/InfluCard/config.yml.

info:
  namespace: fluxpet
items:
  carte_pepite:
    display_name: ' '
    resource:
      material: PAPER
      generate: false
      model_path: item/carte_pepite
  peluche_pepite:
    display_name: <#AAAAAA>Peluche Pépite
    lore:
    - <#EADBC8>Une peluche à l'effigie de <#AAAAAA>Pépite<#EADBC8>.
    - ''
    - <#6B7A8F>Obtenue en complétant sa série
    - <#6B7A8F>de familiers. Se pose comme un meuble.
    resource:
      material: PAPER
      generate: false
      model_path: item/peluche_pepite
    behaviours:
      furniture:
        entity: item_display
        opposite_direction: true
        display_transformation:
          transform: FIXED
          translation:
            x: 0
            y: 0.5
            z: 0
          scale:
            x: 1.0
            y: 1.0
            z: 1.0
        solid: false
        gravity: false
        fixed_rotation: false
        placeable_on:
          floor: true
          walls: false
          ceiling: false
        hitbox:
          width: 1
          length: 1
          height: 1
        sound:
          place:
            name: block.wool.place
          break:
            name: block.wool.break
