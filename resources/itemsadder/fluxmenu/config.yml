info:
  namespace: fluxmenu

# Fonds de coffre redessinés par FluxMenu (Labs).
# La texture vanilla des coffres (influstatique > generic_54.png) est rendue
# transparente : FluxMenu remet l'un de ces fonds dans le titre de chaque fenêtre
# de coffre qui n'est pas un menu FluxMenu, les menus FluxMenu restent transparents.
# Images générées depuis plugins/FluxMenu/assets/generic_54_influstatique.png par assets/chests.py
# (haut = rangées x 18 + 17 px, puis les 96 px de l'inventaire, comme le client).
# 256 px maximum de côté, y_position 13 = haut de l'image sur le haut de la fenêtre.

font_images:
