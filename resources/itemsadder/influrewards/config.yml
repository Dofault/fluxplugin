  # ── Outils — récompenses de caisses de vote ────────────────────────────────
  # Pas d'enchantement baké ici volontairement — appliqués à la main
  # (enchantement vanilla + livre AE Hâte Express) par-dessus cet item.
  # Couleur de nom alignée sur la couleur de caisse ExcellentCrates du palier
  # (blanc = Caisse Ordinaire, vert = Caisse Tendance). Ligne "Rareté :" =
  # glyphe brut influtags en unicode direct (%img_simple%/%img_unique% ne se
  # parsait pas dans le lore natif ItemsAdder — cf. storage/
  # font_images_unicode_cache.yml pour les autres rarétés). Couleur du glyphe
  # posée avec deux tags MiniMessage bien scopés (<gray>...</gray><white>glyphe
  # </white>), PAS <reset> : un <reset> se traduit en §r legacy, et dès que
  # AdvancedEnchantments touche le lore de l'objet (getLore()/setLore(),
  # déclenché par /ae enchant ou l'organisation automatique des enchants sur
  # l'item, organizeEnchants() dans AEAPI.class), ce §r survit au
  # round-trip mais le §f qui le suivait saute — le glyphe hérite alors de la
  # couleur par défaut du lore vanilla (violet foncé &5), pas de la couleur
  # voulue. Repéré en jeu : la ligne Rareté restait blanche tant qu'aucun
  # enchant AE n'était appliqué, et virait &5 uniquement après application.
  # Durabilité affichée = vraie valeur vanilla du matériau (1561 = outils
  # diamant, 64 = canne à pêche), pas une valeur custom réduite comme la
  # gamme ordinaire (150 / 50).
