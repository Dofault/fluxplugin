  # ── Bouteilles d'XP — usage unique, 12 paliers exponentiels (×1,427) ──────
  # Matériau POTION reskin (comme les boosts de métier ci-dessus), PAS
  # EXPERIENCE_BOTTLE : une vraie bouteille d'XP se jette au clic droit
  # (comportement vanilla non désactivable en config ItemsAdder), et le jet
  # empêchait execute_commands de se déclencher côté client sur cette install
  # — testé avec l'event 'item_throw', sans succès. La potion réutilise le
  # pattern 'drink' déjà éprouvé en prod (18 items ci-dessus) : événement
  # fiable, et le clic droit maintenu consomme l'item nativement.
  # Dégradé de couleur pâle → or (#FFD94D) appliqué à la fois sur la teinte
  # de la potion (specific_properties.potion.color) et sur le nom/lore.

  bouteille_xp_01:
    display_name: "<#F5EEDD>Bouteille d'XP I"
    lore:
      - "<#FAF7EE>Libère 400 points d'expérience"
      - "<#FAF7EE>au clic droit."
    resource:
      material: POTION
      generate: false
      model_path: minecraft:item/potion
    specific_properties:
      potion:
        type: WATER
        color: '#F5EEDD'
    item_flags:
      - HIDE_POTION_EFFECTS
    events:
      drink:
        execute_commands:
          give_xp:
            command: 'xp give {player} 400'
            as_console: true
        play_sound:
          name: entity.experience_orb.pickup

