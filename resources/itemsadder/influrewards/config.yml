  # ── Plumes de temps de vol — récompenses PowerFly ───────────────────────────
  # Solde PowerFly sans plafond (addFlyTime est purement additif, cf. échange avec
  # l'utilisateur) : ces plumes peuvent être distribuées sans limite via succès/votes/quêtes.
  # Tag de rareté = glyphe brut influtags en unicode direct ( simple/commun,
  #  unique), PAS la convention "✦ texte" utilisée sur les autres items de ce fichier -
  # demande explicite pour ces deux items précis, ne pas généraliser sans qu'on le redemande.
  # Mécanique : 1ère tentative avec le composant 1.21 "consumable"/event "consume" -
  # ne fonctionnait pas en jeu (item non consommable). Revenu sur l'event "drink", seul
  # mécanisme de consommation PROUVÉ sur ce serveur (utilisé par les ~30 potions/bouteilles
  # de récompense ci-dessus) : material: POTION garantit le comportement (clic droit,
  # consommation automatique, commande déclenchée) ; model_path pousse le rendu visuel vers
  # la plume vanilla - si cet override visuel ne prenait pas, l'item resterait fonctionnel
  # mais rendrait comme une fiole de potion (à vérifier en jeu après reload du pack).
  plume_vol_commune:
    display_name: "<white><b>Plume de Vol — 10 minutes</b></white>"
    lore:
      - ""
      - "<gray><italic>Une plume banale, mais son souffle"
      - "<gray><italic>suffit pour quelques instants dans les airs."
      - ""
      - "<gray>Rareté : </gray><white></white>"
      - "<#B376E5>+10 minutes de temps de vol"
      - ""
      - "<gray><italic>Utilisable uniquement à Valdor —"
      - "<gray><italic>fais /fly pour activer tes ailes."
    resource:
      material: POTION
      generate: false
      model_path: minecraft:item/feather
    specific_properties:
      potion:
        type: WATER
    item_flags:
      - HIDE_POTION_EFFECTS
    events:
      drink:
        execute_commands:
          add_flytime:
            command: 'powerfly addflytime {player} 600'
            as_console: true
        play_sound:
          name: entity.player.levelup

  plume_vol_unique:
    display_name: "<#B376E5><b>Plume de Vol — 30 minutes</b></#B376E5>"
    lore:
      - ""
      - "<gray><italic>Ses reflets ne trompent pas :"
      - "<gray><italic>elle porte plus loin, plus longtemps."
      - ""
      - "<gray>Rareté : </gray><white></white>"
      - "<#B376E5>+30 minutes de temps de vol"
      - ""
      - "<gray><italic>Utilisable uniquement à Valdor —"
      - "<gray><italic>fais /fly pour activer tes ailes."
    resource:
      material: POTION
      generate: false
      model_path: minecraft:item/feather
    specific_properties:
      potion:
        type: WATER
    item_flags:
      - HIDE_POTION_EFFECTS
    events:
      drink:
        execute_commands:
          add_flytime:
            command: 'powerfly addflytime {player} 1800'
            as_console: true
        play_sound:
          name: entity.player.levelup

  # ── Sceau VIP temporaire ─────────────────────────────────────────────────────
  # Accorde le groupe LuckPerms "vip" en temporaire via /lp addtemp (natif LuckPerms, pas de
  # code maison). "accumulate" : un joueur qui en consomme plusieurs cumule la durée au lieu de
  # la remplacer - cohérent avec le comportement additif des plumes de vol ci-dessus.
  # essentials.fly (hérité du groupe vip) ne fait plus rien depuis PowerFly (voir échange sur
  # la régression VIP/fly) - le VIP garde ses autres avantages (chat colors, HeadDB, bypass tpa).
  # Event "events.right_click" (1ère/2ᵉ tentative) n'existe pas - clé incorrecte,
  # confirmée par la doc officielle ItemsAdder (wiki.itemsadder.com/plugin-usage/adding-
  # content/item-properties/events) : la bonne structure est "events.interact.right".
  # Consommé à l'usage (1 par activation) via l'action "decrement_amount: {amount: 1}" -
  # il n'y a pas de retrait automatique sur ce type d'event (contrairement à "drink" sur
  # les potions, qui consomme nativement), donc ce serait resté en main indéfiniment sans
  # cette action, réutilisable à volonté pour du VIP gratuit à l'infini.
  sceau_vip_24h:
    display_name: "<white></white> <#FFD94D><b>Sceau VIP — 24 heures</b></#FFD94D>"
    lore:
      - ""
      - "<gray><italic>Un sceau scintillant, réservé"
      - "<gray><italic>à ceux qu'on remarque."
      - ""
      - "<#B376E5>Accorde le statut VIP"
      - "<#B376E5>pendant 24 heures"
    resource:
      material: NETHER_STAR
      generate: false
      model_path: minecraft:item/nether_star
    events:
      interact:
        right:
          execute_commands:
            grant_vip:
              command: 'lp user {player} parent addtemp vip 1d accumulate'
              as_console: true
          decrement_amount:
            amount: 1
          play_sound:
            name: entity.player.levelup

