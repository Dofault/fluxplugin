items:
  # ── Potions de boost de métier — usage unique, +25% XP (PROGRESS) pendant 1h ──────────────
  # Commande AdvancedJobs déclenchée au moment où le joueur boit (event 'drink'), en console :
  #   aja boosters add <player> PROGRESS <percent> <heures> <affects=job id>
  # La potion est consommée automatiquement par le client (comportement vanilla POTION).
  # Pas d'indicateur de cooldown : events_settings.cooldown testé en profondeur (BOSSBAR/HUD/TITLE,
  # events drink/interact/interact_mainhand, permission, enabled) sans succès sur cette install
  # ItemsAdder — abandonné. Pas de notification non plus.

  boost_mineur:
    display_name: "<#34C9C0>Ferveur du Mineur"
    lore:
      - "<#8FE1DC>Effet : +25% XP Mineur"
      - "<#8FE1DC>Durée : 1h"
    resource:
      material: POTION
      generate: false
      model_path: minecraft:item/potion
    specific_properties:
      potion:
        type: WATER
        color: '#34C9C0'
    item_flags:
      - HIDE_POTION_EFFECTS
    events:
      drink:
        execute_commands:
          apply_boost:
            command: 'aja boosters add {player} PROGRESS 25 1 mineur'
            as_console: true
        play_sound:
          name: entity.player.levelup

  boost_pecheur:
    display_name: "<#3A8FD9>Marée Vive"
