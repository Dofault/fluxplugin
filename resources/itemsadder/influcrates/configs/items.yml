# Caisses issues du "Crates and Stuff Model Pack".
# Modèles convertis depuis les .bbmodel bruts vers le format JSON Minecraft
# (contents/influcrates/models/*.json) + textures extraites (textures/item/*).
#
# Toutes en FURNITURE ItemsAdder (entity: item_display). Le custom block
# (behaviours.block) a été essayé sur common_crate mais se comportait mal
# à la pose/interaction — abandonné au profit de furniture partout.
#
# ExcellentCrates ne peut lier ses caisses qu'à un vrai bloc, jamais à une
# furniture (cf doc officielle IA) : il faut donc poser un vrai bloc (barrier
# ou sol existant) au même endroit que le meuble, et lier CE bloc à la caisse
# EC via /crates editor (bouton de liaison de bloc dans le menu de la caisse).
#
# Les 5 caisses partagent les mêmes réglages (solid, hitbox, translation,
# placement, sons...) — seuls display_name, model_path et scale diffèrent.
info:
  namespace: influcrates

items:
  common_crate:
    display_name: "&fCaisse Commune"
    resource:
      material: PAPER
      generate: false
      model_path: common_crate
    behaviours:
      furniture:
        entity: item_display
        opposite_direction: true
        display_transformation:
          transform: FIXED
          translation:
            x: 0
            y: 0.6
            z: 0
          scale:
            x: 1.5
            y: 1.2
            z: 1.2
        solid: true
        gravity: false
        fixed_rotation: false
        placeable_on:
          floor: true
          walls: false
          ceiling: false
        hitbox:
          width: 1
          length: 1
          height: 1
        sound:
          place:
            name: block.wood.place
          break:
            name: block.wood.break

