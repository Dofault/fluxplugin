  # Cage à BitBlocks (cage suspendue) : modèle fixe, BBModels/cage_bitblocks.bbmodel
  # converti en models/cage_bitblocks.json. Rotations libres multi-axes, format
  # accepté depuis Minecraft 1.21.11. La géométrie du JSON est réduite de moitié
  # (limite -16..32 d'un modèle) : scale 4 = x2 la taille du Blockbench, soit
  # ~5 blocs de large, ~9 de haut. translation.y = pendentif posé au sol.
  cage_bitblocks:
    display_name: "&#FFD94DCage à BitBlocks"
    resource:
      material: PAPER
      generate: false
      model_path: cage_bitblocks
    behaviours:
      furniture:
        entity: item_display
        opposite_direction: true
        display_transformation:
          transform: FIXED
          translation:
            x: 0
            y: 4.46
            z: 0
          scale:
            x: 4
            y: 4
            z: 4
        solid: true
        gravity: false
        fixed_rotation: false
        placeable_on:
          floor: true
          walls: false
          ceiling: false
        hitbox:
          width: 1
          length: 1
          height: 2
        sound:
          place:
            name: block.metal.place
          break:
            name: block.metal.break
