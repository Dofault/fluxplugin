info:
  namespace: influmenu

font_images:
  # ── Menu principal FluxMenu (/menu2, Labs) ───────────────────────────────
  # Fond plein écran : coffre 6 rangées + inventaire du joueur (masqué par
  # FluxMenu). Image 176x221 (jamais plus de 256 px de côté : au-delà Minecraft
  # n'arrive pas à la ranger dans ses planches de police et affiche un rectangle).
  # y_position 13 aligne le haut de l'image sur le haut de la fenêtre.
  menu2:
    suggest_in_command: false
    show_in_gui: false
    path: font/gui/menu2.png
    scale_ratio: 221
    y_position: 13

  # ── Animation d'extension de /menu2 (FluxMenu, page « parametres ») ───────
  # 5 étapes du panneau qui s'agrandit vers le bas (frame_1 = menu2 de base,
  # frame_5 = fond final de la page). Sources : plugins/FluxMenu/assets/menu2_anim/.
  menu2_anim_1:
    suggest_in_command: false
    show_in_gui: false
    path: font/gui/menu2_anim/frame_1.png
    scale_ratio: 221
    y_position: 13
  menu2_anim_2:
    suggest_in_command: false
    show_in_gui: false
    path: font/gui/menu2_anim/frame_2.png
    scale_ratio: 221
    y_position: 13
  menu2_anim_3:
    suggest_in_command: false
    show_in_gui: false
    path: font/gui/menu2_anim/frame_3.png
    scale_ratio: 221
    y_position: 13
  menu2_anim_4:
    suggest_in_command: false
    show_in_gui: false
    path: font/gui/menu2_anim/frame_4.png
    scale_ratio: 221
    y_position: 13
  menu2_anim_5:
    suggest_in_command: false
    show_in_gui: false
    path: font/gui/menu2_anim/frame_5.png
    scale_ratio: 221
    y_position: 13


