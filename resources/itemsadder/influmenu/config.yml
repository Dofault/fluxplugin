  # Fenêtre entière 176x221 (source : plugins/fluxplugin/Flux/assets/recompenses/gen_fond.py) : étoiles
  # gravées sur la bordure, grande étoile en filigrane, boîte des 21 récompenses façon actions du menu métier.
  menu_recompenses:
    suggest_in_command: false
    show_in_gui: false
