  # ── Fond du menu Collection (FluxMenu, menus/collection.yml) ─────────────
  # Fenêtre entière 176x221 (source : plugins/FluxMenu/assets/collection/, gen_fond.py) :
  # 3 étagères sous les rangées 3 à 5 du coffre (couronne et titre effacés), cadre jusqu'à la 1re rangée
  # de l'inventaire (barre de progression).
  menu_collection:
    suggest_in_command: false
    show_in_gui: false
    path: font/gui/menu_collection.png
    scale_ratio: 221
    y_position: 13

  # ── Fond des menus de catégorie de collections (FluxMenu, menus/collection_<id>.yml) ──
  # Fenêtre entière 176x221 (source : plugins/FluxMenu/assets/collection/gen_fond_categorie.py,
  # fond générique raccourci jusque sous la 2e rangée de l'inventaire) : cases de la catégorie (4), des 28 collections
  # (rangées 1 à 4, colonnes 1 à 7) et de la collection sélectionnée (1re rangée de l'inventaire).
  menu_collection_categorie:
    suggest_in_command: false
    show_in_gui: false
    path: font/gui/menu_collection_categorie.png
    scale_ratio: 221
    y_position: 13

  # ── Fonds des menus des familiers (FluxMenu, menus/familiers.yml et familier.yml) ──
