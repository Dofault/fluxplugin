  # ── Fond du menu des grades (FluxOffering, menus/grades.yml, /grade) ─────
  # Fenêtre entière 176x221 (source : plugins/fluxplugin/Flux/assets/rangs/gen_fond.py) : musée, bannières des
  # 4 paliers sous des spots, menu décalé d'une ligne (récompenses de palier sur la 1re ligne de l'inventaire).
