# FluxMascot: the welcome robot. It appears in front of one player (nobody else sees it), waves, speaks and walks away.
# WHO gets it and WHEN is not decided here: something else (a Typewriter page, a command block, the console) runs
#   /fluxmascot greet <player>
# Durations are in ticks (20 = 1 second), distances in blocks.

language: ""

# BetterModel model (plugins/BetterModel/models/<model>.bbmodel) and its size (1.0 = as drawn, 2.8 blocks tall).
model: robot_accueil
scale: 0.7

# Where the robot appears: this far in front of the player (where he looks, on the ground). When something is in the
# way, it comes closer, down to min-distance.
distance: 5.0
min-distance: 2.0

# The speech: a sound of the resource pack, played at the robot's head so the voice comes from it.
voice:
  sound: "influmascotte:accueil"
  # Ticks after the robot appeared before it speaks (it waves first).
  delay: 30
  # Length of the speech: the robot talks that long, then says goodbye.
  duration: 365
  # 1.0 is heard up to 16 blocks away; above 1 it carries further (16 x volume).
  volume: 1.5
  # Height of the robot's head above its feet: where the voice comes from.
  height: 1.35

# Walking speed in blocks per second: the walk animation is drawn for 1.2 at full size, so 1.2 x scale.
speed: 0.84

# The speech is cut when the player is further than this from the robot.
max-distance: 40.0

# After the speech the robot stays and strolls on the streets, like the town's inhabitants.
roam:
  enabled: true
  # Streets (nodes and links) in the plugin folder, written by scripts/typewriter/gen_pnj_ville.py.
  network: network.json
  # When the player is further than this, the robot is moved to a street between relocate-min and relocate-max
  # blocks from him.
  max-distance: 60.0
  relocate-min: 12.0
  relocate-max: 35.0
  # At each crossing: chance to stop for a while (pause-min to pause-max ticks).
  pause-chance: 0.3
  pause-min: 40
  pause-max: 120

# Without streets where it stands (roam off, another world), the robot walks this far and vanishes after the speech.
leave:
  distance: 4.0

# The invisible box the player right clicks to hear the speech again.
click:
  width: 1.2
  height: 2.0

animations:
  idle: idle
  appear: appear
  greet: greet
  talk: talk
  walk: walk
  vanish: vanish
  # Length of the one-shot animations.
  appear-ticks: 10
  greet-ticks: 40
  vanish-ticks: 8
