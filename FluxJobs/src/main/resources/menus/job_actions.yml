# FluxTools : ce qui rapporte de l'XP et de l'argent dans un métier (/metier blocs <métier>), relu à chaque ouverture.
title: "&8%jobactions_name%"
rows: 6
player-inventory: hidden
vanilla-background: true

lists:
  job_actions_header:
    slots: 4
    item:
      material: entry
  job_actions:
    slots: 10-16,19-25,28-34,37-43
    item:
      material: entry

items:
  previous:
    slot: 46
    material: itemsadder:influitems:btn_prev
    hide-tooltip: true
    view-requirements: ["placeholder: %flux_list_job_actions_has_prev% == true"]
    actions:
      left: ["[list] job_actions prev"]
  back:
    slot: 49
    material: itemsadder:influitems:btn_back
    name: "Retour"
    lore:
      - "@left Carrières"
    actions:
      left: ["[player] metiers", "[sound] @page"]
  next:
    slot: 52
    material: itemsadder:influitems:btn_next
    hide-tooltip: true
    view-requirements: ["placeholder: %flux_list_job_actions_has_next% == true"]
    actions:
      left: ["[list] job_actions next"]
