# InfluOffrande — messages.yml
#
# Toutes les chaines supportent : legacy (&7, &#RRGGBB), MiniMessage (<gradient>, <hover>...),
# et les placeholders PlaceholderAPI (%joueur_x%, %img_x%...) — tout est resolu avant affichage.
# Les {accolades} sont des placeholders internes au plugin (remplaces AVANT le parsing couleur),
# propres a chaque message : voir le commentaire au-dessus de chaque section.
#
# Prefixe utilise devant les messages de tchat (calque sur la charte graphique du serveur,
# canal Progression) : "&8[&r#2ECF7BOffrande&8] &7"

general:
  players-only: "&8[&r#2ECF7BOffrande&8] &7Cette commande n'est accessible qu'aux joueurs."
  no-permission: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Tu n'as pas la permission d'utiliser cette commande."
  # {collection}
  unknown-collection: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Offrande inconnue : &f{collection}"
  # {collection}
  no-access-collection: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Tu n'as pas acces a l'offrande &f{collection}&7."
  # /offrande sans argument n'a pas pu determiner le grade du joueur (LuckPerms/PlaceholderAPI absent)
  rank-unresolved: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Impossible de determiner ton grade actuel."

admin:
  usage-root: "&8[&r#2ECF7BOffrande&8] &7Usage : &#F0A800/influoffrande <create|remove|rename|permission|reset|set|money|check|reload> ..."
  reload-success: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Configuration rechargee."
  usage-reset: "&8[&r#2ECF7BOffrande&8] &7Usage : &#F0A800/influoffrande reset <joueur> <collection|all>"
  # {item} accepte aussi "money" pour forcer le depot d'argent d'un joueur
  usage-set: "&8[&r#2ECF7BOffrande&8] &7Usage : &#F0A800/influoffrande set <joueur> <collection> <item|money> <quantite>"
  usage-money: "&8[&r#2ECF7BOffrande&8] &7Usage : &#F0A800/influoffrande money <collection> <montant>"
  # {collection} {amount}
  money-set: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Offrande &f{collection} &7: argent demande mis a &f{amount} %img_bitblock%"
  usage-check: "&8[&r#2ECF7BOffrande&8] &7Usage : &#F0A800/influoffrande check <joueur> [collection]"
  usage-create: "&8[&r#2ECF7BOffrande&8] &7Usage : &#F0A800/influoffrande create <id> [nom affiche]"
  usage-permission: "&8[&r#2ECF7BOffrande&8] &7Usage : &#F0A800/influoffrande permission <collection> <permission|clear>"
  usage-rename: "&8[&r#2ECF7BOffrande&8] &7Usage : &#F0A800/influoffrande rename <collection> <nouveau nom>"
  # {collection} {name}
  rename-success: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Offrande &f{collection} &7renommee : &f{name}"
  usage-remove: "&8[&r#2ECF7BOffrande&8] &7Usage : &#F0A800/influoffrande remove <collection>"
  # {collection}
  remove-success: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Offrande &f{collection} &7supprimee (la progression deja sauvegardee des joueurs n'est pas effacee)."
  # {collection} {permission}
  permission-set: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Offrande &f{collection} &7desormais restreinte a la permission &f{permission}"
  # {collection}
  permission-cleared: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Offrande &f{collection} &7desormais ouverte a tous (permission retiree)."
  # {collection}
  invalid-collection-id: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Id invalide : &f{collection}&7. Lettres, chiffres, &f_&7 et &f-&7 uniquement (pas de point, pas d'espace)."
  # {collection}
  collection-already-exists: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Une offrande &f{collection} &7existe deja."
  # {collection}
  create-success: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Offrande &f{collection} &7creee, vide. Ouvre-la en jeu (&#F0A800/offrande {collection}&7) et utilise l'editeur pour y ajouter des items."
  unknown-player: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Joueur inconnu : &f{player}"
  unknown-item: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Item inconnu : &f{item}"
  invalid-number: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Quantite invalide."
  # {item} {collection}
  item-not-in-collection: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7&f{item} &7ne fait pas partie de l'offrande &f{collection}&7. Ajoute-le d'abord via l'editeur en jeu."
  # {player} {collection}
  reset-all-success: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Toutes les offrandes de &f{player} &7ont ete reinitialisees."
  reset-success: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Offrande &f{collection} &7reinitialisee pour &f{player}&7."
  # {player} {collection} {item} {amount} {required}
  set-success: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7&f{item} &7force a &f{amount}/{required} &7pour &f{player} &7(&f{collection}&7)."
  # {player} {collection}
  check-header: "&8[&r#2ECF7BOffrande&8] &#B376E5Progression de &f{player} &#B376E5sur &f{collection}&#B376E5 :"
  # {item} {deposited} {required}
  check-line: "&8 » &7{item} &8: &f{deposited}&7/&f{required}"
  # {player}
  check-header-all: "&8[&r#2ECF7BOffrande&8] &#B376E5Progression de &f{player} &#B376E5:"
  # {collection} {percent} {progress}
  check-collection-line: "&8 » &7{collection} &8: &f{percent}% &8(&f{progress}&8)"

# Prompts admin de l'editeur (chat).
editor:
  # {name}
  prompt-quantity: "&8[&r#2ECF7BOffrande&8] &7Ecris la quantite voulue pour &f{name} &7dans le tchat (ou &fannuler&7) :"
  cancelled: "&8[&r#2ECF7BOffrande&8] &7Modification annulee."
  invalid-number: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Nombre invalide, reessaie (ou &fannuler&7)."
  # {name} {amount}
  item-added: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7&f{name} &7ajoute, quantite requise : &f{amount}"
  # {name} {amount}
  item-quantity-set: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Quantite de &f{name} &7mise a jour : &f{amount}"
  # {name}
  item-removed: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7&f{name} &7retire de l'offrande."
  # {name}
  item-already-present: "&8[&r#2ECF7BOffrande&8] &7&f{name} &7fait deja partie de cette offrande — clic gauche dessus pour changer sa quantite."
  prompt-money: "&8[&r#2ECF7BOffrande&8] &7Ecris le montant de %img_bitblock% demande dans le tchat (ou &fannuler&7) :"
  # {amount}
  money-set: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Argent demande mis a jour : &f{amount} %img_bitblock%"
  money-removed: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Argent demande retire de cette offrande."

gui:
  # {name}
  deposit-item-already-complete: "&8[&r#2ECF7BOffrande&8] &7&f{name} &7est deja complet."
  # {name}
  deposit-item-missing: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Tu n'as pas de &f{name} &7sur toi."
  # {amount} {name} {deposited} {required} {percent}
  deposit-success: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7+{amount} &f{name} &8(&f{deposited}&7/&f{required}&8) &7— offrande a &f{percent}%"
  # Offrande de livres enchantes : {name} = nom de l'enchantement (ex : Tranchant)
  deposit-enchant-missing: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Tu n'as aucun livre &f{name} &7sur toi."
  # {amount} = niveaux ajoutes, {name} {deposited} {required} {percent}
  deposit-enchant-success: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7+{amount} niveaux de &f{name} &8(&f{deposited}&7/&f{required}&8)&7, offrande a &f{percent}%"
  # {collection}
  collection-completed: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7Offrande &f{collection} &7terminee !"

  # Clic gauche sur la case argent : on n'attend plus un montant tape dans le tchat (il
  # s'affichait publiquement), on envoie la commande de depot toute prete, cliquable.
  # Un clic dessus l'ecrit dans la barre de tchat, le joueur n'a plus qu'a taper le montant.
  # {collection} = id de l'offrande, {name} = son nom affiche, {remaining} = ce qu'il reste a deposer
  money-command-prompt:
    - "&8[&r#2ECF7BOffrande&8] &7Il te reste &f{remaining} %img_bitblock% &7a deposer."
    - "&8[&r#2ECF7BOffrande&8] &7Clique sur <click:suggest_command:'/offrande depot {collection} '><hover:show_text:'&#B376E5Clique pour preparer la commande,&#B376E5 puis tape ton montant.'>&#FFD94D[/offrande depot {collection} montant]</hover></click>&7."
  # {collection}
  money-usage: "&8[&r#2ECF7BOffrande&8] &7Usage : <click:suggest_command:'/offrande depot {collection} '>&#F0A800/offrande depot {collection} montant</click>"
  money-not-required: "&8[&r#2ECF7BOffrande&8] &7Cette offrande ne demande pas de %img_bitblock%."
  money-invalid: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Montant invalide, depot annule."
  money-already-complete: "&8[&r#2ECF7BOffrande&8] &7Le montant demande est deja entierement depose."
  money-deposit-missing: "&8[&r#2ECF7BOffrande&8] &#FF5C5C✖ &7Tu n'as pas assez de %img_bitblock% sur toi."
  # {amount} {deposited} {required} {percent}
  money-deposit-success: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7+{amount} %img_bitblock% &8(&f{deposited}&7/&f{required}&8) &7— offrande a &f{percent}%"

  # {deposited} {required} {percent}
  money-name: "&r&7%img_bitblock% &#FFD94DArgent demande"
  money-name-complete: "&r&7%img_bitblock% &#2ECF7BArgent depose"
  money-lore:
    - "&#B376E5Depose : &f{deposited}&7/&f{required} &8(&f{percent}%&8)"
    - ""
    - "&r&7%img_left_click% &#FFD94DDeposer un montant precis"
    - "&r&7%img_right_click% &#FFD94DDeposer tout ce que tu as"

  # {amount}
  money-name-editor: "&r&7%img_bitblock% &#FFD94DArgent demande &8({amount})"
  money-name-editor-empty: "&r&7%img_bitblock% &#B376E5Aucun argent demande"
  money-lore-editor:
    - "&r&7%img_left_click% &#FFD94DDefinir le montant demande"
    - "&r&7%img_right_click% &#FFD94DRetirer cette exigence"

  nav-prev-name: "&r&7%img_left_click% &#FFD94DPage precedente"
  nav-prev-lore: []
  nav-next-name: "&r&7%img_left_click% &#FFD94DPage suivante"
  nav-next-lore: []

  back-name: "&r&7%img_left_click% &#FFD94DRetour"
  back-lore:
    - "&#B376E5Retour au menu principal."

  # Selecteur d'affichage a 3 etats (meme convention que le selecteur de destination
  # d'Utopia dans /monde) : un clic fait defiler Tout -> Deposes -> Non deposes -> Tout.
  # Les deux filtres portent sur l'avancement de l'offrande, pas sur l'inventaire du joueur.
  # La liste complete est toujours affichee dans le lore, l'etat courant en surbrillance.
  # Le choix est memorise : le joueur retrouve son filtre en rouvrant le menu.
  filter-all-name: "&r&7%img_left_click% &#FFD94DAffichage : Tout"
  filter-all-lore:
    - "&#FFD94D➤ Tout"
    - "&8➤ &#B376E5Deposes"
    - "&8➤ &#B376E5Non deposes"
    - ""
    - "&#B376E5Clique pour changer l'affichage."
  filter-deposited-name: "&r&7%img_left_click% &#FFD94DAffichage : Deposes"
  filter-deposited-lore:
    - "&8➤ &#B376E5Tout"
    - "&#FFD94D➤ Deposes"
    - "&8➤ &#B376E5Non deposes"
    - ""
    - "&#B376E5N'affiche que ce que tu as"
    - "&#B376E5deja depose en entier."
    - ""
    - "&#B376E5Clique pour changer l'affichage."
  filter-not-deposited-name: "&r&7%img_left_click% &#FFD94DAffichage : Non deposes"
  filter-not-deposited-lore:
    - "&8➤ &#B376E5Tout"
    - "&8➤ &#B376E5Deposes"
    - "&#FFD94D➤ Non deposes"
    - ""
    - "&#B376E5N'affiche que ce qu'il"
    - "&#B376E5te reste a deposer."
    - ""
    - "&#B376E5Clique pour changer l'affichage."

  editor-enter-name: "&r&7%img_left_click% &#FFD94DModifier cette offrande"
  editor-enter-lore:
    - "&#B376E5Reserve aux administrateurs."
  editor-exit-name: "&r&7%img_left_click% &#FFD94DQuitter l'edition"
  editor-exit-lore:
    - "&#B376E5Retour a la vue normale."

  deposit-all-name: "&r&7%img_left_click% &#FFD94DTout deposer"
  deposit-all-lore:
    - "&#B376E5Depose d'un coup tout ce que"
    - "&#B376E5tu peux, sur tous les items"
    - "&#B376E5de cette offrande."
  # {amount} {types} {percent}
  deposit-all-success: "&8[&r#2ECF7BOffrande&8] &#2ECF7B✔ &7{amount} items deposes sur &f{types} &7type(s) — offrande a &f{percent}%"
  deposit-all-nothing: "&8[&r#2ECF7BOffrande&8] &7Tu n'as rien a deposer dans cette offrande pour le moment."

  # {name} {amount_formatted} : quantite demandee affichee juste apres le nom, parentheses
  # comprises (cf. section format), ex : "Lingot de fer (2 x64)"
  item-name-complete: "&#2ECF7B{name} {amount_formatted}"
  # {name} {amount_formatted}
  item-name-incomplete: "&#FFD94D{name} {amount_formatted}"
  # {deposited} {required} {percent}
  item-lore:
    - "&#B376E5Depose : &f{deposited}&7/&f{required} &8(&f{percent}%&8)"
  # ajoutee seulement si l'item est complet
  item-lore-complete-suffix:
    - ""
    - "&#2ECF7B✔ Complet"
  # ajoutee seulement si le joueur a au moins 1 exemplaire de l'item sur lui (et qu'il n'est pas complet)
  item-lore-hint:
    - ""
    - "&r&7%img_left_click% &#FFD94DDeposer tout ce que tu as"
    - "&r&7%img_right_click% &#FFD94DDeposer un seul"

  # ajoutee a la place des lignes de depot quand le joueur n'a aucun exemplaire de l'objet
  # (rien a deposer) et qu'une page wiki existe pour lui (section wiki de config.yml)
  item-lore-wiki-hint:
    - ""
    - "&r&7%img_left_click% &#FFD94DVoir le wiki de l'objet"

  # Lien envoye dans le tchat au clic gauche sur un objet que le joueur n'a pas.
  # Gabarit calque sur le /discord de DiscordSRV, une ligne de tchat par entree.
  # {name} nom de l'objet, {name_upper} le meme en majuscules, {url} lien de la page wiki.
  wiki-link:
    - "&#8A8A8A&m                        &r&#8A8A8A ᴡɪᴋɪ &m                        &r"
    - "&r"
    - "&r &8『&r 📖 &#FFD94D&l{name_upper}&r &8』"
    - "&r"
    - "&r  &8• &7Lɪᴇɴ : <click:open_url:'{url}'><hover:show_text:'&#B376E5Ouvrir la page du wiki'>&#2BC4E8&n{url}</hover></click>"
    - "&r"
    - "&#8A8A8A&m                                                        &r"

  # Variante pour une exigence d'enchantement (cle "enchant:..." dans collections.yml) :
  # chaque livre enchante depose ajoute son niveau au compteur (Tranchant V = +5).
  # {deposited} {required} {percent} {name}
  enchant-lore:
    - "&#B376E5Niveaux deposes : &f{deposited}&7/&f{required} &8(&f{percent}%&8)"
    - ""
    - "&#B376E5Depose des livres enchantes"
    - "&f{name}&#B376E5, chaque livre ajoute"
    - "&#B376E5son niveau au compteur."
  enchant-lore-hint:
    - ""
    - "&r&7%img_left_click% &#FFD94DDeposer tous tes livres"
    - "&r&7%img_right_click% &#FFD94DDeposer un seul livre"

  # {name} {amount_formatted}
  item-name-editor: "&#FFD94D{name} {amount_formatted}"
  item-lore-editor:
    - "&r&7%img_left_click% &#FFD94DDefinir la quantite"
    - "&r&7%img_right_click% &#FFD94DRetirer cet item"

# Formatage des quantites affichees apres le nom d'un item (voir AmountFormatter).
# {stacks} {remainder} {stack_size} : "(4 x64)", "(8 x16)", "(1 x64 + 36)". Un item non
# stackable ou une quantite inferieure a un stack s'affiche en nombre simple : "(30)".
format:
  amount-both: "<gray>(</gray><white>{stacks} x{stack_size} + {remainder}</white><gray>)</gray>"
  amount-stacks-only: "<gray>(</gray><white>{stacks} x{stack_size}</white><gray>)</gray>"
  amount-remainder-only: "<gray>(</gray><white>{remainder}</white><gray>)</gray>"
  # Exigence d'enchantement, comptee en niveaux. {amount}
  amount-levels: "<gray>(</gray><white>{amount} niveaux</white><gray>)</gray>"
