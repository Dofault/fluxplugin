name: FluxCasino
version: 0.1.0
main: fr.influencraft.fluxcasino.FluxCasino
api-version: "26.2"
description: Casino chips (balance, bet, exchange against the main currency) and casino games (Plinko, slot machine, roulette) in Flux menus.
authors: [Influencraft]
depend: [Flux]
softdepend: [Vault]

permissions:
  influcasino.use:
    description: Use the chips command (balance, bet, exchange).
    default: true
  influcasino.admin:
    description: Chips admin (give, take, set, history).
    default: op
