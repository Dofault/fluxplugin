name: FluxCasino
version: 0.1.0
main: fr.influencraft.fluxcasino.FluxCasino
api-version: "26.2"
description: Jetons de casino d'Influencraft (solde, mise, échange contre des BitBlock) et jeux du casino (Plinko, machine à sous, roulette) dans des menus Flux.
authors: [Influencraft]
depend: [Vault]
softdepend: [Flux, PlaceholderAPI]

commands:
  jetons:
    description: Jetons de casino (solde, mise, échange).
    usage: /jetons [mise|acheter|vendre|admin]
    aliases: [jeton]

permissions:
  influcasino.use:
    description: /jetons (solde, mise, échange).
    default: true
  influcasino.admin:
    description: /jetons admin (give, take, set, historique).
    default: op
