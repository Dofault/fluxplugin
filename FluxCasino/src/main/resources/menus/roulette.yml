# Roulette (2026-10-17) : la bille tourne sur la piste de la roue, tombe dans une case et s'y pose ([roulette], cf.
# Roulette.java). Roue immobile (influcasino:roulette_roue), fond et sprites : influcasino (assets/casino/roulette/
# gen_roulette_jeu.py), thème casino. Paris : rouge (impairs), noir (pairs), numéro précis (0 à 24).
# Mise en jetons (InfluCasino) : prise au lancer, gain versé à l'arrivée de la bille.
# Haut : retour (0), numéro tombé (7, à côté du lancer) et lancer (8), hors de la roue (son centre n'est jamais touché). Zone du joueur : barre de mise (66 à 68), paris (73, 74,
# 76 à 78). Le bouton de numéro prend l'icône du numéro choisi (placeholder dans le matériau) ; un pari choisi brille.
# [refresh-buttons] : le titre animé n'est pas touché.

title: ":offset_-8::menu_roulette::offset_-151::roulette_roue:"
rows: 6
player-inventory: hidden
vanilla-background: false

items:

  retour:
    material: "itemsadder:influcasino:btn_retour"
    name: "&#FFD94DRetour"
    slots: [0]
    lore:
      - "@desc Revenir au casino."
      - "@left Casino"
    actions:
      left: ["[menu] casino"]

  lancer:
    material: "itemsadder:influcasino:levier"
    name: "&#FFD94DLancer la bille"
    slots: [8]
    lore:
      - "@kv Jetons | %influcasino_jetons% &r&f%img_jeton%"
      - "@kv Mise | %influcasino_mise% &r&f%img_jeton%"
      - "@kv Pari | %fluxroulette_pari_nom% &#B376E5(x%fluxroulette_gain%)"
      - "@kv Dernier tour | %fluxroulette_last%"
      - "@kv Tours | %fluxroulette_count%"
      - "@ko %fluxroulette_erreur%"
      - "@left Lancer"
    actions:
      left: ["[roulette] spin"]

  # Numéro tombé au dernier tour : icône du numéro (couleur de sa case), point d'interrogation avant le premier tour
  # et pendant que la bille tourne.
  dernier:
    material: "itemsadder:influcasino:pari_n%fluxroulette_dernier%"
    priority: 1
    view-requirements:
      - "placeholder: %fluxroulette_dernier% != aucun"
    name: "&#FFD94DNuméro tombé : &f%fluxroulette_dernier_nom%"
    slots: [7]
    lore:
      - "@kv Dernier tour | %fluxroulette_last%"
      - "@kv Tours | %fluxroulette_count%"

  dernier_inconnu:
    material: "itemsadder:influitems:unknown"
    priority: 2
    name: "&#FFD94DNuméro tombé"
    slots: [7]
    lore:
      - "@desc Le numéro s'affiche ici quand la bille s'arrête."

  # ── Paris ──────────────────────────────────────────────────────────────
  rouge_choisi:
    material: "itemsadder:influcasino:pari_rouge"
    priority: 1
    glow: true
    view-requirements:
      - "placeholder: %fluxroulette_pari% == rouge"
    name: "&#FFD94DRouge &#2ECF7B(pari choisi)"
    slots: [73]
    lore:
      - "@desc Les 12 cases rouges (numéros impairs) : la mise est multipliée par 2."
      - "@ok Ton pari actuel."
    actions:
      left: ["[roulette] pari rouge"]

  rouge:
    material: "itemsadder:influcasino:pari_rouge"
    priority: 2
    name: "&#FFD94DRouge"
    slots: [73]
    lore:
      - "@desc Les 12 cases rouges (numéros impairs) : la mise est multipliée par 2."
      - "@left Parier sur le rouge"
    actions:
      left: ["[roulette] pari rouge", "[sound] @click"]

  noir_choisi:
    material: "itemsadder:influcasino:pari_noir"
    priority: 1
    glow: true
    view-requirements:
      - "placeholder: %fluxroulette_pari% == noir"
    name: "&#FFD94DNoir &#2ECF7B(pari choisi)"
    slots: [74]
    lore:
      - "@desc Les 12 cases noires (numéros pairs) : la mise est multipliée par 2."
      - "@ok Ton pari actuel."
    actions:
      left: ["[roulette] pari noir"]

  noir:
    material: "itemsadder:influcasino:pari_noir"
    priority: 2
    name: "&#FFD94DNoir"
    slots: [74]
    lore:
      - "@desc Les 12 cases noires (numéros pairs) : la mise est multipliée par 2."
      - "@left Parier sur le noir"
    actions:
      left: ["[roulette] pari noir", "[sound] @click"]

  numero_moins:
    material: "itemsadder:influcasino:moins"
    name: "&#FFD94DNuméro : &f%fluxroulette_numero%"
    slots: [76]
    lore:
      - "@left -1"
      - "@right -5"
    actions:
      left: ["[roulette] numero -1", "[sound] @click"]
      right: ["[roulette] numero -5", "[sound] @click"]

  numero_choisi:
    material: "itemsadder:influcasino:pari_n%fluxroulette_numero%"
    priority: 1
    glow: true
    view-requirements:
      - "placeholder: %fluxroulette_pari% == numero"
    name: "&#FFD94DNuméro : &f%fluxroulette_numero% &#2ECF7B(pari choisi)"
    slots: [77]
    lore:
      - "@kv Une seule case sur 25 | la mise est multipliée par 24. Règle le numéro"
      - "@desc (0 à 24) avec les boutons - et +."
      - "@ok Ton pari actuel."
    actions:
      left: ["[roulette] pari numero"]

  numero:
    material: "itemsadder:influcasino:pari_n%fluxroulette_numero%"
    priority: 2
    name: "&#FFD94DNuméro : &f%fluxroulette_numero%"
    slots: [77]
    lore:
      - "@kv Une seule case sur 25 | la mise est multipliée par 24. Règle le numéro"
      - "@desc (0 à 24) avec les boutons - et +."
      - "@left Parier sur ce numéro"
    actions:
      left: ["[roulette] pari numero", "[sound] @click"]

  numero_plus:
    material: "itemsadder:influcasino:plus"
    name: "&#FFD94DNuméro : &f%fluxroulette_numero%"
    slots: [78]
    lore:
      - "@left +1"
      - "@right +5"
    actions:
      left: ["[roulette] numero +1", "[sound] @click"]
      right: ["[roulette] numero +5", "[sound] @click"]

  # ── Barre de mise ──────────────────────────────────────────────────────
  baisser:
    material: "itemsadder:influcasino:moins"
    name: "&#FFD94DMise : &f%influcasino_mise% &r&f%img_jeton%"
    slots: [66]
    lore:
      - "@left -%influcasino_mise_pas%"
      - "@right -%influcasino_mise_grand_pas%"
    actions:
      left: ["[player] jetons mise -%influcasino_mise_pas%", "[sound] @click", "[refresh-buttons]"]
      right: ["[player] jetons mise -%influcasino_mise_grand_pas%", "[sound] @click", "[refresh-buttons]"]

  mise:
    material: "itemsadder:influcasino:jeton"
    name: "&#FFD94DMise : &f%influcasino_mise% &r&f%img_jeton%"
    slots: [67]
    lore:
      - "@desc De &f%influcasino_mise_min% <base>à &f%influcasino_mise_max% <base>jetons."
      - "@left Mise minimale"
      - "@right Mise maximale"
    actions:
      left: ["[player] jetons mise min", "[sound] @click", "[refresh-buttons]"]
      right: ["[player] jetons mise max", "[sound] @click", "[refresh-buttons]"]

  augmenter:
    material: "itemsadder:influcasino:plus"
    name: "&#FFD94DMise : &f%influcasino_mise% &r&f%img_jeton%"
    slots: [68]
    lore:
      - "@left +%influcasino_mise_pas%"
      - "@right +%influcasino_mise_grand_pas%"
    actions:
      left: ["[player] jetons mise +%influcasino_mise_pas%", "[sound] @click", "[refresh-buttons]"]
      right: ["[player] jetons mise +%influcasino_mise_grand_pas%", "[sound] @click", "[refresh-buttons]"]
