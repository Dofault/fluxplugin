# Casino (2026-10-17) : jetons (InfluCasino), jeux et revente des jetons contre des Bitblock (pas d'achat).
# Ouvert par /casino et le bouton Casino du menu principal. Fond : influcasino:menu_casino
# (assets/casino/gen_fond.py), thème casino.

title: ":offset_-8::menu_casino:"
rows: 6
commands: [casino]
player-inventory: hidden
vanilla-background: false

items:

  retour:
    material: "itemsadder:influcasino:btn_retour"
    name: "&#FFD94DRetour"
    slots: [0]
    lore:
      - "@desc Revenir au menu."
      - "@left Menu principal"
    actions:
      left: ["[menu] main"]

  solde:
    material: "itemsadder:influcasino:jeton"
    name: "&#FFD94DMes jetons"
    slots: [4]
    lore:
      - "@kv Solde | %influcasino_jetons% &r&f%img_jeton%"
      - "@kv Mise des jeux | %influcasino_mise%"
      - "@desc Revends-les contre des Bitblock en bas."

  # ── Jeux ───────────────────────────────────────────────────────────────
  plinko:
    material: "itemsadder:influcasino:plinko"
    name: "&#FFD94DPlinko"
    slots: [20]
    lore:
      - "@desc Lâche des billes sur une pyramide de clous : la case d'arrivée multiplie ta mise, de x0.4 à x10."
      - "@left Jouer"
    actions:
      left: ["[menu] plinko"]

  roulette:
    material: "itemsadder:influcasino:roulette"
    name: "&#FFD94DRoulette"
    slots: [22]
    lore:
      - "@desc Parie sur le rouge, le noir ou un numéro et regarde la bille tomber : jusqu'à x24 sur un numéro précis."
      - "@left Jouer"
    actions:
      left: ["[menu] roulette"]

  machine_a_sous:
    material: "itemsadder:influcasino:machine_a_sous"
    name: "&#FFD94DMachine à sous"
    slots: [24]
    lore:
      - "@desc Trois rouleaux, une ligne de gain : aligne les symboles pour multiplier ta mise."
      - "@left Jouer"
    actions:
      left: ["[menu] slots"]

  # ── Revente des jetons (pas d'achat : les jetons se gagnent) ───────────
  bitblock:
    material: "itemsadder:influitems:bitblock"
    name: "&#FFD94DMes Bitblock"
    slots: [39]
    lore:
      - "@kv Solde | %vault_eco_balance_formatted% &r&f%img_bitblock%"

  revendre:
    material: "itemsadder:influcasino:moins"
    name: "&#FFD94DRevendre des jetons"
    slots: [41]
    lore:
      - "@desc 1 jeton = &f%influcasino_prix_vente% &r&f%img_bitblock%"
      - "@left 10 jetons"
      - "@right 100 jetons"
      - "@shift-left Tout revendre"
    actions:
      left: ["[player] jetons vendre 10", "[refresh]"]
      right: ["[player] jetons vendre 100", "[refresh]"]
      shift-left: ["[player] jetons vendre tout", "[refresh]"]
