# Machine à sous (2026-10-17) : trois rouleaux animés dans le titre de la fenêtre ([slots], cf. Slots.java).
# Fond et rouleaux : influcasino (assets/slots/gen_slots.py), thème casino. Une ligne de gain : la case du milieu.
# Mise en jetons (InfluCasino) : prise au lancer, gain versé à l'arrêt des rouleaux.
# Rangée du haut commune aux jeux du casino : retour (0), barre de mise au centre (3, 4, 5), action du jeu au
# dernier slot (8). [refresh-buttons] : le titre animé n'est pas touché.

title: ":offset_-8::menu_slots:"
rows: 6
player-inventory: hidden
vanilla-background: false

items:

  retour:
    material: "itemsadder:influcasino:btn_retour"
    name: "&#FFD94DRetour"
    slots: [0]
    lore:
      - "@desc Revenir au casino."
      - "@left Casino"
    actions:
      left: ["[menu] casino"]

  lancer:
    material: "itemsadder:influcasino:levier"
    name: "&#FFD94DTirer le levier"
    slots: [8]
    lore:
      - "@kv Jetons | %influcasino_jetons% &r&f%img_jeton%"
      - "@kv Mise | %influcasino_mise% &r&f%img_jeton%"
      - "@kv Dernier tour | %fluxslots_last%"
      - "@kv Tours | %fluxslots_count%"
      - "@ko %fluxslots_erreur%"
      - "@left Lancer les rouleaux"
    actions:
      left: ["[slots]"]

  # ── Barre de mise ──────────────────────────────────────────────────────
  baisser:
    material: "itemsadder:influcasino:moins"
    name: "&#FFD94DMise : &f%influcasino_mise% &r&f%img_jeton%"
    slots: [3]
    lore:
      - "@left -%influcasino_mise_pas%"
      - "@right -%influcasino_mise_grand_pas%"
    actions:
      left: ["[player] jetons mise -%influcasino_mise_pas%", "[sound] @click", "[refresh-buttons]"]
      right: ["[player] jetons mise -%influcasino_mise_grand_pas%", "[sound] @click", "[refresh-buttons]"]

  mise:
    material: "itemsadder:influcasino:jeton"
    name: "&#FFD94DMise : &f%influcasino_mise% &r&f%img_jeton%"
    slots: [4]
    lore:
      - "@desc De &f%influcasino_mise_min% <base>à &f%influcasino_mise_max% <base>jetons."
      - "@left Mise minimale"
      - "@right Mise maximale"
    actions:
      left: ["[player] jetons mise min", "[sound] @click", "[refresh-buttons]"]
      right: ["[player] jetons mise max", "[sound] @click", "[refresh-buttons]"]

  augmenter:
    material: "itemsadder:influcasino:plus"
    name: "&#FFD94DMise : &f%influcasino_mise% &r&f%img_jeton%"
    slots: [5]
    lore:
      - "@left +%influcasino_mise_pas%"
      - "@right +%influcasino_mise_grand_pas%"
    actions:
      left: ["[player] jetons mise +%influcasino_mise_pas%", "[sound] @click", "[refresh-buttons]"]
      right: ["[player] jetons mise +%influcasino_mise_grand_pas%", "[sound] @click", "[refresh-buttons]"]
