# FluxCasino: casino chips. The games (Plinko, slot machine, roulette) take the player's bet in chips and pay the
# gain in chips; chips are bought and sold back against the main currency of the suite (Flux, currencies.main).

# Bet of the games, in chips, kept per player. "step" = left-click step, "big-step" = right-click step.
# With a minimum and a step of 10 and multipliers with one decimal (x1.1, x0.4...), gains are always whole.
bet:
  min: 10
  max: 1000
  default: 10
  step: 10
  big-step: 100

# Chips <-> main currency exchange.
exchange:
  enabled: true
  # buying chips: closed by default, chips are won elsewhere and only sold back
  buy-enabled: false
  # price of 1 chip when buying
  buy-price: 10
  # money given back for 1 chip when selling (equal to buy-price = exchange without fees)
  sell-price: 10
  # chips at most per purchase or sale
  max-per-operation: 100000

# Texts: lang/<language>.yml, in the suite's language (Flux config) unless set here:
# language: fr_FR
