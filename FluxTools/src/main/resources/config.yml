# FluxTools: general settings. Tools are in tools/<id>.yml, given by /fluxitems give <player> fluxtools:<id>.

# Worlds where tools earn no XP.
excluded-worlds: []

# Tell the whole server when a tool reaches its last level.
announce-mastery: true

# XP bar in the description of a levelled tool: one glyph per step ({step} from 0 to steps, pack of FluxAFK). Without
# this picture, a bar of text is written instead.
level-bar:
  glyph: "fluxafk:bar_{step}"
  steps: 20

# Palette FluxTools (« rubis ») : rubis #FF4D6D (préfixe, titres), rose pâle #FFD6DE (texte),
# grenat #A33A50 (filets), menthe #7BE0A1 (réussi), gris rosé #A89BA0 (pas atteint), blanc (valeurs). Le gain de BitBlock garde la convention commune (docs/notifications/bitblock.md).
# Texts: lang/<language>.yml (language of the suite unless a language key is set here).

# ─── Utility modules (taken over from InfluBridge) ─────────────────────────────
# Each one is switched with enabled. A module whose required plugin is missing (EcoJobs, CMI, ProtocolLib...)
# turns itself off with a console warning.
modules:
  # Refuses at the anvil the items whose lore has the "Irréparable" tag (crate tools).
  anvil-restrictions:
    enabled: true

  # /repair: repair menu at a single price (cost, in the main currency), durability and anvil cost reset.
  # Permission influbridge.repair. Items tagged "Irréparable" are refused.
  repair:
    enabled: true
    cost: 500

  # /bottlexp: stores XP in bottles of 1395 points (levels 0 to 30), given back on right click.
  bottlexp:
    enabled: true
