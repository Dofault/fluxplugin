name: FluxTools
version: '0.1.0'
main: fr.influencraft.fluxtools.FluxTools
api-version: '1.21'
description: Levelled crate tools with quests, and utility modules (jobs, repair, XP bottles, book splitter, notifications).
authors: [Influencraft]
depend: [Flux]
# EcoEnchants avant nous : ses enchantements (Filon, Tranchée...) doivent être inscrits quand on lit les outils.
softdepend: [ProtocolLib, EcoEnchants, EcoBattlepass, EcoCollections]
permissions:
  # Séparation de livres (module enchant-splitter, ex-InfluEnchantSplitter) : réservée aux VIP, accordée au groupe vip
  influenchantsplitter.command:
    description: "Séparer un livre enchanté avec /enchantsplit."
    default: op
  influenchantsplitter.table:
    description: "Séparer un livre enchanté par clic droit sur une table d'enchantement."
    default: op
  influenchantsplitter.reload:
    description: "/enchantsplit reload (relit config.yml)."
    default: op
  influbridge.bottlexp:
    description: "Permet d'utiliser /bottlexp (remplir des fioles d'expérience). Utiliser une fiole ne demande aucune permission."
    default: op
  influbridge.bottlexp.admin:
    description: "Permet /bottlexp give <joueur> <xp> [quantité] : donne des fioles d'un montant d'XP libre."
    default: op
  influbridge.repair:
    description: "Permet d'ouvrir le menu de réparation /repair. Accordé au groupe eminent (rang 5)."
    default: op
  fluxitems.admin:
    description: /fluxitems
    default: op
