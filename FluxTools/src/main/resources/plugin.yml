name: FluxTools
version: '0.1.0'
main: fr.influencraft.fluxtools.FluxTools
api-version: '1.21'
description: Levelled crate tools, repair menu and experience bottles.
authors: [Influencraft]
depend: [Flux]
# EcoEnchants before us: its enchantments (Filon, Tranchee...) must be registered when the tools are read.
softdepend: [EcoEnchants]
permissions:
  fluxtools.bottlexp:
    description: "Permet d'utiliser /bottlexp (remplir des fioles d'expérience). Utiliser une fiole ne demande aucune permission."
    default: op
  fluxtools.bottlexp.admin:
    description: "Permet /bottlexp give <joueur> <xp> [quantité] : donne des fioles d'un montant d'XP libre."
    default: op
  fluxtools.repair:
    description: "Permet d'ouvrir le menu de réparation /repair. Accordé au groupe eminent (rang 5)."
    default: op
  fluxtools.admin:
    description: /tools
    default: op
