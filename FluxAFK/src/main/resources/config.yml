# FluxAFK: a player idle for idle-time (no key pressed, no head movement, no click, no command) is taken to the AFK
# zone. There he cannot act; the first key he presses or the first head movement brings him back where he was.
# While he stays, a bar fills up in the middle of the screen; each time it is full, the rewards below are kept for
# him in /rewards (Flux). Leaving the zone resets the bar to 0.
# Durations: "90s", "10m", "1h30"; a bare number is minutes.

# Idle time before being taken to the zone (permission fluxafk.auto, never with fluxafk.exempt).
idle-time: 10m

# The AFK zone, "world;x;y;z;yaw;pitch". Set it in game with /fluxafk setzone. Empty: players stay frozen where they are.
zone: ""

# Time spent in the zone to fill the bar once (one round of rewards).
reward-every: 15m

# Rounds of rewards per player and per day (0 = no limit). The day changes at midnight in time-zone.
daily-limit: 0
time-zone: "Europe/Paris"

# Accounts of one connection (same IP) filling their bar at the same time (0 = no limit). The others wait, their bar
# paused, so a second account does not double the rewards.
max-per-ip: 1

# /afk is refused this many seconds after hitting or being hit by a player (no escape from a fight).
combat-seconds: 15

# Seconds after arriving in the zone during which head movements do not count (the client settles after the teleport).
grace-seconds: 2

# A player pushed further than this (blocks) from his place in the zone, without pressing any key, is put back.
drift-tolerance: 1.0

# Worlds where nobody is taken to the zone.
disabled-worlds: []

# Boxes where nobody is taken to the zone (a jail...): "world;x1;y1;z1;x2;y2;z2".
excluded-areas: []

# Chat message to everyone when a player goes AFK and comes back.
announce: true

# Writing in the public chat brings the player back (false: he can chat from the zone and stay AFK).
chat-leaves: true

# Commands that do not bring the player back (without "/", the label typed, aliases included, e.g. [msg, r]).
# Any other command does, before it runs.
allowed-commands: []

# Bar shown under the title. glyph: ItemsAdder font image, {step} from 0 to steps (pack generated by
# FluxAFK/assets/gen_bar.py). Without that glyph, a text bar is shown instead.
bar:
  glyph: "fluxafk:bar_{step}"
  steps: 20

# Rewards of one full bar: each entry is one reward in /rewards. Shape of the suite's rewards (Flux):
#   label, icon (Flux item syntax), slots (inventory slots needed to claim it), commands (console, %player%),
#   plus permission (only players holding it get this entry) and chance (0 to 1, default 1).
rewards:
  influence:
    label: "&f1 Influence"
    icon: "itemsadder:influitems:influence"
    slots: 0
    commands:
      - "influence give %player% 1"
  fly:
    label: "&f5 min of fly time"
    icon: FEATHER
    slots: 0
    commands:
      - "fluxfly add %player% 5m"
