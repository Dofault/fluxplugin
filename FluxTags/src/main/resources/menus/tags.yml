# Tags menu (/tags), vanilla theme (2026-10-30): the tags as name tags, 28 per page (rows 1 to 4), the worn one glows;
# hovering one shows the tag image as its name and whether it is unlocked. Pager on row 5. Opened from the main menu.
# Entries built by FluxTags (list tags). Theme: theme.menus.tags of Flux's config.
rows: 6
player-inventory: hidden
vanilla-background: false

open-actions:
  - "[sound] @page"

lists:
  tags:
    slots: 10-16, 19-25, 28-34, 37-43
    item:
      material: entry
      actions:
        left: ["%entry_clic%", "[refresh]"]

widgets:
  pages:
    type: pager
    list: tags
    prev: 45
    next: 53

items:
  retour:
    material: "itemsadder:influitems:btn_back"
    name: "Retour"
    slots: [0]
    lore:
      - "@desc Revenir au menu."
      - "@left Menu principal"
    actions:
      left: ["[menu] main"]

  icone:
    material: NAME_TAG
    name: "Tags"
    slots: [8]
    lore:
      - "@desc Un tag s'affiche à côté de ton pseudo dans le tchat. Clique sur un tag débloqué pour le porter."
