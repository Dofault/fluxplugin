# FluxTags: collectible tags. A player shows one tag at most (picked in /tags, or none): %fluxtags_tag% in the chat
# format and the tab list (%fluxtags_tag_spaced% adds a space after it when there is one).
# Images: ItemsAdder pack « fluxtags », generated by plugins/fluxplugin/FluxTags/assets/gen_tags.py (also writes
# glyphs.yml next to this file: the size of each image).

# The player's rank (one tag that follows his current rank: an older rank's tag cannot be kept).
rank-placeholder: "%luckperms_current_group_on_track_standard%"

# Job tags: unlocked at the first level, a new look at each next level (6 tiers: Commun ... Fabuleux).
job-tiers: [50, 100, 150, 200, 250, 300]

# Special tags, unlocked by a permission (fluxtags.tag.<id>).
specials:
  beta:
    name: "Bêta"
    description: "A joué pendant la bêta du serveur."
  createur:
    name: "Créateur"
    description: "Créateur de contenu partenaire."
