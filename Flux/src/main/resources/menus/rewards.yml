# Flux : menu Récompenses (/recompenses, bouton Récompenses de /menu2). Fond menu_recompenses (ItemsAdder
# influmenu, généré par plugins/fluxplugin/Flux/assets/recompenses/gen_fond.py).
# Retour en 9, explication du menu et récompense du jour en 17.
# Haut : toutes les récompenses en attente, quel que soit le plugin qui les a données, une case par récompense
# (21 par page), page précédente / suivante à gauche et à droite de la boîte, Tout récupérer dessous.
# Bas : deux frises de 7, le cycle de connexion (55-61) et les paliers de temps de jeu (73-79), flèches de chaque
# côté. Explication et frises construites par FluxRewards (listes recompenses_info, _connexion, _temps).
title: ":offset_-8::menu_recompenses:"
rows: 6
player-inventory: hidden
vanilla-background: false
update-interval: 40

# Liaisons entre les étapes des frises (pièces influroad dans le titre, comme le pass), allumées jusqu'à
# vert récupéré, orange en attente, rouge manqué, éteint pas encore (une liaison prend la couleur de l'étape
# où elle arrive).
paths:
  connexion:
    slots: [55, 56, 57, 58, 59, 60, 61]
    progress: "%fluxrewards_frise_connexion%"
    states: "%fluxrewards_frise_connexion_etats%"
    color: vert
    start: false
    end: false
  temps:
    slots: [73, 74, 75, 76, 77, 78, 79]
    progress: "%fluxrewards_frise_temps%"
    states: "%fluxrewards_frise_temps_etats%"
    color: vert
    start: false
    end: false

open-actions:
  - "[fluxrewards] semaine"
  - "[sound] @page"
  - "[refresh]"

lists:
  rewards:
    slots: 19-25,28-34,37-43
    item:
      material: entry
      name: "&#FFD94D%entry_label%"
      lore:
        - "&#FFD94D│ &#B376E5Source : &f%entry_source%"
        - "&#FFD94D│ &#B376E5Reçue le &f%entry_date%"
        - "&#FFD94D│ &#B376E5Cases nécessaires : &f%entry_slots%"
        - "&#FFD94D└ &r&7%img_left_click% &fRécupérer"
      actions:
        left: ["[rewards] claim %entry_id%", "[sound] @complete"]

  recompenses_info:
    slots: 17
    item:
      material: entry
      actions:
        left: ["%entry_clic%", "[refresh]"]

  recompenses_connexion:
    slots: 55-61
    item:
      material: entry
      actions:
        left: ["%entry_clic%", "[refresh]"]

  recompenses_temps:
    slots: 73-79
    item:
      material: entry
      actions:
        left: ["%entry_clic%", "[refresh]"]

items:

  retour:
    material: "itemsadder:influitems:btn_back"
    name: "&#FFD94DRetour"
    slots: [9]
    lore:
      - "&#FFD94D│ &#B376E5Revenir au menu."
      - "&#FFD94D└ &r&7%img_left_click% &fMenu principal"
    actions:
      left: ["[menu] main"]

  vide:
    material: "itemsadder:influitems:checkmark"
    name: "&#FFD94DRien en attente"
    slots: [31]
    view-requirements: ["placeholder: %flux_rewards_count% == 0"]
    lore:
      - "&#FFD94D│ &#B376E5Tes prochaines récompenses"
      - "&#FFD94D│ &#B376E5(connexion, temps de jeu, votes,"
      - "&#FFD94D└ &#B376E5parrainage, boosters...) arrivent ici."

  tout:
    material: "itemsadder:influitems:reward"
    name: "&#FFD94DTout récupérer"
    slots: [49]
    lore:
      - "&#FFD94D│ &#B376E5En attente : &f%flux_rewards_count%"
      - "&#FFD94D│ &#B376E5Cases nécessaires : &f%flux_rewards_slots%"
      - "&#FFD94D│ &#B376E5Ce qui ne rentre pas dans ton"
      - "&#FFD94D│ &#B376E5inventaire reste ici."
      - "&#FFD94D└ &r&7%img_left_click% &fTout récupérer"
    actions:
      left: ["[rewards] claim", "[sound] @complete"]

  precedente:
    material: "itemsadder:influitems:btn_prev"
    hide-tooltip: true
    name: "&#FFD94DPage précédente"
    slots: [27]
    view-requirements: ["placeholder: %flux_list_rewards_has_prev% == true"]
    actions:
      left: ["[list] rewards prev", "[sound] @page"]

  suivante:
    material: "itemsadder:influitems:btn_next"
    hide-tooltip: true
    name: "&#FFD94DPage suivante"
    slots: [35]
    view-requirements: ["placeholder: %flux_list_rewards_has_next% == true"]
    actions:
      left: ["[list] rewards next", "[sound] @page"]

  connexion_prec:
    material: "itemsadder:influitems:btn_prev"
    hide-tooltip: true
    name: "&#FFD94DSemaine précédente"
    slots: [54]
    view-requirements: ["placeholder: %flux_list_recompenses_connexion_has_prev% == true"]
    actions:
      left: ["[list] recompenses_connexion prev", "[sound] @page", "[refresh]"]

  connexion_suiv:
    material: "itemsadder:influitems:btn_next"
    hide-tooltip: true
    name: "&#FFD94DSemaine suivante"
    slots: [62]
    view-requirements: ["placeholder: %flux_list_recompenses_connexion_has_next% == true"]
    actions:
      left: ["[list] recompenses_connexion next", "[sound] @page", "[refresh]"]

  temps_prec:
    material: "itemsadder:influitems:btn_prev"
    hide-tooltip: true
    name: "&#FFD94DPaliers précédents"
    slots: [72]
    view-requirements: ["placeholder: %flux_list_recompenses_temps_has_prev% == true"]
    actions:
      left: ["[list] recompenses_temps prev", "[sound] @page", "[refresh]"]

  temps_suiv:
    material: "itemsadder:influitems:btn_next"
    hide-tooltip: true
    name: "&#FFD94DPaliers suivants"
    slots: [80]
    view-requirements: ["placeholder: %flux_list_recompenses_temps_has_next% == true"]
    actions:
      left: ["[list] recompenses_temps next", "[sound] @page", "[refresh]"]
