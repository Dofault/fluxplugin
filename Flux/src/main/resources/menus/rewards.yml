# Flux: every reward waiting for the player, whatever plugin gave it (/rewards). Click one to claim it, or claim
# everything that fits in your inventory.
title: "&8Rewards"
rows: 6
player-inventory: hidden
vanilla-background: true
update-interval: 40

lists:
  rewards:
    slots: 10-16,19-25,28-34
    item:
      material: entry
      name: "%entry_label%"
      lore:
        - "&7%entry_source%, %entry_date%"
        - "&7Slots needed: &f%entry_slots%"
        - ""
        - "&r&7%img_left_click%&#FFD94D Claim"
      actions:
        left: ["[rewards] claim %entry_id%"]
    empty:
      material: BARRIER
      name: "&7Nothing waiting for you"

items:
  claim:
    slot: 49
    material: CHEST
    name: "&r&7%img_left_click%&#FFD94D Claim everything"
    lore:
      - "&#B376E5%flux_rewards_count% reward(s) waiting, %flux_rewards_slots% slot(s) needed. What does not fit stays here."
    actions:
      left: ["[rewards] claim"]
  previous:
    slot: 45
    material: ARROW
    name: "&fPrevious page"
    view-requirements: ["placeholder: %flux_list_rewards_has_prev% == true"]
    actions:
      left: ["[list] rewards prev"]
  next:
    slot: 53
    material: ARROW
    name: "&fNext page (%flux_list_rewards_page%/%flux_list_rewards_pages%)"
    view-requirements: ["placeholder: %flux_list_rewards_has_next% == true"]
    actions:
      left: ["[list] rewards next"]
