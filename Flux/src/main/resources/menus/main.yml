# ─────────────────────────────────────────────────────────────────────────────
# Menu principal (test Flux), ouvert par /menu2. Identifiant = main.
# Version minimaliste : fond panneau violet (influmenu:menu2), objets vanilla.
#
# Cases : 0-53 = coffre (6 rangées). En player-inventory: hidden, on continue dans
# la zone de l'inventaire du joueur : 54-80 = ses 3 rangées, 81-89 = barre d'action.
#
# Disposition (centrée) :
#   coffre rangée 4 : 28 à 34, 7 fonctionnalités, Profil au centre
#   coffre rangée 6 : Vote 45, Parrainage 46, Classement 47, Récompenses 51, Aide 52, Paramètres 53
#   inventaire du joueur : masqué, aucun bouton
# ─────────────────────────────────────────────────────────────────────────────

title: ":offset_-8::menu2_anim_1:"
rows: 6
commands: [menu2]

# hidden      : inventaire du joueur masqué (seuls nos boutons s'affichent en bas)
# visible     : inventaire affiché mais figé (comportement DeluxeMenus)
# interactive : inventaire affiché, le joueur peut ranger ses objets
player-inventory: hidden

# Fond de coffre : false = transparent (seule l'image du titre s'affiche, le fond
# vanilla est caché), true = fond de coffre habituel sous l'image.
vanilla-background: false

# Rafraîchissement des placeholders et conditions, en ticks (0 = jamais).
update-interval: 20

open-actions:
  - "[sound] minecraft:item.book.page_turn 1 1"

items:

  # ── Fonctionnalités : rangée 4 du coffre (cases 28 à 34) ────────────────

  carrieres:
    material: DIAMOND_PICKAXE
    flags: [HIDE_ATTRIBUTES]
    name: "&#FFD94DCarrières"
    slots: [28]
    lore:
      - "&#FFD94D│ &#B376E5Choisis tes métiers"
      - "&#FFD94D│ &#B376E5et suis ta progression."
      - "&#FFD94D└ &r&7%img_left_click% &fOuvrir"
    actions:
      left: ["[player] job"]

  quetes:
    material: WRITABLE_BOOK
    name: "&#FFD94DQuêtes"
    slots: [29]
    lore:
      - "&#FFD94D│ &#B376E5Suis la quête"
      - "&#FFD94D│ &#B376E5de ton rang."
      - "&#FFD94D├ &r&7%img_left_click% &fSuivre"
      - "&#FFD94D└ &r&7%img_right_click% &fArrêter le suivi"
    actions:
      left:
        - "[console] tw quest track quest_%luckperms_primary_group_name% %player_name%"
        - "[close]"
      right:
        - "[console] tw quest untrack %player_name%"
        - "[close]"

  succes:
    material: NETHER_STAR
    name: "&#FFD94DSuccès"
    slots: [30]
    lore:
      - "&#FFD94D│ &#B376E5Débloque des succès"
      - "&#FFD94D│ &#B376E5et gagne des &f%img_impact% &#B376E5Couronnes."
      - "&#FFD94D└ &r&7%img_left_click% &fVoir mes succès"
    actions:
      left: ["[player] collections"]

  profil:
    material: player-head
    name: "&#FFD94DProfil"
    slots: [31]
    lore:
      - "&#FFD94D│ &#B376E5Rang : &f%luckperms_primary_group_name%"
      - "&#FFD94D│ &#B376E5Tes statistiques et ta famille."
      - "&#FFD94D└ &r&7%img_left_click% &fVoir mon profil"
    actions:
      left: ["[openguimenu] profil"]

  mondes:
    material: COMPASS
    name: "&#FFD94DMondes"
    slots: [32]
    lore:
      - "&#FFD94D│ &#B376E5Voyage entre les"
      - "&#FFD94D│ &#B376E5différents mondes."
      - "&#FFD94D└ &r&7%img_left_click% &fExplorer"
    actions:
      left: ["[openguimenu] mondes_menu"]

  ville:
    material: BRICKS
    name: "&#FFD94DVille"
    slots: [33]
    lore:
      - "&#FFD94D│ &#B376E5Gère ta ville et"
      - "&#FFD94D│ &#B376E5explore celles des autres."
      - "&#FFD94D└ &r&7%img_left_click% &fOuvrir"
    actions:
      left: ["[player] ville"]

  familiers:
    material: BONE
    name: "&#FFD94DFamiliers"
    slots: [34]
    lore:
      - "&#FFD94D│ &#B376E5Consulte et choisis"
      - "&#FFD94D│ &#B376E5tes compagnons."
      - "&#FFD94D└ &r&7%img_left_click% &fMes familiers"
    actions:
      left: ["[player] pets"]

  # ── Boutons utilitaires : rangée 6 du coffre ────────────────────────────
  # Vote 45, Parrainage 46, Classement 47, Récompenses 51, Aide 52, Paramètres 53.

  recompense:
    material: itemsadder:influitems:reward
    name: "&#FFD94DRécompenses"
    slots: [51]
    lore:
      - "&#FFD94D│ &#B376E5Tes récompenses de vote"
      - "&#FFD94D│ &#B376E5t'attendent."
      - "&#FFD94D└ &r&7%img_left_click% &fRécupérer"
    actions:
      left: ["[player] voteclaims"]

  vote:
    material: itemsadder:influitems:vote
    name: "&#FFD94DVote"
    slots: [45]
    lore:
      - "&#FFD94D│ &#B376E5Flamme : &f%influbridge_flame_streak% &#B376E5jour(s)"
      - "&#FFD94D│ &#B376E5Soutiens le serveur."
      - "&#FFD94D├ &r&7%img_left_click% &fVoter"
      - "&#FFD94D└ &r&7%img_right_click% &fRécupérer mes clés"
    actions:
      left: ["[page-toggle] vote"]

  parrainage:
    material: itemsadder:influitems:referral
    name: "&#FFD94DParrainage"
    slots: [46]
    lore:
      - "&#FFD94D│ &#B376E5Invite tes amis et gagnez"
      - "&#FFD94D│ &#B376E5des récompenses ensemble."
      - "&#FFD94D└ &r&7%img_left_click% &fMon code"
    actions:
      left: ["[page-toggle] parrainage"]

  classement:
    material: itemsadder:influitems:leaderboard
    name: "&#FFD94DClassement"
    slots: [47]
    lore:
      - "&#FFD94D│ &#B376E5Les meilleurs joueurs"
      - "&#FFD94D│ &#B376E5de chaque carrière."
      - "&#FFD94D└ &r&7%img_left_click% &fVoir le podium"
    actions:
      left: ["[page-toggle] classement"]

  aide:
    material: itemsadder:influitems:unknown
    name: "&#FFD94DAide"
    slots: [52]
    lore:
      - "&#FFD94D│ &#B376E5Toute la documentation"
      - "&#FFD94D│ &#B376E5du serveur."
      - "&#FFD94D└ &r&7%img_left_click% &fOuvrir le wiki"
    actions:
      left: ["[page-toggle] aide"]

  parametres:
    material: itemsadder:influitems:settings
    name: "&#FFD94DParamètres"
    slots: [53]
    lore:
      - "&#FFD94D│ &#B376E5Personnalise ton"
      - "&#FFD94D│ &#B376E5expérience de jeu."
      - "&#FFD94D└ &r&7%img_left_click% &fOuvrir"
    actions:
      left: ["[page-toggle] parametres"]

# ── Pages : même fenêtre, nouveau fond + boutons en plus ───────────────────
# Chaque bouton du bas ouvre sa page ([page-toggle] <id>) : animation du panneau
# qui s'agrandit, puis boutons de la page dans la zone de l'inventaire (masqué).
# Re-cliquer referme (animation à l'envers) ; d'une page à l'autre, le panneau se
# replie puis se redéploie.
# Zone des pages : 54-62, 63-71, 72-80 (inventaire), 81-89 (barre d'action).
pages:

  # ── Paramètres (réglages de /reglages) ────────────────────────────────
  parametres:
    title: &extension_title ":offset_-8::menu2_anim_5:"
    animation: &extension
      frames:
        - ":offset_-8::menu2_anim_2:"
        - ":offset_-8::menu2_anim_3:"
        - ":offset_-8::menu2_anim_4:"
      interval: 2   # ticks entre deux images
    items:

      parametres:
        material: itemsadder:influitems:settings
        glow: true
        name: "&#FFD94DParamètres"
        slots: [53]
        lore:
          - "&#FFD94D│ &#B376E5Ouvert."
          - "&#FFD94D└ &r&7%img_left_click% &fRefermer"
        actions:
          left: ["[page-toggle] parametres"]

      # Rangée 1 : affichage du HUD (clic gauche active, clic droit désactive).
      hud_avatar:
        material: player-head
        name: "&#FFD94DAvatar (HUD)"
        slots: [55]
        lore:
          - "&#FFD94D│ &#B376E5Ta tête en haut"
          - "&#FFD94D│ &#B376E5de l'écran."
          - "&#FFD94D├ &r&7%img_left_click% &fActiver"
          - "&#FFD94D└ &r&7%img_right_click% &fDésactiver"
        actions:
          left: ["[console] hud layout %player_name% add influprofil-layout"]
          right: ["[console] hud layout %player_name% remove influprofil-layout"]

      hud_voteparty:
        material: NETHER_STAR
        name: "&#FFD94DVote Party (HUD)"
        slots: [56]
        lore:
          - "&#FFD94D│ &#B376E5Progression de la"
          - "&#FFD94D│ &#B376E5prochaine Vote Party."
          - "&#FFD94D├ &r&7%img_left_click% &fActiver"
          - "&#FFD94D└ &r&7%img_right_click% &fDésactiver"
        actions:
          left: ["[console] hud layout %player_name% add influvote-layout"]
          right: ["[console] hud layout %player_name% remove influvote-layout"]

      hud_position:
        material: COMPASS
        name: "&#FFD94DPosition (HUD)"
        slots: [57]
        lore:
          - "&#FFD94D│ &#B376E5Tes coordonnées"
          - "&#FFD94D│ &#B376E5à l'écran."
          - "&#FFD94D├ &r&7%img_left_click% &fActiver"
          - "&#FFD94D└ &r&7%img_right_click% &fDésactiver"
        actions:
          left: ["[console] hud layout %player_name% add influposition-layout"]
          right: ["[console] hud layout %player_name% remove influposition-layout"]

      hud_biome:
        material: GRASS_BLOCK
        name: "&#FFD94DBiome (HUD)"
        slots: [59]
        lore:
          - "&#FFD94D│ &#B376E5Le biome où"
          - "&#FFD94D│ &#B376E5tu te trouves."
          - "&#FFD94D├ &r&7%img_left_click% &fActiver"
          - "&#FFD94D└ &r&7%img_right_click% &fDésactiver"
        actions:
          left: ["[console] tw facts set is_biome 0 %player_name%"]
          right: ["[console] tw facts set is_biome 1 %player_name%"]

      hud_ville:
        material: BRICKS
        name: "&#FFD94DVille (HUD)"
        slots: [60]
        lore:
          - "&#FFD94D│ &#B376E5La ville où"
          - "&#FFD94D│ &#B376E5tu te trouves."
          - "&#FFD94D├ &r&7%img_left_click% &fActiver"
          - "&#FFD94D└ &r&7%img_right_click% &fDésactiver"
        actions:
          left: ["[console] tw facts set is_ville 0 %player_name%"]
          right: ["[console] tw facts set is_ville 1 %player_name%"]

      hud_clearlag:
        material: CLOCK
        name: "&#FFD94DClearLag (HUD)"
        slots: [61]
        lore:
          - "&#FFD94D│ &#B376E5Le prochain nettoyage"
          - "&#FFD94D│ &#B376E5des objets au sol."
          - "&#FFD94D├ &r&7%img_left_click% &fActiver"
          - "&#FFD94D└ &r&7%img_right_click% &fDésactiver"
        actions:
          left: ["[console] hud layout %player_name% add influclearlag-layout"]
          right: ["[console] hud layout %player_name% remove influclearlag-layout"]

      # Rangée 2 : options de jeu.
      opt_votenotif:
        material: WRITABLE_BOOK
        name: "&#FFD94DNotifications de vote"
        slots: [65]
        lore:
          - "&#FFD94D│ &#B376E5Rappel quand tu"
          - "&#FFD94D│ &#B376E5peux revoter."
          - "&#FFD94D├ &r&7%img_left_click% &fActiver"
          - "&#FFD94D└ &r&7%img_right_click% &fDésactiver"
        actions:
          left: ["[player] votenotif on"]
          right: ["[player] votenotif off"]

      opt_chatgames:
        material: BOOK
        name: "&#FFD94DJeux du tchat"
        slots: [66]
        lore:
          - "&#FFD94D│ &#B376E5Participe aux jeux"
          - "&#FFD94D│ &#B376E5proposés dans le tchat."
          - "&#FFD94D├ &r&7%img_left_click% &fActiver"
          - "&#FFD94D└ &r&7%img_right_click% &fDésactiver"
        actions:
          left: ["[player] chatgames toggle"]
          right: ["[player] chatgames toggle"]

      opt_tp:
        material: ENDER_PEARL
        name: "&#FFD94DTéléportation"
        slots: [68]
        lore:
          - "&#FFD94D│ &#B376E5Autorise les demandes"
          - "&#FFD94D│ &#B376E5de téléportation."
          - "&#FFD94D├ &r&7%img_left_click% &fActiver"
          - "&#FFD94D└ &r&7%img_right_click% &fDésactiver"
        actions:
          left: ["[console] cmi options tp true %player_name% -s"]
          right: ["[console] cmi options tp false %player_name% -s"]

      opt_msg:
        material: PAPER
        name: "&#FFD94DMessages privés"
        slots: [69]
        lore:
          - "&#FFD94D│ &#B376E5Autorise les messages"
          - "&#FFD94D│ &#B376E5privés des joueurs."
          - "&#FFD94D├ &r&7%img_left_click% &fActiver"
          - "&#FFD94D└ &r&7%img_right_click% &fDésactiver"
        actions:
          left: ["[console] cmi options msg true %player_name% -s"]
          right: ["[console] cmi options msg false %player_name% -s"]

      retour:
        material: itemsadder:influitems:btn_back
        name: "&#FFD94DRetour"
        slots: [85]
        lore:
          - "&#FFD94D│ &#B376E5Revenir au menu."
          - "&#FFD94D└ &r&7%img_left_click% &fMenu principal"
        actions:
          left: ["[page] main"]


  # ── Aide (Discord) ────────────────────────────────────────────────────
  aide:
    title: *extension_title
    animation: *extension
    items:

      aide:
        material: itemsadder:influitems:unknown
        glow: true
        name: "&#FFD94DAide"
        slots: [52]
        lore:
          - "&#FFD94D│ &#B376E5Ouvert."
          - "&#FFD94D└ &r&7%img_left_click% &fRefermer"
        actions:
          left: ["[page-toggle] aide"]

      discord:
        material: LAPIS_LAZULI
        name: "&#FFD94DRejoindre le Discord"
        slots: [65]
        lore:
          - "&#FFD94D│ &#B376E5Annonces, entraide"
          - "&#FFD94D│ &#B376E5et vocal."
          - "&#FFD94D└ &r&7%img_left_click% &fRecevoir le lien"
        actions:
          left: ["[player] discord", "[close]"]

      lier:
        material: TRIPWIRE_HOOK
        name: "&#FFD94DLier mon compte"
        slots: [66]
        lore:
          - "&#FFD94D│ &#B376E5Relie ton compte"
          - "&#FFD94D│ &#B376E5Minecraft à Discord."
          - "&#FFD94D└ &r&7%img_left_click% &fLier"
        actions:
          left: ["[player] discord link", "[close]"]

      ticket:
        material: NAME_TAG
        name: "&#FFD94DOuvrir un ticket"
        slots: [67]
        lore:
          - "&#FFD94D│ &#B376E5Un souci ? Le staff"
          - "&#FFD94D│ &#B376E5te répond sur Discord."
          - "&#FFD94D└ &r&7%img_left_click% &fComment faire"
        actions:
          left: ["[message] &#FFD94D&lAide &8► &#B376E5Ouvre un ticket dans le salon &f#tickets &#B376E5du Discord."]

      regles:
        material: WRITABLE_BOOK
        name: "&#FFD94DRèglement"
        slots: [68]
        lore:
          - "&#FFD94D│ &#B376E5Les règles"
          - "&#FFD94D│ &#B376E5du serveur."
          - "&#FFD94D└ &r&7%img_left_click% &fLire"
        actions:
          left: ["[player] regles", "[close]"]

      wiki:
        material: KNOWLEDGE_BOOK
        name: "&#FFD94DWiki"
        slots: [69]
        lore:
          - "&#FFD94D│ &#B376E5Toute la documentation"
          - "&#FFD94D│ &#B376E5du serveur."
          - "&#FFD94D└ &r&7%img_left_click% &fOuvrir"
        actions:
          left: ["[player] cmi ctext wiki", "[close]"]

      retour:
        material: itemsadder:influitems:btn_back
        name: "&#FFD94DRetour"
        slots: [85]
        lore:
          - "&#FFD94D│ &#B376E5Revenir au menu."
          - "&#FFD94D└ &r&7%img_left_click% &fMenu principal"
        actions:
          left: ["[page] main"]


  # ── Vote (calendrier de flamme, récompenses d'exemple) ────────────────
  vote:
    title: *extension_title
    animation: *extension
    # Chemin de progression (pack influroad) : 7 votes, branches vers les paliers.
    paths:
      flamme:
        slots: [55, 56, 57, 58, 59, 60, 61]
        branches: ["56 > 65", "58 > 67", "60 > 69"]
        progress: "%influbridge_flame_streak%"
        color: vert
    items:

      vote:
        material: itemsadder:influitems:vote
        glow: true
        name: "&#FFD94DVote"
        slots: [45]
        lore:
          - "&#FFD94D│ &#B376E5Ouvert."
          - "&#FFD94D└ &r&7%img_left_click% &fRefermer"
        actions:
          left: ["[page-toggle] vote"]

      # Rangée 1 : 7 jours de flamme. Jour atteint = coffre coché (priorité 1).
      jour1_ok:
        material: itemsadder:influitems:chest_checkmark
        priority: 1
        view-requirements:
          - "placeholder: %influbridge_flame_streak% >= 1"
        name: "&#FFD94DJour 1"
        slots: [55]
        lore:
          - "&#FFD94D│ &#B376E5Récompense : &f%img_bitblock% 100 BitBlock"
          - "&#FFD94D│ &#B376E5Débloquée."
          - "&#FFD94D└ &r&7%img_left_click% &fRécupérer"
        actions:
          left: ["[player] voteclaims"]

      jour1:
        material: itemsadder:influitems:chest
        priority: 2
        name: "&#FFD94DJour 1"
        slots: [55]
        lore:
          - "&#FFD94D│ &#B376E5Récompense : &f%img_bitblock% 100 BitBlock"
          - "&#FFD94D│ &#B376E5Vote 1 jour(s) de suite."
          - "&#FFD94D└ &r&7%img_left_click% &fVoter"
        actions:
          left: ["[player] vote", "[close]"]

      jour2_ok:
        material: itemsadder:influitems:chest_checkmark
        priority: 1
        view-requirements:
          - "placeholder: %influbridge_flame_streak% >= 2"
        name: "&#FFD94DJour 2"
        slots: [56]
        lore:
          - "&#FFD94D│ &#B376E5Récompense : &f1 clé Ordinaire"
          - "&#FFD94D│ &#B376E5Débloquée."
          - "&#FFD94D└ &r&7%img_left_click% &fRécupérer"
        actions:
          left: ["[player] voteclaims"]

      jour2:
        material: itemsadder:influitems:chest
        priority: 2
        name: "&#FFD94DJour 2"
        slots: [56]
        lore:
          - "&#FFD94D│ &#B376E5Récompense : &f1 clé Ordinaire"
          - "&#FFD94D│ &#B376E5Vote 2 jour(s) de suite."
          - "&#FFD94D└ &r&7%img_left_click% &fVoter"
        actions:
          left: ["[player] vote", "[close]"]

      jour3_ok:
        material: itemsadder:influitems:chest_checkmark
        priority: 1
        view-requirements:
          - "placeholder: %influbridge_flame_streak% >= 3"
        name: "&#FFD94DJour 3"
        slots: [57]
        lore:
          - "&#FFD94D│ &#B376E5Récompense : &f%img_bitblock% 250 BitBlock"
          - "&#FFD94D│ &#B376E5Débloquée."
          - "&#FFD94D└ &r&7%img_left_click% &fRécupérer"
        actions:
          left: ["[player] voteclaims"]

      jour3:
        material: itemsadder:influitems:chest
        priority: 2
        name: "&#FFD94DJour 3"
        slots: [57]
        lore:
          - "&#FFD94D│ &#B376E5Récompense : &f%img_bitblock% 250 BitBlock"
