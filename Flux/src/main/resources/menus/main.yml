# ─────────────────────────────────────────────────────────────────────────────
# Menu principal (test FluxMenu), ouvert par /menu2. Identifiant = main.
# Version minimaliste : fond panneau violet (influmenu:menu2), objets vanilla.
#
# Cases : 0-53 = coffre (6 rangées). En player-inventory: hidden, on continue dans
# la zone de l'inventaire du joueur : 54-80 = ses 3 rangées, 81-89 = barre d'action.
#
# Disposition (centrée) :
#   coffre rangée 4 : 28 à 34, 7 fonctionnalités, Profil au centre
#   coffre rangée 6 : Vote 45, Parrainage 46, Classement 47, Récompenses 51, Pass 52, Autre 53
#   (Autre = Paramètres au clic gauche, Aide au clic droit)
#   inventaire du joueur : masqué, aucun bouton
# ─────────────────────────────────────────────────────────────────────────────

title: ":offset_-8::menu2_anim_1:"
rows: 6
commands: [menu2]

# hidden      : inventaire du joueur masqué (seuls nos boutons s'affichent en bas)
# visible     : inventaire affiché mais figé (comportement DeluxeMenus)
# interactive : inventaire affiché, le joueur peut ranger ses objets
player-inventory: hidden

# Fond de coffre : false = transparent (seule l'image du titre s'affiche, le fond
# vanilla est caché), true = fond de coffre habituel sous l'image.
vanilla-background: false

# Rafraîchissement des placeholders et conditions, en ticks (0 = jamais).
update-interval: 20

open-actions:
  - "[sound] @page"

items:

  # ── Fonctionnalités : rangée 4 du coffre (cases 28 à 34) ────────────────

  carrieres:
    material: DIAMOND_PICKAXE
    flags: [HIDE_ATTRIBUTES]
    name: "&#FFD94DCarrières"
    slots: [28]
    lore:
      - "@desc Choisis tes métiers et suis ta progression."
      - "@left Ouvrir"
    actions:
      left: ["[menu] metiers"]

  quetes:
    material: WRITABLE_BOOK
    name: "&#FFD94DQuêtes"
    slots: [29]
    lore:
      - "@desc Suis la quête de ton rang."
      - "@left Suivre"
      - "@right Arrêter le suivi"
    actions:
      left:
        - "[console] tw quest track quest_%luckperms_primary_group_name% %player_name%"
        - "[close]"
      right:
        - "[console] tw quest untrack %player_name%"
        - "[close]"

  succes:
    material: NETHER_STAR
    name: "&#FFD94DSuccès"
    slots: [30]
    lore:
      - "@desc Débloque des succès et gagne des &f%img_impact% <base>Couronnes."
      - "@left Voir mes succès"
    actions:
      left: ["[menu] collection"]

  profil:
    material: player-head
    name: "&#FFD94DProfil"
    slots: [31]
    lore:
      - "@kv Rang | %luckperms_primary_group_name%"
      - "@desc Tes monnaies, tes classements et ton activité."
      - "@left Voir mon profil"
    actions:
      left: ["[player] profil"]

  mondes:
    material: COMPASS
    name: "&#FFD94DMondes"
    slots: [32]
    lore:
      - "@desc Voyage entre les différents mondes."
      - "@left Explorer"
    actions:
      left: ["[menu] mondes"]

  # Menus Villes et Pays d'InfluLands (Lands, warps InfluPW, échoppes InfluEchoppe),
  # générés par assets/ville/gen_menus_ville.py. Clic gauche : accueil partagé
  # Villes et Pays ; raccourcis directs vers Ma ville, l'Agence et Mon pays.
  ville:
    material: "itemsadder:influville:ville"
    name: "&#FFD94DVille et Pays"
    slots: [33]
    lore:
      - "@desc Gère ta ville, ton pays, et explore ceux des autres."
      - "@left Villes et Pays"
      - "@right Ma ville"
      - "@shift-left Agence (locations et ventes)"
      - "@shift-right Mon pays"
    actions:
      left: ["[menu] territoires"]
      right: ["[player] influlands ouvrir ville"]
      shift-left: ["[player] influlands ouvrir agence depuis:territoires"]
      shift-right: ["[player] influlands ouvrir pays"]

  familiers:
    material: BONE
    name: "&#FFD94DFamiliers"
    slots: [34]
    lore:
      - "@desc Consulte et choisis tes compagnons."
      - "@left Mes familiers"
    actions:
      left: ["[menu] familiers"]

  # Marché d'InfluMarche : hôtel des ventes (AuctionHouse) et échoppes des villes
  # (InfluEchoppe) réunis, menus générés par assets/marche/gen_menus_marche.py.
  marche:
    material: "itemsadder:influmarche:marche"
    name: "&#FFD94DMarché"
    slots: [40]
    lore:
      - "@desc Hôtel des ventes et échoppes des villes : achète, vends, compare les prix."
      - "@left Ouvrir le marché"
      - "@right Mes ventes"
      - "@shift-left Vendre un objet"
    actions:
      left: ["[player] influmarche ouvrir marche"]
      right: ["[player] influmarche ouvrir ventes"]
      shift-left: ["[player] influmarche ouvrir vendre"]

  casino:
    material: "itemsadder:influcasino:jeton"
    name: "&#FFD94DCasino"
    slots: [49]
    lore:
      - "@desc Plinko et bientôt d'autres jeux, avec des jetons échangeables contre des Bitblock."
      - "@left Ouvrir le casino"
    actions:
      left: ["[menu] casino"]

  # ── Boutons utilitaires : rangée 6 du coffre ────────────────────────────
  # Vote 45, Parrainage 46, Classement 47, Récompenses 51, Aide 52, Paramètres 53.

  rangs:
    material: "itemsadder:influitems:stairs"
    name: "&#FFD94DRangs"
    slots: [48]
    lore:
      - "@desc Les 12 rangs, leurs avantages et les coffres de palier."
      - "@kv Ton rang | %grades_rank%"
      - "@left Ouvrir"
    actions:
      left: ["[menu] grades"]

  # >>> gen_pages (boutons générés par assets/gen_pages.py)

  parrainage_1:
    material: "itemsadder:influitems:referral"
    priority: 1
    view-requirements:
      - "placeholder: %parrainage_filleuls% < 7"
    name: "&#FFD94DParrainage"
    slots: [46]
    lore:
      - "@desc Invite tes amis avec ton adresse perso."
      - "@kv Filleuls | %parrainage_filleuls%"
      - "@kv À récupérer | %parrainage_a_recuperer%"
      - "@left Ouvrir"
    actions:
      left: ["[page-toggle] parrainage_1"]

  parrainage_2:
    material: "itemsadder:influitems:referral"
    priority: 2
    view-requirements:
      - "placeholder: %parrainage_filleuls% < 14"
    name: "&#FFD94DParrainage"
    slots: [46]
    lore:
      - "@desc Invite tes amis avec ton adresse perso."
      - "@kv Filleuls | %parrainage_filleuls%"
      - "@kv À récupérer | %parrainage_a_recuperer%"
      - "@left Ouvrir"
    actions:
      left: ["[page-toggle] parrainage_2"]

  parrainage_3:
    material: "itemsadder:influitems:referral"
    priority: 3
    view-requirements:
      - "placeholder: %parrainage_filleuls% < 21"
    name: "&#FFD94DParrainage"
    slots: [46]
    lore:
      - "@desc Invite tes amis avec ton adresse perso."
      - "@kv Filleuls | %parrainage_filleuls%"
      - "@kv À récupérer | %parrainage_a_recuperer%"
      - "@left Ouvrir"
    actions:
      left: ["[page-toggle] parrainage_3"]

  parrainage_4:
    material: "itemsadder:influitems:referral"
    priority: 4
    name: "&#FFD94DParrainage"
    slots: [46]
    lore:
      - "@desc Invite tes amis avec ton adresse perso."
      - "@kv Filleuls | %parrainage_filleuls%"
      - "@kv À récupérer | %parrainage_a_recuperer%"
      - "@left Ouvrir"
    actions:
      left: ["[page-toggle] parrainage_4"]

  pass:
    material: "itemsadder:influitems:pass"
    name: "&#FFD94DPass"
    slots: [52]
    lore:
      - "@desc Palier &f%ecobattlepass_tier_pass%<base>, récompenses Standard et Prestige."
      - "@left Ouvrir"
    actions:
      left: ["[menu] pass"]

  recompense:
    material: "itemsadder:influitems:reward"
    name: "&#FFD94DRécompenses"
    slots: [51]
    lore:
      - "@kv En attente | %flux_rewards_count%"
      - "@kv Jour de connexion | %recompenses_jour%&7/&f%recompenses_cycle%"
      - "@left Ouvrir"
    actions:
      left: ["[menu] rewards"]

  vote:
    material: "itemsadder:influitems:vote"
    name: "&#FFD94DVote"
    slots: [45]
    lore:
      - "@desc Vote et gagne des tickets pour la tombola."
      - "@left Tombola"
      - "@right Mes lots"
    actions:
      left: ["[page-toggle] vote"]
      right: ["[player] voteclaims"]

  # <<< gen_pages

  classement:
    material: itemsadder:influitems:leaderboard
    name: "&#FFD94DClassement"
    slots: [47]
    lore:
      - "@desc Les meilleurs joueurs de chaque carrière."
      - "@left Voir le podium"
    actions:
      left: ["[page-toggle] classement"]

  autre:
    material: itemsadder:influitems:unknown
    name: "&#FFD94DAutre"
    slots: [53]
    lore:
      - "@desc Réglages et liens utiles."
      - "@left Paramètres"
      - "@right Aide"
    actions:
      left: ["[page-toggle] parametres"]
      right: ["[page-toggle] aide"]

# ── Pages : même fenêtre, nouveau fond + boutons en plus ───────────────────
# Chaque bouton du bas ouvre sa page ([page-toggle] <id>) : animation du panneau
# qui s'agrandit, puis boutons de la page dans la zone de l'inventaire (masqué).
# Re-cliquer referme (animation à l'envers) ; d'une page à l'autre, le panneau se
# replie puis se redéploie.
# Zone des pages : 54-62, 63-71, 72-80 (inventaire), 81-89 (barre d'action).
# Pages générées (parrainage, pass, récompenses, vote) : plugins/FluxMenu/assets/gen_pages.py
page-files:
  - _pages/parrainage.yml
  - _pages/vote.yml

pages:

  # ── Paramètres (réglages de /reglages) ────────────────────────────────
  parametres:
    title: &extension_title ":offset_-8::menu2_anim_5:"
    animation: &extension
      frames:
        - ":offset_-8::menu2_anim_2:"
        - ":offset_-8::menu2_anim_3:"
        - ":offset_-8::menu2_anim_4:"
      interval: 2   # ticks entre deux images
    items:

      autre:
        material: itemsadder:influitems:unknown
        glow: true
        hide-tooltip: true
        name: "&#FFD94DAutre"
        slots: [53]
        lore:
          - "@desc Paramètres ouverts."
          - "@left Refermer"
          - "@right Aide"
        actions:
          left: ["[page-toggle] parametres"]
          right: ["[page-toggle] aide"]

      # Rangée 1 : affichage du HUD (clic gauche active, clic droit désactive).
      hud_avatar:
        material: player-head
        name: "&#FFD94DAvatar (HUD)"
        slots: [64]
        lore:
          - "@desc Ta tête en haut de l'écran."
          - "@left Activer"
          - "@right Désactiver"
        actions:
          left: ["[console] hud layout %player_name% add influprofil-layout"]
          right: ["[console] hud layout %player_name% remove influprofil-layout"]

      hud_voteparty:
        material: NETHER_STAR
        name: "&#FFD94DVote Party (HUD)"
        slots: [65]
        lore:
          - "@desc Progression de la prochaine Vote Party."
          - "@left Activer"
          - "@right Désactiver"
        actions:
          left: ["[console] hud layout %player_name% add influvote-layout"]
          right: ["[console] hud layout %player_name% remove influvote-layout"]

      hud_position:
        material: COMPASS
        name: "&#FFD94DPosition (HUD)"
        slots: [66]
        lore:
          - "@desc Tes coordonnées à l'écran."
          - "@left Activer"
          - "@right Désactiver"
        actions:
          left: ["[console] hud layout %player_name% add influposition-layout"]
          right: ["[console] hud layout %player_name% remove influposition-layout"]

      hud_biome:
        material: GRASS_BLOCK
        name: "&#FFD94DBiome (HUD)"
        slots: [68]
        lore:
          - "@desc Le biome où tu te trouves."
          - "@left Activer"
          - "@right Désactiver"
        actions:
          left: ["[console] tw facts set is_biome 0 %player_name%"]
          right: ["[console] tw facts set is_biome 1 %player_name%"]

      hud_ville:
        material: BRICKS
        name: "&#FFD94DVille (HUD)"
        slots: [69]
        lore:
          - "@desc La ville où tu te trouves."
          - "@left Activer"
          - "@right Désactiver"
        actions:
          left: ["[console] tw facts set is_ville 0 %player_name%"]
          right: ["[console] tw facts set is_ville 1 %player_name%"]

      hud_clearlag:
        material: CLOCK
        name: "&#FFD94DClearLag (HUD)"
        slots: [70]
        lore:
          - "@desc Le prochain nettoyage des objets au sol."
          - "@left Activer"
          - "@right Désactiver"
        actions:
          left: ["[console] hud layout %player_name% add influclearlag-layout"]
          right: ["[console] hud layout %player_name% remove influclearlag-layout"]

      # Rangée 2 : options de jeu.
      opt_votenotif:
        material: WRITABLE_BOOK
        name: "&#FFD94DNotifications de vote"
        slots: [74]
        lore:
          - "@desc Rappel quand tu peux revoter."
          - "@left Activer"
          - "@right Désactiver"
        actions:
          left: ["[player] votenotif on"]
          right: ["[player] votenotif off"]

      opt_chatgames:
        material: BOOK
        name: "&#FFD94DJeux du tchat"
        slots: [75]
        lore:
          - "@desc Participe aux jeux proposés dans le tchat."
          - "@left Activer"
          - "@right Désactiver"
        actions:
          left: ["[player] chatgames toggle"]
          right: ["[player] chatgames toggle"]

      opt_tp:
        material: ENDER_PEARL
        name: "&#FFD94DTéléportation"
        slots: [77]
        lore:
          - "@desc Autorise les demandes de téléportation."
          - "@left Activer"
          - "@right Désactiver"
        actions:
          left: ["[console] cmi options tp true %player_name% -s"]
          right: ["[console] cmi options tp false %player_name% -s"]

      opt_msg:
        material: PAPER
        name: "&#FFD94DMessages privés"
        slots: [78]
        lore:
          - "@desc Autorise les messages privés des joueurs."
          - "@left Activer"
          - "@right Désactiver"
        actions:
          left: ["[console] cmi options msg true %player_name% -s"]
          right: ["[console] cmi options msg false %player_name% -s"]

      retour:
        material: itemsadder:influitems:settings
        glow: true
        name: "&#FFD94DParamètres"
        slots: [58]
        lore:
          - "@desc Choisis ce qui s'affiche à l'écran et règle tes options de jeu."

      # Barre d'action : passer directement à la page Aide.
      vers_aide:
        material: itemsadder:influitems:unknown
        name: "&#FFD94DAide"
        slots: [85]
        lore:
          - "@desc Discord, règlement, wiki."
          - "@left Ouvrir"
        actions:
          left: ["[page-swap] aide", "[sound] @page"]

  # ── Aide (Discord) ────────────────────────────────────────────────────
  aide:
    title: *extension_title
    animation: *extension
    items:

      autre:
        material: itemsadder:influitems:unknown
        glow: true
        hide-tooltip: true
        name: "&#FFD94DAutre"
        slots: [53]
        lore:
          - "@desc Aide ouverte."
          - "@left Paramètres"
          - "@right Refermer"
        actions:
          left: ["[page-toggle] parametres"]
          right: ["[page-toggle] aide"]

      discord:
        material: LAPIS_LAZULI
        name: "&#FFD94DRejoindre le Discord"
        slots: [65]
        lore:
          - "@desc Annonces, entraide et vocal."
          - "@left Recevoir le lien"
        actions:
          left: ["[player] discord", "[close]"]

      lier:
        material: TRIPWIRE_HOOK
        name: "&#FFD94DLier mon compte"
        slots: [66]
        lore:
          - "@desc Relie ton compte Minecraft à Discord."
          - "@left Lier"
        actions:
          left: ["[player] discord link", "[close]"]

      ticket:
        material: NAME_TAG
        name: "&#FFD94DOuvrir un ticket"
        slots: [67]
        lore:
          - "@desc Un souci ? Le staff te répond sur Discord."
          - "@left Comment faire"
        actions:
          left: ["[message] &#FFD94D&lAide &8► &#B376E5Ouvre un ticket dans le salon &f#tickets &#B376E5du Discord."]

      regles:
        material: WRITABLE_BOOK
        name: "&#FFD94DRèglement"
        slots: [68]
        lore:
          - "@desc Les règles du serveur."
          - "@left Lire"
        actions:
          left: ["[player] regles", "[close]"]

      wiki:
        material: KNOWLEDGE_BOOK
        name: "&#FFD94DWiki"
        slots: [69]
        lore:
          - "@desc Toute la documentation du serveur."
          - "@left Ouvrir"
        actions:
          left: ["[player] cmi ctext wiki", "[close]"]

      retour:
        material: itemsadder:influitems:unknown
        glow: true
        name: "&#FFD94DAide"
        slots: [58]
        lore:
          - "@desc Une question ? Le Discord, le règlement et le wiki sont là pour t'aider."

      # Barre d'action : passer directement à la page Paramètres.
      vers_parametres:
        material: itemsadder:influitems:settings
        name: "&#FFD94DParamètres"
        slots: [85]
        lore:
          - "@desc Affichage et options de jeu."
          - "@left Ouvrir"
        actions:
          left: ["[page-swap] parametres", "[sound] @page"]

  # ── Vote (calendrier de flamme, récompenses d'exemple) ────────────────


  # ── Parrainage (paliers d'exemple) ────────────────────────────────────


  # ── Classement (podiums d'exemple) ────────────────────────────────────
  classement:
    title: *extension_title
    animation: *extension
    items:

      classement:
        material: itemsadder:influitems:leaderboard
        glow: true
        hide-tooltip: true
        name: "&#FFD94DClassement"
        slots: [47]
        lore:
          - "@desc Ouvert."
          - "@left Refermer"
        actions:
          left: ["[page-toggle] classement"]

      top_carrieres:
