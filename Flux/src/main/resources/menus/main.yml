          - "&#FFD94D└ &r&7%img_left_click% &fRécupérer"
        actions:
          left: ["[player] voteclaims"]

      jour4:
        material: itemsadder:influitems:chest
        priority: 2
        name: "&#FFD94DJour 4"
        slots: [58]
        lore:
          - "&#FFD94D│ &#B376E5Récompense : &#55FF551 clé Tendance"
          - "&#FFD94D│ &#B376E5Vote 4 jour(s) de suite."
          - "&#FFD94D└ &r&7%img_left_click% &fVoter"
        actions:
          left: ["[player] vote", "[close]"]

      jour5_ok:
        material: itemsadder:influitems:chest_checkmark
        priority: 1
        view-requirements:
          - "placeholder: %influbridge_flame_streak% >= 5"
        name: "&#FFD94DJour 5"
        slots: [59]
        lore:
          - "&#FFD94D│ &#B376E5Récompense : &f%img_bitblock% 500 BitBlock"
          - "&#FFD94D│ &#B376E5Débloquée."
          - "&#FFD94D└ &r&7%img_left_click% &fRécupérer"
        actions:
          left: ["[player] voteclaims"]

      jour5:
        material: itemsadder:influitems:chest
        priority: 2
        name: "&#FFD94DJour 5"
