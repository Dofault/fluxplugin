# ─────────────────────────────────────────────────────────────────────────────
# Menu principal (test FluxMenu), ouvert par /menu2. Identifiant = main.
# Version minimaliste : fond panneau violet (influmenu:menu2), objets vanilla.
#
# Cases : 0-53 = coffre (6 rangées). En player-inventory: hidden, on continue dans
# la zone de l'inventaire du joueur : 54-80 = ses 3 rangées, 81-89 = barre d'action.
#
# Disposition (centrée) :
#   Thème vanilla (2026-10-30, theme.menus.main de la config de Flux) : rangée 1 = tableau de bord (tête = profil
#   en 9, pseudo : widget, bouton Compte en 17 : soldes et historique), fonctionnalités en carré 3 x 3 centré (21-23, 30-32, 39-41)
#   coffre rangée 6 : Vote 45, Parrainage 46, Classement 47, Rangs 48, Casino 49, Récompenses 51 (calendrier au clic droit),
#   Pass 52, Autre 53
#   (Autre = fenêtre des paramètres au clic gauche, fenêtre d'aide au clic droit : Flux, settings.yml et help.yml)
#   inventaire du joueur : masqué, aucun bouton
# ─────────────────────────────────────────────────────────────────────────────

title: ":offset_-8::menu2_anim_1:"
rows: 6
commands: [menu2]

# hidden      : inventaire du joueur masqué (seuls nos boutons s'affichent en bas)
# visible     : inventaire affiché mais figé (comportement DeluxeMenus)
# interactive : inventaire affiché, le joueur peut ranger ses objets
player-inventory: hidden

# Fond de coffre : false = transparent (seule l'image du titre s'affiche, le fond
# vanilla est caché), true = fond de coffre habituel sous l'image.
vanilla-background: false

# Rafraîchissement des placeholders et conditions, en ticks (0 = jamais).
update-interval: 20

open-actions:
  - "[sound] @page"

# Bouton Compte (2026-10-30), dernière case de la rangée du profil : soldes de chaque monnaie, construit par Flux
# (liste account_button), ouvre l'historique des gains et dépenses (/compte).
lists:
  account_button:
    slots: 17
    item:
      material: entry
      actions:
        left: ["[player] compte"]

items:

  # ── Fonctionnalités : rangée 4 du coffre (cases 28 à 34) ────────────────

  carrieres:
    material: DIAMOND_PICKAXE
    flags: [HIDE_ATTRIBUTES]
    name: "&#FFD94DCarrières"
    slots: [21]
    lore:
      - "@desc Choisis tes métiers et suis ta progression."
      - "@left Ouvrir"
    actions:
      left: ["[menu] metiers"]

  quetes:
    material: WRITABLE_BOOK
    name: "&#FFD94DQuêtes"
    slots: [22]
    lore:
      - "@desc Suis la quête de ton rang."
      - "@left Suivre"
      - "@right Arrêter le suivi"
    actions:
      left:
        - "[console] tw quest track quest_%luckperms_primary_group_name% %player_name%"
        - "[close]"
      right:
        - "[console] tw quest untrack %player_name%"
        - "[close]"

  collections:
    material: NETHER_STAR
    name: "&#FFD94DCollections"
    slots: [23]
    lore:
      - "@desc Complète des collections et gagne des &f%img_impact% <base>Couronnes."
      - "@left Voir mes collections"
    actions:
      left: ["[menu] collection"]

  profil:
    material: player-head
    name: "&#FFD94DProfil"
    slots: [9]
    lore:
      - "@kv Rang | %luckperms_primary_group_name%"
      - "@desc Tes monnaies, tes classements et ton activité."
      - "@left Voir mon profil"
    actions:
      left: ["[player] profil"]

  mondes:
    material: COMPASS
    name: "&#FFD94DMondes"
    slots: [30]
    lore:
      - "@desc Voyage entre les différents mondes."
      - "@left Explorer"
    actions:
      left: ["[menu] mondes"]

  # Menus Villes et Pays de FluxLands (Lands, warps FluxPW, échoppes FluxCommerce),
  # générés par assets/ville/gen_menus_ville.py. Clic gauche : accueil partagé
  # Villes et Pays ; raccourcis directs vers Ma ville, l'Agence et Mon pays.
  ville:
    material: "itemsadder:influville:ville"
    name: "&#FFD94DVille et Pays"
    slots: [31]
    lore:
      - "@desc Gère ta ville, ton pays, et explore ceux des autres."
      - "@left Villes et Pays"
      - "@right Ma ville"
      - "@shift-left Agence (locations et ventes)"
      - "@shift-right Mon pays"
    actions:
      left: ["[menu] territoires"]
      right: ["[player] fluxlands ouvrir ville"]
      shift-left: ["[player] fluxlands ouvrir agence depuis:territoires"]
      shift-right: ["[player] fluxlands ouvrir pays"]

  familiers:
    material: BONE
    name: "&#FFD94DFamiliers"
    slots: [32]
    lore:
      - "@desc Consulte et choisis tes compagnons."
      - "@left Mes familiers"
    actions:
      left: ["[menu] familiers"]

  # Marché de FluxCommerce : hôtel des ventes et échoppes des villes réunis (menus livrés par FluxCommerce).
  marche:
    material: "itemsadder:influmarche:marche"
    name: "&#FFD94DMarché"
    slots: [39]
    lore:
      - "@desc Hôtel des ventes et échoppes des villes : achète, vends, compare les prix."
      - "@left Ouvrir le marché"
      - "@right Mes ventes"
      - "@shift-left Vendre un objet"
    actions:
      left: ["[hdv] open market"]
      right: ["[hdv] open listings"]
      shift-left: ["[hdv] open sell"]

  casino:
    material: "itemsadder:influcasino:jeton"
    name: "&#FFD94DCasino"
    slots: [41]
    lore:
      - "@desc Plinko et bientôt d'autres jeux, avec des jetons échangeables contre des Bitblock."
      - "@left Ouvrir le casino"
    actions:
      left: ["[menu] casino"]

  # ── Boutons utilitaires : rangée 6 du coffre ────────────────────────────
  # Vote 45, Parrainage 46, Classement 47, Récompenses 51, Aide 52, Paramètres 53.

  rangs:
    material: "itemsadder:influitems:stairs"
    name: "&#FFD94DRangs"
    slots: [40]
    lore:
      - "@desc Les 12 rangs, leurs avantages et les coffres de palier."
      - "@kv Ton rang | %grades_rank%"
      - "@left Ouvrir"
    actions:
      left: ["[menu] grades"]


  tags:
    material: NAME_TAG
    name: "&#FFD94DTags"
    slots: [49]
    lore:
      - "@desc Choisis le tag affiché à côté de ton pseudo."
      - "@left Ouvrir"
    actions:
      left: ["[menu] tags"]
  # >>> gen_pages (boutons générés par assets/gen_pages.py)

  parrainage:
    material: "itemsadder:influitems:referral"
    name: "&#FFD94DParrainage"
    slots: [46]
    lore:
      - "@desc Invite tes amis avec ton adresse perso."
      - "@kv Filleuls | %parrainage_filleuls%"
      - "@kv À récupérer | %parrainage_a_recuperer%"
      - "@left Ouvrir"
    actions:
      left: ["[menu] parrainage"]

  pass:
    material: "itemsadder:influitems:pass"
    name: "&#FFD94DPass"
    slots: [52]
    lore:
      - "@desc Palier &f%ecobattlepass_tier_pass%<base>, récompenses Standard et Prestige."
      - "@left Ouvrir"
    actions:
      left: ["[menu] pass"]

  recompense:
    material: "itemsadder:influitems:reward"
    name: "&#FFD94DRécompenses"
    slots: [51]
    lore:
      - "@kv En attente | %flux_rewards_count%"
      - "@left Ouvrir"
      - "@right Calendrier"
    actions:
      left: ["[menu] rewards"]
      right: ["[menu] calendrier"]

  vote:
    material: "itemsadder:influitems:vote"
    name: "&#FFD94DVote"
    slots: [45]
    lore:
      - "@desc Vote et gagne des tickets pour la tombola."
      - "@left Tombola"
      - "@right Mes lots"
    actions:
      left: ["[menu] vote"]
      right: ["[player] voteclaims"]

  # <<< gen_pages

  classement:
    material: itemsadder:influitems:leaderboard
    name: "&#FFD94DClassement"
    slots: [47]
    lore:
      - "@desc Les meilleurs joueurs de chaque carrière."
      - "@left Voir le podium"
    actions:
      left: ["[menu] classement"]

  autre:
    material: itemsadder:influitems:unknown
    name: "&#FFD94DAutre"
    slots: [53]
    lore:
      - "@desc Réglages et liens utiles."
      - "@left Paramètres"
      - "@right Aide"
    actions:
      left: ["[player] parametres"]
      right: ["[player] aide"]

# Plus de tiroirs depuis le 2026-10-30 : vote, classement et parrainage ont chacun leur menu (vote.yml,
# classement.yml, parrainage.yml).

# Tableau de bord de la rangée 1 : tête (profil) en 9 et pseudo à sa droite, solde abrégé et bouton Compte en 17 en miroir.
widgets:
  pseudo:
    type: text
    ink: true
    x: 28
    y: 41
    text: "%player_name%"
  # solde en abrégé (80M), calé à droite contre le bouton Compte (case 17, x 152) : même écart de 4 px que le
  # pseudo avec la tête (case 9 finit à 24, pseudo à 28), le dernier pixel tombe en 147
  solde:
    type: text
    ink: true
    x: 148
    y: 41
    align: right
    text: "%flux_balance_vault_short%"
