# ─────────────────────────────────────────────────────────────────────────────
# Menu principal (test FluxMenu), ouvert par /menu2. Identifiant = main.
# Version minimaliste : fond panneau violet (influmenu:menu2), objets vanilla.
#
# Cases : 0-53 = coffre (6 rangées). En player-inventory: hidden, on continue dans
# la zone de l'inventaire du joueur : 54-80 = ses 3 rangées, 81-89 = barre d'action.
#
# Disposition (centrée) :
#   coffre rangée 4 : 28 à 34, 7 fonctionnalités, Profil au centre
#   coffre rangée 6 : Vote 45, Parrainage 46, Classement 47, Rangs 48, Casino 49, Calendrier 50, Récompenses 51,
#   Pass 52, Autre 53
#   (Autre = fenêtre des paramètres au clic gauche, fenêtre d'aide au clic droit : Flux, settings.yml et help.yml)
#   inventaire du joueur : masqué, aucun bouton
# ─────────────────────────────────────────────────────────────────────────────

title: ":offset_-8::menu2_anim_1:"
rows: 6
commands: [menu2]

# hidden      : inventaire du joueur masqué (seuls nos boutons s'affichent en bas)
# visible     : inventaire affiché mais figé (comportement DeluxeMenus)
# interactive : inventaire affiché, le joueur peut ranger ses objets
player-inventory: hidden

# Fond de coffre : false = transparent (seule l'image du titre s'affiche, le fond
# vanilla est caché), true = fond de coffre habituel sous l'image.
vanilla-background: false

# Rafraîchissement des placeholders et conditions, en ticks (0 = jamais).
update-interval: 20

open-actions:
  - "[sound] @page"

items:

  # ── Fonctionnalités : rangée 4 du coffre (cases 28 à 34) ────────────────

  carrieres:
    material: DIAMOND_PICKAXE
    flags: [HIDE_ATTRIBUTES]
    name: "&#FFD94DCarrières"
    slots: [28]
    lore:
      - "@desc Choisis tes métiers et suis ta progression."
      - "@left Ouvrir"
    actions:
      left: ["[menu] metiers"]

  quetes:
    material: WRITABLE_BOOK
    name: "&#FFD94DQuêtes"
    slots: [29]
    lore:
      - "@desc Suis la quête de ton rang."
      - "@left Suivre"
      - "@right Arrêter le suivi"
    actions:
      left:
        - "[console] tw quest track quest_%luckperms_primary_group_name% %player_name%"
        - "[close]"
      right:
        - "[console] tw quest untrack %player_name%"
        - "[close]"

  collections:
    material: NETHER_STAR
    name: "&#FFD94DCollections"
    slots: [30]
    lore:
      - "@desc Complète des collections et gagne des &f%img_impact% <base>Couronnes."
      - "@left Voir mes collections"
    actions:
      left: ["[menu] collection"]

  profil:
    material: player-head
    name: "&#FFD94DProfil"
    slots: [31]
    lore:
      - "@kv Rang | %luckperms_primary_group_name%"
      - "@desc Tes monnaies, tes classements et ton activité."
      - "@left Voir mon profil"
    actions:
      left: ["[player] profil"]

  mondes:
    material: COMPASS
    name: "&#FFD94DMondes"
    slots: [32]
    lore:
      - "@desc Voyage entre les différents mondes."
      - "@left Explorer"
    actions:
      left: ["[menu] mondes"]

  # Menus Villes et Pays d'InfluLands (Lands, warps InfluPW, échoppes InfluEchoppe),
  # générés par assets/ville/gen_menus_ville.py. Clic gauche : accueil partagé
  # Villes et Pays ; raccourcis directs vers Ma ville, l'Agence et Mon pays.
  ville:
    material: "itemsadder:influville:ville"
    name: "&#FFD94DVille et Pays"
    slots: [33]
    lore:
      - "@desc Gère ta ville, ton pays, et explore ceux des autres."
      - "@left Villes et Pays"
      - "@right Ma ville"
      - "@shift-left Agence (locations et ventes)"
      - "@shift-right Mon pays"
    actions:
      left: ["[menu] territoires"]
      right: ["[player] influlands ouvrir ville"]
      shift-left: ["[player] influlands ouvrir agence depuis:territoires"]
      shift-right: ["[player] influlands ouvrir pays"]

  familiers:
    material: BONE
    name: "&#FFD94DFamiliers"
    slots: [34]
    lore:
      - "@desc Consulte et choisis tes compagnons."
      - "@left Mes familiers"
    actions:
      left: ["[menu] familiers"]

  # Marché d'InfluMarche : hôtel des ventes (AuctionHouse) et échoppes des villes
  # (InfluEchoppe) réunis, menus générés par assets/marche/gen_menus_marche.py.
  marche:
    material: "itemsadder:influmarche:marche"
    name: "&#FFD94DMarché"
    slots: [40]
    lore:
      - "@desc Hôtel des ventes et échoppes des villes : achète, vends, compare les prix."
      - "@left Ouvrir le marché"
      - "@right Mes ventes"
      - "@shift-left Vendre un objet"
    actions:
      left: ["[player] influmarche ouvrir marche"]
      right: ["[player] influmarche ouvrir ventes"]
      shift-left: ["[player] influmarche ouvrir vendre"]

  casino:
    material: "itemsadder:influcasino:jeton"
    name: "&#FFD94DCasino"
    slots: [49]
    lore:
      - "@desc Plinko et bientôt d'autres jeux, avec des jetons échangeables contre des Bitblock."
      - "@left Ouvrir le casino"
    actions:
      left: ["[menu] casino"]

  # ── Boutons utilitaires : rangée 6 du coffre ────────────────────────────
  # Vote 45, Parrainage 46, Classement 47, Récompenses 51, Aide 52, Paramètres 53.

  rangs:
    material: "itemsadder:influitems:stairs"
    name: "&#FFD94DRangs"
    slots: [48]
    lore:
      - "@desc Les 12 rangs, leurs avantages et les coffres de palier."
      - "@kv Ton rang | %grades_rank%"
      - "@left Ouvrir"
    actions:
      left: ["[menu] grades"]

  # >>> gen_pages (boutons générés par assets/gen_pages.py)

  parrainage_1:
    material: "itemsadder:influitems:referral"
    priority: 1
    view-requirements:
      - "placeholder: %parrainage_filleuls% < 7"
    name: "&#FFD94DParrainage"
    slots: [46]
    lore:
      - "@desc Invite tes amis avec ton adresse perso."
      - "@kv Filleuls | %parrainage_filleuls%"
      - "@kv À récupérer | %parrainage_a_recuperer%"
      - "@left Ouvrir"
    actions:
      left: ["[page-toggle] parrainage_1"]

  parrainage_2:
    material: "itemsadder:influitems:referral"
    priority: 2
    view-requirements:
      - "placeholder: %parrainage_filleuls% < 14"
    name: "&#FFD94DParrainage"
    slots: [46]
    lore:
      - "@desc Invite tes amis avec ton adresse perso."
      - "@kv Filleuls | %parrainage_filleuls%"
      - "@kv À récupérer | %parrainage_a_recuperer%"
      - "@left Ouvrir"
    actions:
      left: ["[page-toggle] parrainage_2"]

  parrainage_3:
    material: "itemsadder:influitems:referral"
    priority: 3
    view-requirements:
      - "placeholder: %parrainage_filleuls% < 21"
    name: "&#FFD94DParrainage"
    slots: [46]
    lore:
      - "@desc Invite tes amis avec ton adresse perso."
      - "@kv Filleuls | %parrainage_filleuls%"
      - "@kv À récupérer | %parrainage_a_recuperer%"
      - "@left Ouvrir"
    actions:
      left: ["[page-toggle] parrainage_3"]

  parrainage_4:
    material: "itemsadder:influitems:referral"
    priority: 4
    name: "&#FFD94DParrainage"
    slots: [46]
    lore:
      - "@desc Invite tes amis avec ton adresse perso."
      - "@kv Filleuls | %parrainage_filleuls%"
      - "@kv À récupérer | %parrainage_a_recuperer%"
      - "@left Ouvrir"
    actions:
      left: ["[page-toggle] parrainage_4"]

  pass:
    material: "itemsadder:influitems:pass"
    name: "&#FFD94DPass"
    slots: [52]
    lore:
      - "@desc Palier &f%ecobattlepass_tier_pass%<base>, récompenses Standard et Prestige."
      - "@left Ouvrir"
    actions:
      left: ["[menu] pass"]

  recompense:
    material: "itemsadder:influitems:reward"
    name: "&#FFD94DRécompenses"
    slots: [51]
    lore:
      - "@kv En attente | %flux_rewards_count%"
      - "@left Ouvrir"
    actions:
      left: ["[menu] rewards"]

  calendrier:
    material: "itemsadder:fluxcalendar:jour_cadeau"
    name: "&#FFD94DCalendrier"
    slots: [50]
    lore:
      - "@desc Une récompense par jour du mois : clique sur la date du jour pour la récupérer."
      - "@kv Ce mois-ci | %fluxcalendar_recuperes%&7/&f%fluxcalendar_jours_mois%"
      - "@left Ouvrir"
    actions:
      left: ["[menu] calendrier"]

  vote:
    material: "itemsadder:influitems:vote"
    name: "&#FFD94DVote"
    slots: [45]
    lore:
      - "@desc Vote et gagne des tickets pour la tombola."
      - "@left Tombola"
      - "@right Mes lots"
    actions:
      left: ["[page-toggle] vote"]
      right: ["[player] voteclaims"]

  # <<< gen_pages

  classement:
    material: itemsadder:influitems:leaderboard
    name: "&#FFD94DClassement"
    slots: [47]
    lore:
      - "@desc Les meilleurs joueurs de chaque carrière."
      - "@left Voir le podium"
    actions:
      left: ["[page-toggle] classement"]

  autre:
    material: itemsadder:influitems:unknown
    name: "&#FFD94DAutre"
    slots: [53]
    lore:
      - "@desc Réglages et liens utiles."
      - "@left Paramètres"
      - "@right Aide"
    actions:
      left: ["[player] parametres"]
      right: ["[player] aide"]

# ── Pages : même fenêtre, nouveau fond + boutons en plus ───────────────────
# Chaque bouton du bas ouvre sa page ([page-toggle] <id>) : animation du panneau
# qui s'agrandit, puis boutons de la page dans la zone de l'inventaire (masqué).
# Re-cliquer referme (animation à l'envers) ; d'une page à l'autre, le panneau se
# replie puis se redéploie.
# Zone des pages : 54-62, 63-71, 72-80 (inventaire), 81-89 (barre d'action).
# Pages générées (parrainage, pass, récompenses, vote) : plugins/FluxMenu/assets/gen_pages.py
page-files:
  - _pages/parrainage.yml
  - _pages/vote.yml

pages:

  classement:
    title: &extension_title ":offset_-8::menu2_anim_5:"
    animation: &extension
      frames:
        - ":offset_-8::menu2_anim_2:"
        - ":offset_-8::menu2_anim_3:"
        - ":offset_-8::menu2_anim_4:"
      interval: 2   # ticks entre deux images
    items:

      classement:
        material: itemsadder:influitems:leaderboard
        glow: true
        hide-tooltip: true
        name: "&#FFD94DClassement"
        slots: [47]
        lore:
          - "@desc Ouvert."
          - "@left Refermer"
        actions:
          left: ["[page-toggle] classement"]

