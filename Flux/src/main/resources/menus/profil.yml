# Profile menu (/profil [player]): a player card. Vanilla theme background bg_profil (Flux/assets/vanilla/gen_ui.py), the
# shown player's name between back (18) and menu icon (26) (widget of theme.menus.profil in Flux's config). Photo of 3 x 3
# slots: the shown player's bust (list profile_bust: left arm, torso, right arm, head in slots 36, 37, 38, 46; models
# profile.bust-model of Flux's config + part, Flux/assets/buste/gen_buste.py).
# Above the sections, the shown player's rank tag drawn in the title (%fluxtags_profile%, FluxTags). Sections (list profile, slots 40-43 and 49-52): given by the plugins of the
# suite (economy, leaderboards, jobs, statistics in Flux; town, collection, pets, tags in their plugins).
title: ":offset_-8::menu_profil::offset_-177:%fluxtags_profile%"
rows: 6
player-inventory: hidden
vanilla-background: false
update-interval: 40

open-actions:
  - "[sound] @page"

lists:
  profile_bust:
    slots: 36,37,38,46
    item:
      material: entry
  profile:
    slots: 40,41,42,43,49,50,51,52
    item:
      material: entry
      actions:
        left: ["[profile] left %entry_id%", "[refresh]"]
        right: ["[profile] right %entry_id%", "[refresh]"]

items:
  retour:
    material: "itemsadder:influitems:btn_back"
    name: "Retour"
    slots: [18]
    lore:
      - "@left Menu principal"
    actions:
      left: ["[menu] main"]

  icone:
    material: "itemsadder:influitems:referral"
    name: "Profil de %flux_profile_name%"
    slots: [26]
    lore:
      - "@desc Le résumé d'un joueur : ses monnaies, sa place dans les classements, ses métiers et ses statistiques."
      - "@info Voir un autre joueur : /profil <pseudo>"
