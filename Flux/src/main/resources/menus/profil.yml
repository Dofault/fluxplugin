  combat:
    material: IRON_SWORD
    name: "Combats"
    slots: [50]
    flags: [HIDE_ATTRIBUTES]
    lore:
      - "@kv Monstres vaincus | %statistic_mob_kills%"
      - "@kv Joueurs vaincus | %statistic_player_kills%"
