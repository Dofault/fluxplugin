  votes:
    material: "itemsadder:influitems:vote"
    name: "Votes"
    slots: [52]
    lore:
      - "@kv Série | %influbridge_flame_streak% j"
      - "@kv Palier | %influbridge_flame_tier%"

  rangs:
    material: "itemsadder:influitems:stairs"
    name: "Rangs"
    slots: [55]
