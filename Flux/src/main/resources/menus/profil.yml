# Profile menu (/profil [player]): a passport. Background influmenu:menu_profil (Flux/assets/profil/gen_fond.py).
# Row 0: back (0), menu icon (8). Photo: the shown player's head, a big item model (list profile_head, slot 19, model
# profile.head-model of Flux's config). Sections (list profile, slots 22-25 and 31-34): given by the plugins of the
# suite (economy, leaderboards, jobs, statistics in Flux; town, collection, pets, tags in their plugins).
title: ":offset_-8::menu_profil:"
rows: 6
player-inventory: hidden
vanilla-background: false
update-interval: 40

open-actions:
  - "[sound] @page"

lists:
  profile_head:
    slots: 19
    item:
      material: entry
  profile:
    slots: 22,23,24,25,31,32,33,34
    item:
      material: entry
      actions:
        left: ["[profile] left %entry_id%", "[refresh]"]
        right: ["[profile] right %entry_id%", "[refresh]"]

items:
  retour:
    material: "itemsadder:influitems:btn_back"
    name: "Retour"
    slots: [0]
    lore:
      - "@left Menu principal"
    actions:
      left: ["[menu] main"]

  icone:
    material: "itemsadder:influitems:referral"
    name: "Profil de %flux_profile_name%"
    slots: [8]
    lore:
      - "@desc Le résumé d'un joueur : ses monnaies, sa place dans les classements, ses métiers et ses statistiques."
      - "@info Voir un autre joueur : /profil <pseudo>"
