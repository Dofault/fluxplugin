  carrieres:
    material: IRON_PICKAXE
    name: "Carrières"
    slots: [46]
    flags: [HIDE_ATTRIBUTES]
    lore:
      - "@kv Actives | %ecojobs_in_jobs%&#B376E5/&f%ecojobs_limit%"
      - "@kv Niveau total | %ecojobs_total_job_level%"
      - "@left Mes carrières"
    actions:
      left: ["[menu] metiers"]

  pass:
    material: NETHER_STAR
    name: "Pass"
    slots: [48]
    lore:
      - "@kv Palier | %ecobattlepass_tier_pass%"
      - "@left Ouvrir le pass"
