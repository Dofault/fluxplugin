    slots: [32]
    lore:
      - "@kv Toi | %flux_top_peche_value%"
      - "@kv Ta place | %flux_top_peche_rank%"
      - "@item &f1. %flux_top_peche_1_name% &8· &7%flux_top_peche_1_value%"
      - "@item &f2. %flux_top_peche_2_name% &8· &7%flux_top_peche_2_value%"
      - "@item &f3. %flux_top_peche_3_name% &8· &7%flux_top_peche_3_value%"
      - "@item &f4. %flux_top_peche_4_name% &8· &7%flux_top_peche_4_value%"
      - "@item &f5. %flux_top_peche_5_name% &8· &7%flux_top_peche_5_value%"

  top_sans_mourir:
    material: "TOTEM_OF_UNDYING"
    name: "Sans mourir"
    slots: [33]
    lore:
      - "@kv Toi | %flux_top_sans_mourir_value%"
      - "@kv Ta place | %flux_top_sans_mourir_rank%"
      - "@item &f1. %flux_top_sans_mourir_1_name% &8· &7%flux_top_sans_mourir_1_value%"
      - "@item &f2. %flux_top_sans_mourir_2_name% &8· &7%flux_top_sans_mourir_2_value%"
      - "@item &f3. %flux_top_sans_mourir_3_name% &8· &7%flux_top_sans_mourir_3_value%"
      - "@item &f4. %flux_top_sans_mourir_4_name% &8· &7%flux_top_sans_mourir_4_value%"
      - "@item &f5. %flux_top_sans_mourir_5_name% &8· &7%flux_top_sans_mourir_5_value%"

  top_jeux_du_chat:
    material: "WRITABLE_BOOK"
    name: "Jeux du tchat"
    slots: [34]
    lore:
      - "@kv Toi | %flux_top_jeux_du_chat_value%"
      - "@kv Ta place | %flux_top_jeux_du_chat_rank%"
      - "@item &f1. %flux_top_jeux_du_chat_1_name% &8· &7%flux_top_jeux_du_chat_1_value%"
      - "@item &f2. %flux_top_jeux_du_chat_2_name% &8· &7%flux_top_jeux_du_chat_2_value%"
      - "@item &f3. %flux_top_jeux_du_chat_3_name% &8· &7%flux_top_jeux_du_chat_3_value%"
      - "@item &f4. %flux_top_jeux_du_chat_4_name% &8· &7%flux_top_jeux_du_chat_4_value%"
