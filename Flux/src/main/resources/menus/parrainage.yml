# Menu Parrainage (2026-10-30) : tes filleuls (liste parrainage_filleuls de FluxReferral), ton code, ton adresse,
# tes récompenses. L'arbre complet (filleuls de tes filleuls, adoptions, couple) est celui de /famille (FluxFamily) :
# un parrain y est le parent de ses filleuls. Thème vanilla (theme.menus.parrainage de la config de Flux).
rows: 6
player-inventory: hidden
vanilla-background: false
update-interval: 40
commands: [parrainagemenu]

open-actions:
  - "[sound] @page"

lists:
  parrainage_filleuls:
    slots: 10-16, 19-25, 28-34, 37-43
    item:
      material: entry

widgets:
  pages:
    type: pager
    list: parrainage_filleuls
    prev: 45
    next: 53

items:

  retour:
    material: "itemsadder:influitems:btn_back"
    name: "&#FFD94DRetour"
    slots: [0]
    lore:
      - "@desc Revenir au menu."
      - "@left Menu principal"
    actions:
      left: ["[menu] main"]

  moi:
    material: player-head
    name: "&#FFD94D%player_name%"
    slots: [4]
    lore:
      - "@desc Les joueurs que tu as amenés sur le serveur. Dans ta famille, tu es leur parent."
      - "@kv Ton code | %parrainage_code%"
      - "@kv Filleuls | %parrainage_filleuls%"
      - "@kv Parrain | %parrainage_parrain%"

  recompenses:
    material: "itemsadder:influitems:reward"
    name: "&#FFD94DRécompenses"
    slots: [7]
    lore:
      - "@desc Les récompenses de tes filleuls et des paliers atteints."
      - "@kv À récupérer | %parrainage_a_recuperer%"
      - "@left Récupérer"
    actions:
      left: ["[player] parrainage recuperer", "[refresh]"]

  adresse:
    material: "itemsadder:influitems:copy"
    name: "&#FFD94DTon adresse"
    slots: [8]
    lore:
      - "@desc Donne cette adresse à tes amis : en se connectant avec, ils deviennent tes filleuls."
      - "@kv Adresse | %parrainage_adresse%"
      - "@left Copier"
    actions:
      left: ["[player] parrainage adresse"]

  famille:
    material: "itemsadder:influitems:referral"
    name: "Arbre de famille"
    slots: [6]
    lore:
      - "@desc Tes filleuls, leurs propres filleuls, tes adoptions et ton couple, dans un seul arbre. Marié, les filleuls de ton conjoint sont aussi les vôtres."
      - "@kv Dans ta famille | %fluxfamily_size%"
      - "@left Voir l'arbre"
    actions:
      left: ["[player] famille"]
