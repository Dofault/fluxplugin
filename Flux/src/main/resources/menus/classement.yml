# Menu Classement (2026-10-30) : l'ancien tiroir du menu principal en menu à part, même contenu.
# Thème vanilla (theme.menus.classement de la config de Flux).
rows: 6
player-inventory: hidden
vanilla-background: false
update-interval: 20

open-actions:
  - "[sound] @page"

items:

  retour:
    material: "itemsadder:influitems:btn_back"
    name: "&#FFD94DRetour"
    slots: [0]
    lore:
      - "@desc Revenir au menu."
      - "@left Menu principal"
    actions:
      left: ["[menu] main"]

  icone:
    material: itemsadder:influitems:leaderboard
    name: "&#FFD94DClassement"
    slots: [8]
    lore:
      - "@desc Compare-toi aux meilleurs joueurs du serveur, dans chaque domaine."

  top_carrieres:
    material: DIAMOND_PICKAXE
    flags: [HIDE_ATTRIBUTES]
    name: "&#FFD94DCarrières"
    slots: [10]
    lore:
      - "@text &#F0A800① &fDofault &8· &#B376E5412 niv."
      - "@text &#D9D9D9② &fAurora &8· &#B376E5388 niv."
      - "@text &#C97B3A③ &fKaelis &8· &#B376E5361 niv."
      - "@text &8(exemple)"
      - "@left Voir tout"
    actions:
      left: ["[menu] metiers"]

