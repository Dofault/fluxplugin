# Money of the suite: gain / loss message (look: style.yml money), currencies, account menu (/account).
# {icon} {color} come from style.yml, {verb} from verbs, {name} from names, {origin} = where the money comes from.
money:
  message: "{icon} {color}You {verb} {amount} {color}{name} {arrow}{origin}"
  verbs:
    gained: "gained"
    lost: "lost"
    bought: "bought for"
    sold: "sold for"
    received: "received"
    given: "gave"
    won: "won"
    bet: "bet"
    spent: "spent"
  names:
    vault: "money"
    influence: "Influence"
    chips: "chips"
  balance: "&fYou have %amount%."
  balance-other: "&f%player% has %amount%."
  usage: "&f/%command% &7[give|take|set|look] [player] [amount]"
  admin-done: "&#2ECF7BDone: %player% now has %amount%."
  admin-failed: "&#FF5C5COperation refused (balance too low or database unavailable)."
  player-not-found: "&#FF5C5CUnknown player: %player%"
  no-menu: "&#FF5C5CThe account menu is not installed."
  button:
    name: "Account"
    description: "Your balances, and everything you gained and spent."
    open: "History"
  menu:
    title: "My account"
    summary: "Every gain and every expense, whatever its origin."
    summary-other: "Account of %player%."
    week: "Last 7 days (%name%)"
    week-in: "Gained"
    week-out: "Spent"
    week-best: "Main source"
    kind: "Gains or expenses"
    all: "Everything"
    gains: "Gains"
    losses: "Expenses"
    origin: "Origin"
    detail: "Detail"
    count: "Operations"
    period: "Period"
    hour: Hour
    hour-format: "MM/dd HH':00'"
    date: "Date"
    balance: "Balance after"
# /fluxmenu database (staff): where the suite keeps its data, move to another engine
database:
  usage: "&#B376E5/%label% database &f[status] &8| &#B376E5migrate &f<sqlite|mysql> [replace] &8| &#B376E5cancel"
  checking: "&#B376E5Checking the target database (&f%target%&#B376E5)..."
  planned: "&#2ECF7BMigration to &f%target% &#2ECF7Bplanned: type switched in storage.yml. &fRestart the server&#2ECF7B, the copy runs at start-up before players can join."
  cancelled: "&#2ECF7BPlanned migration cancelled, type set back in storage.yml."
  refused: "&#FF5C5CNothing done: &f%reason%"
  status-title: "&#FFD94DDatabase of the suite"
  status-line: "&8- &#B376E5%line%"
  join-blocked: "&#FF5C5CThe server cannot reach its database right now.\n&fYour progress is safe: try again in a few minutes."

