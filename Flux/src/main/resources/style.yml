# Look of every button of the suite (menu files and buttons built by code). Change it here, it changes everywhere
# after /fluxmenu reload. Look only, never words (labels live in the lang files). Colours: &x, &#RRGGBB.
#
# lore: the template of every lore, read top to bottom like an HTML page the data is poured into.
# Tags are the structure, {braces} the data.
#   <block>...</block>  repeated once per line of that kind, gone when there is none:
#     <description> {text}          description paragraphs (@desc)
#     <values> {key} {value}        key : value (@kv Key | Value)
#     <list> {text}                 list items (@item)
#     <filter> {text}               filter options; <selected>...</selected> / <unselected>...</unselected> inside
#     <text> {text}                 plain lines (@text, or a line without tag)
#     <ok> <ko> <info> {text}       states
#     <actions> {icon} {label}      click actions (@left @right @shift-left @shift-right), icons below
#   The order of the lines is the order of the lore. A blank line only shows between two lines of content
#   (two blank lines = a bigger gap). Any text may use <smallcaps>...</smallcaps>.
lore: |
  <description>&f{text}</description>

  <values>&#B376E5{key} : &f{value}</values>

  <list>&8➤ &7{text}</list>
  <filter><selected>&f» {text}</selected><unselected>&#B376E5{text}</unselected></filter>

  <text>&#B376E5{text}</text>
  <ok>&#2ECF7B{text}</ok>
  <ko>&#FF5C5C{text}</ko>
  <info>&#FFD94D{text}</info>

  <actions>{icon} &f{label}</actions>

# border of the lore (border: false removes it)
#   left / left-action / left-last   start of the lines, of the action lines, of the last line when there is no bottom
#   right                            end of the lines, aligned at the widest line: a real box
#   top / bottom / separator         full lines, {fill} repeats `fill` across the box width; separator replaces the
#                                    blank lines of the template
border:
  left: "&#FFD94D│ "
  left-action: "&#FFD94D├ "
  left-last: "&#FFD94D└ "
  right: ""
  top: ""
  bottom: ""
  separator: ""
  fill: "─"

# width in pixels (spacing included) of characters measured wrong, e.g. box drawing characters of the right side
# and the full lines; letters, digits and custom glyphs are already known
font-widths: {}

# button name ({text}: the name, a colour in the name itself wins)
name: "&#FFD94D{text}"

icons:
  left: "&r&7%img_left_click%"
  right: "&r&7%img_right_click%"
  shift-left: "&r&7⇧%img_left_click%"
  shift-right: "&r&7⇧%img_right_click%"

# Variants of a plugin: lore, name, icons, border (left side only: the box is finished with the suite's border),
# the rest comes from here, e.g.
# variants:
#   pets:
#     name: "&#FF7A59{text}"
variants: {}
