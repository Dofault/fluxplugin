# Look of every button of the suite (menu files and buttons built by code). Change it here, it changes everywhere
# after /fluxmenu reload. Look only, never words (labels live in the lang files). Colours: &x, &#RRGGBB.
#
# lore: the template of every lore, read top to bottom like an HTML page the data is poured into.
# Tags are the structure, {braces} the data.
#   <block>...</block>  repeated once per line of that kind, gone when there is none:
#     <description> {text}          description paragraphs (@desc)
#     <values> {key} {value}        key : value (@kv Key | Value)
#     <list> {text}                 list items (@item)
#     <filter> {text}               filter options; <selected>...</selected> / <unselected>...</unselected> inside
#     <text> {text}                 plain lines (@text, or a line without tag)
#     <ok> <ko> <info> {text}       states
#     <actions> {icon} {label}      click actions (@left @right @shift-left @shift-right), icons below
#   The order of the lines is the order of the lore. A blank line only shows between two lines of content
#   (two blank lines = a bigger gap). Any text may use <smallcaps>...</smallcaps>.
lore: |
  <description>&f{text}</description>

  <values>&#B376E5{key} : &f{value}</values>

  <list>&8➤ &7{text}</list>
  <filter><selected>&f» {text}</selected><unselected>&#B376E5{text}</unselected></filter>

  <text>&#B376E5{text}</text>
  <ok>&#2ECF7B{text}</ok>
  <ko>&#FF5C5C{text}</ko>
  <info>&#FFD94D{text}</info>

  <actions>{icon} &f{label}</actions>

# frame of the buttons (optional, enabled: false removes it): before the button name, before every line, before
# the actions, before the last line
frame:
  enabled: true
  name: ""
  line: "&#FFD94D│ "
  branch: "&#FFD94D├ "
  corner: "&#FFD94D└ "

# what each blank line of the template becomes (still only between two lines of content); empty = a blank line
# (the frame's line alone when framed), e.g. "&#FFD94D├──────"
separator: ""

# button name ({text}: the name, a colour in the name itself wins)
name: "&#FFD94D{text}"

icons:
  left: "&r&7%img_left_click%"
  right: "&r&7%img_right_click%"
  shift-left: "&r&7%img_shift%&7+%img_left_click%"
  shift-right: "&r&7%img_shift%&7+%img_right_click%"

# Variants of a plugin: any of the keys above (lore, frame, separator, name, icons), the rest comes from here.
# A menu button picks one with a lore line « @style <variant> ».
# variants:
#   pets:
#     name: "&#FF7A59{text}"
variants:
  # FluxTools (« rubis » palette): garnet frame, pale pink text, mint / greyish pink states
# Gain / loss messages of every currency (the words live in the lang file: money.message, money.verbs, money.names).
#   {icon} {color}: of the currency (currencies.<id>), {amount}: the amount template below, {arrow}: arrow-gain or
#   arrow-loss, {origin}: the origin template below (empty when the origin is unknown).
money:
  color: "&#B376E5"
  amount: "&f{amount}"
  arrow-gain: "&#2ECF7B▲"
  arrow-loss: "&#FF5C5C▼"
  origin: "&7 [<smallcaps>{origin}</smallcaps>]"
  currencies:
    vault:
      color: "&#B376E5"
      icon: "&r&f$"
    influence:
      color: "&#E060A0"
      icon: "&r&f✦"
    chips:
      color: "&#FFD94D"
      icon: "&r&f●"
