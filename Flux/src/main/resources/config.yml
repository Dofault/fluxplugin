# Flux : réglages généraux. Les menus vivent dans menus/*.yml (un fichier = un menu,
# son identifiant est le nom du fichier sans .yml, sous-dossiers acceptés).

# Délai minimal entre deux clics pris en compte, en ticks (anti double clic / spam).
click-cooldown: 4

# Sound of a menu opening when its open-actions play none ("@<cue>" of sounds, or "<sound> [volume] [pitch]",
# "none" = silent).
menu-open-sound: "@page"

# Préfixe des messages d'administration (/fluxmenu).
prefix: "&#FFD94D&lFlux &8► "

# ─── Suite Flux : réglages communs à tous les plugins de la suite ─────────────
# Langue par défaut de tous les plugins de la suite (fichiers lang/<langue>.yml de chaque plugin).
# Un plugin peut la remplacer par sa propre clé language.
language: en_US

# Monnaies. main = monnaie principale (prix par défaut des plugins). Format d'affichage de chaque monnaie :
# %amount% = montant mis en forme (« 1 200 »). vault = toute économie Vault, playerpoints = PlayerPoints ;
# d'autres plugins ajoutent les leurs (ex : chips, les jetons de FluxCasino).
currencies:
  main: vault
  # type: vault = the Vault economy (kept by CMI or another plugin), flux = kept by Flux in its database.
  # format: how an amount is written; icon: item shown for it in menus (Flux material syntax).
  # flux currencies: decimals (0 = whole units), command: true = /<id> (balance; give|take|set|look for
  # flux.currency.<id>.admin). Names: money.names.<id> in the lang file; message look: money in style.yml.
  vault:
    type: vault
    format: "%amount% $"
    icon: GOLD_INGOT
  influence:
    type: flux
    decimals: 0
    command: true
    format: "%amount% influence"
    icon: EMERALD
  chips:
    type: flux
    decimals: 0
    command: false   # FluxCasino's /chips
    format: "%amount% chips"
    icon: GOLD_NUGGET

# Account history (/account, menu "compte"): every balance change of every currency, with its origin.
ledger:
  enabled: true
  # movements of the same currency, origin and direction within this window share one line (jobs paying every block)
  merge-seconds: 300
  keep-days: 90
  # lines kept in memory per online player, shown by the menu
  menu-lines: 300
  # currencies of the menu filter and of the main-menu button, in order
  currencies: [vault, influence, chips]
  # plugins that only carry money for others: the origin is the outermost other plugin of the call stack
  plumbing: [Flux, Vault, VaultUnlocked, CMI, CMILib, CMIEInjector, eco]
  # class name prefix -> origin ("Plugin:key"), for what the plugin name alone cannot tell
  classes:
    "com.Zrips.CMI.Modules.PlayTimeRewards": "CMI:salary"
    "com.Zrips.CMI.commands.list.pay": "CMI:transfer"
    "com.Zrips.CMI.commands.list.money": "CMI:command"
  # label of an origin: "Plugin:key", or "Plugin" for every key of a plugin; suite plugins name their own keys in
  # their lang file (origins.<key>), these entries win. unknown: origin not found.
  origins:
    unknown: "Other"
    EcoJobs: "Jobs"
    libreforge: "Jobs"
    Lands: "Towns"
    AuctionHouse: "Auction house"
    EcoBattlepass: "Pass"
    "CMI:salary": "Salary"
    "CMI:transfer": "Transfer"
    "CMI:command": "Command"
  # origins never recorded ("Plugin:key" or "Plugin")
  ignored: []
  # true: log where a movement without origin comes from (thread and stack), to give it a name
  debug-unknown: false

# Couleurs des boîtes de dialogue (saisies, confirmations, copie, liens).
dialogs:
  # Neutral windows (2026-10-29): yellow title, everything else white; links stay blue and underlined.
  title: "&#FFD94D"
  text: "&f"
  label: "&f"
  option: "&f"
  # label of the check boxes (settings window)
  toggle: "&f"
  confirm: "&f"
  cancel: "&f"
  # descriptions shown on hover (check boxes, buttons), cut into lines of line-length characters
  hover: "&f"
  line-length: 40
  link: "&#2BC4E8&n"
  # error line of a window opened again after a wrong value (amount out of bounds...)
  error: "&#FF5C5C"

# Lores of every menu and item of the suite: a line longer than max-line-length visible characters (colour codes not
# counted) is cut on spaces into several lines that keep the colours. repeat-prefix: a decoration at the start of the
# line ("&#FFD94D│ ") is repeated on the cut lines. 0 = never cut.
lore:
  max-line-length: 40
  repeat-prefix: true

# Leaderboards (placeholders %flux_top_<board>_<n>_name%, %flux_top_<board>_<n>_value%, %flux_top_<board>_rank% and
# %flux_top_<board>_value% for the viewer). Values of online players are recorded every refresh-minutes and on quit;
# a new board is first filled with every player the server knows (a few per second). A board's source: a vanilla
# statistic (statistic: PLAY_ONE_MINUTE...), the main money (money: true) or a placeholder giving a number
# (placeholder: "%..."). format: number (default), ticks or seconds (shown as a duration), money.
leaderboards:
  refresh-minutes: 10
  size: 10
  boards:
    playtime: {statistic: PLAY_ONE_MINUTE, format: ticks}
    fish: {statistic: FISH_CAUGHT}
    money: {money: true, format: money}
    # any currency of Flux: currency: <id>, format: <id>
    influence: {currency: influence, format: influence}

# Reward manager: every plugin of the suite hands its rewards to Flux, players claim them all with /rewards.
# Trade window of one item (api.trade.TradeWindow): buying buttons x1/x2/x10/x64 and the selling confirm button.
trade:
  # a first click arms a button, it disarms itself after this delay
  confirm-timeout-seconds: 5
  # right after a purchase, the same button buys again without confirmation during this time (0: off)
  quick-buy-seconds: 1.0
  # icons (material spec: MATERIAL, itemsadder:ns:id); the stack size of the buying buttons shows the quantity
  buy-button: LIME_STAINED_GLASS_PANE
  buy-button-armed: ORANGE_STAINED_GLASS_PANE
  sell-button: itemsadder:influitems:accept
  sell-button-armed: itemsadder:influitems:checkmark

rewards:
  # /rewards opens the menu "rewards" (menus/rewards.yml); false: claims everything straight away
  command-opens-menu: true
  # chat message when a reward is given to an online player
  notify-on-give: true
  # reminder of the waiting rewards, every N seconds (0: only when joining)
  reminder-interval-seconds: 0
  # a reward not claimed after this many days is lost (0 = never)
  expire-days: 21
  # reminders before it is lost: in game, and Discord private message (DiscordSRV, linked accounts)
  expire-reminders: ["7d", "24h"]
  discord-reminders: true
  # address shown in the Discord reminders (%ip%)
  server-address: "play.influencraft.fr"

# Interface sounds of the whole suite ("<sound> [volume] [pitch]", "none" = silent). Plugins and menus play them by
# name (Sounds.cue in code, "@error" in a config or a [sound] action).
sounds:
  # un menu s'ouvre ou change de page
  page: "minecraft:item.book.page_turn"
  # un bouton
  click: "minecraft:ui.button.click 0.6 1.4"
  # premier clic d'une double confirmation (rien n'est encore fait)
  confirm: "minecraft:entity.experience_orb.pickup 0.6 0.7"
  # une action a marché : achat, vente, dépôt
  success: "minecraft:entity.experience_orb.pickup 0.8 1.2"
  # quelque chose de gagné : niveau, offrande terminée, récompense récupérée
  complete: "minecraft:entity.player.levelup 1 1.4"
  error: "minecraft:entity.villager.no"
  remove: "minecraft:entity.item.break 0.6 1"
  toggle-on: "minecraft:block.amethyst_block.chime 1 1.4"
  toggle-off: "minecraft:block.amethyst_block.hit 1 0.8"
  # quelque chose demande l'attention : récompense en attente, alerte staff (3 s minimum entre deux)
  alert: "minecraft:block.note_block.pling 0.7 1.6"
  # (open, close et reward n'existent plus : open joue page, reward joue complete, close est muet)

# Combat rules of the whole server.
combat:
  # Attack cadence (as Wynncraft): a weapon attacks at its own pace, spam clicks do nothing until it is recharged,
  # the weapon visibly comes back slowly (slower for a slow weapon), the vanilla recharge indicator is hidden (empty
  # sprites over the pack influstatique). Hits always land at full charge. false: items lose it at their next refresh.
  attack-cadence:
    enabled: true
    # Share of the recharge needed to attack again (1 = full).
    minimum-charge: 1.0
    # The swing of the weapon lasts the whole recharge.
    slow-swing: true
    # Particle and sound at every real swing, even in the air, where the swing reaches: the player's reach (attribute,
    # bonuses of pets and effects included, or the weapon's range), stopped by the first block or creature. none: off.
    swing-particle: SWEEP_ATTACK
    swing-sound:
      key: minecraft:entity.player.attack.sweep
      volume: 0.7
      pitch: 1.0

# Third-party plugins behind the services of the suite. The plugins of the suite only talk to Flux: changing one of
# these plugins means one adapter in Flux, nothing else. auto: the known plugin that is installed; none: off.
providers:
  # custom items, blocks and font glyphs (itemsadder)
  items: auto
  # careers: levels, XP, XP gains and level-ups (ecojobs)
  jobs: auto
  # custom fishing: fish prices, rarity tiers, rod durability (customfishing)
  fishing: auto
  # protected areas, for plugins that only need to know where a claim is (lands)
  claims: auto
  # Java or Bedrock client of each player (floodgate), see the bedrock section
  clients: auto
  # every Vault balance change, whatever plugin made it: account history, "money gained" notifications (cmi)
  money-events: auto

# Rarity tiers of the custom fish (a fish belongs to a tier when its id starts with "<tier>_"): sample shown in the
# shop price lists, label and colour. Example:
#   tiers:
#     common: {sample: common_cod, label: "Common fish", color: "&7"}
fishing:
  tiers: {}

# Bedrock players (Geyser + Floodgate) get no resource pack: custom items and glyphs are replaced for them. Flux applies
# it in every menu and text of the suite; the inventory of a "hidden" menu stays visible on Bedrock.
bedrock:
  # text written instead of a glyph (:id: or %img_id%), by glyph id; the others become default-glyph
  glyphs:
    left_click: "[L]"
    right_click: "[R]"
  default-glyph: ""
  # vanilla item shown instead of a custom item, by id (namespace:id or id); the others become default-item
  items:
    # namespace:id: MATERIAL
  default-item: PAPER


# Alerts for the staff (players with flux.staff.alerts), e.g. how a new player found the server.
staff:
  format: "&#FF5C5Cꜱᴛᴀꜰꜰ &8▸ &#FFD94D{title} &8» &#B376E5{message}"
  # sound cue (see sounds) or "<sound> [volume] [pitch]", "" = silent
  sound: alert
  # per topic: false turns its chat alert off
  topics:
    referral-origin:
      chat: true

# Commands suggested when a player types "/": every command is hidden but the suggested ones of commands.yml (suite
# commands, menu commands and the "others" section), whatever plugin they come from. The server still drops what the
# player has no permission for. Only suggestions change: a hidden command can still be run. /help lists them.
command-suggestions:
  enabled: false
  # sees every command
  bypass-permission: flux.commands.all
  # also propose the aliases (false: one label per command)
  show-aliases: false

