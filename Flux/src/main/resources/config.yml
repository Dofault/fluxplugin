# Flux : réglages généraux. Les menus vivent dans menus/*.yml (un fichier = un menu,
# son identifiant est le nom du fichier sans .yml, sous-dossiers acceptés).

# Délai minimal entre deux clics pris en compte, en ticks (anti double clic / spam).
click-cooldown: 4

# Préfixe des messages d'administration (/fluxmenu).
prefix: "&#FFD94D&lFlux &8► "

# ─── Suite Flux : réglages communs à tous les plugins de la suite ─────────────
# Langue par défaut de tous les plugins de la suite (fichiers lang/<langue>.yml de chaque plugin).
# Un plugin peut la remplacer par sa propre clé language.
language: en_US

# Monnaies. main = monnaie principale (prix par défaut des plugins). Format d'affichage de chaque monnaie :
# %amount% = montant mis en forme (« 1 200 »). vault = toute économie Vault, playerpoints = PlayerPoints ;
# d'autres plugins ajoutent les leurs (ex : chips, les jetons de FluxCasino).
currencies:
  main: vault
  # format: how an amount is written; icon: item shown for it in menus (Flux material syntax)
  vault:
    format: "%amount% $"
    icon: GOLD_INGOT
  playerpoints:
    format: "%amount% points"
    icon: EMERALD
  chips:
    format: "%amount% chips"
    icon: GOLD_NUGGET

# Couleurs des boîtes de dialogue (saisies, confirmations, copie, liens).
dialogs:
  title: "&#FFD94D"
  text: "&#B376E5"
  label: "&#B376E5"
  option: "&f"
  confirm: "&#2ECF7B"
  cancel: "&#FF5C5C"
  link: "&#2BC4E8&n"

# Lores of every menu and item of the suite: a line longer than max-line-length visible characters (colour codes not
# counted) is cut on spaces into several lines that keep the colours. repeat-prefix: a decoration at the start of the
# line ("&#FFD94D│ ") is repeated on the cut lines. 0 = never cut.
lore:
  max-line-length: 40
  repeat-prefix: true

# Reward manager: every plugin of the suite hands its rewards to Flux, players claim them all with /rewards.
rewards:
  # /rewards opens the menu "rewards" (menus/rewards.yml); false: claims everything straight away
  command-opens-menu: true
  # chat message when a reward is given to an online player
  notify-on-give: true
  # reminder of the waiting rewards, every N seconds (0: only when joining)
  reminder-interval-seconds: 0

# The one database of the suite: every plugin of the suite keeps its tables here.
database:
  # sqlite: file plugins/Flux/<file> (nothing to install). mysql: MySQL or MariaDB server below.
  type: sqlite
  file: flux.db
  host: localhost
  port: 3306
  name: influencraft
  user: root
  password: ""
  pool-size: 6
  # prefix added to every table name (useful when the database is shared with other applications)
  table-prefix: ""

# Interface sounds of the whole suite ("<sound> [volume] [pitch]", "none" = silent). Plugins and menus play them by
# name (Sounds.cue in code, "@error" in a config or a [sound] action).
sounds:
  alert: "minecraft:block.note_block.pling 0.7 1.6"
  open: "minecraft:block.chest.open 0.6 1.2"
  close: "minecraft:block.chest.close 0.6 1.2"
  page: "minecraft:item.book.page_turn"
  click: "minecraft:ui.button.click 0.6 1.4"
  confirm: "minecraft:entity.experience_orb.pickup 0.6 0.7"
  success: "minecraft:entity.experience_orb.pickup 0.8 1.2"
  error: "minecraft:entity.villager.no"
  complete: "minecraft:entity.player.levelup 1 1.4"
  reward: "minecraft:ui.toast.challenge_complete 0.8 1"
  toggle-on: "minecraft:block.amethyst_block.chime 1 1.4"
  toggle-off: "minecraft:block.amethyst_block.hit 1 0.8"
  remove: "minecraft:entity.item.break 0.6 1"

# Third-party plugins behind the services of the suite. The plugins of the suite only talk to Flux: changing one of
# these plugins means one adapter in Flux, nothing else. auto: the known plugin that is installed; none: off.
providers:
  # custom items, blocks and font glyphs (itemsadder)
  items: auto
  # careers: levels, XP, XP gains and level-ups (ecojobs)
  jobs: auto
  # custom fishing: fish prices, rarity tiers, rod durability (customfishing)
  fishing: auto
  # protected areas, for plugins that only need to know where a claim is (lands)
  claims: auto
  # chest shops of the players (quickshop: FluxChestShop or QuickShop-Hikari)
  chest-shops: auto
  # Java or Bedrock client of each player (floodgate), see the bedrock section
  clients: auto
  # balance changes of the main currency, for the "money gained" notifications (cmi)
  money-events: auto

# Rarity tiers of the custom fish (a fish belongs to a tier when its id starts with "<tier>_"): sample shown in the
# shop price lists, label and colour. Example:
#   tiers:
#     common: {sample: common_cod, label: "Common fish", color: "&7"}
fishing:
  tiers: {}

# Bedrock players (Geyser + Floodgate) get no resource pack: custom items and glyphs are replaced for them. Flux applies
# it in every menu and text of the suite; the inventory of a "hidden" menu stays visible on Bedrock.
bedrock:
  # text written instead of a glyph (:id: or %img_id%), by glyph id; the others become default-glyph
  glyphs:
    left_click: "[L]"
    right_click: "[R]"
  default-glyph: ""
  # vanilla item shown instead of a custom item, by id (namespace:id or id); the others become default-item
  items:
    # namespace:id: MATERIAL
  default-item: PAPER


# Alerts for the staff (players with flux.staff.alerts), e.g. how a new player found the server.
staff:
  format: "&#FF5C5Cꜱᴛᴀꜰꜰ &8▸ &#FFD94D{title} &8» &#B376E5{message}"
  # sound cue (see sounds) or "<sound> [volume] [pitch]", "" = silent
  sound: alert
  # per topic: false turns its chat alert off
  topics:
    referral-origin:
      chat: true
