# Flux : menu Compte (/compte, bouton BitBlock en haut à droite de /menu2) : l'historique des gains et des dépenses
# de chaque monnaie (BitBlock, Influence, Jetons), quel que soit le plugin qui a bougé l'argent. Une case par ligne
# (21 par page) ; les petits gains répétés (métiers) sont regroupés en une ligne par période de 5 minutes.
# Retour en 9, résumé (soldes, 7 derniers jours) en 17, monnaie en 48, gains / dépenses en 50.
# Contenu construit par Flux en Java (listes ledger, ledger_summary, ledger_kind), cf. docs/technique/flux-economie.md.
title: "Compte"
rows: 6
player-inventory: hidden
vanilla-background: false
update-interval: 40

open-actions:
  - "[sound] @page"

lists:
  ledger_summary:
    slots: 17
    item:
      material: entry
  ledger:
    slots: 19-25,28-34,37-43
    item:
      material: entry
  ledger_kind:
    slots: 50
    item:
      material: entry
      actions:
        left: ["[list] ledger sort", "[refresh]"]
        right: ["[list] ledger sort-prev", "[refresh]"]

items:

  retour:
    material: "itemsadder:influitems:btn_back"
    name: "Retour"
    slots: [9]
    lore:
      - "@desc Revenir au menu."
      - "@left Menu principal"
    actions:
      left: ["[menu] main"]

  vide:
    material: "itemsadder:influitems:checkmark"
    name: "Rien pour l'instant"
    slots: [31]
    view-requirements: ["placeholder: %flux_list_ledger_count% == 0"]
    lore:
      - "@desc Tes gains et tes dépenses de cette monnaie apparaîtront ici."

  monnaie:
    material: "itemsadder:influitems:filter"
    name: "Monnaie"
    slots: [48]
    lore:
      - "@filter ledger"
    actions:
      left: ["[list] ledger filter", "[refresh]"]
      right: ["[list] ledger filter-prev", "[refresh]"]

  precedente:
    material: "itemsadder:influitems:btn_prev"
    hide-tooltip: true
    slots: [27]
    view-requirements: ["placeholder: %flux_list_ledger_has_prev% == true"]
    actions:
      left: ["[list] ledger prev", "[sound] @page"]

  suivante:
    material: "itemsadder:influitems:btn_next"
    hide-tooltip: true
    slots: [35]
    view-requirements: ["placeholder: %flux_list_ledger_has_next% == true"]
    actions:
      left: ["[list] ledger next", "[sound] @page"]
