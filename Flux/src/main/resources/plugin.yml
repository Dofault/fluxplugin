name: Flux
version: 0.1.0
main: fr.influencraft.flux.Flux
api-version: "26.2"
description: Couche d'interface de la suite Flux - menus (inventaire du joueur masquable) et API commune des plugins Flux.
authors: [Influencraft]
depend: [packetevents]
# shared database pool of the suite (see the database section of config.yml)
libraries:
  - com.zaxxer:HikariCP:7.0.2
softdepend: [ItemsAdder, PlaceholderAPI, DeluxeMenus, EcoBattlepass, EcoJobs, EcoCollections, Vault, PlayerPoints, CMI, eco, libreforge, CustomFishing, Lands, DiscordSRV, MCGUI]

commands:
  fluxmenu:
    description: Administration de Flux.
    usage: /fluxmenu <open|reload|list|database>
    aliases: [fmenu]

permissions:
  flux.money.pay:
    description: /pay (send money to a player).
    default: true
  flux.money.top:
    description: /baltop (richest players).
    default: true
  flux.money.others:
    description: /money <player> (another player's balance).
    default: op
  # The one admin permission of the whole suite: every admin command, admin button and admin menu of every Flux
  # plugin checks it (fr.influencraft.flux.api.staff.Staff.isAdmin), and no plugin declares an admin node of its own.
  # Server operators (ops.json) have it; a LuckPerms group gets everything with this single node. Its children are
  # the finer staff nodes operators had by default, still grantable one by one to a lower rank (moderators).
  flux.admin:
    description: Administration of the whole Flux suite (every admin command, button and menu of every plugin).
    default: op
    children:
      flux.commands.all: true
      flux.commands.staff: true
      flux.money.others: true
      flux.account.others: true
      flux.staff.alerts: true
      fluxcommerce.staff: true
      fluxcommerce.trade.staff: true
      fluxcrate.free: true
      fluxenchant.split: true
      fluxenchant.split.table: true
      fluxfamily.bypass.warmup: true
      fluxfamily.bypass.worlds: true
      fluxfly.bypass: true
      fluxfly.others: true
      fluxlands.voxel: true
      fluxmusic.others: true
      fluxmusic.play: true
      fluxpw.about: true
      fluxpw.delay.bypass: true
      fluxpw.manage.others: true
      fluxpw.teleport.others: true
      fluxreferral.commande.info.autres: true
      fluxreferral.staff.origine: true
      fluxtools.bottlexp: true
      fluxtools.repair: true
      fluxtopdown.use: true
  flux.universe.bypass:
    description: Outside vanilla, containers, crafting, portals and every command allowed; in creative, items of another universe are not taken away (builders).
    default: false
  flux.staff.alerts:
    description: Receives the staff alerts of the suite in the chat (e.g. how a new player found the server).
    default: op
  flux.commands.all:
    description: Sees every command in the "/" suggestions (command-suggestions of the config).
    default: op
  flux.commands.staff:
    description: Sees the staff list of the "/" suggestions.
    default: op
