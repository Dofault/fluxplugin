name: Flux
version: 0.1.0
main: fr.influencraft.flux.Flux
api-version: "26.2"
description: Couche d'interface de la suite Flux - menus (inventaire du joueur masquable) et API commune des plugins Flux.
authors: [Influencraft]
depend: [packetevents]
softdepend: [ItemsAdder, PlaceholderAPI, DeluxeMenus, EcoBattlepass, EcoJobs, Vault, PlayerPoints]

commands:
  fluxmenu:
    description: Administration de Flux.
    usage: /fluxmenu <open|reload|list>
    aliases: [fmenu]

permissions:
  fluxmenu.admin:
    description: /fluxmenu (open, reload, list).
    default: op
  flux.rewards.give:
    description: /rewards give and /rewards list (hand a reward to a player, see what waits for him).
    default: op
