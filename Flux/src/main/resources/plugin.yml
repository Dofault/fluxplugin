name: Flux
version: 0.1.0
main: fr.influencraft.flux.Flux
api-version: "26.2"
description: Couche d'interface de la suite Flux - menus (inventaire du joueur masquable) et API commune des plugins Flux.
authors: [Influencraft]
depend: [packetevents]
# shared database pool of the suite (see the database section of config.yml)
libraries:
  - com.zaxxer:HikariCP:7.0.2
softdepend: [ItemsAdder, PlaceholderAPI, DeluxeMenus, EcoBattlepass, EcoJobs, EcoCollections, Vault, PlayerPoints, CMI, eco, CustomFishing, Lands, QuickShop-Hikari, FluxChestShop]

commands:
  fluxmenu:
    description: Administration de Flux.
    usage: /fluxmenu <open|reload|list>
    aliases: [fmenu]

permissions:
  fluxmenu.admin:
    description: /fluxmenu (open, reload, list).
    default: op
  flux.rewards.give:
    description: /rewards give and /rewards list (hand a reward to a player, see what waits for him).
    default: op
  flux.staff.alerts:
    description: Receives the staff alerts of the suite in the chat (e.g. how a new player found the server).
    default: op
  flux.commands.all:
    description: Sees every command in the "/" suggestions (command-suggestions of the config).
    default: op
  flux.commands.staff:
    description: Sees the staff list of the "/" suggestions.
    default: op
