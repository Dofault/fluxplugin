# Settings window (/parametres, command "settings"): one check box per option, its description shows when the mouse
# is over its name. Saving runs "on" or "off" for each option that changed: "[console] ..." (default) or
# "[player] ..." as the player, %player% = player name.
# "state": placeholder telling whether the option is on (true/yes/oui/1), when the plugin behind it gives one;
# otherwise Flux remembers the last choice of the player ("default" before any choice).
title: "Settings"
save: "Save"
close: "Close"
text:
  - "Tick what you want. Hover an option to see what it does."
options:
  music:
    label: "Music"
    description: "Music of some moments of the game (dungeon bosses, crates, level up). Its volume is the Jukebox/Note Blocks slider of Minecraft's sound options."
    default: true
    off: ["[console] musique stop %player%"]
  msg:
    label: "Private messages"
    description: "Lets other players send you private messages."
    default: true
    on: ["[console] cmi options msg true %player% -s"]
    off: ["[console] cmi options msg false %player% -s"]
