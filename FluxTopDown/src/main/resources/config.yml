# FluxTopDown: a hack and slash view from above (experiment).
# The camera hangs over the player, the mouse moves a pointer instead of the view, a click moves the hero there or
# attacks the monster under the pointer, keys 1 to 4 aim a spell and the left click casts it.
# Durations are in ticks (20 = 1 second), distances in blocks.

language: ""

# Dungeon started by "/hackslash play" when none is given.
dungeon: moisson

camera:
  # Distance from the point it looks at (the hero's feet + 1 block).
  distance: 13
  # Degrees under the horizon (90 = straight down).
  pitch: 55
  # Direction it looks to: 180 = north at the top of the screen, 0 = south, 90 = west, -90 = east.
  yaw: 180
  # It comes this close at most under a roof (it never goes through blocks).
  min-distance: 3

cursor:
  # true: the pointer is drawn by the player's client from his head's turn (Flux's head pointer, shader of the pack):
  # no wait for the server, as smooth as the mouse. false: the server's mark on the pointed spot (any client, but it
  # lags by the ping). The settings below, but width and height, are for the server's mark only.
  client: true
  # Pointer move per degree of mouse turn (screen units, 1 = the screen's half height at a 90 degree field of view).
  speed: 0.03
  # Area the pointer moves in, from the screen's centre (same units).
  width: 1.15
  height: 0.62
  # The mark standing on the pointed spot (MiniMessage, seen through blocks) and its size.
  text: "<bold><#FFD94D>+</#FFD94D></bold>"
  scale: 3
  # From the mark's anchor (bottom middle of the text) to its centre, in pixels of the font.
  hotspot: [0, 4.5]

move:
  # Blocks per tick (a walking player does about 0.22, sprinting 0.28).
  speed: 0.24
  # Paths are searched up to this distance.
  max-distance: 48

# Hotbar slot (0 to 8) held during the view: keys 1 to 4 are the spells, so it must be 4 or higher.
rest-slot: 4

# Item in the hero's hand (look only).
weapon: IRON_SWORD

# Basic attack: a click on a monster walks to it and strikes it at the class's attack speed.
basic:
  range: 2.8
  coefficient: 1.0

# The four spells, on keys 1 to 4. Types: line (a blade wave), leap (jump to the pointer, hits where you land),
# strike (a zone hit after a delay), spin (hits around you several times). coefficient x attack (magic: magic power).
spells:
  '1':
    id: wave
    type: line
    range: 9
    width: 1.8
    windup: 4
    coefficient: 1.8
    cooldown: 80
    magic: false
  '2':
    id: leap
    type: leap
    range: 7
    radius: 2.6
    coefficient: 1.3
    cooldown: 160
    magic: false
  '3':
    id: thunder
    type: strike
    range: 12
    radius: 3.2
    delay: 16
    coefficient: 2.6
    cooldown: 200
    magic: true
  '4':
    id: whirl
    type: spin
    radius: 4
    hits: 6
    duration: 36
    coefficient: 0.75
    cooldown: 500
    magic: false
