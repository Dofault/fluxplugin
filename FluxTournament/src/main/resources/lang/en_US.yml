prefix: "&#FFD94DTOURNAMENT &8> "
no-menu: "&#FF5C5CThe tournament menu is missing."
reloaded: "&#2ECF7BFluxTournament reloaded."

names:
  job: "{job} tournament"
  resource: "Rush: {target}"
  race: "Race: {amount} {target}"
  variety: "{job} explorer"
descriptions:
  job: "Earn the most points as {job}: every action of the job counts, rarer ones are worth more."
  resource: "Gather as much {target} as you can before the end."
  race: "The first 3 players to gather {amount} {target} win. The tournament stops once the podium is full."
  variety: "Gather the most different resources of the {job} job: variety counts, not quantity."
score:
  job: "{n} pts"
  resource: "{n}"
  race: "{n}/{amount}"
  variety: "{n} resources"

announce:
