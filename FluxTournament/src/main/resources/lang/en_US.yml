prefix: "&#FFD94DTOURNAMENT &8> "
no-menu: "&#FF5C5CThe tournament menu is missing."
reloaded: "&#2ECF7BFluxTournament reloaded."

draw-heading:
  job: "Draw · Tournament"
  resource: "Draw · Rush"
  race: "Draw · Race"
  variety: "Draw · Explorer"

names:
  job: "{job} tournament"
  resource: "Rush: {target}"
  race: "Race: {amount} {target}"
  variety: "{job} explorer"
short-names:
  job: "{job} tournament"
  resource: "Rush {target}"
  race: "Race {target}"
  variety: "{job} explorer"
descriptions:
  job: "Earn the most points as {job}: every action of the job counts, rarer ones are worth more."
  resource: "Gather as much {target} as you can before the end."
  race: "The first 3 players to gather {amount} {target} win. The tournament stops once the podium is full."
  variety: "Gather the most different resources of the {job} job: variety counts, not quantity."
score:
  job: "{n} pts"
  resource: "{n}"
  race: "{n}/{amount}"
  variety: "{n}/{amount} resources"

announce: "&7A tournament starts in &f{seconds} s&7! The draw will pick the job and the resource."
start:
  - "!&#FFD94D{name} &7has started ({minutes} minutes). &7{description} Ranking: &f/tournament"
end:
  - "!&#FFD94D{name} &7is over."
  - "!  &#F0A8001. &f{1_player} &7- &#FFD94D{1_score}"
  - "!  &#C0C0C02. &f{2_player} &7- &#FFD94D{2_score}"
  - "!  &#CD7F323. &f{3_player} &7- &#FFD94D{3_score}"
end-too-few:
  - "!&#FFD94D{name} &7is over: too few players ({participants}/{min}), no reward."
end-empty: "&7The tournament &f{name} &7ended without any player."
cancelled: "&#FF5C5CThe tournament &f{name} &#FF5C5Cwas cancelled."
joined: "&7You take part in &f{name}&7. Ranking: &f/tournament&7."
race-finished: "&#FFD94D{player} &7finished the race in place &#FFD94D{place}&7!"
variety-new: "&#2BC4E8New resource: &f{resource} &7({count}/{amount})"
variety-complete: "&#2BC4E8{player} &7gathered every resource: &f{name} &7ends now, ranking frozen!"
your-result: "&7You finish &#FFD94D#{place} &7with &f{score}&7. Tournament points: &#FFD94D{points}"

bossbar: "&#2BC4E8&l{name}   &#A6E4F5Time &f{time}   &#A6E4F5Place &f#{place}   &#A6E4F5Score &f{score}   &#A6E4F5Players &f{players}"
bossbar-none: "&#2BC4E8&l{name}   &#A6E4F5Time &f{time}   &#A6E4F5Players &f{players}"
ranking:
  - "!&#2BC4E8{name} &7- ranking, &f{time} &7left"
  - "!  &#F0A8001. &f{1_player} &7- &#A6E4F5{1_score}"
  - "!  &#C0C0C02. &f{2_player} &7- &#A6E4F5{2_score}"
  - "!  &#CD7F323. &f{3_player} &7- &#A6E4F5{3_score}"
  - "!  &7You: &f#{place} &7of {players} - &#A6E4F5{score}"

