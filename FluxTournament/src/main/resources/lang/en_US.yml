  - "!  &#C0C0C02. &f{2_player} &7- &#FFD94D{2_score}"
  - "!  &#CD7F323. &f{3_player} &7- &#FFD94D{3_score}"
end-too-few:
  - "!&#FFD94D{name} &7is over: too few players ({participants}/{min}), no reward."
end-empty: "&7The tournament &f{name} &7ended without any player."
cancelled: "&#FF5C5CThe tournament &f{name} &#FF5C5Cwas cancelled."
joined: "&7You take part in &f{name}&7. Ranking: &f/tournament&7."
race-finished: "&#FFD94D{player} &7finished the race in place &#FFD94D{place}&7!"
variety-new: "&#FFD94DNew resource: &f{resource} &7({count})"
