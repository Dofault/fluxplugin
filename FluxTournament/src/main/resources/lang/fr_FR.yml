prefix: "&#FFD94Dᴛᴏᴜʀɴᴏɪ &8▸ "
no-menu: "&#FF5C5CLe menu des tournois est introuvable."
reloaded: "&#2ECF7BFluxTournament rechargé."

# Nom et description de chaque sorte de tournoi. {job} = métier, {target} = ressource, {amount} = objectif.
names:
  job: "Tournoi : {job}"
  resource: "Ruée : {target}"
  race: "Course : {amount} {target}"
  variety: "Exploration : {job}"
descriptions:
  job: "Gagne le plus de points dans le métier {job} : chaque action du métier compte, les plus rares valent davantage."
  resource: "Récolte le plus de {target} possible avant la fin."
  race: "Les 3 premiers à récolter {amount} {target} gagnent. Le tournoi s'arrête dès que le podium est complet."
  variety: "Récolte le plus de ressources différentes du métier {job} : la variété compte, pas la quantité."
# Score affiché, {n} = valeur, {amount} = objectif d'une course
score:
  job: "{n} pts"
  resource: "{n}"
  race: "{n}/{amount}"
  variety: "{n} ressources"

announce:
  - "!"
  - "!&#8A8A8A&m                       &r &#FFD94Dᴛᴏᴜʀɴᴏɪ &#8A8A8A&m                        "
  - "!  &#FFD94D{name} &7· dans {seconds} s &#FFD94D✦"
  - "!  &7{description}"
  - "!&#8A8A8A&m                                                            "
start:
  - "!"
  - "!&#8A8A8A&m                       &r &#FFD94Dᴛᴏᴜʀɴᴏɪ &#8A8A8A&m                        "
  - "!  &#FFD94D{name} &7· commencé &#FFD94D✦"
  - "!"
  - "!  &7Durée : &f{minutes} minutes"
  - "!  &7{description}"
