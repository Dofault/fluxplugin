  - "!  &#FFD94D{name} &7· terminé &#FFD94D✦"
  - "!"
  - "!  &#F0A800① &f{1_player} &7· &#FFD94D{1_score}"
  - "!  &#C0C0C0② &f{2_player} &7· &#FFD94D{2_score}"
  - "!  &#CD7F32③ &f{3_player} &7· &#FFD94D{3_score}"
  - "!"
