prefix: "&#2BC4E8ᴛᴏᴜʀɴᴏɪ &8▸ "
no-menu: "&#FF5C5CLe menu des tournois est introuvable."
rpg-on: "&7Tu verras les tournois même dans le monde RPG."
rpg-off: "&7Plus de tournois affichés dans le monde RPG."
reloaded: "&#2ECF7BFluxTournament rechargé."

# Titre du tirage au sort animé, par sorte de tournoi
draw-heading:
  job: "Tirage tournoi · Métier"
  resource: "Tirage tournoi · Farm"
  race: "Tirage tournoi · Course"
  variety: "Tirage tournoi · Explo"

# Nom et description de chaque sorte de tournoi. {job} = métier, {target} = ressource, {amount} = objectif.
names:
  job: "Tournoi : {job}"
  resource: "Farm : {target}"
  race: "Course : {amount} {target}"
  variety: "Explo : {job}"
# Nom court (barre de boss, classement du tchat)
short-names:
  job: "Tournoi &f{job}"
  resource: "Farm &f{target}"
  race: "Course &f{target}"
  variety: "Explo &f{job}"
descriptions:
  job: "Chaque action du métier rapporte des points, les plus rares en valent davantage."
  resource: "Récolte le plus de {target} possible."
  race: "Les 3 premiers à récolter {amount} {target} gagnent, le tournoi s'arrête là."
  variety: "Récolte le plus de ressources différentes du métier."
# Score affiché, {n} = valeur, {amount} = objectif d'une course
score:
  job: "{n} pts"
  resource: "{n}"
  race: "{n}/{amount}"
  variety: "{n}/{amount} ressources"

announce: "&#DADADAUn tournoi commence dans &f{seconds} s &#DADADA: le tirage au sort désignera le métier et la ressource."
start:
  - "!&#8A8A8A&m                        &r&#8A8A8A ᴛᴏᴜʀɴᴏɪ &m                        "
  - "!&r"
  - "!&r &8『&r {kind} &#2BC4E8&l{short} {icon}&r &8』"
  - "!&r"
  - "!&r   &#DADADA{description}"
  - "!&r  &8• &7Dᴜʀéᴇ :&f {minutes} minutes"
  - "!&r  &8• &7Cʟᴀꜱꜱᴇᴍᴇɴᴛ :&f [/tournoi]"
  - "!&r"
  - "!&#8A8A8A&m                                                            "
end:
  - "!&#8A8A8A&m                        &r&#8A8A8A ᴛᴏᴜʀɴᴏɪ &m                        "
  - "!&r"
  - "!&r &8『&r {kind} &#2BC4E8&l{short} {icon}&r &8』 &7terminé"
  - "!&r"
  - "!&r   &#F0A800① &f{1_player} &8• &#A6E4F5{1_score}"
  - "!&r   &#C0C0C0② &f{2_player} &8• &#A6E4F5{2_score}"
  - "!&r   &#CD7F32③ &f{3_player} &8• &#A6E4F5{3_score}"
  - "!&r"
  - "!&r  &8• &7Pᴀʀᴛɪᴄɪᴘᴀɴᴛꜱ :&f {participants}"
  - "!&r  &8• &7Hɪꜱᴛᴏʀɪǫᴜᴇ :&f [/tournoi]"
  - "!&r"
  - "!&#8A8A8A&m                                                            "
end-too-few:
  - "!&#8A8A8A&m                        &r&#8A8A8A ᴛᴏᴜʀɴᴏɪ &m                        "
  - "!&r"
  - "!&r &8『&r {kind} &#2BC4E8&l{short} {icon}&r &8』 &7terminé"
  - "!&r"
  - "!&r   &#F0A800① &f{1_player} &8• &#A6E4F5{1_score}"
  - "!&r"
  - "!&r   &#DADADAPas assez de participants ({participants}/{min}) : aucune récompense."
  - "!&r"
  - "!&#8A8A8A&m                                                            "
end-empty: "&7Le tournoi &f{name} &7est terminé sans participant."
cancelled: "&#FF5C5CLe tournoi &f{name} &#FF5C5Ca été annulé."
joined: "&7Tu participes au tournoi &f{name}&7. Suis ton classement dans &f/tournoi&7."
race-finished: "&#FFD94D{player} &7a terminé la course en &#FFD94D{place}e position &7!"
variety-new: "&#2BC4E8Nouvelle ressource : &f{resource} &7({count}/{amount})"
variety-complete: "&#2BC4E8{player} &7a récolté toutes les ressources : &f{name} &7s'arrête, classement figé !"
your-result: "&7Tu termines &#FFD94D{place}e &7avec &f{score}&7. Points de tournoi gagnés : &#FFD94D{points}"

bossbar: "{kind} &#2BC4E8&l{name}   <sprite:items:item/clock_00> &f{time}   &#A6E4F5Place &f{place}e   &#A6E4F5Score &f{score}   <head:entity/player/wide/steve> &f{players}"
bossbar-none: "{kind} &#2BC4E8&l{name}   <sprite:items:item/clock_00> &f{time}   <head:entity/player/wide/steve> &f{players}"
# Classement envoyé dans le tchat aux participants (ranking-every-minutes)
ranking:
  - "!&r"
  - "!&r &8『&r {kind} &#2BC4E8&l{name} {icon}&r &8』 &7encore &f{time}"
  - "!&r   &#F0A800① &f{1_player} &8• &#A6E4F5{1_score}"
  - "!&r   &#C0C0C0② &f{2_player} &8• &#A6E4F5{2_score}"
  - "!&r   &#CD7F32③ &f{3_player} &8• &#A6E4F5{3_score}"
  - "!&r  &8• &7Tᴏɪ :&f {place}e &7sur {players} &8• &#A6E4F5{score}"
  - "!&r"

