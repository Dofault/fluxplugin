name: FluxMenu
version: 0.1.0
main: fr.influencraft.fluxmenu.FluxMenu
api-version: "26.2"
description: Menus maison d'Influencraft (remplaçant de DeluxeMenus), inventaire du joueur masquable.
authors: [Influencraft]
depend: [packetevents]
softdepend: [ItemsAdder, PlaceholderAPI, DeluxeMenus, EcoBattlepass, EcoJobs, InfluCasino]

commands:
  fluxmenu:
    description: Administration de FluxMenu.
    usage: /fluxmenu <open|reload|list>
    aliases: [fmenu]

permissions:
  fluxmenu.admin:
    description: /fluxmenu (open, reload, list).
    default: op
