name: FluxLands
version: 0.3.0
main: fr.influencraft.fluxlands.FluxLands
# 26.2 = version minimale, le plugin se charge aussi en 26.3 (compilation vérifiée par le profil Maven paper-26.3).
api-version: '26.2'
authors: [Dofault, Entr0pik]
description: Extension de Lands (ex-InfluVille) - villes, pays, warps (InfluPW), échoppes (FluxChestShop) unifiés.
depend: [Lands, Vault, Flux]
softdepend: [InfluPW, FluxChestShop, ItemsAdder]

permissions:
  influlands.use:
    description: Naviguer dans les menus Ville, Annuaire, Warps, Échoppes et Agence.
    default: true
  influlands.admin:
    description: Rechargement, diagnostic, réglage du droit de place de n'importe quelle ville.
    default: op
