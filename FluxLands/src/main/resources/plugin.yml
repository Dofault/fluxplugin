name: FluxLands
version: '1.0.0'
main: fr.influencraft.fluxlands.FluxLands
# 26.2 = version minimale, le plugin se charge aussi en 26.3 (compilation vérifiée par le profil Maven paper-26.3).
api-version: '26.2'
authors: [Influencraft]
description: Extension de Lands.
depend: [Lands, Flux]
# FluxCommerce is not listed: it loads after FluxLands (its market reads the towns), chest shops are linked on the
# first tick.
softdepend: [FluxPW]

permissions:
  fluxlands.voxel:
    description: /v opens VoxelSniper (builders) instead of the towns, which stay on /ville.
    default: op
  fluxlands.admin:
    description: Rechargement, diagnostic, réglage du droit de place de n'importe quelle ville.
    default: op
