name: InfluLands
version: 0.3.0
main: fr.influencraft.influlands.InfluLands
# 26.2 = version minimale, le plugin se charge aussi en 26.3 (compilation vérifiée par le profil Maven paper-26.3).
api-version: '26.2'
authors: [Dofault, Entr0pik]
description: Extension de Lands (ex-InfluVille) - villes, pays, warps (InfluPW), échoppes (InfluEchoppe) unifiés.
depend: [Lands, Vault]
softdepend: [PlaceholderAPI, InfluPW, InfluEchoppe, ItemsAdder, FluxMenu]

commands:
  influlands:
    description: Navigation des menus Ville (appelée par FluxMenu) et administration.
    # influville / iv : anciens noms (InfluVille), gardés pour ne casser aucun bouton ou raccourci existant.
    aliases: [il, influville, iv]
    usage: /<command> aide

permissions:
  influlands.use:
    description: Naviguer dans les menus Ville, Annuaire, Warps, Échoppes et Agence.
    default: true
  influlands.admin:
    description: Rechargement, diagnostic, réglage du droit de place de n'importe quelle ville.
    default: op
