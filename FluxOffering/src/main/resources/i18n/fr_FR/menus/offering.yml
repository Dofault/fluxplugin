# FluxOffering : l'offrande ouverte par le joueur (/offrande [collection]). L'argent et les objets demandés sont la
# liste « offering » (chaque élément porte son objet, son nom et sa progression) ; les clics passent par [offering].
title: "&8%offrandes_current_name%"
rows: 6
player-inventory: hidden
vanilla-background: true

lists:
  offering:
    slots: 10-16,19-25,28-34
    item:
      material: entry
      actions:
        left: ["[offering] click %entry_id% left"]
        right: ["[offering] click %entry_id% right"]

items:
  retour:
    slot: 45
    material: "itemsadder:influitems:btn_back"
    name: "&r&7%img_left_click% &#FFD94DRetour"
    lore: ["&#B376E5Retour au menu principal."]
    view-requirements: ["placeholder: %flux_list_offering_has_prev% == false"]
    actions:
      left: ["[close]", "[player] menu"]
  precedente:
    slot: 45
    material: "itemsadder:influitems:btn_prev"
    name: "&r&7%img_left_click% &#FFD94DPage précédente"
    priority: -1
    view-requirements: ["placeholder: %flux_list_offering_has_prev% == true"]
    actions:
      left: ["[list] offering prev"]
  suivante:
    slot: 53
    material: "itemsadder:influitems:btn_next"
    name: "&r&7%img_left_click% &#FFD94DPage suivante"
    view-requirements: ["placeholder: %flux_list_offering_has_next% == true"]
    actions:
      left: ["[list] offering next"]
  filtre:
    slot: 49
    material: "itemsadder:influitems:filter"
    name: "&r&7%img_left_click% &#FFD94DAffichage : %flux_list_offering_filter%"
    lore:
      - "&#B376E5Tout, Déposés (offrande remplie),"
      - "&#B376E5Non déposés (ce qu'il reste à faire)."
      - ""
      - "&#B376E5Clique pour changer l'affichage."
    view-requirements: ["placeholder: %offrandes_editing% == false"]
    actions:
      left: ["[list] offering filter"]
  tout_deposer:
    slot: 40
    material: CHEST
    name: "&r&7%img_left_click% &#FFD94DTout déposer"
    lore:
      - "&#B376E5Dépose d'un coup tout ce que"
      - "&#B376E5tu peux, sur tous les items"
      - "&#B376E5de cette offrande."
      - ""
      - "&#B376E5Progression : &f%offrandes_current_percent% %"
    view-requirements:
      - "placeholder: %offrandes_editing% == false"
      - "placeholder: %offrandes_current_complete% == false"
    actions:
      left: ["[offering] depositall"]
  edition:
    slot: 0
    material: ANVIL
    name: "&r&7%img_left_click% &#FFD94DModifier cette offrande"
    lore: ["&#B376E5Réservé aux administrateurs."]
    view-requirements:
      - "permission: offrandes.admin"
      - "placeholder: %offrandes_editing% == false"
    actions:
      left: ["[offering] editor"]
  quitter_edition:
    slot: 0
    material: BARRIER
    name: "&r&7%img_left_click% &#FFD94DQuitter l'édition"
    lore: ["&#B376E5Retour à la vue normale."]
    view-requirements:
      - "permission: offrandes.admin"
      - "placeholder: %offrandes_editing% == true"
    actions:
      left: ["[offering] editor"]
  ajouter:
    slot: 8
    material: "itemsadder:influitems:add"
    name: "&r&7%img_left_click% &#FFD94DDemander l'objet en main"
    lore:
      - "&#B376E5Tiens l'objet (ou un livre enchanté)"
      - "&#B376E5puis clique pour fixer sa quantité."
    view-requirements:
      - "permission: offrandes.admin"
      - "placeholder: %offrandes_editing% == true"
    actions:
      left: ["[offering] additem"]
