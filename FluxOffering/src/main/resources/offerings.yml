# Offerings: this file says WHAT each offering asks for, the amounts are computed. Readable result: quantities.md.
#   hours played up to grade g = total-hours x (g / 35)^exponent
#   a grade's hours are split evenly between the jobs it asks for, then between the items of each job
#   amount = hours x points per second x job speed at that grade / points of the item (FluxValue)
# Changing a weight in FluxValue/sources.yml, total-hours, or adding an item here recomputes everything (/fluxvalue reload).
# An offering is made at grade g and gives grade g+1. slots: the composition of each position; cycles
# (Prestige) reuse the same items, only the amount changes: grade 13 (Inconnu Prestige I) asks what grade 1 asks.
# items.<item>: 1 = normal share within its job, 2 = two shares.
budget:
  total-hours: 1000
  exponent: 2.5
  # Effort of the first grades, in hours of optimal play: same order of magnitude as production up to Influenceur, not matched grade by grade.
  # After the last anchor, the total-hours curve takes over (grade 11: same value as that curve).
  anchors:
    1: 0.0069
    6: 2.76
    11: 9.72
# Money asked: 1,000 at grade 1 and 167,000 at grade 6 as in production, Supreme at 1,000,000; between two anchors the progression
# is regular, after the last one it follows the resource curve. A composition may set its own with money: <amount>.
money:
  anchors:
    1: 1000
    6: 167000
    11: 1000000
ramp:
  full-speed-grade: 12
  area-from-grade: 13 # area items (Tranchee) only once Supreme is completed (grade 13)
  beginner-speed:
    default: 0.1
    rochiste: 0.1
    deblayeur: 0.2
    mineur: 0.03
    sylviculteur: 0.1
    herboriste: 0.1
    cultivateur: 0.02
    fondeur: 0.02
    pecheur: 3 # above 1: fishing weighs more early on
    defenseur: 0.07
    enchanteur: 0.05
    chimiste: 0.05
    batisseur: 0.1
