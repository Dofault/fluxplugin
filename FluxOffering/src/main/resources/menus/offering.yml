# FluxOffering : l'offrande ouverte par le joueur (/offrande [collection], ou un clic sur un rang de /grade).
# Fond menu_offrande_<rang> (Flux/assets/offrande/gen_fonds.py, style inventaire du thème) ; ton inventaire reste
# visible pour voir ce que tu peux déposer. Même principe que le métier et le marché (2026-11-15) : ligne 0 retour (0)
# et icône de l'offrande (8) ; objets demandés sur toute la largeur, liste « offering » (9-35) ; ligne 4 réservée à la
# pagination du thème (widget pages) ; ligne du bas centrée : scoreboard (47), Tout déposer (49), filtre (51), boutons
# d'administration aux bouts (45, 53). Les clics passent par [offering].
title: ":offset_-8::menu_offrande_%offrandes_current_id%:"
rows: 6
player-inventory: visible
vanilla-background: false

lists:
  offering:
    slots: 9-35
    item:
      material: entry
      actions:
        left: ["[offering] click %entry_id% left"]
        right: ["[offering] click %entry_id% right"]

widgets:
  pages:
    type: pager
    list: offering
    prev: 36
    next: 44

items:
  icone:
    slot: 8
    material: "itemsadder:influitems:stairs"
    name: "%offrandes_current_name%"
    lore:
      - "@desc Dépose les objets demandés depuis ton inventaire (clic sur un objet, ou Tout déposer)."
      - "@kv Progression | %offrandes_current_percent% %"
  retour:
    slot: 0
    material: "itemsadder:influitems:btn_back"
    name: "Retour"
    lore:
      - "@desc Retour aux rangs."
      - "@left Rangs"
    actions:
      left: ["[menu] grades"]
  filtre:
    slot: 51
    material: "itemsadder:influitems:filter"
    name: "Filtrer"
    lore:
      - "@filter offering"
    view-requirements: ["placeholder: %offrandes_editing% == false"]
    actions:
      left: ["[list] offering filter"]
      right: ["[list] offering filter-prev"]
  tout_deposer:
    slot: 49
    material: CHEST
    name: "Tout déposer"
    lore:
      - "@desc Dépose d'un coup tout ce que tu peux, sur tous les objets de cette offrande."
      - "@kv Progression | %offrandes_current_percent% %"
      - "@left Tout déposer"
    view-requirements:
      - "placeholder: %offrandes_editing% == false"
      - "placeholder: %offrandes_current_complete% == false"
    actions:
      left: ["[offering] depositall"]
  edition:
    slot: 45
    material: ANVIL
    name: "Modifier cette offrande"
    lore: ["@desc Réservé aux administrateurs.", "@left Modifier"]
    view-requirements:
      - "permission: flux.admin"
      - "placeholder: %offrandes_editing% == false"
    actions:
      left: ["[offering] editor"]
  quitter_edition:
    slot: 45
    material: BARRIER
    name: "Quitter l'édition"
    lore: ["@desc Retour à la vue normale.", "@left Quitter"]
    view-requirements:
      - "permission: flux.admin"
      - "placeholder: %offrandes_editing% == true"
    actions:
      left: ["[offering] editor"]
  ajouter:
    slot: 53
    material: "itemsadder:influitems:add"
    name: "Demander l'objet en main"
    lore:
      - "@desc Tiens l'objet (ou un livre enchanté) puis clique pour fixer sa quantité."
      - "@left Ajouter"
    view-requirements:
      - "permission: flux.admin"
      - "placeholder: %offrandes_editing% == true"
    actions:
      left: ["[offering] additem"]
  # Option du joueur : son offrande affichée ou non dans le scoreboard (/offrande scoreboard, aussi dans /reglages).
  scoreboard_on:
    slot: 47
    material: "itemsadder:influitems:tracking"
    name: "Offrande dans le scoreboard"
    glow: true
    lore:
      - "@desc Affiche dans le scoreboard les objets qu'il te reste à déposer, en orange quand tu as de quoi les compléter."
      - "@ok Affichée."
      - "@left Masquer"
    view-requirements:
      - "placeholder: %offrandes_editing% == false"
      - "placeholder: %offrandes_sidebar_shown% == true"
    actions:
      left: ["[player] offrande scoreboard off", "[refresh]"]
  scoreboard_off:
    slot: 47
    material: "itemsadder:influitems:tracking"
    name: "Offrande dans le scoreboard"
    lore:
      - "@desc Affiche dans le scoreboard les objets qu'il te reste à déposer, en orange quand tu as de quoi les compléter."
      - "@ko Masquée."
      - "@left Afficher"
    view-requirements:
      - "placeholder: %offrandes_editing% == false"
      - "placeholder: %offrandes_sidebar_shown% == false"
    actions:
      left: ["[player] offrande scoreboard on", "[refresh]"]
