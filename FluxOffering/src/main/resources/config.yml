# FluxOffering — configuration generale.
# Les collections (quels items, quelles quantites, quelle permission) vivent dans
# collections.yml, pas ici : ce fichier est volontairement epargne par l'editeur en jeu
# (clic sur le bouton d'edition dans /offrande <collection>) pour ne jamais perdre
# ces commentaires.
#
# Textes joueur (messages de tchat, noms/lore des items de menu) : voir messages.yml.

settings:
  # Un item renomme (enclume) est-il accepte en depot ?
  accept-renamed-items: false
  # Un outil/armure use (durabilite entamee) est-il accepte en depot ?
  # false = seuls les objets a pleine durabilite comptent.
  accept-damaged-tools: false
  # A quelle frequence (en minutes) le plugin sauvegarde en tache de fond les joueurs
  # en ligne dont la progression a change. Independant de la sauvegarde immediate a
  # chaque depot et a l'arret du serveur (celles-ci ont toujours lieu).
  autosave-interval-minutes: 5

storage:
  # Seul 'yaml' est implemente : un fichier par joueur sous plugins/FluxOffering/data/.
  # Un fichier pese quelques centaines d'octets et n'est ecrit qu'au depot/edition admin
  # (jamais en boucle), donc largement suffisant meme avec un millier de joueurs.
  type: yaml

# The menu (layout, buttons, icons) is the Flux menu plugins/FluxOffering/menus/offering.yml; its sounds are the
# cues of the suite (sounds section of plugins/Flux/config.yml) and the money icon is the one of the main currency
# (currencies.<id>.icon in plugins/Flux/config.yml).

wiki:
  enabled: true
  # {title} = titre de la page wiki, derive automatiquement de l'id vanilla de l'objet
  # (ROTTEN_FLESH -> "Rotten Flesh", enchant:bane_of_arthropods -> "Bane of Arthropods").
  # fr.minecraft.wiki garde des redirections depuis les titres anglais vers ses articles
  # francais ("Stone" -> "Roche", "Rotten Flesh" -> "Chair putrefiee"), donc rien a
  # maintenir ici quand un objet est ajoute a une offrande : ca marche tout seul.
  url-format: "https://fr.minecraft.wiki/w/{title}"
  # Les seuls objets dont le titre de page ne se deduit pas de leur id. Verifies le
  # 2026-09-20 sur fr.minecraft.wiki (les 153 autres objets des offrandes se resolvent
  # sans exception). Une cle absente d'ici et sans page (item ItemsAdder, poisson
  # CustomFishing) n'affiche simplement pas le bouton.
  titles:
    AMETHYST_BLOCK: "Block of Amethyst"
    BEEF: "Raw Beef"
    PORKCHOP: "Raw Porkchop"
    SLIME_BALL: "Slimeball"
    DRAGON_BREATH: "Dragon's Breath"
