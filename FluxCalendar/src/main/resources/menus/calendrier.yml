# Calendar menu (/calendrier, FluxCalendar): opens by itself at the first login of a day when today's reward waits.
# A real calendar of the month: weeks on chest rows 0 to 5, Monday to Sunday in columns 1 to 7 (calendrier_jours,
# the day's number is the item count); the player claims today's reward by clicking today's date.
# Month and year engraved on the window's plate (%fluxcalendar_titre%). Nothing else: no back button, no menu icon,
# no inventory row (decision of 2026-11-10, the calendar explains itself; Escape closes it).
# Background fluxcalendar:menu_calendrier, vanilla theme (FluxCalendar/assets/calendrier/gen_fond.py).
title: ":offset_-8::menu_calendrier::offset_-177:%fluxcalendar_titre%"
rows: 6
player-inventory: hidden
vanilla-background: false
update-interval: 40

open-actions:
  - "[sound] @page"

lists:
  calendrier_jours:
    slots: 1-7,10-16,19-25,28-34,37-43,46-52
    item:
      material: entry
      actions:
        left: ["%entry_clic%", "[refresh]"]
