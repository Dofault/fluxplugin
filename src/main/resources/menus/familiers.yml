# Menu /familiers (alias /pets, /pet) : rangées et colonnes à partir de 1. Objets en syntaxe eco
# (« arrow name:"..." », « player_head texture:... », « itemsadder:... »). Placeholders des lores : %pet%,
# %level%, %description%, %effects%, %percentage_progress%, %current_xp%, %required_xp%.

title: '&#FFD94DFamiliers'
rows: 6
mask:
  materials:
  - black_stained_glass_pane
  pattern:
  - '110000011'
  - '111111111'
  - '100000001'
  - '100000001'
  - '100000001'
  - '101000111'
pet-area:
  top-left:
    row: 3
    column: 2
  bottom-right:
    row: 5
    column: 8
# Emplacements des familiers actifs (rangée du haut), dans l'ordre de remplissage : un familier activé prend le
# premier emplacement libre, le n°1 est celui qui suit le joueur (les autres marchent derrière lui). Le joueur a
# autant d'emplacements que son maximum (permission influpet.familiers.max.<n>, cf. config.yml familiers.actifs),
# les suivants s'affichent verrouillés.
pet-slots:
  locations:
  - row: 1
    column: 3
  - row: 1
    column: 4
  - row: 1
    column: 5
  - row: 1
    column: 6
  - row: 1
    column: 7
  # emplacement occupé (clic gauche : progression, clic droit : ranger)
  active:
    name: '%pet% &#FFD94DNiv. %level%'
    lore:
    - '&r&7%img_right_click% &#FFD94DRanger'
    - ''
    - '%description%'
    - '&#6B7A8F(clic droit sur une de ses cartes)'
    - ''
    - '&#FFD94DEffets :'
    - '%effects%'
    - ''
    - '&#FFD94DProgression :'
    - '&8» &#B376E5%percentage_progress% %'
    - '&8» &#B376E5%current_xp%&8/&7%required_xp% &#B376E5XP'
    - ''
    - '&r&7%img_left_click% &#FFD94DVoir la progression'
    max-level-lore:
    - '&r&7%img_right_click% &#FFD94DRanger'
    - ''
    - '%description%'
    - '&#6B7A8F(clic droit sur une de ses cartes)'
    - ''
    - '&#FFD94DEffets :'
    - '%effects%'
    - ''
    - '&#2ECF7BNiveau maximum atteint'
    - ''
    - '&r&7%img_left_click% &#FFD94DVoir la progression'
  # emplacement libre (%slot% : numéro de l'emplacement)
  empty:
    name: '&#FFD94DEmplacement libre'
    lore:
    - ''
    - '&#B376E5Clique sur un familier'
    - '&#B376E5ci-dessous pour l''activer.'
    - ''
    item: player_head texture:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmFkYzA0OGE3Y2U3OGY3ZGFkNzJhMDdkYTI3ZDg1YzA5MTY4ODFlNTUyMmVlZWQxZTNkYWYyMTdhMzhjMWEifX19
  # emplacement au-delà du maximum du joueur. %slot% : numéro de l'emplacement ; %grade% : texte de « grades »
  # pour cet emplacement (une ligne contenant %grade% est retirée tant qu'aucun grade n'y est indiqué).
  # Placeholders PlaceholderAPI acceptés dans le nom et la description.
  locked:
    item: barrier
    name: '&#FF5C5CEmplacement verrouillé'
    lore:
    - ''
    - '&#B376E5Tu n''as pas encore accès'
    - '&#B376E5à cet emplacement.'
    - '&#B376E5Grade requis : %grade%'
    - ''
    # numéro d'emplacement : texte de %grade%, par exemple « 2: '&#FFD94DCitoyen' »
    grades: {}
pet-icon:
  name: '%pet% &#FFD94DNiv. %level%'
  lore:
  - '%description%'
  - '&#6B7A8F(clic droit sur une de ses cartes)'
  - ''
  - '&#FFD94DEffets :'
  - '%effects%'
  - ''
  - '&#FFD94DProgression :'
  - '&8» &#B376E5%percentage_progress% %'
  - '&8» &#B376E5%current_xp%&8/&7%required_xp% &#B376E5XP'
  max-level-lore:
  - '%description%'
  - '&#6B7A8F(clic droit sur une de ses cartes)'
  - ''
  - '&#FFD94DEffets :'
  - '%effects%'
  - ''
  - '&#2ECF7BNiveau maximum atteint'
  active-lore:
  - ''
  - '&#2ECF7BFamilier actif'
  - '&r&7%img_left_click% &#FFD94DRanger'
  not-active-lore:
  - ''
  - '&r&7%img_left_click% &#FFD94DActiver'
  click:
    enabled: true
    sound: ui_button_click
    pitch: 1
    volume: 1
    category: UI
page-change-sound:
  enabled: true
  sound: ui_button_click
  pitch: 1
  volume: 1
  category: UI
prev-page:
  item: arrow name:"&#FFD94DPage précédente"
  location:
    row: 6
    column: 4
next-page:
  item: arrow name:"&#FFD94DPage suivante"
  item-inactive: gray_dye name:"&7Page suivante"
  location:
    row: 6
    column: 6
