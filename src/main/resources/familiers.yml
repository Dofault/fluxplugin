# Effets de familiers codés dans InfluCard (impossibles en config libreforge).
# Généré par scripts/influcard/appliquer_effets.py depuis effets_familiers.JAVA : modifier le script,
# pas ce fichier. Relu par /influcard reload.
# min = valeur au niveau 1, max = valeur au niveau max, linéaire entre les deux.

niveau-max: 10
effets:
  xp-pierre:
    familier: caillou
    min: 1
    max: 10
    xp: 1
    blocs:
    - stone
  sans-mise-a-jour:
    familier: fourmi
    min: 10
    max: 100
  neige-poudreuse:
    familier: lievre_neiges
    min: 0.5
    max: 5
    recharge: 30
    message-fin: '&#B376E5Ton Lièvre des Neiges se repose &#FFD94D%secondes% s'
  replant-cacao:
    familier: ouistiti
    min: 10
    max: 100
  poudre-os-instant:
    familier: gland
    min: 10
    max: 100
  resistance-allies:
    familier: pavois
    min: 4
    max: 12
    intervalle-ticks: 40
  rage:
    familier: chien_garde
    min: 10
    max: 100
  beton-instant:
    familier: betonniere
    min: 10
    max: 100
  cuisson-rapide:
    familier: soufflet
    min: 10
    max: 100
  livraison-four:
    familier: fournaise
    min: 10
    max: 100
    rayon: 16
  lapis-econome:
    familier: lapin_lapis
    min: 10
    max: 100
  niveaux-econome:
    familier: orbe_xp
    min: 1
    max: 10
  usure-savante:
    familier: chouette_arcane
    min: 1500
    max: 500
    message: '&#B376E5Ta Chouette Arcane fait progresser &#FFD94D%enchant%'
trainees:
  phenix:
    particule: flame
    nombre: 2
    intervalle: 2
    hauteur: 0.3
  astrolabe:
    particule: end_rod
    nombre: 2
    intervalle: 2
    hauteur: 0.3
  kitsune:
    particule: snowflake
    nombre: 2
    intervalle: 2
    hauteur: 0.3
  licorne:
    particule: firework
    nombre: 2
    intervalle: 2
    hauteur: 0.3
  nida:
    particule: reverse_portal
    nombre: 2
    intervalle: 2
    hauteur: 0.3
