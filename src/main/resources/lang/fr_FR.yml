# InfluPet : textes affichés aux joueurs (français). Choisi par « language » dans config.yml : lang/<language>.yml.
# Une clé absente ici reprend le texte par défaut du plugin (anglais).
#
# Codes & et &#RRGGBB. %img_<id>% affiche un glyphe ItemsAdder (influtags, influemoji, influitems, influcards),
# toujours précédé de &r&f pour garder ses couleurs.
# Palette des cartes (hors charte serveur) : corail #FF7A59 (accent), parchemin #EADBC8 (textes),
# crème #FFF4E0 (noms), ardoise #6B7A8F (secondaire), sarcelle #5FB3B3 (infos), brique #D9534F (erreurs).

messages:
  prefix: "&#FF7A59ᴄᴀʀᴛᴇꜱ &#6B7A8F▸ "
  opened: "&#EADBC8Ouverture d'un %booster%&#EADBC8..."
  finished: "&#EADBC8Booster terminé : &#FFF4E0%count% &#EADBC8cartes obtenues."
  opened-all: "&#FFF4E0%boosters% &#EADBC8boosters ouverts : &#FFF4E0%count% &#EADBC8cartes obtenues."
  skipped: "&#6B7A8FRévélation passée, cartes ajoutées à ton inventaire."
  inventory-full: "&#D9534FInventaire plein : des cartes sont tombées à tes pieds."
  inventory-needed: "&#D9534FPas assez de place : libère &#FFF4E0%slots% &#D9534Femplacement(s) pour ouvrir ce booster."
  empty-booster: "&#D9534FCe booster ne contient aucune carte (configuration à vérifier)."
  unknown-booster: "&#D9534FBooster inconnu : &#FFF4E0%id%"
  unknown-card: "&#D9534FCarte inconnue : &#FFF4E0%id%"
  player-not-found: "&#D9534FJoueur introuvable : &#FFF4E0%player%"
  invalid-amount: "&#D9534FNombre invalide : &#FFF4E0%amount% &#6B7A8F(1 à 64)"
  given: "&#FFF4E0%amount%x &r%item% &#EADBC8donné(s) à &#FFF4E0%player%&#EADBC8."
  opened-for: "&#FFF4E0%amount% &#EADBC8booster(s) &r%booster% &#EADBC8ouvert(s) pour &#FFF4E0%player%&#EADBC8."
  reloaded: "&#EADBC8Configuration rechargée : &#FFF4E0%cards% &#EADBC8cartes, &#FFF4E0%boosters% &#EADBC8boosters."
  unknown-pet: "&#D9534FFamilier inconnu : &#FFF4E0%id%"
  player-only: "&#D9534FCommande réservée aux joueurs."
  no-permission: "&#FF5C5CTu n'as pas la permission."
  already-exists: "&#D9534F« %id% » existe déjà."
  created: "&#EADBC8« &#FFF4E0%id%&#EADBC8 » créé."
  deleted: "&#EADBC8« &#FFF4E0%id%&#EADBC8 » supprimé."
  prompt-hint: "&#6B7A8FÉcris ta réponse dans le tchat, ou « annuler »."
  # mot qui annule une saisie dans le tchat (« cancel » marche toujours aussi)
  prompt-cancel-word: "annuler"
  prompt-cancelled: "&#6B7A8FSaisie annulée."
  prompt-timeout: "&#6B7A8FSaisie expirée."
  pet-broadcast: "&#FFF4E0%player% &#EADBC8vient d'adopter &r%pet%&#EADBC8 !"
  pet-unlocked: "&#5FB3B3Nouveau familier adopté : &r%pet%&#5FB3B3 !"
  series-complete: "&#FFD94DSérie %series% complète ! &#EADBC8Tu reçois ses &#FFF4E0%count% &#EADBC8peluches."
  card-used: "&#FFF4E0%amount% &#EADBC8carte(s) utilisée(s) : &#FFF4E0+%xp% XP &#EADBC8pour &r%pet%"
  card-pet-locked: "&#D9534FTu n'as pas encore adopté &r%pet%&#D9534F : ouvre son booster pour le débloquer."
  card-no-use: "&#6B7A8FCette carte ne nourrit aucun familier."
  usage:
    - "&#FF7A59/influpet menu &#6B7A8F- édition des boosters, cartes et familiers"
    - "&#FF7A59/influpet give <joueur> booster <id> [nombre] &#6B7A8F- donne des boosters"
    - "&#FF7A59/influpet give <joueur> card <id> [nombre] &#6B7A8F- donne une carte précise"
    - "&#FF7A59/influpet open <joueur> <booster> [nombre] &#6B7A8F- ouvre des boosters sans l'objet"
    - "&#FF7A59/influpet list <cards|pets|boosters> &#6B7A8F- liste le contenu"
    - "&#FF7A59/influpet info <card|pet|booster> <id> &#6B7A8F- détail et chances de tirage"
    - "&#FF7A59/influpet pet <give|take|givexp|reset|setlevel|...> <joueur> &#6B7A8F- familiers d'un joueur"
    - "&#FF7A59/influpet reload &#6B7A8F- recharge la configuration"
  list:
    cards: "&#FF7A59Cartes &#6B7A8F(%count%)"
    card: "&#6B7A8FN°%number% &r%name% &#6B7A8F(%id%)"
    pets: "&#FF7A59Familiers &#6B7A8F(%count%)"
    pet-enabled: "&r%name% &#6B7A8F(%id%, obtenable)"
    pet-disabled: "&r%name% &#6B7A8F(%id%, désactivé)"
    boosters: "&#FF7A59Boosters &#6B7A8F(%count%)"
    booster: "&r%name% &#6B7A8F(%id%, %draws% tirages)"
  info:
    card: "%name% &#6B7A8F(%id%, N°%number%, série %series%)"
    pet: "%name% &#6B7A8F(%id%)"
    chance: "&#6B7A8F- &r%booster% &#EADBC8: %chance% par tirage"
    booster: "%name% &#6B7A8F(%id%, %draws% tirages) - chance par tirage :"
    pets-share: "&#FF7A59Familiers &#EADBC8%chance% des tirages"
    cards-share: "&#FF7A59Cartes &#EADBC8%chance% des tirages"

# Révélation d'un booster
reveal:
  actionbar: '%card%'
  # quantité au milieu de l'écran (sous-titre en gros)
  subtitle: '%rarity_color%&lx%count%'
  # verso commun des cartes, affiché en grand avant chaque carte
  back-title: "&r&f%img_carte_verso_grand%"
  actionbar-pet: "%card% &#5FB3B3Nouveau familier !"
  actionbar-pet-duplicate: '%card% &#6B7A8FDéjà adopté &#EADBC8: sa carte et sa peluche'
  actionbar-pet-duplicate-incomplete: '%card% &#6B7A8FDéjà adopté &#EADBC8: sa carte en plus'

# Adoption d'un familier : titre = nom du familier, sous-titre en petites capitales
pet-reveal:
  title: "%pet%"
  subtitle: "&#FF7A59Nᴏᴜᴠᴇᴀᴜ Fᴀᴍɪʟɪᴇʀ"

# Cartes : %tag% (rareté), %name%, %number% (N° dans la collection), %series%
card-format:
  name: "%tag% &#FFF4E0%name%"
  lore-header:
    - "&#6B7A8FN°%number% &#6B7A8F• %series%"
    - ""
  lore-footer: []
  # ajouté aux cartes qui nourrissent un familier
  lore-pet:
    - ""
    - "&#5FB3B3+%xp% XP &#EADBC8pour &r%pet%"
    - "&#6B7A8F[Clic droit] &#FF7A59Nourrir &#6B7A8F(Maj : toute la pile)"

# Familiers
pets:
  # nom d'un familier dans les menus d'édition et les annonces
  name-format: "%tag% &#5FB3B3%name%"

pet-settings:
  # nom affiché au-dessus du modèle qui suit le joueur
  pet-entity:
    name: "%pet%&f (Niv. %level%)"
  level-up:
    message:
      message:
        - ""
        - " &#B376E5Ton familier %pet%&#B376E5 passe au &#FFD94Dniveau %level%&#B376E5 !"
        - ""
        - " &#FFD94D&lEFFETS :"
        - " %level_up_messages%"
        - ""
  messages:
    prefix: "&#FFD94D&lFamiliers &8» &r"
    invalid-pet: "&#FF5C5CFamilier inconnu ou pas adopté."
    pet-already-active: "&#FF5C5CCe familier est déjà actif."
    cannot-activate-pet: "&#FF5C5CTu ne peux pas activer %pet%&#FF5C5C ici."
    activated-pet: "&#B376E5Familier activé : %pet%"
    deactivated-pet: "&#B376E5Familier rangé : %pet%"
    no-pet-active: "&#FF5C5CTu n'as aucun familier actif."
    pet-auto-deactivated: "&#FF5C5CTon familier %pet%&#FF5C5C a été rangé : ses conditions ne sont plus remplies."
    max-pets-reached: "&#FF5C5CTu as déjà %max% familier(s) actif(s) : range-en un d'abord (clic dessus)."
    cancelled-swap: "&#FF5C5CChangement de familier annulé."
    player-only: "&#FF5C5CCommande réservée aux joueurs."
    # /influpet pet ... (administration)
    admin:
      unavailable: "&#D9534FSystème de familiers inactif (cf. logs du démarrage)."
      usage: "&#FF7A59/influpet pet <give|take|givexp|givecurrentxp|reset|setlevel|activate|deactivate> <joueur> [familier] [valeur]"
      unknown-player: "&#D9534FJoueur inconnu : %player%"
      unknown-pet: "&#D9534FFamilier inconnu : %id%"
      offline: "&#D9534F%player% n'est pas connecté."
      invalid-number: "&#D9534FNombre invalide."
      not-owned: "&#D9534F%player% n'a pas %pet%&#D9534F."
      no-active-pet: "&#D9534F%player% n'a pas de familier actif (ou n'est pas connecté)."
      adopted: "&#EADBC8%player% adopte %pet%&#EADBC8."
      already-adopted: "&#D9534F%player% a déjà %pet%&#D9534F (ou adoption annulée)."
      taken: "&#EADBC8%pet%&#EADBC8 retiré à %player%."
      level-set: "&#EADBC8%pet%&#EADBC8 de %player% au niveau %level%."
      xp-given: "&#EADBC8%xp% XP donnée à %pet%&#EADBC8 de %player%."
      activated: "&#EADBC8%pet%&#EADBC8 activé pour %player%."
      activation-failed: "&#D9534FActivation de %pet%&#D9534F impossible : %reason% (max %max%)."
      deactivated: "&#EADBC8Familier(s) de %player% rangé(s)."
      nothing-to-deactivate: "&#D9534F%player% n'a rien à ranger."

