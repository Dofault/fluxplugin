# Familiers EcoPets obtenables dans les boosters (réglables dans /influpet menu > Familiers).
# Un familier ne sort qu'une fois par booster. Peluches (pets.list.<id>.plush, influcards:peluche_<id>
# par défaut) : l'adoption qui complète une série donne les peluches de toute la série, puis chaque
# doublon d'une série complète donne sa peluche (série incomplète : rien). Déjà adopté : "reroll" (jamais tiré
# pour ce joueur) ou "xp" (peut ressortir : peluche + duplicate-xp points d'XP, 0 = peluche seule).
pets:
  name-format: "%tag% &#5FB3B3%name%"
  duplicate: xp
  duplicate-xp: 0
  list: {}

boosters:
  basique:
    item: influcards:booster_basique
    name: "&#FF7A59&lBooster Basique"
    lore:
      - "&#EADBC8Contient &#FFF4E0%cards% &#EADBC8cartes de la série"
      - "&#FFF4E0Flammes&#EADBC8."
      - ""
      - "&r&7%img_right_click% &#FF7A59Ouvrir"
    cards: 5
    # Poids de tirage par rareté pour chaque carte, puis carte au hasard dans la rareté.
    # Une rareté sans carte est ignorée (ici fabled).
    rarity-weights:
      simple: 50
      unique: 25
      elite: 13
      ultimate: 7
      legendary: 4
      fabled: 1
    # Récompenses possibles ("carte:<id>", "familier:<id>"). Vide = toutes les cartes et
    # tous les familiers obtenables.
    contents: []

# Familiers BetterModel qui suivent le joueur (PetFollowers) au lieu d'être collés à sa caméra.
# Distances en blocs, par rapport au joueur et à sa direction de marche.
familier-suivi:
  cote: 1.0              # écart sur le côté en marchant
  arriere: 1.2           # retard derrière le joueur en marchant
  hauteur: 0.9           # hauteur au-dessus des pieds du joueur
  distance-min: 1.0      # à l'arrêt, s'écarte s'il est plus près
  distance-max: 3.5      # à l'arrêt, revient s'il est plus loin
  teleport-distance: 16  # au-delà, réapparaît à côté du joueur
  lissage: 0.18          # part du chemin parcourue par tick (plus haut = plus réactif)
  vitesse-min: 0.45      # vitesse maximale par tick, au moins (sinon 1,3 x celle du joueur)
  flottement: 0.06       # amplitude du flottement
  hauteur-nom: 1.3       # hauteur du nom au-dessus du modèle
