# Révélation : une animation de totem par carte différente (de la moins rare à la plus rare),
# puis la carte et le nombre d'exemplaires au milieu de l'écran une fois la carte envolée.
# Un clic droit pendant la révélation la passe (cartes données d'un coup) et, avec un booster
# en main, ouvre le suivant.
reveal:
  start-delay-ticks: 10
  actionbar-delay-ticks: 2    # quasiment en même temps que le déclenchement du totem
  delay-ticks: 39             # temps entre deux animations du totem (le verso s'ajoute avant)
  actionbar: '%card%'
  # Quantité au milieu de l'écran (sous-titre en gros), à partir de subtitle-min-count exemplaires
  subtitle: '%rarity_color%&lx%count%'
  subtitle-min-count: 1
  fade-in: 2
  stay: 22
  fade-out: 6
  # Verso commun des cartes affiché en grand (titre) pendant back-ticks avant chaque retournement,
  # puis l'animation du totem passe par-dessus. 0 = désactivé.
  # ouverture : image du booster affichée seule pendant booster-ticks, puis le verso de la première carte
  booster-ticks: 20
  back-ticks: 4
  # le verso reste encore back-overlap-ticks par-dessus le début de l'animation du totem
  back-overlap-ticks: 3
  back-title: "&r&f%img_carte_verso_grand%"
  # Booster ouvert pendant une révélation ou moins de spam-window-ticks après le précédent :
  # pas d'animation du totem, cartes données d'un coup (un nouveau familier garde sa mise en scène).
  spam-window-ticks: 20
  actionbar-pet: "%card% &#5FB3B3Nouveau familier !"
  actionbar-pet-duplicate: '%card% &#6B7A8FDéjà adopté &#EADBC8: sa carte et sa peluche'
  actionbar-pet-duplicate-incomplete: '%card% &#6B7A8FDéjà adopté &#EADBC8: sa carte en plus'
  sound-finish: "block.amethyst_block.resonate"

# Familier tout juste adopté : la révélation marque une pause, titre + son, le modèle 3D apparaît
# face au joueur (visible par lui seul) et joue son animation, spirale de particules à la couleur
# de la rareté, annonce dans le tchat pour les raretés listées.
pet-reveal:
  duration-ticks: 160
  # durée d'affichage du modèle 3D (visible par les joueurs à moins de 64 blocs), plus longue
  # que la pause de la révélation
  model-ticks: 240
  title-ticks: 50   # le titre s'efface avant : on peut contempler le familier
  # titre = nom du familier, sous-titre compact en petites capitales (seuls N et F en majuscules normales)
  title: "%pet%"
  subtitle: "&#FF7A59Nᴏᴜᴠᴇᴀᴜ Fᴀᴍɪʟɪᴇʀ"
  sound: "ui.toast.challenge_complete"
  animation: "happy"
  distance: 2.5
  broadcast-rarities:   # annonce à tout le serveur : mythique (ultimate), légendaire, fabuleux
    - ultimate
    - legendary
    - fabled

# Raretés, de la plus commune à la plus rare (ordre de révélation). Le tag contient déjà
# le nom de la rareté : il est affiché seul devant le nom des cartes.
rarities:
  simple:
    tag: "&r&f%img_simple%"
    color: '#AAAAAA'
  unique:
    tag: "&r&f%img_unique%"
    color: '#37C44A'
  elite:
    tag: "&r&f%img_elite%"
    color: '#3283A8'
  ultimate:
    tag: "&r&f%img_ultimate%"
    color: '#B376E5'
  legendary:
    tag: "&r&f%img_legendary%"
    color: '#F0A800'
  fabled:
    tag: "&r&f%img_fabled%"
    color: '#C8256A'

# Format commun des cartes : %tag% (rareté), %name%, %number% (N° dans la collection, ordre de cette liste)
card-format:
  name: "%tag% &#FFF4E0%name%"
  lore-header:
    - "&#6B7A8FN°%number% &#6B7A8F• %series%"
    - ""
  lore-footer: []
  # Ajouté aux cartes liées à un familier (champ pet) qui donnent de l'XP
  lore-pet:
    - ""
    - "&#5FB3B3+%xp% XP &#EADBC8pour &r%pet%"
    - "&r&7%img_right_click% &#FF7A59Nourrir &#6B7A8F(Maj : toute la pile)"

# XP donnée au familier par carte utilisée, selon la rareté de la carte
card-xp:
  simple: 150
  unique: 220
  elite: 320
  ultimate: 450
  legendary: 650
  fabled: 1000

