# InfluPet : familiers, cartes à collectionner et boosters. Réglages seulement :
#   lang/<langue>.yml      tous les textes affichés aux joueurs
#   menus/                 menus des familiers (/familiers et progression)
#   contenu/               cartes, boosters et familiers obtenables (modifiés aussi par /influpet menu)
#   pets/<id>.yml          définition de chaque familier (niveaux, effets libreforge, modèle)
#   effets.yml             effets de familiers codés dans le plugin (généré, cf. scripts/influcard)
# Relu par /influpet reload.

# Fichier de textes : lang/<langue>.yml
langue: fr_FR

# Révélation : une animation de totem par carte différente (de la moins rare à la plus rare). Un clic droit
# pendant la révélation la passe (cartes données d'un coup) et, avec un booster en main, ouvre le suivant.
reveal:
  start-delay-ticks: 10
  actionbar-delay-ticks: 2    # quasiment en même temps que le déclenchement du totem
  delay-ticks: 39             # temps entre deux animations du totem (le verso s'ajoute avant)
  subtitle-min-count: 1       # quantité affichée à partir de ce nombre d'exemplaires
  fade-in: 2
  stay: 22
  fade-out: 6
  # ouverture : image du booster seule pendant booster-ticks, puis le verso de la première carte
  booster-ticks: 20
  # verso affiché back-ticks avant chaque retournement (0 = désactivé), puis encore back-overlap-ticks
  # par-dessus le début de l'animation du totem
  back-ticks: 4
  back-overlap-ticks: 3
  # booster ouvert pendant une révélation ou moins de spam-window-ticks après le précédent : pas d'animation
  spam-window-ticks: 20
  sound-finish: "block.amethyst_block.resonate"

# Familier tout juste adopté : pause, titre + son, modèle 3D face au joueur, spirale de particules à la couleur
# de la rareté, annonce dans le tchat pour les raretés listées.
pet-reveal:
  duration-ticks: 160
  model-ticks: 240    # durée d'affichage du modèle (visible à 64 blocs), plus longue que la pause
  title-ticks: 50
  sound: "ui.toast.challenge_complete"
  animation: "happy"
  distance: 2.5
  broadcast-rarities:   # annonce à tout le serveur
    - ultimate
    - legendary
    - fabled

# Raretés, de la plus commune à la plus rare (ordre de révélation). Le tag (glyphe) contient déjà le nom de
# la rareté : il est affiché seul devant le nom des cartes.
rarities:
  simple:
    tag: "&r&f%img_simple%"
    color: '#AAAAAA'
  unique:
    tag: "&r&f%img_unique%"
    color: '#37C44A'
  elite:
    tag: "&r&f%img_elite%"
    color: '#3283A8'
  ultimate:
    tag: "&r&f%img_ultimate%"
    color: '#B376E5'
  legendary:
    tag: "&r&f%img_legendary%"
    color: '#F0A800'
  fabled:
    tag: "&r&f%img_fabled%"
    color: '#C8256A'

# Familier qui ressort d'un booster alors qu'il est déjà adopté : reroll (jamais tiré) ou xp (duplicate-xp
# donnée, plus duplicate-card cartes du familier).
pets:
  duplicate: xp
  duplicate-xp: 0
  duplicate-card: 1

# Système de familiers (remplace EcoPets)
familiers:
  # sauvegarde en local même si eco utilise une base de données (pas de synchronisation entre serveurs) ;
  # ne changer qu'avec le serveur arrêté
  stockage-local: false
  # range le familier actif quand ses activate-conditions ne sont plus remplies
  desactiver-si-conditions-echouent: true
  # montures : rien n'est montable tant que c'est false, même un familier « montable: true »
  montures:
    actives: false
  # familiers actifs en même temps (leurs effets s'additionnent) : defaut sans permission, sinon la plus haute
  # permission influpet.familiers.max.<n>, jamais plus que maximum
  actifs:
    defaut: 1
    maximum: 5
  pet-entity:
    enabled: true
    show-hologram: true
  level-up:
    message:
      enabled: true
    sound:
      enabled: true
      sound: entity_player_levelup
      pitch: 1.3
      volume: 0.8
      category: PLAYER
  # Multiplicateur d'XP des familiers par permission : influpet.xpmultiplier.double / triple / quadruple /
  # 50percent, ou influpet.xpmultiplier.<pourcentage>. Ne s'applique pas aux cartes.

# Modèle 3D du familier qui suit le joueur (BetterModel). Distances en blocs. Entre distance-min et
# distance-max il ne bouge pas et regarde le joueur ; il ne se déplace qu'en sortant de cette zone.
familier-suivi:
  hauteur: 0.9           # hauteur au-dessus des pieds du joueur
  distance-min: 1.5      # trop près : il recule un peu
  distance-max: 4.0      # trop loin : il revient vers le joueur
  teleport-distance: 16  # au-delà, réapparaît à côté du joueur
  lissage: 0.18          # plus haut = il accélère plus vite vers sa place
  vitesse-min: 0.45      # vitesse max par tick quand il rattrape (au moins ; sinon 1,3 x celle du joueur)
  flottement: 0.06       # amplitude du flottement
  hauteur-nom: 1.3       # hauteur du nom au-dessus du modèle
  # plusieurs familiers actifs : file derrière le premier, chacun entre ces écarts du précédent
  ecart-file-min: 1.2
  ecart-file-max: 2.2
