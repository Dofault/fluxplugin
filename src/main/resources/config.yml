# InfluPet (ex-InfluCard) : cartes à collectionner et boosters.
#
# Textes : codes & et &#RRGGBB. %img_<id>% affiche un glyphe ItemsAdder (cherché dans influtags,
# influemoji puis influitems), toujours précédé de &r&f pour garder ses couleurs.
# Textures des cartes et boosters : items ItemsAdder (namespace influcards).
#
# Palette propre aux cartes (volontairement hors charte serveur) :
#   corail #FF7A59 (accent, actions), parchemin #EADBC8 (textes), crème #FFF4E0 (noms),
#   ardoise #6B7A8F (secondaire), sarcelle #5FB3B3 (infos), brique #D9534F (erreurs).

