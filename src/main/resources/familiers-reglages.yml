    click:
      enabled: true
      sound: ui_button_click
      pitch: 1
      volume: 1
      category: UI

  page-change-sound:
    enabled: true
    sound: ui_button_click
    pitch: 1
    volume: 1
    category: UI

  prev-page:
    item: arrow name:"&#FFD94DPage précédente"
    location:
