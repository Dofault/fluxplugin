# Système de familiers d'InfluPet (remplace EcoPets, même structure de réglages).
# Les familiers eux-mêmes : plugins/InfluPet/pets/<id>.yml (même format qu'EcoPets, plus « vol » et « montable »).
# Relu par /influpet reload.

# Sauvegarder les familiers des joueurs en local même si eco utilise une base de données (pas de synchronisation
# entre serveurs). Ne changer qu'avec le serveur arrêté.
stockage-local: false

# Désactiver le familier actif quand ses activate-conditions ne sont plus remplies
desactiver-si-conditions-echouent: true

# Montures : prévu pour plus tard. Tant que c'est false, aucun familier ne se monte, même « montable: true ».
montures:
  actives: false

# Multiplicateur d'XP des familiers par permission (influpet.xpmultiplier.double / triple / quadruple /
# 50percent, ou influpet.xpmultiplier.<pourcentage>). Ne s'applique pas aux cartes : une carte = son XP fixe.

gui:
  title: "&#FFD94DFamiliers"
  rows: 6

  mask:
    materials:
      - black_stained_glass_pane
    pattern:
      - "111101111"
      - "111111111"
      - "100000001"
      - "100000001"
      - "100000001"
      - "101000111"

  pet-area:
    top-left:
      row: 3
      column: 2
    bottom-right:
      row: 5
      column: 8

  pet-info:
    row: 1
    column: 5

    no-active:
      name: "&#FF5C5CAucun familier actif"
      lore:
        - ""
        - "&#B376E5Choisis-en un ci-dessous !"
        - ""
      item: player_head texture:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmFkYzA0OGE3Y2U3OGY3ZGFkNzJhMDdkYTI3ZDg1YzA5MTY4ODFlNTUyMmVlZWQxZTNkYWYyMTdhMzhjMWEifX19

    active:
