level-gui:
  title: "&#FFD94D%pet%"
  rows: 6

  mask:
    materials:
      - black_stained_glass_pane
    pattern:
      - "111111111"
      - "111111111"
      - "111111111"
      - "111111111"
      - "111111111"
      - "111111111"

  progression-slots:
    # Ordre des niveaux : 1 à 9 puis a à z
    pattern:
      - "109ab0jkl"
      - "2080c0i0m"
      - "3070d0h0n"
      - "4560efg0o"
      - "00000000p"
      - "00000000q"
    level-as-amount: true

    page-change-sound:
      enabled: true
      sound: ui_button_click
      pitch: 1
      volume: 1
      category: UI

    prev-page:
      item: arrow name:"&#FFD94DPage précédente"
      location:
        row: 6
        column: 4

    next-page:
      item: arrow name:"&#FFD94DPage suivante"
      item-inactive: gray_dye name:"&7Page suivante"
      location:
        row: 6
        column: 6

    close:
      enabled: true
      item: barrier
      name: "&#FF5C5CFermer"
      location:
        row: 6
        column: 5

    unlocked:
      item: lime_stained_glass_pane
      name: "%pet% &#FFD94DNiv. %level%"
      lore:
        - ""
        - "&#FFD94DEffets :"
        - "%rewards%"
        - ""
        - "&#2ECF7BDÉBLOQUÉ"
    in-progress:
      item: yellow_stained_glass_pane
      name: "%pet% &#FFD94DNiv. %level%"
      lore:
        - ""
        - "&#FFD94DEffets :"
        - "%rewards%"
        - ""
        - "&#FFD94DProgression :"
        - "&8» &#B376E5%percentage_progress% %"
        - "&8» &#B376E5%current_xp%&8/&7%required_xp% &#B376E5XP"
    locked:
      item: red_stained_glass_pane
      name: "%pet% &#FFD94DNiv. %level%"
      lore:
        - ""
        - "&#FFD94DEffets :"
        - "%rewards%"

# Modèle 3D qui suit le joueur (BetterModel), cf. familier-suivi dans config.yml pour les distances
pet-entity:
  enabled: true
  show-hologram: true
  name: "%pet%&f (Niv. %level%)"

level-up:
  message:
    enabled: true
    message:
      - ""
      - " &#B376E5Ton familier %pet%&#B376E5 passe au &#FFD94Dniveau %level%&#B376E5 !"
      - ""
      - " &#FFD94D&lEFFETS :"
      - " %level_up_messages%"
      - ""
  sound:
    enabled: true
    sound: entity_player_levelup
    pitch: 1.3
    volume: 0.8
    category: PLAYER

messages:
  prefix: "&#FFD94D&lFamiliers &8» &r"
  invalid-pet: "&#FF5C5CFamilier inconnu ou pas adopté."
  pet-already-active: "&#FF5C5CCe familier est déjà actif."
  cannot-activate-pet: "&#FF5C5CTu ne peux pas activer %pet%&#FF5C5C ici."
  activated-pet: "&#B376E5Familier activé : %pet%"
  deactivated-pet: "&#B376E5Familier rangé : %pet%"
  no-pet-active: "&#FF5C5CTu n'as aucun familier actif."
  pet-auto-deactivated: "&#FF5C5CTon familier %pet%&#FF5C5C a été rangé : ses conditions ne sont plus remplies."
  cancelled-swap: "&#FF5C5CChangement de familier annulé."
  player-only: "&#FF5C5CCommande réservée aux joueurs."
