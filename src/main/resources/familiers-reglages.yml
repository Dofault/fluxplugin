        - ""
        - "&#FFD94DEffets :"
        - "%effects%"
        - ""
        - "&#FFD94DProgression :"
        - "&8» &#B376E5%percentage_progress% %"
        - "&8» &#B376E5%current_xp%&8/&7%required_xp% &#B376E5XP"
        - ""
        - "&r&7%img_left_click% &#FFD94DVoir la progression"
      max-level-lore:
        - "%description%"
        - "&#6B7A8F(clic droit sur une de ses cartes)"
        - ""
        - "&#FFD94DEffets :"
        - "%effects%"
        - ""
        - "&#2ECF7BNiveau maximum atteint"
        - ""
        - "&r&7%img_left_click% &#FFD94DVoir la progression"

  pet-icon:
    name: "%pet% &#FFD94DNiv. %level%"
    lore:
      - "%description%"
      - "&#6B7A8F(clic droit sur une de ses cartes)"
      - ""
      - "&#FFD94DEffets :"
      - "%effects%"
      - ""
      - "&#FFD94DProgression :"
      - "&8» &#B376E5%percentage_progress% %"
      - "&8» &#B376E5%current_xp%&8/&7%required_xp% &#B376E5XP"
    max-level-lore:
      - "%description%"
      - "&#6B7A8F(clic droit sur une de ses cartes)"
      - ""
      - "&#FFD94DEffets :"
      - "%effects%"
      - ""
      - "&#2ECF7BNiveau maximum atteint"
