name: InfluPet
version: '26.2'
main: fr.influencraft.influpet.InfluPet
api-version: '1.21'
description: Familiers, cartes à collectionner et boosters (ex-InfluCard).
softdepend: [ItemsAdder, EcoPets, eco, BetterModel, packetevents]

commands:
  influpet:
    description: Administration des familiers, cartes et boosters.
    usage: /influpet <menu|give|open|list|info|reload>
    aliases: [influcard]
    permission: influpet.admin

permissions:
  influpet.admin:
    default: op
