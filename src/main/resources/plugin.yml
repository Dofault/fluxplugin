name: InfluPet
version: '26.2'
main: fr.influencraft.influpet.InfluPet
api-version: '1.21'
description: Familiers, cartes à collectionner et boosters (ex-InfluCard).
# eco : stockage des familiers des joueurs (comme EcoPets). libreforge (chargé par les plugins eco, EcoJobs en
# tête) : effets des familiers et multiplicateur d'XP de carrière.
depend: [eco]
softdepend: [libreforge, EcoJobs, EcoEnchants, EcoItems, ItemsAdder, BetterModel, packetevents, PlaceholderAPI]

commands:
  influpet:
    description: Administration des familiers, cartes et boosters.
    usage: /influpet <menu|give|open|list|info|familier|reload>
    aliases: [influcard]
    permission: influpet.admin
  familiers:
    description: Menu des familiers.
    usage: /familiers [activer <familier>|desactiver]
    aliases: [pets, pet, familier]
    permission: influpet.command.familiers

permissions:
  influpet.admin:
    default: op
  influpet.command.familiers:
    default: true
