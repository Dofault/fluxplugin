# My listings: every listing of the player and its state (for sale, expired, removed by staff...). Left: see it or
# collect it; right: take it back. Row 1: back, menu icon. Rows 1-4: listings. Row 5: pages. Inventory row: collect
# everything, sell, history, my bids. Lists built by FluxCommerce.
rows: 6
player-inventory: hidden
vanilla-background: false

open-actions:
  - "[sound] @page"

lists:
  hdv_listings_info:
    slots: [8]
    item:
      material: entry
  hdv_listings:
    slots: "10-16, 19-25, 28-34, 37-43"
    item:
      material: entry
      actions:
        left: ["%entry_left%"]
        right: ["%entry_right%"]
    empty:
      material: "itemsadder:influitems:unknown"
      name: "Aucune offre"
      lore:
        - "@desc Tu n'as rien en vente. Mets un objet en vente depuis le bouton Vendre."
  hdv_collect:
    slots: [55]
    item:
      material: entry
      actions:
        left: ["[hdv] collect"]

widgets:
  pages:
    type: pager
    list: hdv_listings
    prev: 45
    next: 53

items:
  retour:
    material: "itemsadder:influitems:btn_back"
    name: "Retour"
    slots: [0]
    lore:
      - "@left Revenir au marché"
    actions:
      left: ["[hdv] open market"]
  vendre:
    material: "itemsadder:influitems:add"
    name: "Vendre"
    slots: [57]
    lore:
      - "@desc Mets un objet de ton inventaire en vente directe ou aux enchères."
      - "@left Choisir un objet"
    actions:
      left: ["[hdv] open sell"]
  historique:
    material: "itemsadder:influmarche:historique"
    name: "Historique"
    slots: [59]
    lore:
      - "@desc Tes ventes et tes achats, à l'HDV et dans les échoppes."
      - "@left Ouvrir"
    actions:
      left: ["[hdv] open history"]
  encheres:
    material: "itemsadder:influmarche:enchere"
    name: "Mes enchères"
    slots: [61]
    lore:
      - "@desc Les enchères où tu as fait une offre."
      - "@left Ouvrir"
    actions:
      left: ["[hdv] open bids"]
