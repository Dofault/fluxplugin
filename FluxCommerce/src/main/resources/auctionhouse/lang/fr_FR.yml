# FluxCommerce, HDV (auctionhouse/) : textes en français pour tous les joueurs ; %item% = nom de l'objet dans la langue du jeu du joueur
# (survol : l'objet). Une ligne qui commence par « ! » n'a pas le préfixe. Prix déjà formatés par Flux (montant puis
# glyphe BitBlock). Charte des messages : celle de FluxCommerce et FluxPW (préfixe en petites capitales, texte gris,
# valeurs en or, chiffres en blanc, erreur en rouge puis explication en gris, réussite en vert, commandes entre crochets,
# cliquables). Les messages d'argent suivent la convention BitBlock (docs/notifications/bitblock.md).
prefix: "&#B376E5ʜᴅᴠ&8 ▸ "

