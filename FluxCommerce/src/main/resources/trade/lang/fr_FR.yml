# FluxCommerce, échanges (trade/) : textes en français pour tous les joueurs ; %item% = nom de l'objet dans la langue du jeu du joueur.
# Une ligne qui commence par « ! » n'a pas le préfixe. Montants déjà formatés par Flux (montant puis glyphe BitBlock).
# Charte des messages : celle de CMI (docs/notifications/cmi.md, comme FluxPW) : préfixe en petites capitales, texte gris
# #8A8A8A (jamais &7 ni &8), pseudos et durées en or (même dans une erreur), chiffres en blanc, erreur en rouge puis
# explication en gris, issue positive entre joueurs en vert, commandes entre crochets (cliquables).
# Les mouvements de BitBlock passent par le message commun de Flux (donné / reçu, [ᴇᴄʜᴀɴɢᴇ]).
prefix: "&#B376E5ᴇᴄʜᴀɴɢᴇ&8 ▸ "

no-permission: "&#FF5C5CTu n'as pas la permission de faire ça."
reloaded: "&#2BC4E8FluxCommerce rechargé."

