# FluxCommerce, trades (trade/): texts for every player; %item% = the item's name in the reader's game language.
# A line starting with "!" has no prefix. Amounts already formatted by Flux.
prefix: "&#B376E5ᴛʀᴀᴅᴇ&8 ▸ "

no-permission: "&#FF5C5CYou may not do that."
reloaded: "&#2BC4E8FluxCommerce reloaded."

# Requests
request-sent: "&#8A8A8ATrade request sent to &#FFD94D%player%&#8A8A8A. It expires in &#FFD94D%seconds% s&#8A8A8A."
request-received:
  - "&#FFD94D%player% &#8A8A8Awants to trade with you!"
  - "!&#8A8A8ASneak + right click on him, or: [/%cmd% accept %player%] [/%cmd% deny %player%]"
request-expired: "&#8A8A8AYour trade request to &#FFD94D%player% &#8A8A8Aexpired."
request-already-sent: "&#FF5C5CRequest already sent.&#8A8A8A Wait for &#FFD94D%player%&#8A8A8A to answer."
request-not-accepting: "&#FFD94D%player% &#FF5C5Cdoes not accept trades.&#8A8A8A He turned them off in his settings."
request-none: "&#FF5C5CNo trade request waiting."
request-offline: "&#FF5C5CPlayer not found.&#8A8A8A &#FFD94D%player% &#8A8A8Ais not online."
request-denied: "&#8A8A8AYou declined the trade with &#FFD94D%player%&#8A8A8A."
request-denied-sender: "&#FFD94D%player% &#FF5C5Cdeclined your trade."
request-self: "&#FF5C5CYou cannot trade with yourself."
request-you-busy: "&#FF5C5CYou are already trading.&#8A8A8A Finish or close your trade first."
request-busy: "&#FFD94D%player% &#FF5C5Cis already trading.&#8A8A8A Try again in a moment."
request-gamemode-you: "&#FF5C5CYou must be in survival to trade."
request-gamemode: "&#FFD94D%player% &#FF5C5Cis not in survival.&#8A8A8A Trades happen in survival only."
request-world: "&#FF5C5CNo trades in this world."
request-too-far: "&#FF5C5CYou are too far from &#FFD94D%player%&#FF5C5C.&#8A8A8A Come closer to trade."
request-same-ip: "&#FF5C5CTrade refused.&#8A8A8A Both accounts are connected from the same address."
# Banned from commerce by the staff (/commerce ban): you, or the player asked.
request-banned-you: "&#FF5C5CYou are banned from commerce for now.&#8A8A8A No trade possible."
request-banned: "&#FFD94D%player% &#FF5C5Cis banned from commerce for now.&#8A8A8A No trade possible with him."

# During the trade
started: "&#2ECF7BTrade opened with &#FFD94D%player%&#2ECF7B!&#8A8A8A Nothing moves until you both validated."
item-refused: "&#FF5C5CThis item cannot be traded.&#8A8A8A (or an item inside it)"
offer-full: "&#FF5C5CYour offer is full.&#8A8A8A &f%max% &#8A8A8Astacks at most per trade."
partner-full: "&#FFD94D%player% &#FF5C5Chas no room left.&#8A8A8A His inventory could not hold everything."
inventory-full: "&#FF5C5CInventory full.&#8A8A8A Make room to take this item back."
inventory-full-end: "&#FF5C5CYour inventory is too full to receive the trade.&#8A8A8A Make room, then validate again."
offer-changed: "&#FFD94D%player% &#FF5C5Cchanged his offer: &#8A8A8Acheck it before validating."
locked: "&#FF5C5CThe offer just changed.&#8A8A8A Check it, then validate in a moment."
nothing: "&#FF5C5CNothing to trade.&#8A8A8A Add an item, experience or money."
not-enough-xp: "&#FF5C5CYou no longer have that much experience.&#8A8A8A Lower the amount offered."
not-enough-money: "&#FF5C5CYou no longer have that much money.&#8A8A8A Lower the amount offered."
partner-cannot-pay: "&#FFD94D%player% &#FF5C5Cno longer has what he offers.&#8A8A8A Validations cancelled."
failed: "&#FF5C5CThe trade failed.&#8A8A8A Nothing moved, validate again."

# End of the trade
completed: "&#2ECF7BTrade done with &#FFD94D%player%&#2ECF7B!"
summary-item-given: "!&#8A8A8A • &#FF5C5C- &f%amount% %item%"
summary-item-received: "!&#8A8A8A • &#2ECF7B+ &f%amount% %item%"
summary-xp-given: "!&#8A8A8A • &#FF5C5C- &f%points% &#8A8A8Aexperience points"
summary-xp-received: "!&#8A8A8A • &#2ECF7B+ &f%points% &#8A8A8Aexperience points (now level &f%levels%&#8A8A8A)"
summary-nothing: "!&#8A8A8A • Nothing changed hands."
aborted-cancelled: "&#FFD94D%player% &#FF5C5Ccancelled the trade.&#8A8A8A Your items are given back."
aborted-cancelled-you: "&#8A8A8ATrade with &#FFD94D%player% &#8A8A8Acancelled. Your items are given back."
aborted-left: "&#FFD94D%player% &#FF5C5Cleft.&#8A8A8A Trade cancelled, your items are given back."
aborted-death: "&#FFD94D%player% &#FF5C5Cdied.&#8A8A8A Trade cancelled, your items are given back."
aborted-death-you: "&#FF5C5CYou died during the trade.&#8A8A8A Your items dropped with the rest."
aborted-idle: "&#FFD94D%player% &#FF5C5Cdid not answer in time.&#8A8A8A Trade cancelled, your items are given back."
aborted-idle-you: "&#FF5C5CYou took too long to choose an amount.&#8A8A8A Trade cancelled, your items are given back."
aborted-too-far: "&#FF5C5CYou are too far from each other.&#8A8A8A Trade cancelled, your items are given back."
aborted-gamemode: "&#FF5C5COne of you is no longer in survival.&#8A8A8A Trade cancelled, your items are given back."
aborted-world: "&#FF5C5CNo trades in this world.&#8A8A8A Trade cancelled, your items are given back."
aborted-banned: "&#FF5C5COne of you was just banned from commerce.&#8A8A8A Trade cancelled, your items are given back."
aborted-staff: "&#FF5C5CTrade cancelled by the staff.&#8A8A8A Your items are given back."
aborted-stopped: "&#FF5C5CTrade interrupted by a restart.&#8A8A8A Your items are given back."
aborted-window: "&#FF5C5CThe trade window could not open.&#8A8A8A Trade cancelled, your items are given back."

toggle-on: "&#8A8A8ATrade requests &#2ECF7Bon&#8A8A8A."
toggle-off: "&#8A8A8ATrade requests &#FF5C5Coff&#8A8A8A. To turn them back on: [/%cmd% toggle]"

# Staff
admin-no-trade: "&#FFD94D%player% &#FF5C5Cis not trading."
admin-cancelled: "&#2ECF7BTrade cancelled&#8A8A8A between &#FFD94D%player% &#8A8A8Aand &#FFD94D%other%&#8A8A8A, items given back."
admin-unknown-player: "&#FF5C5CUnknown player.&#8A8A8A Nobody known is called &#FFD94D%player%&#8A8A8A."
admin-history-usage: "&#FF5C5C/%cmd% admin history <player> [page]"
admin-history-none: "&#8A8A8ANo trade recorded for &#FFD94D%player%&#8A8A8A."
admin-history-end: "&#8A8A8ANo older trade for &#FFD94D%player%&#8A8A8A."
admin-history-header: "&#FFD94DTrades of %player% &#8A8A8A(page &f%page%&#8A8A8A, most recent first)"
admin-history-line:
  - "!&#8A8A8A • &f%date% &#FFD94D%a% &#8A8A8A⇄ &#FFD94D%b%"
  - "!&#8A8A8A     %a% gave: &f%a_gave%"
  - "!&#8A8A8A     %b% gave: &f%b_gave%"
admin-history-next: "!&#8A8A8AOlder: [/%cmd% admin history %player% %page%]"

# Paged help (Flux's ChatHelp).
help:
  header: "<#8A8A8A><st>               </st></#8A8A8A> %previous% <#FFD94D>ʜᴇʟᴘ</#FFD94D> <dark_gray>·</dark_gray> <#8A8A8A>Page</#8A8A8A> <white>%page%</white><dark_gray>/</dark_gray><white>%pages%</white> %next% <#8A8A8A><st>               </st></#8A8A8A>"
  header-admin: "<#8A8A8A><st>             </st></#8A8A8A> %previous% <#FFD94D>ꜱᴛᴀꜰꜰ ʜᴇʟᴘ</#FFD94D> <dark_gray>·</dark_gray> <#8A8A8A>Page</#8A8A8A> <white>%page%</white><dark_gray>/</dark_gray><white>%pages%</white> %next% <#8A8A8A><st>             </st></#8A8A8A>"
  line: "<#F0A800>   %command%</#F0A800> <dark_gray>-</dark_gray> <#8A8A8A>%description%"
  footer: "<#8A8A8A><st>             </st></#8A8A8A> %previous% <dark_gray>|</dark_gray> %next% <#8A8A8A><st>             </st></#8A8A8A>"
  previous-arrow: "<#FFD94D>«</#FFD94D>"
  next-arrow: "<#FFD94D>»</#FFD94D>"
  previous: "<#FFD94D>« Previous</#FFD94D>"
  next: "<#FFD94D>Next »</#FFD94D>"
  previous-hover: "<#B376E5>Previous page"
  next-hover: "<#B376E5>Next page"
  hover-run: "<#B376E5>Click to run."
  hover-suggest: "<#B376E5>Click to copy the command."
  args:
    request: "<player>"
    accept: "[player]"
    deny: "[player]"
    toggle: "[on|off]"
    help: "[page]"
    admin: ""
    admin-history: "<player> [page]"
    admin-cancel: "<player>"
    admin-reload: ""
    admin-help: "[page]"
  commands:
    request: "Offer a trade (or sneak + right click on the player)"
    accept: "Accept a trade request"
    deny: "Decline a trade request"
    toggle: "Turn trade requests on or off"
    help: "Show this help"
    admin: "Staff commands"
    admin-history: "Latest trades of a player"
    admin-cancel: "Cancel a player's trade (items given back)"
    admin-reload: "Reload the configuration"
    admin-help: "Show the staff help"

