# FluxCommerce, échoppes (chestshop/) : textes en français pour tous les joueurs ; %item% = nom de l'objet dans la langue du jeu du joueur.
# Une ligne qui commence par « ! » n'a pas le préfixe. Prix déjà formatés par Flux (montant puis glyphe BitBlock).
# Charte des messages : celle de CMI (docs/notifications/cmi.md) : texte gris #8A8A8A (jamais &7 ni &8, sauf la
# flèche du préfixe et la pancarte), pseudos et durées en or, chiffres en blanc, erreur en rouge puis explication en
# gris, réussite en vert, info système en bleu, commandes entre crochets (cliquables). Les messages d'argent suivent
# la convention BitBlock commune à Flux (source [ʜᴅᴠ] / [ᴇᴄʜᴏᴘᴘᴇ] en &7, docs/notifications/bitblock.md).
prefix: "&#B376E5ᴇᴄʜᴏᴘᴘᴇꜱ&8 ▸ "

