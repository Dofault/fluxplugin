# FluxCommerce, chest shops (chestshop/). %item% = item name in the player's game language. A line starting with "!" has no prefix.
# Message charter of the server (Lands / CMI): small-caps prefix, grey text, gold values, white numbers, red error
# then grey explanation, green success, commands in brackets (clickable). Money lines follow the BitBlock convention.
