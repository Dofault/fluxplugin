name: FluxEnchant
version: 26.2
main: fr.influencraft.fluxenchant.FluxEnchant
api-version: "26.2"
description: Enchantment weight per item and mastery enchantments on the crate tools (EcoEnchants enchantments).
authors: [Influencraft]
depend: [Flux]
softdepend: [FluxTools, EcoEnchants]

permissions:
  fluxenchant.cheat:
    description: /fluxcheat, development gear with every enchantment. Not even operators have it by default.
    default: false
  fluxenchant.admin:
    description: /fluxenchant reload and info.
    default: op
