# ---------------------------------------------------------------------------
# Coffres magasins (clic droit = menu d'achat/vente) et blocs de vente
# ---------------------------------------------------------------------------
# Un coffre magasin est assigné par sa position avec /supermarket addchest (en
# regardant le bloc). Ses objets se gèrent dans son éditeur (admin accroupi +
# clic droit) : n'importe quel objet, booster InfluPet ou item custom compris.
# Seuls les types listés ici peuvent devenir un coffre magasin :
#   - matériau vanilla : CHEST, BARREL...
#   - bloc ItemsAdder  : itemsadder:<namespace>:<id> (les meubles ItemsAdder,
#     qui sont des entités, ne sont pas pris en charge)
# Le bloc n'est jamais ouvert : son contenu réel n'a aucune importance. Les
# objets vendus sont stockés dans shops.yml (6 au maximum, une rangée chacun).
# Les blocs de vente (/supermarket addsellblock) peuvent être de n'importe
# quel type : clic droit = menu de dépôt, clic gauche = consultation des prix.
shop:
  block-types:
    - CHEST

# Menu d'un coffre magasin (achat seul) : l'objet puis ses boutons x1, x2, x10,
# x64, centrés. La taille de la pile du bouton affiche la quantité. Double
# confirmation : le 1er clic arme le bouton (buy-button-armed), le 2e achète.
# Juste après un achat, le même bouton achète sans confirmation pendant
# quick-buy-seconds (relancé à chaque achat) : achat en masse en cliquant vite.
# Disposition, vitres et titres : menus Flux plugins/FluxShop/menus/ (shop, shop_sell...).
# custom-model-data > 0 : icône ItemsAdder posée sur le matériau (pas de hook
# ItemsAdder, cf. ItemsAdder/storage/items_ids_cache.yml).
shop-menu:
  # Délai avant qu'un bouton armé ne redevienne normal tout seul.
  confirm-timeout-seconds: 5
  quick-buy-seconds: 1
  buy-button:
    material: LIME_STAINED_GLASS_PANE
    custom-model-data: 0
  buy-button-armed:
    material: ORANGE_STAINED_GLASS_PANE
    custom-model-data: 0
  # Éditeur : influitems:add (10021), influitems:settings (10040),
  # influitems:chest_delete (10024).
  editor-add:
    material: PAPER
    custom-model-data: 10021
  editor-price:
    material: PAPER
    custom-model-data: 10040
  editor-remove:
    material: PAPER
    custom-model-data: 10024

# ---------------------------------------------------------------------------
# /supermarket tpshop (bouton du menu /marche)
# ---------------------------------------------------------------------------
# Point d'arrivée posé en jeu par /supermarket settpshop (section tpshop).
#
# Cooldown (en secondes) pour un joueur sans la permission supermarket.admin.
# Pour donner un cooldown différent par grade, mets une meta LuckPerms
# "supermarket-tpshop-cooldown" sur le groupe (ex: /lp group vip meta set
# supermarket-tpshop-cooldown 300) : elle prend le dessus sur cette valeur.
tpshop-cooldown-seconds: 1800

# Délai (en secondes) pendant lequel le joueur ne doit pas bouger avant d'être
# téléporté. Les admins n'en ont aucun. 0 pour désactiver.
tpshop-warmup-seconds: 3

# ---------------------------------------------------------------------------
# Menu de vente manuelle (clic droit sur le bloc de vente)
# ---------------------------------------------------------------------------
# Le joueur dépose ses items dans la zone de dépôt du menu Flux shop_sell
# (disposition dans plugins/FluxShop/menus/shop_sell.yml). Rien n'est vendu tant qu'il n'a pas cliqué DEUX fois dessus : le
# 1er clic arme la vente (son d'XP), le 2e vend et ferme le menu. Fermer le
# menu autrement rend tout le contenu au joueur.
sell-menu:

  # Délai avant qu'un bouton armé ne redevienne inactif tout seul.
  confirm-timeout-seconds: 5

  # Les icônes ItemsAdder sont rendues via le custom_model_data posé sur un
  # matériau vanilla (le plugin n'a pas de hook ItemsAdder) :
  # 10020 = influitems:accept, 10032 = influitems:checkmark.
  # Voir ItemsAdder/storage/items_ids_cache.yml pour les autres icônes.
  confirm-button:
    material: PAPER
    custom-model-data: 10020
  confirm-button-armed:
    material: PAPER
    custom-model-data: 10032

# ---------------------------------------------------------------------------
# Vente automatique (objet "Vente Automatique")
# ---------------------------------------------------------------------------
# Ce qui ne doit JAMAIS partir en vente auto. But : la vente auto vend des
# ressources farmées, jamais de l'équipement ni un objet rare : un joueur qui
# reçoit le stuff d'un ami ne doit pas le voir disparaître parce qu'il avait
# oublié son objet activé. Ces items restent vendables manuellement au bloc de vente.
autosell:
  exclusions:
    # Exceptions PAR DÉFAUT : chaque joueur peut les modifier dans le menu de
    # l'objet (clic droit). Seules les règles "enchanted" et "custom-items"
    # restent des garde-fous non modifiables.
    #
    # Tout item réparable (armures, outils, armes, arcs/arbalètes, boucliers,
    # élytres, cannes à pêche) est ajouté aux exceptions par défaut.
    damageable: true

    # Items enchantés et livres d'enchantement.
    enchanted: true

    # Items "façonnés" par un plugin : nom custom, lore, custom model data ou
    # données persistantes (ItemsAdder, AdvancedEnchantments, EcoEnchants,
    # récompenses de caisse, items de quête...).
    custom-items: true

    # Paliers de poissons CustomFishing en exception par défaut (préfixe de l'id
    # de l'objet : common, unique, epic, mythic, legendary, fabled). Absent ->
    # tous les paliers.
    fish-tiers: [common, unique, epic, mythic, legendary, fabled]

    # Matériaux en exception par défaut. Liste vide -> la liste par défaut du
    # plugin est utilisée.
    materials:
      - NETHERITE_INGOT
      - NETHERITE_SCRAP
      - NETHERITE_BLOCK
      - ANCIENT_DEBRIS
      - NETHERITE_UPGRADE_SMITHING_TEMPLATE
      - COD
      - SALMON
      - TROPICAL_FISH
      - PUFFERFISH
      - COOKED_COD
      - COOKED_SALMON
      - COD_BUCKET
      - SALMON_BUCKET
      - TROPICAL_FISH_BUCKET
      - PUFFERFISH_BUCKET
      - AXOLOTL_BUCKET
      - TADPOLE_BUCKET
      - NETHER_STAR
      - TOTEM_OF_UNDYING
      - SHULKER_SHELL
      - ELYTRA
      - DRAGON_EGG
      - DRAGON_HEAD
      - WITHER_SKELETON_SKULL
      - HEAVY_CORE
      - ECHO_SHARD
      - ENCHANTED_GOLDEN_APPLE
      - HEART_OF_THE_SEA
      - NAUTILUS_SHELL
      - BEACON
      - CONDUIT
      - END_CRYSTAL
      - TRIAL_KEY
      - OMINOUS_TRIAL_KEY
      - SNIFFER_EGG
      - SADDLE
      - NAME_TAG

# ---------------------------------------------------------------------------
# Menu de la vente automatique (clic droit avec l'objet)
# ---------------------------------------------------------------------------
# Icônes ItemsAdder rendues via custom_model_data sur du PAPER (pas de hook
# ItemsAdder), cf. ItemsAdder/storage/items_ids_cache.yml. Section facultative :
# ces valeurs sont aussi les valeurs par défaut du plugin.
autosell-menu:
  icons:
    category: { material: PAPER, custom-model-data: 10017 }        # influitems:filter
    view: { material: PAPER, custom-model-data: 10019 }            # influitems:search
    bulk: { material: PAPER, custom-model-data: 10021 }            # influitems:add
    reset: { material: PAPER, custom-model-data: 10024 }           # influitems:chest_delete
    info: { material: PAPER, custom-model-data: 10181 }            # influitems:unknown
