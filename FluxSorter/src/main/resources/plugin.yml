name: FluxSorter
version: '1.0.0'
main: fr.influencraft.fluxsorter.FluxSorter
api-version: '1.21'
description: A sorting chest that sends its content to the copper chests of the same Lands area that already hold the same items.
depend: [Flux]
softdepend: [BlockLocker, CoreProtect]

permissions:
  fluxsorter.admin:
    default: op
  # Former names (sortingchest.admin, influtri.admin), kept for servers that still grant them. Never list a
  # permission among its own children: Paper recurses forever and the server crashes at start (2026-11-13).
  sortingchest.admin:
    default: op
    children:
      fluxsorter.admin: true
  influtri.admin:
    default: op
    children:
      fluxsorter.admin: true
