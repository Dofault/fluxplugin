name: FluxSorter
version: '1.0.0'
main: fr.influencraft.fluxsorter.FluxSorter
api-version: '1.21'
description: A sorting chest that sends its content to the copper chests of the same Lands area that already hold the same items.
depend: [Lands]
softdepend: [BlockLocker, CoreProtect, ItemsAdder]

commands:
  sortingchest:
    description: Sorting chest administration.
    usage: /<command> <give <player> [amount] [level]|reload>
    aliases: [schest, tri]
    permission: sortingchest.admin

permissions:
  sortingchest.admin:
    default: op
  # Ancien nom (FluxSorter), gardé pour les serveurs qui l'accordent déjà.
  influtri.admin:
    default: op
    children:
      sortingchest.admin: true
