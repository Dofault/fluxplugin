name: FluxSorter
version: '1.0.0'
main: fr.influencraft.fluxsorter.FluxSorter
api-version: '1.21'
description: A sorting chest that sends its content to the copper chests of the same Lands area that already hold the same items.
depend: [Flux]
softdepend: [BlockLocker, CoreProtect]

permissions:
  sortingchest.admin:
    default: op
  # Ancien nom (FluxSorter), gardé pour les serveurs qui l'accordent déjà.
  influtri.admin:
    default: op
    children:
      sortingchest.admin: true
