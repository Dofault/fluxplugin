# Cosmetics menu, opened from the wardrobe (/cosmetique, /tenue, right click). Drawn in the player's inventory rows
# only (slots 54 to 89 of a 6-row chest): the chest above stays empty and transparent, the mannequin is seen over the
# menu and wears what is clicked at once. Entries and category buttons are built by FluxCosmetics (lists cosmetics,
# cosmetics_cat_<n>); Flux keeps each player's category and page, so the menu opens again where he left it.
# Row 1: back, 7 categories (helmets, chestplates, leggings, boots, tags, rpg outfits, accessories), icon.
# Saved outfits (« Mes tenues ») right under back (63, owner's choice of 2026-11-21). Rows 2-3: the list (14 per
# page), turn and see the outfit on the right.
# Hotbar row: pages. Theme: theme.menus.cosmetiques of Flux's config (picture drawn by gen_ui.py).
rows: 6
player-inventory: hidden
vanilla-background: false

open-actions:
  - "[cosmetics] opened"
  - "[sound] @page"
close-actions:
  - "[cosmetics] closed"

lists:
  cosmetics_cat_0:
    slots: 55
    item:
      material: entry
      actions:
        left: ["[cosmetics] category 0"]
  cosmetics_cat_1:
    slots: 56
    item:
      material: entry
      actions:
        left: ["[cosmetics] category 1"]
  cosmetics_cat_2:
    slots: 57
    item:
      material: entry
      actions:
        left: ["[cosmetics] category 2"]
  cosmetics_cat_3:
    slots: 58
    item:
      material: entry
      actions:
        left: ["[cosmetics] category 3"]
  cosmetics_cat_4:
    slots: 59
    item:
      material: entry
      actions:
        left: ["[cosmetics] category 4"]
  cosmetics_cat_5:
    slots: 63
    item:
      material: entry
      actions:
        left: ["[cosmetics] category 5"]
  cosmetics_cat_6:
    slots: 60
    item:
      material: entry
      actions:
        left: ["[cosmetics] category 6"]
  cosmetics_cat_7:
    slots: 61
    item:
      material: entry
      actions:
        left: ["[cosmetics] category 7"]
  cosmetics:
    slots: 64-70, 73-79
    item:
      material: entry
      actions:
        left: ["%entry_clic%", "[cosmetics] changed", "[refresh]"]
        right: ["%entry_clic_droit%"]

widgets:
  pages:
    type: pager
    list: cosmetics
    prev: 81
    next: 89

items:
  retour:
    material: "itemsadder:influitems:btn_back"
    name: "Retour"
    slots: [54]
    lore:
      - "@desc Quitter la garde-robe et revenir au menu principal."
      - "@left Menu principal"
    actions:
      left: ["[cosmetics] main"]

  icone:
    material: "itemsadder:fluxcosmetics:penderie"
    name: "Cosmétiques"
    slots: [62]
    lore:
      - "@desc Choisis ce que tu portes par-dessus ton armure et le tag affiché à côté de ton pseudo. Ton personnage le porte aussitôt, juste au-dessus."
      - "@desc Dans le monde RPG, seule ta tenue RPG compte : celle de ta classe, ou une autre que tu as débloquée."

  tourner:
    material: "itemsadder:fluxui:btn_rotate_blue"
    name: "Tourner"
    slots: [71]
    lore:
      - "@desc Fait tourner la caméra autour de ton personnage."
      - "@left Tourner à gauche"
      - "@right Tourner à droite"
    actions:
      left: ["[cosmetics] turn -45"]
      right: ["[cosmetics] turn 45"]

  camera:
    material: "itemsadder:fluxui:btn_eye_blue"
    name: "Voir ma tenue"
    slots: [80]
    lore:
      - "@desc Ferme ce menu pour te voir en entier et tourner la caméra au clavier. Clic droit dans le vide pour rouvrir le menu."
      - "@left Voir ma tenue"
    actions:
      left: ["[close]"]
