# Cosmetics menu, opened from the wardrobe (/tenue, right click). Drawn in the player's inventory rows only (slots 54
# to 89 of a 6-row chest): the chest above stays empty and transparent, the mannequin is seen over the menu and wears
# what is clicked at once. Row 1: back, turn, the 5 categories, see the outfit, icon; rows 2-3: saved outfits
# (63), the list (14 per page); hotbar row: pages. Entries and category buttons are built by FluxCosmetics (lists cosmetics, cosmetics_cat_<n>);
# Flux keeps each player's category and page, so the menu opens again where he left it.
# Theme: theme.menus.cosmetiques of Flux's config (picture drawn by gen_ui.py).
rows: 6
player-inventory: hidden
vanilla-background: false

open-actions:
  - "[cosmetics] opened"
  - "[sound] @page"
close-actions:
  - "[cosmetics] closed"

lists:
  cosmetics_cat_0:
    slots: 56
    item:
      material: entry
      actions:
        left: ["[list] cosmetics filter 0", "[cosmetics] frame", "[refresh]"]
  cosmetics_cat_1:
    slots: 57
    item:
      material: entry
      actions:
        left: ["[list] cosmetics filter 1", "[cosmetics] frame", "[refresh]"]
  cosmetics_cat_2:
    slots: 58
    item:
      material: entry
      actions:
        left: ["[list] cosmetics filter 2", "[cosmetics] frame", "[refresh]"]
  cosmetics_cat_3:
    slots: 59
    item:
      material: entry
      actions:
        left: ["[list] cosmetics filter 3", "[cosmetics] frame", "[refresh]"]
  cosmetics_cat_4:
    slots: 60
    item:
      material: entry
      actions:
        left: ["[list] cosmetics filter 4", "[cosmetics] frame", "[refresh]"]
  # saved outfits, left of the list they fill
  cosmetics_cat_5:
    slots: 63
    item:
      material: entry
      actions:
        left: ["[list] cosmetics filter 5", "[cosmetics] frame", "[refresh]"]
  cosmetics:
    slots: 64-70, 73-79
    item:
      material: entry
      actions:
        left: ["%entry_clic%", "[cosmetics] changed", "[refresh]"]
        right: ["%entry_clic_droit%"]

widgets:
  pages:
    type: pager
    list: cosmetics
    prev: 81
    next: 89

items:
  retour:
    material: "itemsadder:influitems:btn_back"
    name: "Retour"
    slots: [54]
    lore:
      - "@desc Quitter la garde-robe et revenir au menu principal."
      - "@left Menu principal"
    actions:
      left: ["[cosmetics] main"]

  tourner:
    material: "itemsadder:fluxui:btn_rotate_blue"
    name: "Tourner"
    slots: [55]
    lore:
      - "@desc Fait tourner la caméra autour de ton personnage."
      - "@left Tourner à gauche"
      - "@right Tourner à droite"
    actions:
      left: ["[cosmetics] turn -45"]
      right: ["[cosmetics] turn 45"]

  camera:
    material: "itemsadder:fluxui:btn_eye_blue"
    name: "Voir ma tenue"
    slots: [61]
    lore:
      - "@desc Ferme ce menu pour te voir en entier et tourner la caméra au clavier. Clic droit dans le vide pour rouvrir le menu."
      - "@left Voir ma tenue"
    actions:
      left: ["[close]"]

  icone:
    material: "itemsadder:fluxcosmetics:penderie"
    name: "Cosmétiques"
    slots: [62]
    lore:
      - "@desc Choisis ce que tu portes par-dessus ton armure et le tag affiché à côté de ton pseudo. Ton personnage le porte aussitôt, juste au-dessus."
      - "@desc Ferme ce menu pour bouger la caméra, puis clic droit pour le rouvrir."
