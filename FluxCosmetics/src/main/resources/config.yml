# Particles around the wearer of a cosmetic (its trail). colours: pairs "first colour, colour it fades into", one pair
# per particle; period: ticks between two particles (5 = four a second, about ten alive at once); size of the dust;
# low / high: heights above his feet, radius: to each side of his back, behind: distance behind him (blocks).
# Seen by those who see him only; none while he is invisible, in the wardrobe or in the rpg universe.
trails:
  cape_astral_particles:
    colours: ["#62C8D0 #A5CCDA", "#D6B9DF #A18AC4", "#A5CCDA #D6B9DF"]
    period: 5
    size: 0.5
    low: 0.45
    high: 1.35
    radius: 0.5
    behind: 0.35
  ender_crown_particles:
    colours: ["#A66BCB #583C82", "#B9A2E1 #543D80"]
    period: 6
    size: 0.45
    ring: true
    low: 1.85
    high: 2.45
    radius: 0.55
  cosmic_hat_particles:
    colours: ["#F6FAFF #B9A2E1", "#B9A2E1 #8766BC", "#FFF0AE #F6FAFF"]
    period: 4
    size: 0.4
    ring: true
    low: 1.9
    high: 2.7
    radius: 0.7
  particle_boots_particles:
    colours: ["#B59BD6 #76579B", "#EF8ACB #B59BD6"]
    period: 6
    size: 0.4
    ring: true
    low: 0.05
    high: 0.35
    radius: 0.45
  rocket_boots_particles:
    colours: ["#F49A42 #A83C30", "#E15B35 #6F2929"]
    period: 4
    size: 0.35
    ring: true
    low: 0.0
    high: 0.15
    radius: 0.4

# Outfits of the rpg universe, apart from the vanilla cosmetics: each one is a whole outfit (the four slots).
# set: a FluxArmor set (pieces fluxarmor:<set>_<helmet|chestplate|leggings|boots>), or pieces.<piece> to pick the
# items one by one. Owned when free, given (/tenue donner), by admins, or when it is the player's class's.
# class: the class to embody to wear it (FluxDungeons id), level: the level reached in that class. An outfit with
# class or level is worn only while the player meets both, even given or free (admins aside).
# Each class's default outfit is common, its max level (50) outfit mythic.
rpg-outfits:
  rpg_brasier:
    name: "&#C96B36Tenue du Brasier"
    set: brasier
    rarity: commun
    class: pyromancer
  rpg_givre:
    name: "&#8EBCCBTenue du Givre"
    set: givre
    rarity: commun
  rpg_ancien:
    name: "&#A2B88ATenue du Sylve-Ancien"
    set: ancien
    rarity: mythique
    class: druid
    level: 50
  rpg_saule:
    name: "&#82916BTenue du Vieux-Saule"
    set: saule
    rarity: commun
    class: druid
  rpg_sylve:
    name: "&#A2B88ATenue de la Sylve Primordiale"
    set: sylve
    rarity: epique
  rpg_hivers:
    name: "&#8EBCCBTenue des Mille Hivers"
    set: hivers
    rarity: mythique
    class: cryomancer
    level: 50
  rpg_pyromancien:
    name: "&#C65A35Tenue du Pyromancien des Cendres"
    set: pyromancien
    rarity: mythique
    class: pyromancer
    level: 50
  rpg_sentinelle:
    name: "&#83A6F5Tenue de la Sentinelle Azurée"
    set: sentinelle
    rarity: mythique
  rpg_veilleur:
    name: "&#65AFAETenue de l'Ordre des Veilleurs"
    set: veilleur
    rarity: epique
  rpg_zero:
    name: "&#B9E8F2Tenue du Zéro Absolu"
    set: zero
