# FluxCosmetics: cosmetics of the players.
# The wardrobe (/tenue): the player leaves his body (a mannequin with his skin stays in his place) and becomes a camera
# around it. Left / right keys turn the camera around him, forward / backward tilt it over or under him, the mouse
# moved forward / back slides it up or down, the mouse wheel zooms.
# Distances in blocks, angles in degrees, speeds per tick (20 ticks = 1 second).

language: ""

# Menu opened by a right click on the back button of the cosmetics menu (the wardrobe is left first).
main-menu: main

# Saved outfits per player (category "My outfits" of the cosmetics menu).
presets: 7

# Colours of the leather icons of the cosmetics menu's categories, in order: helmets, chestplates, leggings, boots.
menu-colours: ["#7A48C0", "#E060A0", "#2BC4E8", "#2ECF7B"]

camera:
  # Distance from the mannequin when the wardrobe opens.
  distance: 3.2
  # Closest and farthest the wheel can bring the camera.
  min-distance: 0.6
  max-distance: 6.0
  # Blocks per notch of the mouse wheel.
  zoom-step: 0.4
  # Degrees the camera turns around him per tick while left or right is held (3 = 60 degrees a second).
  turn-speed: 3
  # Degrees the camera tilts over or under him per tick while forward or backward is held.
  pitch-speed: 2
  # Highest look down (positive) and look up (negative) allowed.
  max-pitch: 70
  min-pitch: -25
  # Point looked at when the wardrobe opens, above the mannequin's feet (1.0 = his chest). Moving the mouse forward or
  # back slides it, and the camera with it, between min-height (his feet) and max-height (over his head).
  target-height: 1.0
  min-height: 0.1
  max-height: 1.9
  # Blocks the camera slides per degree the mouse would have turned the view.
  mouse-height: 0.03
  # Look down when the wardrobe opens.
  start-pitch: 12

# Camera of the cosmetics menu (right click in the wardrobe). The menu covers the lower part of the screen: each
# category frames its piece in the upper middle. height: the piece above the mannequin's feet (blocks), distance:
# from it, pitch: the camera's angle above it (degrees, looking down), look-down: degrees the view tilts below the
# piece so it shows above the menu (17 puts it halfway up the upper half with the default field of view).
menu-camera:
  look-down: 17
  shots:
    head:  {height: 1.8, distance: 1.6, pitch: 6, look-down: 22}
    chest: {height: 1.25, distance: 1.9, pitch: 8, look-down: 22}
    legs:  {height: 0.75, distance: 1.7, pitch: 10, look-down: 20}
    feet:  {height: 0.15, distance: 1.4, pitch: 16}
    # the tags: his real nametag over the mannequin's head, framed with his head
    tags:  {height: 2.15, distance: 1.9, pitch: 2, look-down: 18}
    # saved outfits: the whole body, nametag included
    outfits: {height: 1.1, distance: 3.6, pitch: 8, look-down: 14}
    # rpg outfits: the whole body
    rpg: {height: 1.0, distance: 3.2, pitch: 8, look-down: 14}
    # accessories (bags, capes, wings...): the chest and what stands out of it
    accessories: {height: 1.3, distance: 2.6, pitch: 8, look-down: 18}


# Rarities, from the most common to the rarest (menu order); colour of the name shown in the menu. Names in the
# lang files (rarities.<id>).
rarities:
  commun: {colour: "#B5B5B5"}
  unique: {colour: "#5BC0EB"}
  epique: {colour: "#B376E5"}
  mythique: {colour: "#E060A0"}
  legendaire: {colour: "#F0A800"}
  fabuleux: {colour: "#FF5C5C"}

# The cosmetics. item: what is worn (a Flux item id such as fluxarmor:zero_helmet, or a material); model: an item
# model of the pack drawn instead (item is then optional), slot: head, chest,
# legs or feet (drawn over the real item of that slot, for everybody, the wearer included: his real item keeps its
# name and lore on his screen), rarity: one of the rarities above, free: owned by everybody. Otherwise a player owns
# it once given (/tenue donner <player> <id|tout>); admins (flux.admin) own them all.
