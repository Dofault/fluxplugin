# FluxCosmetics: cosmetics of the players.
# The wardrobe (/tenue): the player leaves his body (a mannequin with his skin stays in his place) and becomes a camera
# around it. Left / right keys turn the camera around him, forward / backward tilt it over or under him, the mouse
# moved forward / back slides it up or down, the mouse wheel zooms.
# Distances in blocks, angles in degrees, speeds per tick (20 ticks = 1 second).

language: ""

camera:
  # Distance from the mannequin when the wardrobe opens.
  distance: 3.2
  # Closest and farthest the wheel can bring the camera.
  min-distance: 0.6
  max-distance: 6.0
  # Blocks per notch of the mouse wheel.
  zoom-step: 0.4
  # Degrees the camera turns around him per tick while left or right is held (3 = 60 degrees a second).
  turn-speed: 3
  # Degrees the camera tilts over or under him per tick while forward or backward is held.
  pitch-speed: 2
  # Highest look down (positive) and look up (negative) allowed.
  max-pitch: 70
  min-pitch: -25
  # Point looked at when the wardrobe opens, above the mannequin's feet (1.0 = his chest). Moving the mouse forward or
  # back slides it, and the camera with it, between min-height (his feet) and max-height (over his head).
  target-height: 1.0
  min-height: 0.1
  max-height: 1.9
  # Blocks the camera slides per degree the mouse would have turned the view.
  mouse-height: 0.03
  # Look down when the wardrobe opens.
  start-pitch: 12


# The green book button of the inventory opens the cosmetics instead of the recipes (no crafting recipe in the book any
# more; crafting itself is unchanged, furnace books keep theirs). Java only.
recipe-book: true

# The cosmetics of the catalog. tab: equipment, building, redstone or misc (the four tabs of the book, icons drawn by
# the client). icon: a material or itemsadder:<namespace>:<id>. unlocked: everybody has it (first version: ownership
# comes later).
cosmetics:
  crown:
    name: "Golden crown"
    description: "A crown for the most famous."
    icon: GOLDEN_HELMET
    tab: equipment
    unlocked: true
  wings:
    name: "Wings"
    description: "Wings that only look like they fly."
    icon: ELYTRA
    tab: equipment
    unlocked: false
  cape:
    name: "Cape"
    description: "A cape on your shoulders."
    icon: LEATHER_CHESTPLATE
    tab: equipment
    unlocked: true
  halo:
    name: "Halo"
    description: "A light over your head."
    icon: GLOWSTONE_DUST
    tab: misc
    unlocked: true
  flames:
    name: "Flames"
    description: "Flames at your feet."
    icon: BLAZE_POWDER
    tab: misc
    unlocked: false
