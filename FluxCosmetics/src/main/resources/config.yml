# Outfits of the rpg universe, apart from the vanilla cosmetics: each one is a whole outfit (the four slots).
# set: a FluxArmor set (pieces fluxarmor:<set>_<helmet|chestplate|leggings|boots>), or pieces.<piece> to pick the
# items one by one. Owned when free, given (/tenue donner), by admins, or when it is the player's class's.
# class: the class to embody to wear it (FluxDungeons id), level: the level reached in that class. An outfit with
# class or level is worn only while the player meets both, even given or free (admins aside).
# Each class's default outfit is common, its max level (50) outfit mythic.
rpg-outfits:
  rpg_brasier:
    name: "&#C96B36Tenue du Brasier"
    set: brasier
    rarity: commun
    class: pyromancer
  rpg_givre:
    name: "&#8EBCCBTenue du Givre"
    set: givre
    rarity: commun
  rpg_ancien:
    name: "&#A2B88ATenue du Sylve-Ancien"
    set: ancien
    rarity: mythique
    class: druid
    level: 50
  rpg_saule:
    name: "&#82916BTenue du Vieux-Saule"
    set: saule
    rarity: commun
    class: druid
  rpg_sylve:
    name: "&#A2B88ATenue de la Sylve Primordiale"
    set: sylve
    rarity: epique
  rpg_hivers:
    name: "&#8EBCCBTenue des Mille Hivers"
    set: hivers
    rarity: mythique
    class: cryomancer
    level: 50
  rpg_pyromancien:
    name: "&#C65A35Tenue du Pyromancien des Cendres"
    set: pyromancien
    rarity: mythique
    class: pyromancer
    level: 50
  rpg_sentinelle:
    name: "&#83A6F5Tenue de la Sentinelle Azurée"
    set: sentinelle
    rarity: mythique
  rpg_zero:
    name: "&#B9E8F2Tenue du Zéro Absolu"
    set: zero
    rarity: commun
    class: cryomancer
  rpg_arcanum:
    name: "&#C8874DTenue de l'Arcanum"
    set: arcanum
    rarity: legendaire

# Outfit worn by default in the rpg universe, by class (FluxDungeons class id; default: any other class). A player
# there is never bare.
rpg-class-outfits:
  pyromancer: rpg_brasier
  cryomancer: rpg_zero
  druid: rpg_saule
  default: rpg_sentinelle

# Universe of the rpg world (Flux's universes.yml).
rpg-universe: rpg

# Player tags (FluxTags until 2026-11-21): one tag worn before the name in the chat (%fluxcosmetics_tag%), the tab list
# ({tag} of Flux's tab.yml) and over the head, chosen in the Tags category of the cosmetics menu or with /tags <tag>.
# Images: ItemsAdder pack "fluxtags", generated by plugins/fluxplugin/FluxCosmetics/assets/tags/gen_tags.py (also writes
# tag_glyphs.yml next to this file: the size of each image).
tags:
  # The player's rank (one tag that follows his current rank: an older rank's tag cannot be kept).
  rank-placeholder: "%luckperms_current_group_on_track_standard%"
  # Job tags: unlocked at the first level, a new look at each next level (6 tiers: Common ... Fabled).
  job-tiers: [50, 100, 150, 200, 250, 300]
  # Tag worn by a player who never picked one, by main group (when he has that tag), else his rank.
  default-tags:
    admin: admin
    operateur: operateur
  # Special tags, unlocked by fluxcosmetics.tag.<id>, or by their own "permission" (staff tags: flux.admin, the one
  # admin node of the suite). hidden: true = only listed for who has it. shortcut: a command of its own that wears the
  # tag (renamed like any other in plugins/Flux/commands.yml).
  specials:
    beta:
      name: "Beta"
      description: "Played during the beta of the server."
    createur:
      name: "Creator"
      description: "Partner content creator."
    operateur:
      name: "Operator"
      description: "Staff tag of the operators."
      permission: flux.admin
      hidden: true
      shortcut: "_o"
    admin:
      name: "Admin"
      description: "Staff tag of the administrators."
      permission: flux.admin
      hidden: true
      shortcut: "_a"
