# Entrée d'un boss (scène d'entrée des donjons, FluxDungeons boss-room.intro) : environ 10 secondes en ré mineur.
# Un cœur lent et un bourdon, une montée, puis l'accord qui tombe à 7,5 s (le rugissement du boss). Commune à tous
# les boss.
title: "Le Réveil"
author: "Influencraft"
bpm: 96
steps-per-beat: 4
beats-per-bar: 4

tracks:
  bourdon: { instrument: didgeridoo, volume: 0.7, chorus: 8 }
  basse:   { instrument: bass, volume: 0.85, chorus: 12 }
  harpe:   { instrument: harp, volume: 0.55 }
  flute:   { instrument: flute, volume: 0.6 }
  cloche:  { instrument: bell, volume: 0.45 }
  guitare: { instrument: guitar, volume: 0.7 }
  grosse:  { instrument: basedrum, volume: 0.8 }
  caisse:  { instrument: snare, volume: 0.4 }

sections:
  reveil:
    bourdon: "D2:16 | D2:16 | A#1:8 A1:8 | D2:16"
    basse: ".:16 | D2:8 C2:8 | A#1:8 A1:8 | D2:16"
    harpe: ".:8 D4:4 F4:4 | A4:4 G4:4 F4:4 E4:4 | D4:2 E4:2 F4:2 A4:2 D5:2 E5:2 F5:2 F5:2 | D4+A4+D5:16"
    flute: ".:16 | .:16 | .:8 A5:4 C#6:4 | D6~:16"
    cloche: ".:16 | .:16 | .:16 | D6+A6:16"
    guitare: ".:16 | .:16 | A#2+F3+A#3:8 A2+E3+A3+C#4:8 | D3+A3+D4+F4:16"
    grosse: "x:8 x:8 | x:4 x:4 x:4 x:4 | x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2 | x:16"
    caisse: ".:16 | .:16 | .:8 x x x x x x x x | x:16"
