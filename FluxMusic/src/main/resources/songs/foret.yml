# Les Murmures de Sylve : exploration en mi dorien (do dièse dans l'accord de la majeur).
# Arpège de guitare grave, danse à la harpe, milieu mélancolique à la flûte, fin sombre.
title: "Les Murmures de Sylve"
author: "Influencraft"
bpm: 84
steps-per-beat: 4
beats-per-bar: 4
loop: false

tracks:
  harpe:   { instrument: harp, volume: 0.8 }
  flute:   { instrument: flute, volume: 0.7 }
  nappe:   { instrument: harp, volume: 0.3 }
  guitare: { instrument: guitar, volume: 0.6 }
  basse:   { instrument: bass, volume: 0.8 }
  carillon: { instrument: chime, volume: 0.3 }
  grosse:  { instrument: basedrum, volume: 0.5 }
  caisse:  { instrument: snare, volume: 0.22 }
  charley: { instrument: hat, volume: 0.15 }

patterns:
  gt_em: "E3:2 G3:2 B3:2 E4:2 B3:2 G3:2 E3:2 B2:2"
  gt_a:  "A2:2 E3:2 A3:2 C#4:2 E4:2 C#4:2 A3:2 E3:2"
  gt_c:  "C3:2 G3:2 C4:2 E4:2 C4:2 G3:2 E3:2 G3:2"
  gt_d:  "D3:2 A3:2 D4:2 F#4:2 D4:2 A3:2 F#3:2 A3:2"
  gt_bm: "B2:2 F#3:2 B3:2 D4:2 F#4:2 D4:2 B3:2 F#3:2"
  gt_am: "A2:2 E3:2 A3:2 C4:2 E4:2 C4:2 A3:2 E3:2"
  gt_b:  "B2:2 F#3:2 B3:2 D#4:2 F#4:2 D#4:2 B3:2 F#3:2"
  danse: "B4:2 E5:2 F#5:4 E5:2 D5:2 B4:4 | C#5:2 D5:2 E5:4 A4:4 .:4 | B4:2 E5:2 F#5:4 E5:2 F#5:2 D5:2 B4:2 | A4:6 B4:2 C#5:8 | E5:4 D5:2 C5:2 B4:4 G4:4 | F#4:4 A4:2 D5:2 C5:4 A4:4 | B4:4 G4:2 F#4:2 E4:8 | .:16"
  danse_haut: "B5:2 E6:2 F#6:4 E6:2 D6:2 B5:4 | C#6:2 D6:2 E6:4 A5:4 .:4 | B5:2 E6:2 F#6:4 E6:2 F#6:2 D6:2 B5:2 | A5:6 B5:2 C#6:8 | E6:4 D6:2 C6:2 B5:4 G5:4 | F#5:4 A5:2 D6:2 C6:4 A5:4 | B5:4 G5:2 F#5:2 E5:8 | .:16"
  gt_danse: "@gt_em | @gt_a | @gt_em | @gt_a | @gt_c | @gt_d | @gt_em | @gt_em"
  b_danse: "E2:8 B1:8 | A1:8 E2:8 | E2:8 B1:8 | A1:8 E2:8 | C2:8 G1:8 | D2:8 A1:8 | E2:8 B1:8 | E2:16"
  kick: "x:6 x:2 x:8"
  rim: ".:4 x:8 x:4"
  hats: "x:2 x:2 x:2 x:2 x:2 x:2 x:2 x:2"

sections:
  intro:
    guitare: "@gt_em | @gt_a | @gt_em | @gt_a"
    carillon: "B5:16 | C#6:16 | B5:16 | A5:16"
    basse: ".:32 | E2:16 | A1:16"
  danse:
    harpe: "@danse"
    guitare: "@gt_danse"
    basse: "@b_danse"
    grosse: "@kick*7 | .:16"
    caisse: "@rim*7 | .:16"
    charley: "@hats*8"
  milieu:
    flute: "G5:8 E5:8 | F#5:8 A5:8 | B5:12 A5:4 | G5:8 E5:8 | C6:8 B5:4 A5:4 | G5:8 E5:8 | F#5:8 D#5:8 | F#5:16"
    nappe: "E4+G4+C5:16 | F#4+A4+D5:16 | F#4+B4+D5:16 | E4+G4+B4:16 | E4+A4+C5:16 | E4+G4+C5:16 | F#4+B4+D#5:16 | F#4+B4+D#5:16"
    guitare: "@gt_c | @gt_d | @gt_bm | @gt_em | @gt_am | @gt_c | @gt_b | @gt_b"
    basse: "C2:16 | D2:16 | B1:16 | E2:16 | A1:16 | C2:16 | B1:16 | B1:16"
    carillon: ".:64 | E6+A6+C7:16 | .:48"
  danse_finale:
    harpe: "@danse"
    flute: "@danse_haut"
    guitare: "@gt_danse"
    basse: "@b_danse"
    grosse: "@kick*7 | .:16"
    caisse: "@rim*7 | .:16"
    charley: "@hats*7 | .:16"
  fin:
    harpe: "B4:4 G4:4 F#4:4 D4:4 | E4:16"
    guitare: "@gt_em | E3+B3+E4:16"
    carillon: ".:16 | B5:16"
    basse: "E2:16 | E2:16"

order: [intro, danse, milieu, danse_finale, fin]
