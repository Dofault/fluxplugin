# La Chope du Voyageur : gigue de taverne en sol majeur (couleur mixolydienne : fa naturel dans la partie B).
# Mesure à 6/8 : un pas = une croche, 3 par temps, 2 temps par mesure.
title: "La Chope du Voyageur"
author: "Influencraft"
bpm: 112
steps-per-beat: 3
beats-per-bar: 2
loop: false

tracks:
  melodie: { instrument: flute, volume: 0.9 }
  banjo:   { instrument: banjo, volume: 0.45 }
  guitare: { instrument: guitar, volume: 0.6 }
  basse:   { instrument: bass, volume: 0.8 }
  grosse:  { instrument: basedrum, volume: 0.55 }
  caisse:  { instrument: snare, volume: 0.25 }
  charley: { instrument: hat, volume: 0.18 }

patterns:
  gt_g: ".:3 G3+B3+D4:2 G3+B3+D4"
  gt_c: ".:3 G3+C4+E4:2 G3+C4+E4"
  gt_d: ".:3 F#3+A3+D4:2 F#3+A3+D4"
  gt_f: ".:3 F3+A3+C4:2 F3+A3+C4"
  b_g: "G1:3 D2:3"
  b_c: "C2:3 G1:3"
  b_d: "D2:3 A1:3"
  b_f: "F2:3 C2:3"
  kick: "x:6"
  rim: ".:3 x:3"
  hats: ".:1 x x .:1 x x"
  mel_a: "D5 B4 G4 D5 B4 G4 | G5:2 F#5 G5:2 D5 | E5 C5 E5 G5:2 E5 | F#5:2 E5 D5:3 | D5 B4 G4 D5 B4 G4 | B5:2 A5 G5:2 D5 | C5 E5 G5 F#5 E5 D5 | G5:3 G4:3"
  mel_b: "C6:2 A5 F5:2 A5 | C6 D6 C6 A5:3 | G5:2 E5 C5:2 E5 | G5 A5 G5 E5:3 | D5:2 G5 B5:2 G5 | A5 B5 A5 G5:3 | F#5:2 A5 D6:2 C6 | B5 A5 G5 F#5:3"
  ban_a: "D4 B3 G3 D4 B3 G3 | G4:2 F#4 G4:2 D4 | E4 C4 E4 G4:2 E4 | F#4:2 E4 D4:3 | D4 B3 G3 D4 B3 G3 | B4:2 A4 G4:2 D4 | C4 E4 G4 F#4 E4 D4 | G4:3 G3:3"

sections:
  intro:
    guitare: "@gt_g | @gt_g"
    basse: "@b_g | @b_g"
    charley: "@hats | @hats"
  partie_a:
    melodie: "@mel_a"
    guitare: "@gt_g | @gt_g | @gt_c | @gt_d | @gt_g | @gt_g | @gt_c | @gt_g"
    basse: "@b_g | @b_g | @b_c | @b_d | @b_g | @b_g | @b_c | @b_g"
    grosse: "@kick*8"
    caisse: "@rim*8"
    charley: "@hats*8"
  partie_b:
    melodie: "@mel_b"
    guitare: "@gt_f | @gt_f | @gt_c | @gt_c | @gt_g | @gt_g | @gt_d | @gt_d"
    basse: "@b_f | @b_f | @b_c | @b_c | @b_g | @b_g | @b_d | @b_d"
    grosse: "@kick*8"
    caisse: "@rim*8"
    charley: "@hats*8"
  reprise:
    melodie: "@mel_a"
    banjo: "@ban_a"
    guitare: "@gt_g | @gt_g | @gt_c | @gt_d | @gt_g | @gt_g | @gt_c | @gt_g"
    basse: "@b_g | @b_g | @b_c | @b_d | @b_g | @b_g | @b_c | @b_g"
    grosse: "@kick*8"
    caisse: "@rim*8"
    charley: "@hats*8"
  fin:
    melodie: "G5:6"
    banjo: "G3+B3+D4+G4:6"
    guitare: "G2+D3+G3+B3:6"
    basse: "G1:6"
    grosse: "x:6"

order: [intro, partie_a, partie_b, reprise, fin]
