# Language of the texts (empty = the suite's language).
language: ""
# Multiplies the volume of every note (1.0 = as written in the songs).
volume: 1.0
# Quand une musique s'arrête (sortie d'un lieu, fin de donjon, autre musique), son volume baisse peu à peu
# pendant ce nombre de secondes au lieu de couper net. 0 = coupure immédiate.
fade-out-seconds: 2.5
# Song played (as a jingle, over the music) at moments of the game. Empty = nothing.
moments:
  job-level-up: niveau
# Ambient music of places: while a player is in one of the worlds, these songs play one after another (shuffled),
# with a pause between two. Other music (crates, dungeons) always wins; the ambience comes back after it.
ambience:
  rpg-lobby:
    worlds: [flux_rpg]
    pause-seconds: 4
    first: camp_veilleurs
    songs: [camp_veilleurs, rpg1, rpg2, rpg3, rpg4, rpg5, rpg6, rpg7, rpg8, rpg9, rpg10]
  resaac:
    worlds: [resaac]
    pause-seconds: 4
    songs: [resaac, resaac2, resaac_bonjour, resaac_fleurs, resaac_route, resaac_the, resaac_toits, resaac_gare, resaac_parc, resaac_academie, resaac_fete, resaac_quais]
# The band of the stages (/musique stage place <place>): the model (BetterModel) playing each note block instrument,
# front row first. A place given a stage plays one music for everybody there, heard from the stage within its
# radius; each musician moves only while his instrument sounds.
band:
  guitar: guitariste
  banjo: banjoiste
  flute: trompettiste
  harp: harpiste
  pling: pling
  bit: bit
  bell: glockenspiel
  cow_bell: cloche
  chime: carillonneur
  xylophone: xylophoniste
  iron_xylophone: vibraphoniste
  snare: caisse_claire
  basedrum: grosse_caisse
  hat: charleston
  bass: contrebassiste
  didgeridoo: didgeridoo
