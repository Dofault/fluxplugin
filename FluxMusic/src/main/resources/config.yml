# Language of the texts (empty = the suite's language).
language: ""
# Multiplies the volume of every note (1.0 = as written in the songs).
volume: 1.0
# Quand une musique s'arrête (sortie d'un lieu, fin de donjon, autre musique), son volume baisse peu à peu
# pendant ce nombre de secondes au lieu de couper net. 0 = coupure immédiate.
fade-out-seconds: 2.5
# Song played (as a jingle, over the music) at moments of the game. Empty = nothing.
moments:
  job-level-up: niveau
# Ambient music of places: while a player is in one of the worlds, these songs play one after another (shuffled),
# with a pause between two. Other music (crates, dungeons) always wins; the ambience comes back after it.
ambience:
  rpg-lobby:
    worlds: [flux_rpg]
    pause-seconds: 4
    songs: [camp_veilleurs]
