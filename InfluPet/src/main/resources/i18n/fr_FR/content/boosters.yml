# Boosters : un par série (seul moyen d'adopter ses familiers), un Prestige, et 4 paliers qui peuvent donner
# n'importe quel familier (un au plus par ouverture). cards = tirages, rarity-weights / pet-rarity-weights
# = poids des raretés, contents = « card:<id> » / « pet:<id> » (vide = tout le contenu obtenable),
# pet-chance = % de chance qu'un tirage soit un familier, duplicate-plush: false = un doublon ne donne
# jamais sa peluche depuis ce booster. %adopted:<id>% dans la description affiche ✔ ou ✘ selon que le
# joueur a adopté ce familier. Modifié aussi par /influpet menu.

