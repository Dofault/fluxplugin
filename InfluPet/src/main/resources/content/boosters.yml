# Boosters: one per job series (the only way to adopt its pets), a Prestige booster, and 4 tiers that can
# give any pet (at most one pet per opening). cards = draws, rarity-weights / pet-rarity-weights = rarity
# weights, contents = "card:<id>" / "pet:<id>" (empty = all obtainable content), pet-chance = % chance
# that a draw is a pet, duplicate-plush: false = a duplicate never gives its plush from this booster.
# %adopted:<pet id>% in the lore shows ✔ or ✘ depending on whether the viewer adopted that pet.
