name: InfluMarche
version: '0.1.0'
main: fr.influencraft.influmarche.InfluMarche
api-version: '1.21'
description: Marché unifié (hôtel des ventes AuctionHouse + échoppes InfluEchoppe), historique et prix moyen.
authors: [Influencraft]
depend: [Vault, AuctionHouse]
softdepend: [FluxMenu, PlaceholderAPI, InfluEchoppe, InfluLands, ItemsAdder]
# Pilote SQLite de l'historique (téléchargé par Paper au premier démarrage, déjà en cache sur Labs).
libraries:
  - org.xerial:sqlite-jdbc:3.49.1.0
commands:
  influmarche:
    description: Navigation des menus du marché (boutons FluxMenu).
    usage: /influmarche
  hdv:
    description: Marché et hôtel des ventes.
    aliases: [marche]
    usage: /hdv [search <objet>|sell|history|average|help]
permissions:
  influmarche.admin:
    description: /influmarche reload
    default: op
