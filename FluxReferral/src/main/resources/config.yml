# ===================================================
# FluxReferral, InfluenCraft
# Configuration principale
# Auteur : Entr0pik
# ===================================================

base-de-donnees:
  # La base elle-même (SQLite ou MySQL/MariaDB, hôte, identifiants) se règle une seule fois pour toute la suite,
  # section database de plugins/Flux/config.yml. Ici : seulement le préfixe des tables du parrainage.
  prefixe-tables: "parr_"
  # Ancien fichier SQLite local, recopié une fois dans la base de Flux au démarrage
  fichier-local: "parrainage.db"

# Code de langue : correspond au fichier langue_{code}.yml
langue: fr

# Préfixe affiché devant chaque message du plugin (format MiniMessage)
prefixe: "<color:#B376E5>ᴘᴀʀʀᴀɪɴᴀɢᴇ</color> <dark_gray>▸</dark_gray>"

# ===================================================
# Adresse personnelle : <pseudo>.<domaine>
# ===================================================
# Chaque joueur a sa propre adresse de serveur (ex : dofault.influencraft.fr).
# Un nouveau joueur qui se connecte avec devient son filleul (validé après temps-jeu-minimum).
# Le serveur lit l'adresse tapée par le joueur, transmise par Velocity (forwarding "modern").
# Prérequis réseau :
#   - DNS : enregistrement A générique "*.<domaine>" vers l'IP du serveur ;
#   - le proxy doit répondre sur le port 25565 de cette IP : avec un enregistrement SRV, le
#     client envoie la cible du SRV et non l'adresse tapée, l'adresse perso serait perdue.
adresse:
  active: true
  domaine: "influencraft.fr"
  # Anciens domaines encore lus (une adresse donnée avant un changement marche toujours)
  autres-domaines:
    - "play.influencraft.fr"
  # Sous-domaines du site et du serveur : jamais une adresse perso (un joueur nommé ainsi donne son code)
  reserves: [play, www, map, carte, wiki, api, mail, vote, boutique, shop, store, discord, dev, admin, panel,
    lobby, labs, semilab, events, mc, minecraft, static, cdn, stats, status, ns1, ns2, smtp, imap, webmail]
  # Une arrivée par adresse n'est prise en compte que si le joueur s'est connecté pour la première
  # fois il y a moins de X heures (un ancien joueur ne rapporte rien à celui dont il prend l'adresse)
  delai-arrivee-heures: 48

# ===================================================
# Comment le joueur a découvert le serveur
# ===================================================
# À sa première connexion (et aux suivantes tant qu'il n'a pas répondu, pendant delai-arrivee-heures),
# un joueur arrivé sans l'adresse perso d'un autre joueur reçoit une fenêtre : un bouton par source
# ci-dessous, plus « Par un joueur » avec un champ pour son pseudo (ou son code). Répondre « par un
# joueur » vaut une arrivée par son adresse : parrainage en attente du temps de jeu minimum.
# Une arrivée par adresse perso est enregistrée toute seule, sans questionnaire.
# /parrainage decouverte <joueur> et /parrainage decouvertes (admin) pour consulter.
decouverte:
  questionnaire: true
  # Délai avant l'ouverture de la fenêtre après la connexion (secondes)
  delai-secondes: 5
  sources:
    tiktok: "TikTok"
    vote: "Site de vote"

parrainage:
  # Temps de jeu minimum avant qu'un code puisse être utilisé, et avant qu'une arrivée par
  # adresse soit validée (en secondes). Mettre à 0 pour désactiver
  temps-jeu-minimum: 3600
  # Refuse le parrainage si parrain et filleul ont la même dernière IP (double compte).
  # Seule une empreinte salée de l'IP est gardée en base
  bloquer-meme-ip: true
  # Fréquence de vérification du temps de jeu des filleuls en attente (en secondes)
  intervalle-verification: 60
  # Empêche le filleul de devenir à son tour le parrain de son propre parrain
  bloquer-circulaire: true
  # Notifier le joueur de son code dès sa première connexion
  generation-auto-connexion: false

# ===================================================
# Récompenses distribuées lors de la validation d'un parrainage
# (adresse perso ou /parrainage utiliser). "description" : texte du menu
# ===================================================
recompenses-parrainage:
  # Récompenses pour le parrain à chaque nouveau filleul
  parrain:
    commandes:
      - "ecocrates give {joueur} key tendance physical 1"
      - "xp add {joueur} 10 levels"
    description:
      - "&#55FF551 clé Tendance"
      - "&f10 niveaux d'expérience"
  # Récompenses pour le filleul lors de son premier parrainage
  filleul:
    commandes:
      - "ecocrates give {joueur} key ordinaire physical 2"
      - "give {joueur} bread 16"
    description:
      - "&f2 clés Ordinaire"
      - "&f16 pains"

# ===================================================
# Paliers de parrainage (récompenses bonus pour le parrain)
# "nom" et "description" : affichage dans le menu (couleurs &)
# ===================================================
paliers:
  - filleuls: 3
    nom: "3 filleuls"
    description:
      - "&f5 diamants"
      - "&f%img_bitblock% 2 000"
    recompenses:
      parrain:
        commandes:
          - "give {joueur} diamond 5"
          - "money give {joueur} 2000"
      annonce-globale: true
  - filleuls: 5
    nom: "5 filleuls"
    description:
      - "&f2 lingots de netherite"
      - "&f%img_bitblock% 5 000"
    recompenses:
      parrain:
        commandes:
          - "give {joueur} netherite_ingot 2"
          - "money give {joueur} 5000"
      annonce-globale: true
  - filleuls: 10
    nom: "10 filleuls"
    description:
      - "&fDes élytres"
      - "&f%img_bitblock% 10 000"
    recompenses:
      parrain:
        commandes:
          - "give {joueur} elytra 1"
          - "money give {joueur} 10000"
      annonce-globale: true

classement:
  # Nombre d'entrées affichées dans /parrainage top
  taille-affichage: 10
  # Intervalle de rafraîchissement du cache en mémoire (en secondes)
  intervalle-rafraichissement: 300
