decouverte-merci: "&#2ECF7BMerci pour ta réponse,&#8A8A8A bon jeu sur Influencraft !"
decouverte-merci-joueur: "&#2ECF7BMerci !&#8A8A8A On note que tu es venu grâce à &#FFD94D{joueur}&#8A8A8A."
# /origine et /parrainage admin decouverte(s) (staff)
decouverte-info: "&#FFD94D{joueur} &#8A8A8Aa découvert le serveur par &f{source} &#8A8A8A({detail}, {date})"
decouverte-info-aucune: "&#8A8A8AAucune réponse connue pour &#FFD94D{joueur}&#8A8A8A."
decouverte-stats-entete: "&#8A8A8ADécouverte du serveur &#8A8A8A(&f{total} &#8A8A8Ajoueurs)"
