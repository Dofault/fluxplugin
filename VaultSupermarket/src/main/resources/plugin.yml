name: VaultSupermarket
version: 26.2
author: dofault
main: io.dofault.supermarket.main.Main
api-version: "1.21.4"

softdepend: [PlaceholderAPI, LuckPerms, CustomFishing, AdvancedEnchantments, eco, ProtocolLib]

commands:
  supermarket:
    description: Commande principale du plugin Supermarket
    usage: /supermarket <entry|exit|save|setprice|tpshop [joueur]|checkprices>

permissions:
  supermarket.admin:
    description: "Permet d'utiliser les commandes d'administration du Supermarket (ex: tpshop <joueur>)"
    default: op
  supermarket.tpshop:
    description: "Permet de se téléporter soi-même dans le shop via /supermarket tpshop (à attribuer par grade via LuckPerms)"
    default: false
