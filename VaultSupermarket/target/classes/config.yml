language: fr
buy_block: IRON_BLOCK
sell_block: TARGET

# Cooldown (en secondes) de /supermarket tpshop pour un joueur sans la
# permission supermarket.admin. Pour donner un cooldown différent par grade,
# mets une meta LuckPerms "supermarket-tpshop-cooldown" sur le groupe
# (ex: /lp group vip meta set supermarket-tpshop-cooldown 300) — elle prend
# le dessus sur cette valeur par défaut.
tpshop-cooldown-seconds: 1800

# Warmup (en secondes) avant la téléportation de /supermarket tpshop pour un
# joueur sans la permission supermarket.admin. Le joueur ne doit pas bouger
# pendant ce délai, sinon la téléportation est annulée. Les admins n'ont
# aucun warmup (téléportation instantanée). Mettre à 0 pour désactiver.
tpshop-warmup-seconds: 3

# WARNING
# This plugin does'nt support bundle (because of glitch)
banned-items:
  - BUNDLE
  - WHITE_BUNDLE
  - ORANGE_BUNDLE
  - MAGENTA_BUNDLE
  - LIGHT_BLUE_BUNDLE
  - YELLOW_BUNDLE
  - LIME_BUNDLE
  - PINK_BUNDLE
  - GRAY_BUNDLE
  - LIGHT_GRAY_BUNDLE
  - CYAN_BUNDLE
  - PURPLE_BUNDLE
  - BLUE_BUNDLE
  - BROWN_BUNDLE
  - GREEN_BUNDLE
  - RED_BUNDLE
  - BLACK_BUNDLE

# ---------------------------------------------------------------------------
# Menu de vente manuelle (clic droit sur le bloc de vente)
# ---------------------------------------------------------------------------
# Le joueur dépose ses items dans les slots 0-44 ; la dernière rangée (45-53)
# est une zone morte remplie de vitres, avec le bouton de confirmation au
# milieu. Rien n'est vendu tant qu'il n'a pas cliqué DEUX fois dessus : le
# 1er clic arme la vente (son d'XP), le 2e vend et ferme le menu. Fermer le
# menu autrement rend tout le contenu au joueur.
sell-menu:
  # Slot du bouton de confirmation (doit être entre 45 et 53).
  confirm-slot: 49

  # Délai avant qu'un bouton armé ne redevienne inactif tout seul.
  confirm-timeout-seconds: 5

  # Les icônes ItemsAdder sont rendues via le custom_model_data posé sur un
  # matériau vanilla (le plugin n'a pas de hook ItemsAdder) :
  # 10020 = influitems:accept, 10032 = influitems:checkmark.
  # Voir ItemsAdder/storage/items_ids_cache.yml pour les autres icônes.
  confirm-button:
    material: PAPER
    custom-model-data: 10020
  confirm-button-armed:
    material: PAPER
    custom-model-data: 10032
  filler:
    material: GRAY_STAINED_GLASS_PANE
    custom-model-data: 0

# ---------------------------------------------------------------------------
# Vente automatique (objet "Vente Automatique")
# ---------------------------------------------------------------------------
# Ce qui ne doit JAMAIS partir en vente auto. But : la vente auto vend des
# ressources farmées, jamais de l'équipement ni un objet rare — un joueur qui
# reçoit le stuff d'un ami ne doit pas le voir disparaître parce qu'il avait
# oublié son objet activé. Ces items restent vendables manuellement au magasin.
autosell:
  exclusions:
    # Exceptions PAR DÉFAUT : chaque joueur peut les modifier dans le menu de
    # l'objet (clic droit). Seules les règles "enchanted" et "custom-items"
    # restent des garde-fous non modifiables.
    #
    # Tout item réparable (armures, outils, armes, arcs/arbalètes, boucliers,
    # élytres, cannes à pêche) est ajouté aux exceptions par défaut.
    damageable: true

    # Items enchantés et livres d'enchantement.
    enchanted: true

    # Items "façonnés" par un plugin : nom custom, lore, custom model data ou
    # données persistantes (ItemsAdder, AdvancedEnchantments, EcoEnchants,
    # récompenses de caisse, items de quête...).
    custom-items: true

    # Paliers de poissons CustomFishing en exception par défaut (préfixe de l'id
    # de l'objet : common, unique, epic, mythic, legendary, fabled). Absent ->
    # tous les paliers.
    fish-tiers: [common, unique, epic, mythic, legendary, fabled]

    # Matériaux en exception par défaut. Liste vide -> la liste par défaut du
    # plugin est utilisée.
    materials:
      - NETHERITE_INGOT
      - NETHERITE_SCRAP
      - NETHERITE_BLOCK
      - ANCIENT_DEBRIS
      - NETHERITE_UPGRADE_SMITHING_TEMPLATE
      - COD
      - SALMON
      - TROPICAL_FISH
      - PUFFERFISH
      - COOKED_COD
      - COOKED_SALMON
      - COD_BUCKET
      - SALMON_BUCKET
      - TROPICAL_FISH_BUCKET
      - PUFFERFISH_BUCKET
      - AXOLOTL_BUCKET
      - TADPOLE_BUCKET
      - NETHER_STAR
      - TOTEM_OF_UNDYING
      - SHULKER_SHELL
      - ELYTRA
      - DRAGON_EGG
      - DRAGON_HEAD
      - WITHER_SKELETON_SKULL
      - HEAVY_CORE
      - ECHO_SHARD
      - ENCHANTED_GOLDEN_APPLE
      - HEART_OF_THE_SEA
      - NAUTILUS_SHELL
      - BEACON
      - CONDUIT
      - END_CRYSTAL
      - TRIAL_KEY
      - OMINOUS_TRIAL_KEY
      - SNIFFER_EGG
      - SADDLE
      - NAME_TAG

# Commandes utilisables par un joueur qui se trouve dans le magasin. Toute autre
# commande est bloquée (le magasin est un espace fermé : pas de /home, /tpa,
# /back...). Le préfixe de plugin ("cmi:msg") est ignoré, donc inutile de le
# lister. Liste vide -> seul /supermarket passe.
allowed-commands:
  - supermarket
  # Exceptions : messages privés, pour ne pas laisser un joueur muet pendant ses
  # courses. Les alias sont à lister un par un (ce sont des commandes distinctes
  # côté serveur).
  - msg
  - tell
  - w
  - whisper
  - r
  - reply

# ---------------------------------------------------------------------------
# Menu de la vente automatique (clic droit avec l'objet)
# ---------------------------------------------------------------------------
# Icônes ItemsAdder rendues via custom_model_data sur du PAPER (pas de hook
# ItemsAdder), cf. ItemsAdder/storage/items_ids_cache.yml. Section facultative :
# ces valeurs sont aussi les valeurs par défaut du plugin.
autosell-menu:
  icons:
    previous: { material: PAPER, custom-model-data: 10012 }        # influitems:btn_prev
    next: { material: PAPER, custom-model-data: 10011 }            # influitems:btn_next
    category: { material: PAPER, custom-model-data: 10017 }        # influitems:filter
    view: { material: PAPER, custom-model-data: 10019 }            # influitems:search
    bulk: { material: PAPER, custom-model-data: 10021 }            # influitems:add
    reset: { material: PAPER, custom-model-data: 10024 }           # influitems:chest_delete
    info: { material: PAPER, custom-model-data: 10181 }            # influitems:unknown
