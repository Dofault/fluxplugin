name: FluxPortal
version: 26.2
main: fr.influencraft.fluxportal.FluxPortal
api-version: "26.2"
description: Permanent portals showing the other side in depth (/portail). Window shader adapted from RPE-portals (GPL-3.0).
authors: [Influencraft]
depend: [Flux]

permissions:
  fluxportal.admin:
    description: /portail (create, link, move, open, close, remove, list, go to portals).
    default: op
