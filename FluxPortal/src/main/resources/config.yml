# FluxPortal: permanent portals (docs/technique/fluxportal.md). Portals are saved in Flux's database.

# Language of the texts (lang/<language>.yml), empty = the suite's language.
language: ""

# Size of the hole of a new portal, in blocks. The width is odd (the hole is centred on a block).
width: 5
height: 4

# The window: the other side seen through the hole, in depth, drawn by the text shader of the resource pack.
window:
  # A side shows its window while a Java player is within this distance (blocks); its item frames are taken down
  # beyond it.
  view-distance: 64
  # Extra item frames around the hole, in blocks (0: exactly the hole). Frames outside the hole draw nothing with the
  # shader, but show as raw maps without it (shaders off, pack not loaded).
  margin: 0
  # Block layers of the far side read again per tick, for all windows together (a window has 28).
  layers-per-tick: 2
  # Layers read per tick by a window that just appeared, until it has them all.
  first-layers-per-tick: 4
  # Ticks between two reads of the far land and tree tops (chunks loaded in the background, never generated).
  horizon-every: 6000
  # Chunks kept loaded around the far side while its window is up (radius, in chunks).
  far-chunks-radius: 5
  # Resource packs to read block textures from, before the vanilla client (paths from the server folder): the
  # custom blocks of the pack keep their look through a portal.
  texture-packs:
    - plugins/ItemsAdder/output/generated.zip
  # Download the vanilla client from Mojang once (plugins/FluxPortal/cache/) for the vanilla block textures.
  download-client: true

# Where the window's shader is written (pack folders, from the server folder): the overlay below and pack.mcmeta.
pack:
  overlay: fluxportal_v88
  # Pack formats the shader is written for (88 = Minecraft 26.2).
  min-format: 88
  max-format: 88
  folders:
    - plugins/FluxPortal/pack
