# FluxPortal : textes des portails. Une ligne qui commence par « ! » n'a pas le préfixe. Charte des plugins Flux
# (texte gris #8A8A8A, noms en or #FFD94D, erreur en rouge, réussite en vert).
prefix: "&#B376E5ᴘᴏʀᴛᴀɪʟ &8▸ "

# Mots tapés après /portail (les mots anglais marchent aussi).
subcommands:
  create: creer
  link: relier
  move: deplacer
  open: ouvrir
  close: fermer
  remove: supprimer
  list: liste
  goto: aller
  help: aide

players-only: "&#FF5C5CSeul un joueur peut faire ça."
