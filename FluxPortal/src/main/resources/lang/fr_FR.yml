# Aide paginée /portail aide, au format de l'aide de Lands (ChatHelp de Flux).
help:
  header: "<#8A8A8A><st>             </st></#8A8A8A> %previous% <#FFD94D>ᴘᴏʀᴛᴀɪʟꜱ</#FFD94D> <dark_gray>·</dark_gray> <#8A8A8A>Page</#8A8A8A> <white>%page%</white><dark_gray>/</dark_gray><white>%pages%</white> %next% <#8A8A8A><st>             </st></#8A8A8A>"
  header-admin: "<#8A8A8A><st>             </st></#8A8A8A> %previous% <#FFD94D>ᴘᴏʀᴛᴀɪʟꜱ</#FFD94D> <dark_gray>·</dark_gray> <#8A8A8A>Page</#8A8A8A> <white>%page%</white><dark_gray>/</dark_gray><white>%pages%</white> %next% <#8A8A8A><st>             </st></#8A8A8A>"
  line: "<#F0A800>   %command%</#F0A800> <dark_gray>-</dark_gray> <#8A8A8A>%description%"
  footer: "<#8A8A8A><st>             </st></#8A8A8A> %previous% <dark_gray>|</dark_gray> %next% <#8A8A8A><st>             </st></#8A8A8A>"
  previous-arrow: "<#FFD94D>«</#FFD94D>"
  next-arrow: "<#FFD94D>»</#FFD94D>"
  previous: "<#FFD94D>« Précédente</#FFD94D>"
  next: "<#FFD94D>Suivante »</#FFD94D>"
  previous-hover: "<#B376E5>Aller à la page précédente"
  next-hover: "<#B376E5>Aller à la page suivante"
  hover-run: "<#B376E5>Clique pour exécuter."
  hover-suggest: "<#B376E5>Clique pour copier la commande."
  args:
    create: "<nom>"
    link: "<nom>"
    move: "<nom> [1|2]"
    open: "<nom>"
    close: "<nom>"
    remove: "<nom>"
    list: ""
    goto: "<nom> [1|2]"
    help: "[page]"
  commands:
    create: "Premier côté : regarde le sol au milieu de l'ouverture"
    link: "Second côté, à l'autre bout : le portail s'ouvre"
    move: "Reposer un côté là où tu regardes (le plus proche par défaut)"
    open: "Ouvrir le portail (vue et passage)"
    close: "Fermer le portail un moment"
    remove: "Supprimer le portail"
    list: "Tous les portails, clic sur un côté pour y aller"
    goto: "Aller devant un côté"
    help: "Cette aide"
