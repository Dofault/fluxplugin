# FluxSpawner : textes en français pour tous les joueurs ; %type% = nom de la créature dans la langue du jeu du joueur.
# Une ligne qui commence par « ! » n'a pas le préfixe. Une clé vide n'affiche rien.
# Charte des messages : celle de CMI et des autres plugins Flux (FluxCommerce, FluxPW) : texte gris #8A8A8A, noms
# de créature, de joueur et durées en or #FFD94D, chiffres en blanc, erreur en rouge #FF5C5C puis explication en
# gris, réussite en vert #2ECF7B, info système en bleu #2BC4E8, commandes entre crochets (cliquables). Les messages
# d'argent viennent de Flux (convention BitBlock commune).
# Variables d'un spawner, partout où il est question de lui : %type% %level% %max% %rate% (créatures par heure)
# %waiting% %capacity% %fuel% %tank% %status% %owner% %world% %coords% %kills%
prefix: "&#B376E5ꜱᴘᴀᴡɴᴇʀꜱ&8 ▸ "

free: "Gratuit"
unlimited: "illimité"
units:
  xp: "points d'XP"
  per-hour: "/ h"

# ---------------------------------------------------------------- pose, ramassage
unknown-type: "&#FF5C5CCe spawner n'existe plus.&#8A8A8A Montre-le au staff."
type-locked: "&#FF5C5CCe spawner ne t'est pas encore ouvert.&#8A8A8A Ton grade ne le permet pas."
world-disabled: "&#FF5C5CPas de spawner ici.&#8A8A8A Les spawners ne sont pas autorisés dans ce monde."
not-in-town: "&#FF5C5CPas de spawner ici.&#8A8A8A Pose-le dans ta ville, ou dans une ville dont tu es habitant."
too-close: "&#FF5C5CTrop près d'un autre spawner.&#8A8A8A Laisse au moins &f%distance% &#8A8A8Ablocs entre deux spawners."
placed-limit: "&#FF5C5CTu as déjà posé ton maximum de spawners (&f%limit%&#FF5C5C).&#8A8A8A Ramasses-en un pour en poser un autre : [/spawners]"
duplicate: "&#FF5C5CCe spawner est déjà posé ailleurs.&#8A8A8A Le staff a été prévenu."
placed: "&#2ECF7BSpawner de &#FFD94D%type% &#2ECF7Bposé !&#8A8A8A Niveau &f%level%&#8A8A8A, &f%rate% &#8A8A8Acréatures par heure. Clic droit dessus pour le gérer."
placed-inactive: "&#FFD94DSpawner de %type% &#8A8A8Aposé, &#FF5C5Cen pause&#8A8A8A : tu as déjà ton maximum de spawners allumés. Gère-les ici : [/spawners]"
picked-up: "&#2ECF7BSpawner de &#FFD94D%type% &#2ECF7Bramassé.&#8A8A8A Il garde son niveau &f%level%&#8A8A8A, son carburant et ses créatures en attente."
not-yours: "&#FF5C5CCe spawner ne t'appartient pas.&#8A8A8A Il est à &#FFD94D%owner%&#8A8A8A."
info-other:
  - "&#8A8A8ASpawner de &#FFD94D%type% &#8A8A8Aniveau &f%level%&#8A8A8A, à &#FFD94D%owner%&#8A8A8A."
  - "!&#8A8A8A  %status% &8· &f%waiting% &#8A8A8Acréatures en attente."
captured: "&#2ECF7BSpawner capturé !&#8A8A8A Ce spawner de &#FFD94D%type% &#8A8A8Aest à toi, niveau &f0&#8A8A8A."
too-far: "&#FF5C5CTrop loin.&#8A8A8A Approche-toi de ce spawner pour le gérer."
rewards-label: "&#FFD94DSpawner de %type% &8· &fniveau %level%"
rewards-label-new: "&#FFD94DSpawner de %type%"

# ---------------------------------------------------------------- marche, arrêt
