name: FluxRewards
version: 26.2
main: fr.influencraft.fluxrewards.FluxRewards
api-version: "26.2"
description: Récompenses de connexion quotidienne et de temps de jeu (menu Flux).
authors: [Influencraft]
softdepend: [PlaceholderAPI]

commands:
  recompenses:
    description: Récupérer ses récompenses de connexion et de temps de jeu.
    usage: /recompenses <jour|temps [n]>
    aliases: [recompense, daily]

permissions:
  influrecompenses.admin:
    description: /recompenses admin (jour, reset, reload).
    default: op
