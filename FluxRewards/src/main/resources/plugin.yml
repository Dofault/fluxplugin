name: FluxRewards
version: 26.2
main: fr.influencraft.fluxrewards.FluxRewards
api-version: "26.2"
description: Daily login and playtime rewards, delivered through the reward manager of Flux.
authors: [Influencraft]
depend: [Flux]

permissions:
  influrecompenses.admin:
    description: Login and playtime rewards admin (day, reset, reload).
    default: op
  fluxrewards.queue:
    description: Queue a reward for a player (/rewards queue), e.g. from another plugin's config.
    default: op
