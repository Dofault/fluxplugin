# ===================================================
# FluxRewards, Influencraft
# Récompenses de connexion quotidienne et de temps de jeu.
# Récupération dans le menu (page Récompenses de /menu2), ou /recompenses jour, /recompenses temps.
# Couleurs : &x et &#RRGGBB. Placeholders PlaceholderAPI acceptés dans les descriptions et messages.
# ⚠️ Montants proposés pour la bêta sur Labs, à équilibrer avant la prod.
# ===================================================

# Le jour change à minuit dans ce fuseau.
fuseau-horaire: "Europe/Paris"

connexion:
  # Nombre de jours d'un cycle : après le dernier, on repart au jour 1.
  cycle: 28
  # false : chaque jour de connexion fait avancer d'un jour, même après une absence.
  # true  : un jour sans connexion ramène au jour 1 (série stricte).
  serie-stricte: false
  # Un jour non récupéré le jour même est manqué. Jours absents de la liste = sans récompense.
  jours:
    1:
      description:
        - "&f%img_bitblock% 50"
      commandes:
        - "money give {joueur} 50"
