# FluxRewards: every pending reward in one place (/rewards), daily login rewards and playtime rewards.
# Colours: & codes, &#RRGGBB and MiniMessage tags. Commands run from the console, %player% = player name.
# "slots" = inventory slots the commands need: a reward is only given when it fits (0 for money only).

timezone: "Europe/Paris"

# Order in which /rewards claims the sources (others after, alphabetically). Sources of other plugins:
# votes (FluxWebsite), boosters (FluxPets), referral (FluxReferral).
claim-order: [mailbox, daily, playtime, votes, boosters, referral]
# Sources never claimed by /rewards (they keep their own command).
disabled-sources: []

# true: /rewards opens the menu of pending rewards instead of claiming everything right away.
command-opens-menu: false

# Reminder of pending rewards: on join, and every interval-seconds (0 = on join only).
reminder:
  interval-seconds: 0

# Icons of the login and playtime rewards in the menu of pending rewards.
icons:
  daily: "CLOCK"
  playtime: "EXPERIENCE_BOTTLE"

daily:
  # Days of a cycle: after the last one, back to day 1.
  cycle: 7
  # false: each login day moves one day forward, even after an absence. true: a day without login resets to day 1.
  strict-streak: false
  # A day not claimed on the same day is missed. Days missing from the list give nothing.
  days:
    1:
      lore: ["&f8 bread"]
      commands: ["give %player% minecraft:bread 8"]
      slots: 1
    3:
      lore: ["&f16 iron ingots"]
      commands: ["give %player% minecraft:iron_ingot 16"]
      slots: 1
    7:
      name: "Day 7"
      lore: ["&b2 diamonds"]
      commands: ["give %player% minecraft:diamond 2"]
      slots: 1

playtime:
  # Key = total playtime needed on this server ("30m", "1h", "2h30"). Once each.
  tiers:
    1h:
      lore: ["&f32 cooked beef"]
      commands: ["give %player% minecraft:cooked_beef 32"]
      slots: 1
    10h:
      lore: ["&b4 diamonds"]
      commands: ["give %player% minecraft:diamond 4"]
      slots: 1
    50h:
      lore: ["&aAn emerald block"]
      commands: ["give %player% minecraft:emerald_block 1"]
      slots: 1

# Texts: lang/<language>.yml, in the suite's language (Flux config) unless set here:
# language: fr_FR
