# URL publique du site (mineweb), sans slash final.
api-base-url: "https://dev.influencraft.fr"

# Doit être identique à MC_SERVER_SECRET dans web/mineweb/.env
api-secret: "CHANGE_ME"

# Fréquence de vérification des commandes en attente (pending_commands)
poll-interval-seconds: 30

# Fréquence de rafraîchissement du cache de streak de vote (placeholders %influbridge_flame_*%)
streak-cache-interval-seconds: 30

# Commande exécutée (en tant que joueur) à l'ouverture de l'écran de succès vanilla (touche L)
advancement-key-command: "menu"

# ─── Vote Party ────────────────────────────────────────────────────────────
# Système entièrement géré en jeu par InfluBridge (compte les votes
# confirmés remontés par mineweb via /influvoteparty add). Le compteur est
# exposé via %influbridge_voteparty_current% / %influbridge_voteparty_required%
# (utilisé notamment par MythicHUD).
voteparty:
  # Nombre de votes réels (tous joueurs et tous vote-sites confondus) pour déclencher le Vote Party
  votes-required: 30

  # Récompense de chaque joueur en ligne, à réclamer par /voteclaims (le site la met en
  # attente). Utilisée seulement si le panel admin du site (Votes > Vote Party) est vide.
  # %player% = nom du joueur
  reward-commands:
    - "ecocrates give %player% key tendance physical 1"

  # Message broadcast à tout le serveur au déclenchement du Vote Party.
  # %votes-required% = seuil configuré ci-dessus
  broadcast-message: "&5&l✦ &dVote Party ! &7Le serveur vient d'atteindre &6%votes-required% votes&7, une Clé Tendance est offerte à tous les joueurs en ligne ! Récupère-la avec &f/voteclaims&7."

  # Message privé envoyé à chaque joueur en ligne une fois sa récompense mise en attente (laisser vide "" pour désactiver)
  reward-message: "&d✦ &7Ta &6Clé Tendance&7 du Vote Party t'attend : tape &f/voteclaims&7 pour la récupérer."

  # Message privé quand le site est injoignable au déclenchement : la récompense est
  # gardée en local (voteparty.yml, par UUID) et rendue par /voteclaims avec les autres.
  reward-stored-message: "&d✦ &7Ta &6Clé Tendance&7 du Vote Party t'attend : tape &f/voteclaims&7 pour la récupérer."

  # Titre + sous-titre affichés au centre de l'écran de chaque joueur en ligne
  # (laisser vide "" pour désactiver).
  title: "&#FFD94D&lVote Party atteint !"
  subtitle: "&#B376E5Une Clé Tendance offerte à tous"

  # Son joué à chaque joueur en ligne (clé de son vanilla, "" pour aucun son).
  sound: "entity.player.levelup"

# ─── Rappel de vote ────────────────────────────────────────────────────────
# Rappel périodique envoyé en tchat aux joueurs en ligne, sur le même gabarit
# que la fiche /vote, qu'il sert aussi (commande voteinfo, alias /vote).
# Déclenchement : UNIQUEMENT si le joueur a au moins un site de vote
# disponible (cooldown écoulé côté mineweb). Les récompenses en attente ne
# déclenchent jamais le rappel à elles seules, elles sont seulement affichées.
vote-reminder:
  enabled: true

  # Intervalle entre deux rappels, en secondes (plancher : 60)
  interval-seconds: 300

  # Délai avant le TOUT PREMIER rappel après un démarrage, en secondes.
  # Sert à décaler le rappel des autres messages périodiques du serveur :
  # ChatGames tourne toutes les 10 min (ChatGames/config.yml → time_minutes),
  # donc un rappel toutes les 5 min non décalé tomberait pile sur un jeu une
  # fois sur deux. Avec 150 (2 min 30, soit la moitié de l'intervalle), les
  # deux ne coïncident jamais. Si tu changes interval-seconds, remets ce délai
  # à la moitié de la nouvelle valeur.
  initial-delay-seconds: 150

  # Bloc envoyé au joueur. Placeholders :
  #   %available% = sites de vote disponibles maintenant pour ce joueur
  #   %total%     = nombre total de sites de vote
  #   %pending%   = récompenses de vote en attente de réclamation (/voteclaims)
  #   %tickets%   = tickets de tombola pas encore misés (à miser sur le site)
  #   %prochain_lot% = temps avant le prochain tirage de la tombola (ligne sautée sans lot ouvert)
  # Une ligne contenant %pending% (ou %tickets%) est automatiquement sautée
  # quand le joueur n'a rien en attente (ou aucun ticket).
  # Les raccourcis écrits [/commande] sont rendus cliquables.
  message:
    - "&#8A8A8A&m                        &r&#8A8A8A ɪɴꜰᴏꜱ &m                        &r"
    - ""
    - " &8『&r 🗳 &#B376E5&lᴠᴏᴛᴇ&r &8』"
    - ""
    - "   &#DADADAVote chaque jour pour gagner des récompenses."
    - "  &8• &7Sɪᴛᴇꜱ ᴅɪꜱᴘᴏɴɪʙʟᴇꜱ : &f%available%&7/&f%total%"
    - "  &8• &7Cléꜱ ᴇɴ ᴀᴛᴛᴇɴᴛᴇ : &f%pending% [/voteclaims]"
    - "  &8• &7Tɪᴄᴋᴇᴛꜱ ᴅᴇ ᴛᴏᴍʙᴏʟᴀ : &f%tickets%"
    - "  &8• &7Pʀᴏᴄʜᴀɪɴ ʟᴏᴛ : &fdans %prochain_lot%"
    - "  &8• &7Lɪᴇɴ : &#2BC4E8&nhttps://influencraft.fr/vote"
    - ""
    - "&#8A8A8A&m                                                        &r"

# ─── Boss bar de progression d'XP de métier (EcoJobs) ──────────────────────
# S'affiche à chaque gain d'XP de métier, même minime, et se masque après le
# délai d'inactivité ci-dessous. Une seule boss bar par joueur (pas une par
# métier) : si plusieurs métiers sont actifs, elle reflète toujours la
# dernière action, jamais plusieurs bars empilées.
job-xp-bossbar:
  enabled: true

  # Délai (en secondes) sans nouveau gain d'XP avant que la bar ne disparaisse
  hide-after-seconds: 4

  # Valeurs Adventure BossBar.Color : PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  color: "GREEN"

  # Valeurs Adventure BossBar.Overlay : PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20
  # NOTCHED_20 = grille de 20 segments, équivalent à "SEGMENTED_20" côté AdvancedJobs
  # (AdvancedJobs/config.yml §boss-bar) — repris pour matcher leur convention.
  overlay: "NOTCHED_20"

# ─── Action bar de gain d'argent cumulatif ──────────────────────────────────
# Écoute com.Zrips.CMI.events.CMIUserBalanceChangeEvent (CMI, actionType ==
# "Deposit"), fire par CMIEconomyAcount pour TOUT dépôt qui transite par le
# backend économie CMIEconomy (confirmé par décompilation : la même méthode
# est appelée aussi bien par l'API Vault générique — "give_money" d'EcoJobs,
# Salaires, /money give, les récompenses ChatGames/UStats/ExcellentCrates/
# Parrainage/CustomFishing/AxTrade — que par les commandes CMI elles-mêmes),
# donc le montant affiché est le VRAI delta de solde encaissé (event.getTo()
# - event.getFrom()), pas une valeur recalculée/devinée (contrairement à
# l'ancien piège "give_money n'émet aucun event" — vrai pour libreforge/eco/
# EcoJobs, faux une fois qu'on descend jusqu'au backend économie réel).
# Depuis la migration EssentialsX→CMI (cf. CLAUDE.md), CMI n'expose plus de
# cause distincte par commande (contrairement à l'ancien Cause.API/COMMAND_ECO/
# COMMAND_PAY d'EssentialsX) : /pay et /money give déclenchent donc aussi
# cette action bar, en plus de leur propre message CMI natif — accepté comme
# léger doublon plutôt que fragile à distinguer sans hook plus profond.
#
# Cumulatif : tant que de nouveaux gains arrivent, ils s'additionnent au
# compteur affiché et repoussent le délai d'expiration ci-dessous. Dès que ce
# délai s'écoule sans nouveau gain, l'action bar est effacée et le compteur
# retombe à 0 — un nouveau gain reparties alors de zéro.
money-gain-actionbar:
  enabled: true

  # Délai (en secondes) sans nouveau gain avant que l'action bar ne s'efface et que le compteur ne se remette à 0.
  hide-after-seconds: 1.5

  # Couleur du montant affiché (legacy hex &#RRGGBB) — violet clair, convention charte graphique (CLAUDE.md §6.1/notifications).
  # Un reset ("&r") est toujours inséré juste avant %img_bitblock% pour que l'icône ne soit pas teintée.
  color: "&#B376E5"

# ─── Neutralisation de l'enchantement Raccommodage (Mending) ────────────────
# Règle de gameplay : le livre Raccommodage continue de circuler (loot, échanges,
# ventes) mais ne peut plus jamais être associé à un objet — l'enchant est retiré
# du résultat d'enclume, du loot généré (coffres trésor / structures / bastions /
# fouille archéologique) et des prises de pêche. Les livres eux-mêmes ne sont
# jamais modifiés, ils deviennent juste inutiles.
# Détail : docs/technique/raccommodage.md
raccommodage:
  # true = neutralisation active (défaut, valeur attendue en production).
  # false = Raccommodage redevient un enchant vanilla normal, applicable à
  #   l'enclume. Interrupteur prévu pour les tests sur Labs, à ne pas passer à
  #   false sur le SemiRP sans décision de gameplay explicite.
  enabled: true

  # true = écrit une ligne console à chaque retrait de Raccommodage, en précisant
  #   le contexte (enclume / loot / pêche) et l'objet concerné. Utile pour auditer
  #   après un déploiement ou débusquer un vecteur oublié.
  # false = silencieux (défaut).
  log: false

# ─── Réparation (/repair) ──────────────────────────────────────────────────
# Menu de réparation maison, en remplacement de l'alias CMI /repair (désactivé
# dans CMI/Settings/Alias.yml) : le joueur dépose un objet dans la case centrale
# et paie un prix unique, quel que soit l'état de l'objet (CMI facturait un
# BasePrice modulé par la durabilité, le worth et les enchantements).
# La réparation remet la durabilité à plein ET le coût d'enclume ("poids") à
# zéro, pour que l'objet reste enchantable/fusionnable ensuite sans tomber sur
# le "Trop cher !" vanilla.
# Les objets portant le tag de lore "Irréparable" (outils de caisse Ordinaire/
# Tendance, cf. AnvilRestrictionListener) sont refusés, comme à l'enclume.
# Accès : permission influbridge.repair, accordée au groupe LuckPerms
# "eminent" (rang 5) — c'est un déblocage de rang, cf. docs/rang.md.
repair:
  enabled: true

  # Prix d'une réparation, en BitBlock. Relu à chaud par /influbridge reload.
  cost: 500
