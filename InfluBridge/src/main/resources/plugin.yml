name: InfluBridge
version: 26.2
main: fr.influencraft.influbridge.InfluBridgePlugin
api-version: '26.2'
author: dofault
description: "Pont entre le site web (mineweb) et le serveur SemiRP : livre les commandes en attente (achats boutique, récompenses de vote et top 3 mensuel), redirige la touche des succès vanilla vers /menu, et gère le Vote Party en jeu."

softdepend: [ProtocolLib, PlaceholderAPI, EcoJobs, CMI, Vault, CustomFishing]

commands:
  influbridge:
    description: "Relit config.yml et réapplique à chaud ce qui peut l'être (rappel de vote, Vote Party)."
    usage: "/<command> reload"
    permission: influbridge.admin
  influvoteparty:
    description: "Incrémente le compteur Vote Party. Déclenché en console par mineweb à chaque vote confirmé (tous sites confondus). Réservé OP en jeu (add/remove <montant> pour corriger le compteur à la main)."
    usage: "/<command> <add [montant]|remove <montant>>"
  metier:
    description: "Backend du menu /métiers : rejoindre/quitter un métier (facture le vrai prix EcoJobs), voir sa progression ou le détail bloc par bloc."
    usage: "/<command> [rejoindre <métier>|quitter <métier>|progression <métier>|blocs <métier> [page]]"
  jobxpbar:
    description: "Active/désactive la boss bar de progression d'XP de métier (bouton /reglages)."
    usage: "/<command> <on|off|toggle>"
  bitblocknotif:
    description: "Active/désactive l'action bar de gain cumulatif de BitBlock (bouton /reglages)."
    usage: "/<command> <on|off>"
  bottlexp:
    description: "Stocke l'XP du joueur dans des fioles d'expérience de 1395 points chacune (niveaux 0 à 30), rendues au clic droit."
    usage: "/<command> [give <joueur> <xp> [quantité]]"
    permission: influbridge.bottlexp
  voteinfo:
    description: "Affiche le bloc d'infos de vote (sites disponibles, récompenses en attente). Cible de l'alias /vote."
    usage: "/<command>"
  votenotif:
    description: "Active/désactive le rappel de vote périodique en tchat (bouton /reglages)."
    usage: "/<command> <on|off>"
  repair:
    description: "Ouvre le menu de réparation : dépose un objet, paie le prix fixe (repair.cost), durabilité et coût d'enclume remis à neuf."
    usage: "/<command>"
    permission: influbridge.repair
  voteclaims:
    description: "Réclame toutes les récompenses de vote en attente (clés, flamme, top 3, objectif du mois, tombola, Vote Party), dans la limite des cases libres de l'inventaire (bouton Vote de /menu, clic droit)."
    usage: "/<command>"
    aliases: [votekeys]

permissions:
  influbridge.admin:
    description: "Permet /influbridge reload (rechargement de config.yml)"
    default: op
  influbridge.bottlexp:
    description: "Permet d'utiliser /bottlexp (remplir des fioles d'expérience). Utiliser une fiole ne demande aucune permission."
    default: op
  influbridge.bottlexp.admin:
    description: "Permet /bottlexp give <joueur> <xp> [quantité] : donne des fioles d'un montant d'XP libre."
    default: op
  influbridge.repair:
    description: "Permet d'ouvrir le menu de réparation /repair. Accordé au groupe eminent (rang 5)."
    default: op
  influbridge.voteparty.admin:
    description: "Permet de corriger le compteur Vote Party à la main (/influvoteparty add|remove <montant>)"
    default: op
