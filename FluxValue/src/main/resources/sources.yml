# Weights of everything that can be farmed, in points. See assets/gen_values.py for how a server builds its own.
jobs: {}

# actions : ce que vaut une action qu'aucun métier ne paie (points, même échelle que le reste : 7050 = 2 min de jeu
# optimal). Lu par les missions du pass (FluxPass) : quantité d'une mission = effort / poids de l'action.
# actions.<déclencheur>.<cible> ; default = n'importe quelle cible. Poids de départ (2026-11-11) déduits des
# quantités des missions d'avant ; une mission qui demande trop ou trop peu = corriger son poids ici.
# gain_job_xp vaut 1 par définition (1 XP de métier = 1 point).
