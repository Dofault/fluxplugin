# Weight of everything that can be farmed: the only source of value of the server (generated once by assets/gen_values.py,
# hand-edited since). Everything is in POINTS: 7050 points = 2 minutes of optimal play (economy.yml), whatever the job.
#
# jobs.<job>.sources.<block>:
#   weight: points of one action (job XP and money derive from it)
#   yields: items obtained per action (Fortune III counted), several lines = alternatives (silk touch or not); absent = the block itself
#   area  : true = area tools (Tranchee) multiply the harvest (factor in economy.yml), never the job XP
# mobs.<mob>: weight = relative weight (1 = zombie, "Poids" column of the spreadsheet): how hard it is to find.
#   A kill is worth base health (read from the server, not written here) x mobs.points-per-health (economy.yml) x weight: value of loot,
#   offerings and collections. Defender does not depend on it: it stays paid per health point in EcoJobs.
#   yields = average loot (Looting III), the kill's value is shared between the drops
# others: items no job gives (points per item)
# same-value-as: an item that is only another one passed through a tool or water, it follows it
# Crafted items (planks, ingots, blocks...) are NOT here: their value comes from the server's real recipes.
